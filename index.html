t, that the second feeling had caught up with her: a quiet, private ache, small and stubborn, that she hadn’t asked for and didn’t particularly want.", "Both things were true at once. Priya had learned that this was allowed: you could be completely happy for your best friend and still feel your own disappointment sitting quietly beside that happiness, not canceling it out, just sitting there.", "So she practiced. Partly out of duty, because an understudy who doesn’t know the role isn’t really doing her job. And partly, if she was honest with herself, because it felt good to move through those steps, to imagine, just for twenty private minutes each Thursday, what it might feel like to dance them under the lights.", "The weeks passed in a familiar rhythm. On Tuesdays and most of Thursdays, Callie rehearsed Reflections with the full cast, working out entrances and spacing with the six other dancers who moved around her in the piece, while Priya watched from the side, absorbing every count, every phrase of music, every small correction Madame Orlova offered. Then, once the studio cleared out, Priya would have her twenty minutes, dancing the same steps alone in the empty room, without the six other dancers, without the audience, without anyone at all except the pianist packing up sheet music and, occasionally, Miss Petrova, who sometimes lingered by the window and watched without saying much.", "Callie, for her part, was generous about the whole arrangement in a way that made it easier for Priya than it might otherwise have been. She never made Priya feel strange for practicing so hard at a role she wasn't dancing. Once, when Priya struggled for three Thursdays in a row with a particularly tricky sequence of turns that traveled diagonally across the floor, Callie stayed late on her own time, without being asked, and marked through the sequence beside her, calling out the counts, until Priya finally landed it cleanly.", "“See,” Callie said, a little out of breath, grinning. “Understudies need coaching too. It's only fair. You've watched me rehearse this a hundred times. The least I can do is watch you back.”", "“You didn't have to stay,” Priya said.", "“I wanted to,” said Callie. “Besides, what kind of friend would I be if I let you struggle with the exact same turn sequence for a month just because it isn't technically my job to help?”", "Priya thought about that afternoon often in the weeks that followed, how easily Callie had turned rehearsal time she didn't owe anyone into a gift, without making a show of it, without even seeming to think it was a particularly big deal. It was one of a hundred small things Callie did without being asked, the kind of quiet, steady kindness that never showed up on a program or a cast list but that Priya had come, over seven years, to depend on completely.", "The recital was scheduled for a Saturday in May. On the Friday before, Callie called Priya in tears.", "“I fell down the stairs at my apartment,” she said, her voice thick. “My ankle. The doctor says it’s a bad sprain. I can’t dance tomorrow. I can’t even stand on it right now.”", "Priya’s stomach dropped, two feelings arriving at exactly the same moment, tangled together so tightly she could barely tell them apart. The first was pure worry for her friend: Callie’s voice sounded small and scared, and Priya wanted nothing more than to go sit with her and make sure she was okay. The second feeling arrived right behind it, uninvited, and Priya almost felt ashamed of it even as it rose in her chest: a hot, bright flicker of hope. She knows the role. She could actually do this tomorrow.", "She hated herself a little for feeling that flicker while her best friend was crying on the phone. But she had learned enough, from months of watching her own complicated feelings, not to pretend the flicker wasn’t there. Instead, she pushed it gently to one side and focused on Callie.", "“I’m coming over,” Priya said. “Right now. Tell your mom I’m coming.”", "She spent that evening sitting on the floor of Callie’s bedroom, an ice pack propped against her friend’s swollen ankle, the two of them watching old dance videos on Callie’s laptop because it was easier than talking about the recital. At one point Callie’s mother brought them both mugs of tea, and Callie’s little sister wandered in and drew a slightly crooked smiley face on the bandage wrapped around Callie’s ankle with a marker, which made Callie laugh for the first time all evening, a small, watery laugh that made Priya's chest hurt with how much she loved her.", "“It doesn't even hurt that badly right now,” Callie said at one point, staring at the ceiling. “It's not the ankle that's the worst part. It's knowing I worked on this piece for three months and I don't get to do it in front of anyone. Not my parents, not my grandma flying in from Portland, none of it.”", "Priya didn't know what to say to that, so she just scooted closer and put her head on Callie's shoulder, the way she had a hundred times before over seven years of friendship, and let the silence sit there for a while, because sometimes there isn't a right thing to say, only a right thing to do, and sitting close was the only thing Priya could think of.", "“You have to do it tomorrow,” Callie finally said, breaking the silence. “Reflections. You know it. You’ve always known it.”", "“Callie—”", "“I mean it. I’d rather it be you than a total stranger from the understudy pool at another studio. Madame Orlova is going to call you tonight, I bet anything. Please say yes.”", "Priya swallowed hard. “I don’t want you to feel like I’m happy this happened to you.”", "Callie managed a small, watery laugh. “I know you’re not happy I fell down the stairs, Priya. You’ve been sitting on my floor with an ice pack for two hours. But you are allowed to be excited about dancing tomorrow. Those are two different things. I need you to actually let yourself feel the second one, or I’m going to feel worse, not better.”", "Priya felt her eyes sting. “How are you the one comforting me right now? You’re the one with the hurt ankle.”", "“Generosity isn’t only for people who are winning,” said Callie. “Sometimes it’s the only thing you have left to give. So let me give it.”", "That night, exactly as Callie had predicted, Madame Orlova called. Priya would dance the lead role in Reflections at tomorrow’s recital. There would be one final rehearsal in the morning, just to run the spacing with the full cast, since Priya had only ever practiced the choreography alone, in an empty studio, without the six other dancers who moved around her in the piece.", "Priya barely slept that night. She lay in bed running the choreography in her head, counting music that wasn't playing, feeling her stomach flip between excitement and a nervousness so sharp it was almost like fear. Around midnight, she gave up trying to sleep and sent Callie a single text: Are you awake? I'm terrified. Callie wrote back almost instantly: Terrified is normal. I was terrified for three months straight. You'll be fine. Go to sleep, understudy. That's an order from your lead.", "The rehearsal the next morning was rough. Priya kept anticipating cues that belonged to a different dancer’s counts, her body remembering the private, empty-studio version of the role rather than this fuller one, crowded with other dancers moving in patterns she’d only watched from the side before. She missed an entrance. She bumped shoulders with another dancer during a turn. One of the other dancers, a girl named Weiwei who Priya barely knew, tried to be encouraging between run-throughs, offering a few whispered tips about exactly when to expect a shoulder brushing past during the group section, but the corrections piled up faster than Priya could absorb them, and by the end of the rehearsal, her confidence, so carefully built over months of Thursday afternoons, had nearly drained away entirely.", "“I can’t do this,” she told Madame Orlova afterward, her voice cracking. “I know the steps but I don’t know the role. Not really. Not with everyone else there.”", "Madame Orlova considered her for a long moment. “Do you know why I chose you as the understudy for this particular piece, out of everyone in the class?”", "Priya shook her head.", "“Because you dance it as though you understand what it is about,” said Madame Orlova. “Reflections is not simply about turns and spacing, though those matter. It is about a person looking at herself, honestly, and finding both the parts she is proud of and the parts that still need work, and loving the whole picture anyway. You have been doing exactly that all year, in ways I don’t think you realize I have noticed. Dance it that way tonight. Not perfectly. Honestly.”", "Priya thought about that all afternoon, through a lunch she barely tasted, through the long, restless hours before call time, through the moment she finally arrived backstage and saw her costume hanging, freshly steamed, on the rack with her name taped above it in Madame Orlova's careful handwriting where, until yesterday, Callie's name had been.", "She stood in front of that costume for a long moment before touching it, running through Madame Orlova's words again in her head. Not perfectly. Honestly. It sounded simple, the way advice about hard things sometimes does right up until you try to actually follow it. Priya had spent an entire year of Thursday afternoons chasing a version of this role that looked exactly like what she imagined a perfect performance should look like, clean lines, matched counts, nothing out of place. She had never once considered that the thing Madame Orlova valued most about her dancing was something else entirely, something closer to the truth of how she actually felt rather than how flawlessly she could disguise it. She reached out and touched the sleeve of the costume, and for the first time all day, the nervous flutter in her stomach settled into something calmer, something closer to readiness.", "Her mother and younger brother arrived early to save seats near the front, and her mother sent a photo of the program with Priya's name printed under the role, a small thing that nonetheless made Priya's throat tighten when she saw it backstage on her phone. She thought about how many recitals she had watched from those same seats over the years, clapping for Callie, clapping for other dancers, always assuming her own turn, if it ever came, would arrive further down the road, at some vague future point she hadn't bothered to imagine clearly. It had arrived instead with almost no warning at all, wrapped inside her best friend's bad luck, and Priya was still working out how strange that felt.", "That evening, Priya sat in the dressing room, pinning her hair, watching the other dancers around her buzz with pre-show energy. Her phone buzzed. A text from Callie, sitting at home with her foot propped up on a pillow, already dressed to watch the livestream her mother had promised to set up.", "I’ll be watching every second. Dance it for both of us. You’ve got this. And Priya — thank you for not letting my bad luck turn into a bad night for you too.", "Priya read it twice, then tucked her phone away and stood, smoothing down her costume in the mirror. Callie had always been generous that way, quick to hand over credit and encouragement even from a couch with her foot propped up, and Priya wanted, more than anything else that night, to dance in a way that honored that generosity.", "When her music began, she did not think about the missed cue from that morning’s rehearsal, or the bumped shoulder, or the months of quiet disappointment she had carried and set gently aside so many Thursdays in a row. She thought about Callie on the other end of a phone screen, ankle propped on a pillow, watching. She thought about the countless empty-studio afternoons that had brought her, somehow, to exactly this moment. And she danced.", "It was not a flawless performance. She landed one turn slightly off balance, and recovered so smoothly that only Madame Orlova, watching from the wings, seemed to notice at all. There was a moment in the middle section, reaching for a slow extension, where she felt her balance waver for half a second before her supporting leg found its strength again, a wobble so small that afterward she would wonder if she had imagined it entirely. But it was honest, the way Madame Orlova had asked her to be, full of the same quiet longing and quiet strength that the music itself seemed to hold.", "When the final note faded and Priya came to stillness, arms lowered, the audience rose in applause that felt, to her, like it lasted an impossibly long time. In her bow, she gestured gracious thanks first toward Madame Orlova in the wings, and then, unable to resist, blew a small kiss toward the phone she knew was propped up somewhere in the audience, streaming to a couch across town.", "Backstage afterward, her phone was already buzzing with messages. The very first one was from Callie: a single video, filmed sideways on a shaky phone screen, of Callie sitting up on her couch, both fists raised in the air, cheering so loudly that her mother could be heard in the background telling her to please not fall off the couch too. There was a second message a moment later, this one just text: You did the diagonal turns perfectly. I could NOT do those. I'm serious, watch it back, you were better at them than me.", "Priya laughed until she cried, sitting on the dressing room floor still in her costume, other dancers changing and chattering around her, the whole evening finally catching up with her all at once, relief and joy and exhaustion arriving together. She texted back a single line.", "Loyalty looks good on both of us. Save me a seat next time. I want to be the one cheering from the couch someday too.", "Two weeks later, when Callie's ankle had healed enough for gentle stretching, Priya showed up at her apartment on a Thursday afternoon with two water bottles and her phone loaded with the Reflections music.", "“What's this?” Callie asked, eyeing the phone suspiciously.", "“You said you wanted to see the diagonal turns,” Priya said. “So I'm going to teach them to you. Understudy's orders. Consider it payback for every Thursday you ever stayed late for me.”", "Callie laughed, and made room on the living room rug, and for the next half hour, in stocking feet on a carpet instead of pointe shoes on a sprung floor, two best friends traded a role back and forth between them, exactly the way they had traded hair ties and granola bars for seven years, as if it had never really belonged to only one of them at all."]}, {"vocab": [{"w": "tradition", "d": "a custom or practice passed down through many years"}, {"w": "heritage", "d": "the traditions, achievements, and history that belong to a culture or family"}, {"w": "graceful", "d": "moving in a smooth, beautiful way"}, {"w": "ornate", "d": "decorated with many elaborate details"}, {"w": "universal", "d": "shared by or true for everyone, everywhere"}], "quiz": [{"skill": "Main idea", "q": "What is the story mostly about?", "opts": ["A girl discovers that dance traditions from around the world share a common spirit even though they look different", "Old costumes are worthless", "Only ballet counts as real dance", "The wardrobe is haunted and scary"], "ans": 0, "why": "Delphine learns to appreciate many dance forms and what connects them."}, {"skill": "Details", "q": "What is the first non-ballet costume Delphine finds in the secret drawer?", "opts": ["A costume for classical Chinese dance", "A soccer uniform", "A ballet tutu", "A raincoat"], "ans": 0, "why": "The story's first magical costume is for classical Chinese dance, with long flowing sleeves."}, {"skill": "Inference", "q": "Why might the old wardrobe have been keeping these costumes hidden in a secret drawer?", "opts": ["The theater wanted young dancers to discover the wider world of dance when they were ready", "Nobody liked the costumes", "They were considered garbage", "They were too modern"], "ans": 0, "why": "The magical framing suggests the discovery is meant to expand her view of dance."}, {"skill": "Cause and effect", "q": "What happens each time Delphine puts on one of the special costumes?", "opts": ["She learns a few real steps from that dance tradition and understands the story behind it", "She disappears forever", "The costume rips", "Nothing happens"], "ans": 0, "why": "Each costume briefly teaches her a bit of that tradition's movement and history."}, {"skill": "Vocabulary", "q": "What does “heritage” mean?", "opts": ["The traditions and history belonging to a culture or family", "A type of costume", "A ballet company", "A city in Europe"], "ans": 0, "why": "Heritage refers to inherited traditions, which is central to the story's theme."}], "title": "The Wardrobe of a Thousand Dances", "cat": "ballet", "blurb": "Cleaning the theater's ancient costume wardrobe for extra credit sounds boring, until Delphine opens a drawer that isn't supposed to exist and finds costumes from dance traditions all over the world, each one eager to show her a step.", "paras": ["Delphine Boucher had always loved the Rainier Ballet Theater for reasons that had very little to do with dancing itself. She loved the creak of the old wooden stairs backstage, worn smooth by decades of feet. She loved the smell of the place, a mixture of rosin, old velvet curtains, and something faintly like sawdust that never quite went away no matter how many times the floors were cleaned. Most of all, she loved the sense that the building held more history than anyone currently walking around inside it, that its walls had watched a hundred years of dancers come and go, each one leaving some invisible trace behind before making room for the next.", "Extra credit for a missed rehearsal did not usually sound like much of a reward, but when Madame Orlova offered it to Delphine Boucher in exchange for helping sort the theater’s old costume storage room, Delphine had said yes immediately. She had always been curious about the storage room at the very back of the Rainier Ballet Theater, a long, narrow space crammed with garment racks and a single enormous wooden wardrobe that stood against the far wall like something out of an old painting, carved all over with leaves and vines and small, watchful faces.", "“That wardrobe came with the building,” Madame Orlova told her, handing over a checklist and a roll of garment bags. “Older than any of us. We only use the front section for storage now. The back panels don’t open — they’ve been painted shut for years. Don’t worry about those. Just the racks, please, by Friday.”", "Delphine worked through the racks for two afternoons, tagging and bagging faded tutus and dusty character shoes, mostly bored, occasionally delighted by some forgotten treasure like a genuine feathered headpiece from a production of The Firebird decades ago. She found a program from a performance thirty years earlier with a cast list full of names she didn't recognize, and wondered, briefly, whether any of those long-ago dancers still thought about this theater the way she was starting to. On the third afternoon, reaching to retrieve a tutu that had slipped behind the wardrobe, her hand brushed against something at the very bottom of the wardrobe’s back panel: a small brass handle, nearly invisible beneath decades of dust, shaped like a tiny curling leaf.", "She should not have pulled it. She knew, even as she did it, that Madame Orlova had said the back panels didn’t open. But the handle turned so easily beneath her fingers, as though it had been waiting for exactly this moment, that a drawer slid open before she had fully decided to try.", "Inside lay a single costume, folded with extraordinary care in tissue paper that had somehow stayed bright white despite the dust everywhere else. Delphine lifted it out. It was nothing like a ballet costume: a flowing robe in shimmering blue silk, with sleeves so long they trailed nearly to the floor, embroidered all over with silver clouds and cranes.", "A small tag, tucked into the folds, read simply: Classical Chinese Dance. Try me.", "Delphine glanced over her shoulder. The storage room was empty, the theater quiet on a Wednesday afternoon with no rehearsals scheduled. Slowly, feeling faintly ridiculous, she slipped the robe on over her leotard.", "The moment the long sleeves settled over her hands, something shifted in the room, a kind of hush, as though the air itself had leaned in to listen. Delphine lifted her arms experimentally, and the long silk sleeves rippled outward in a wide, slow arc, and her body seemed, for just a moment, to know exactly what to do with them, moving in a way she had never been taught: a gentle curling of the wrist, a soft ripple that traveled up through the sleeve like water, her whole torso following in a smooth, circling wave that felt nothing at all like the sharp lines of ballet, and everything like watching silk drift on a breeze.", "In her mind, or perhaps in the fabric itself, she seemed to understand fragments of what this dance was for: telling stories of legends and emperors and flying cranes, the long sleeves used almost like an extension of the dancer’s own voice, a technique dancers call water sleeves, each ripple and curl meaning something specific to those who knew how to read it, a whole vocabulary of grace built from cloth and wrist and breath. She felt, too, a flicker of understanding about how many years a real dancer of this tradition would spend simply learning to control those sleeves, the same way Delphine herself had spent years learning to control the angle of a single finger in a ballet arabesque, small precise work that audiences rarely noticed but without which nothing else would look right at all.", "As suddenly as it had begun, the feeling faded, and Delphine stood in the quiet storage room, breathless, the sleeves settling still around her hands. She carefully folded the robe back into its tissue paper and set it back in the drawer, and found, to her surprise, that the little brass handle now revealed a second drawer beneath the first, which she was quite certain had not been visible a moment ago.", "She opened it anyway.", "Before she did, she paused for a moment with her hand resting on the little brass leaf, half expecting the drawer to have vanished, half expecting the whole thing to have been some strange trick of an overtired imagination after two long afternoons of dusty costume racks. But the handle was solid and cool under her fingers, exactly as real as it had been the first time, and when she pulled, the second drawer slid open just as smoothly as the first, revealing another costume folded in the same bright tissue paper, as though the wardrobe itself had been waiting patiently for her to come back.", "Over the following days, whenever she had an excuse to slip into the storage room, Delphine returned to the wardrobe. Each time, a new drawer seemed to have appeared, each holding a single costume, each with its small tag: Try me.", "There was a flamenco dress in a defiant red, with layers of ruffles that snapped and cracked around her ankles as she stamped her feet, discovering rhythms that lived not in her arms but entirely in the sharp, percussive strikes of her heels against the floor, a whole language of footwork that seemed to argue and declare and insist, nothing at all like the quiet control of pointe work. She felt, faintly, an emotion she didn't have an English word for but that the costume itself seemed to whisper was called duende, a kind of fierce, soulful intensity that flamenco dancers chase their whole lives, along with the layered claps and rhythms called palmas that other dancers and musicians use to hold the whole dance together like a heartbeat you could hear from across the room.", "There was a costume for a traditional Irish step dance, stiff and formal from the waist up, arms held rigidly at her sides, while her feet, once she let them, wanted to fly into impossibly fast, precise little jumps and clicks, a kind of joyful discipline that made her laugh out loud in the empty room. She understood, in the same half-dreaming way she'd understood the flamenco rhythms, that dancers in this tradition sometimes wore soft shoes for quiet, quick footwork and hard shoes for the sharp, drumming clicks she felt buzzing up through her own borrowed shoes, and that this same dance was performed at community gatherings called céilís long before it ever appeared on any stage at all, passed from grandparent to grandchild the way a favorite recipe might be.", "There was a beaded regalia dress belonging to a powwow tradition of dance from Indigenous nations of North America, with a small note explaining that different regalia and dance styles belong to specific nations and families, each carrying meaning that is not meant to be copied outside of that community; Delphine, moved by this, did not put the dress on, but instead sat with it for a long while, reading everything the tag had to teach her, understanding that respect for a tradition sometimes means watching and learning without stepping directly inside it, and that this too was a valuable lesson the wardrobe seemed to want her to learn. The tag mentioned that at real powwows, different dances such as fancy dance, jingle dress dance, and grass dance are each performed by dancers who have earned the right to wear their own specific regalia, often made by hand by family members over months or years, and that the most respectful way for someone outside the community to appreciate the tradition is simply to watch, to listen, and to ask the people who carry it forward what they wish to share. Delphine found that she did not feel disappointed by not trying this costume on. If anything, she felt she had learned something the other costumes couldn't have taught her quite as clearly: that admiration does not always require participation, and that some traditions are gifts best received by simply paying attention.", "There was a costume for Bharatanatyam, a classical dance form from South India, its skirt pleated into an ornate fan of gold-edged fabric that spread wide with every turn, and when Delphine slipped on the anklets that came folded beside it, heavy with small bells called ghungroo, she discovered that even standing still, the simple bend of her knees into a wide, grounded stance and the precise, geometric positioning of her hands told an entire story with no words at all, a whole system of hand gestures called mudras, each one meaning something specific: a flower, a deer, the moon. She felt her feet begin a sequence of basic rhythmic steps, called adavus, the foundation every Bharatanatyam dancer practices for years before ever performing a full piece, the bells at her ankles chiming out the rhythm with every stamp, sharp and bright and precise. This dance, she sensed, was somebody's heritage in the truest sense, carried forward inside careful gestures passed from teacher to student for centuries.", "Each costume left her a little dizzy, a little breathless, and utterly fascinated, and each time she folded it carefully back into its tissue paper, feeling as though she were closing a book she desperately wanted to keep reading. After the flamenco dress and the Irish costume, but before she reached for the beaded regalia dress, Delphine sat for a while on an overturned prop trunk in the middle of the storage room, thinking about how strange it was that she had spent her whole life inside a single tradition without ever wondering very hard what lay just outside it. She had always known, in a distant sort of way, that other kinds of dance existed. She had simply never stopped to consider that each one carried the same seriousness, the same decades of accumulated wisdom about how a body could move and what that movement could mean, that she had always assumed belonged only to ballet. It was a small realization, but it sat heavily with her, the pleasant kind of heavy that comes from learning something true.", "She began to notice, too, that the feeling followed her out of the storage room and into her regular life. She found herself watching street performers and family videos and even background dancers in movies with a new kind of attention, wondering what tradition their movements came from, what centuries of practice sat quietly behind even a few seconds of footage.", "She almost told her regular ballet friend, Noor, about the wardrobe one afternoon, the words halfway out of her mouth before she stopped herself. It wasn't that she didn't trust Noor. It was that the whole thing felt, somehow, like it belonged to her alone for now, a private education she wasn't ready to explain to anyone else, not until she understood it a little better herself.", "Instead, she started a small notebook, hidden in the bottom of her dance bag, where she wrote down everything she could remember about each costume before the details faded: the word duende, spelled out carefully and underlined twice; a rough sketch of a mudra shaped like a blooming flower; a reminder to herself, in slightly messy handwriting, that some traditions are not hers to borrow, only to admire from a respectful distance. She filled three pages in a single week, and found, flipping back through them one evening, that she had never taken this many notes about anything for school, not even subjects she was supposed to be studying for a real grade.", "One evening, curious whether Madame Orlova might know more than she let on about the wardrobe's origins, Delphine lingered after class, pretending to reorganize her dance bag while the room emptied out.", "“You've been staying later than usual,” Madame Orlova observed, not looking up from the folder of music she was sorting.", "“I've just been thinking about a lot of things,” Delphine said carefully. “About dance. About how many different kinds there are that I never really thought about before.”", "“That is not a small thing to start thinking about,” said Madame Orlova. “Some dancers train for forty years and never once wonder about it.”", "“Is that a good thing or a bad thing?”", "“Neither, and both,” said Madame Orlova, smiling in the particular way she smiled when she thought a question deserved more than a simple answer. “A dancer who wonders about it sometimes finds her own tradition harder to love simply, because she can no longer pretend it is the only one. But she usually finds she loves it more honestly instead. I know which trade I would choose, if anyone offered it to me.”", "Delphine turned that answer over in her mind the whole walk home, and decided, by the time she reached her own front door, that she agreed with it completely.", "On the final afternoon of her extra credit assignment, only one drawer remained unopened, at the very bottom of the wardrobe. Inside, instead of a costume, lay a single pair of ballet slippers, pale pink, clearly well worn, and beside them a note in careful, old-fashioned handwriting.", "Every dance in this wardrobe believes something different about beauty, and all of them are right. A dancer who understands this dances ballet better, not worse, because she understands that her own tradition is one voice among many, not the only voice there is. The wish to move beautifully, it turns out, is nearly universal, even when every culture answers it in its own graceful and particular way. Wear your own shoes now, and dance knowing what you know.", "Delphine sat on the floor of the storage room for a long time after that, the pink slippers in her lap, thinking about flamenco heels and Chinese silk sleeves and Bharatanatyam hand gestures and the powwow dress she had chosen only to admire and not to wear. She thought about how different they all looked, and how, underneath the differences, each one had asked the exact same question in its own particular language: what does the body have to say that words cannot?", "When she returned to her regular ballet class the following week, something in her dancing had changed, though she could not have explained exactly what to anyone who asked. Madame Orlova noticed it first, watching Delphine move through a familiar adagio with a new kind of attention in her wrists, a new patience in the way she let each position settle before moving to the next.", "“You’ve found something,” Madame Orlova said, after class, studying her carefully.", "“I found a whole world,” Delphine said. “I didn’t know how much of it there was.”", "Madame Orlova smiled, and something in her expression suggested she understood exactly what Delphine meant, and had perhaps once opened the very same brass handle herself, many years before. “There is a saying among dancers who understand this,” she said. “Every tradition is a river, and every river, eventually, reaches the same sea.”", "“Did you find the wardrobe too?” Delphine asked, before she could stop herself.", "Madame Orlova only smiled a little wider and began gathering her sheet music, which Delphine decided to take as something between a yes and a secret she wasn't yet ready to share, the same way Delphine wasn't quite ready to share her own secret with Noor.", "Delphine never found the little brass handle again, no matter how carefully she searched the wardrobe’s back panel in the weeks that followed. Some afternoons she lingered in the storage room longer than any task required, running her fingers along the carved leaves and vines, half hoping, half certain it was useless. She came to believe the wardrobe had shown her exactly what it meant to, and no more, and that perhaps it was waiting now for someone else who needed to learn the very same thing.", "Months later, watching a school assembly where a visiting dance troupe performed a piece she didn't recognize, Delphine found herself leaning forward in her seat instead of politely waiting for it to end the way some of her classmates did. She found herself wondering about the tradition behind the movements, the years of practice folded invisibly into every gesture, the whole hidden history riding along inside something that most people in the audience would only watch for two minutes and then forget. She thought of the wardrobe, and of the note about wearing her own shoes, and understood, finally, exactly what it had meant. She didn't need another secret drawer to keep learning. The whole world outside the wardrobe was full of dances waiting for someone to pay attention.", "She still had the little notebook, tucked now into a drawer of her own at home instead of the bottom of her dance bag, its pages a small, private record of everything the wardrobe had shown her. She took it out sometimes, on evenings when she felt tired of practicing the same few ballet steps over and over, and reread her own messy notes about water sleeves and ghungroo bells and the powwow dress she had chosen to admire rather than wear, and each time, the tiredness lifted a little, replaced by the same feeling she'd had standing in that dusty storage room for the very first time: the sense that dance was a much bigger, much older, much more generous thing than she had ever imagined, and that she had only just begun to see how far it stretched."]}, {"vocab": [{"w": "grand jeté", "d": "a large, soaring jump from one foot to the other, with legs split in the air"}, {"w": "courage", "d": "the ability to do something difficult or frightening"}, {"w": "momentum", "d": "the force and speed that carries something forward once it is moving"}, {"w": "commit", "d": "to fully decide to do something, without holding back"}, {"w": "exhilarating", "d": "extremely exciting and thrilling"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Soleil learns that fully committing to a leap, in dance and in life, takes courage but feels wonderful", "Camp food is bad", "Soleil is afraid of water", "Dancing outdoors is impossible"], "ans": 0, "why": "The creek-crossing and the grand jeté both teach her about full commitment."}, {"skill": "Details", "q": "What natural obstacle does Soleil have to cross at camp?", "opts": ["A creek with stepping stones", "A mountain", "A lake", "A forest fire"], "ans": 0, "why": "She must leap across stones in a creek near the camp."}, {"skill": "Inference", "q": "Why did Soleil keep landing short on her grand jeté in the studio?", "opts": ["She was holding back at the last second instead of fully committing to the jump", "Her shoes were too big", "The floor was wet", "She was not warmed up"], "ans": 0, "why": "Hesitation right before takeoff was cutting her leap short."}, {"skill": "Cause and effect", "q": "What helped Soleil finally commit fully to a big jump?", "opts": ["Remembering how she had to fully commit while leaping across the creek stones", "A new pair of shoes", "Warmer weather", "A different studio"], "ans": 0, "why": "The physical memory of the creek crossing helped her trust the jump."}, {"skill": "Vocabulary", "q": "What does “commit” mean?", "opts": ["To fully decide to do something without holding back", "To feel sad", "To measure something", "To slow down"], "ans": 0, "why": "Committing to the jump means going for it fully, not hesitating."}], "title": "The Biggest Leap", "cat": "ballet", "blurb": "At summer ballet camp deep in the Cascade foothills, Soleil must cross a creek by leaping from stone to stone before she can face the jump that scares her most: the grand jeté, ballet's biggest leap of all.", "paras": ["Summer camp for the Rainier Ballet Theater’s junior company was held every August at a rustic lodge in the Cascade foothills, two hours east of the city, where the dancers spent mornings in a converted barn that had been fitted with a proper sprung floor and mirrors, and afternoons hiking the trails that wound through the surrounding forest. Soleil Marchetti had been looking forward to camp all year. She loved the barn studio, the smell of pine needles drifting through its open windows, the way the evening light slanted gold through the trees during the last class of the day. She loved the cabins, too, with their creaky bunk beds and the flashlight games that went on long after lights-out, and the dining hall where somebody always seemed to spill a pitcher of lemonade at exactly the wrong moment. This was her third summer at camp, and she had arrived this year already picturing the whole two weeks stretched out ahead of her, familiar and golden and safe.", "What she did not love, and had been quietly dreading since the moment the camp schedule was posted, was the grand jeté.", "A grand jeté is, in the simplest terms, a giant leap: a dancer runs, pushes off one leg, and soars through the air with both legs stretched into a full split, front leg reaching forward, back leg reaching behind, hanging there for one long, suspended instant before landing on the opposite foot. Done well, it looks effortless, almost like flying. Soleil had watched older dancers do it a hundred times and had always thought it looked like the most beautiful thing a body could do. She had a favorite video, saved on her mother's tablet, of a famous ballerina performing a grand jeté across an enormous stage, and she had watched it so many times she could recite, almost to the second, exactly when the dancer's legs would open into that impossible split.", "Doing it herself was another matter entirely.", "Every time she tried, something happened in the final half-second before her feet left the ground: a small, involuntary hesitation, a holding back, as though some cautious part of her brain reached out and grabbed the hem of her leotard at the very last moment. The result was always the same. Instead of a soaring leap with legs stretched wide in the air, she got a small, apologetic hop, her back leg barely lifting off the floor at all. She had been working on it for weeks before camp even started, and the pattern never changed, no matter how many times her regular teacher back home reminded her to run faster, push harder, trust the jump.", "“You’re holding something back,” said her teacher, Mr. Alavi, after her third attempt one morning in the barn studio. He wasn’t frustrated, exactly, just puzzled. “Your technique is fine. Your legs are strong enough. But right at the moment you should be committing fully to the air, you pull back. Do you know why?”", "Soleil did not know why. Or rather, she knew exactly why, but it embarrassed her too much to say it out loud in front of the whole class: she was afraid, and admitting that out loud felt like it would take more courage than the jump itself. Not of falling, exactly, though that was part of it. Afraid, mostly, of the enormous, uncontrollable feeling of actually letting go and trusting the jump completely, the way you had to, or it simply didn’t work.", "She tried again that same morning, and then a fourth time, and a fifth, and each attempt ended the same disappointing way, until Mr. Alavi finally moved the class on to other combinations, telling her gently that they would return to it later in the week, before the showcase. Soleil spent the rest of the morning class distracted, half-listening to corrections about her arabesque line while the grand jeté sat in the back of her mind like an unfinished sentence.", "At lunch, she picked at her sandwich and barely spoke, until her cabinmate Nadia finally set down her own tray and asked what was wrong.", "“I can't do the jump,” Soleil admitted. “Everyone else in our group already has it, or they're close. I just look scared. Because I am scared.”", "“Scared of what, exactly?” Nadia asked, not unkindly. “Falling?”", "“I don't even know,” Soleil said, which was the most honest answer she had given anyone all week. “Just scared of the middle part. Where you're all the way in the air and there's nothing to hold on to and you can't take it back anymore.”", "Nadia considered this for a moment. “That does sound like the whole point of jumping, though,” she said. “Isn't that just what a jump is?”", "Soleil didn't have a good answer for that either.", "After lunch, before the hike, Soleil found a quiet corner of the lodge porch and tried to write down, in the little notebook she brought to camp every summer, exactly what the fear felt like, thinking that maybe naming it precisely might loosen its grip a little. She wrote: it isn't the height. It isn't even really the falling. It's the second where you can't take it back. She read the sentence over twice, unsure whether writing it down had helped or simply made the whole problem feel more official, more real, more truly hers to solve.", "That afternoon, the whole junior company set out on the camp’s traditional hike to Amber Creek, a wide, shallow stream that cut through the forest about a mile from the lodge, crossable only by a scattered line of large, flat stones spaced just far enough apart that crossing required a series of small, committed jumps from one to the next. The trail to get there wound through tall firs, the ground soft and springy with fallen needles, and by the time the group reached the creek, everyone was warm and a little breathless from the walk, sunlight scattering in bright coins across the moving water.", "Soleil had crossed the creek the summer before without much trouble. This year, standing at the bank, watching the water rush clear and cold over smooth stones below, she found herself hesitating in exactly the same way she hesitated in the studio.", "“You okay?” asked her camp friend Nadia, already two stones ahead, balanced easily, hands on her hips.", "“Just thinking,” Soleil said, which was true, though what she was thinking about surprised her: the grand jeté. The stones in front of her were spaced almost exactly like the distance she needed to cover in a good leap, and the consequence of hesitating here was even more immediate than in the studio. A half-hearted jump between stones didn’t result in an apologetic little hop. It resulted in a wet sneaker, or worse.", "She looked at the first stone. She thought about all the ways this was, strangely, the same problem as the grand jeté: a gap that could only be crossed by fully deciding to cross it, with no room left over for a hesitation halfway through. She noticed, too, that the fear standing at the edge of this creek felt almost exactly like the fear standing at the edge of the studio floor before a jump: the same fluttering stomach, the same urge to take one more second to think it over, as if one more second of thinking had ever once made a hard thing easier.", "She jumped. Her foot landed solidly on the first stone, and the momentum of that first small commitment carried her thoughts forward faster than her fear could catch up. She jumped to the second stone. The third. By the fourth, something had shifted, some rhythm had taken over, and she was moving across the creek the way Nadia had, decisively, without pausing to reconsider each individual leap once it had already begun. The cold spray off the water misted her ankles as she crossed, and somewhere behind her she could hear the rest of the group laughing and calling out encouragement to a boy named Theo, who had paused too long on the middle stone and was wobbling dramatically for the amusement of everyone watching.", "She reached the far bank, a little breathless, entirely dry, and stood there for a moment turning something over in her mind.", "“You’re smiling like you won something,” said Nadia.", "“I think I figured something out,” Soleil said slowly. “About jumping.”", "She tried to explain it on the walk back to the lodge, stumbling a little over the words, saying something about how the scary part of the grand jeté wasn't really the height or the split at all, it was the exact same feeling as standing on the creek bank deciding whether to commit to the first stone. Nadia listened, nodding along even though, as a dancer who had never struggled much with jumps herself, she couldn't entirely understand what the fuss was about. But she understood enough to say the right thing anyway.", "“So you already did the hard part once today,” Nadia said. “Ten times, actually, once per stone. Feels like you're basically warmed up for it.”", "Soleil laughed, surprised at how much lighter the idea made her feel. She spent the walk back rehearsing the sensation in her mind, the specific decisiveness of that first leap onto the first stone, trying to memorize exactly what it had felt like in her legs and her stomach, the way you might try to memorize the smell of a place you knew you'd want to return to.", "That evening’s class was the last one before the following morning’s showcase for camp families. Mr. Alavi called for grand jetés across the diagonal of the barn studio, one dancer at a time, evening light slanting gold through the tall windows exactly the way Soleil loved. She watched the dancers ahead of her in line, some soaring, some holding back just as she always had, and found herself, for the first time all week, more curious than afraid about which one she would turn out to be tonight.", "When her turn came, she did not think about her feet, or her legs, or the split she was supposed to achieve in the air. She thought about the creek. She thought about the specific feeling of looking at a gap and deciding, fully and completely, with no held-back corner of herself, to cross it.", "She ran the three preparatory steps. She pushed off her back leg.", "And for the first time, she did not hold anything back. Her front leg shot forward, her back leg stretched behind her, her whole body opening into the air the way it was always supposed to, the way she had watched older dancers do a hundred times and always assumed was simply beyond her. For one long, suspended, exhilarating instant, she was entirely airborne, entirely committed, flying the way flying is supposed to feel. The barn's high rafters and dusty light seemed to blur past above her, and for that one suspended second she understood, in her whole body at once, exactly what she had been missing every single time before: not more strength, not more flexibility, only the plain, total decision to go.", "She landed, a little off balance, stumbling slightly forward on her front leg — but she landed having actually jumped, for the first time all week, a real grand jeté instead of an apologetic hop.", "“There it is,” said Mr. Alavi, and there was real delight in his voice. “What changed?”", "Soleil, catching her breath, laughing a little at herself, told him about the creek: the stones, the moment of realizing that a half-hearted jump was often more dangerous than a fully committed one, that hesitation didn’t actually protect you from anything, it just made the landing worse.", "Mr. Alavi nodded slowly. “Dancers spend years learning that lesson,” he said. “Some never learn it at all. You found it on a hiking trail. I’d call that a good use of a Tuesday afternoon.”", "She practiced the jump six more times before the class ended, and while not every attempt was as clean as the first, none of them slipped back into the small, apologetic hop that had followed her all week. Each time, she found the same trick worked: picture the creek, pick the first stone, go.", "Between attempts, she noticed Theo, the boy who had wobbled so dramatically on the creek stones that afternoon, watching her with unusual attention from the side of the studio. When class ended, he caught up with her by the water fountain.", "“You just decided to do it, right?” he asked, a little awkwardly, like he wasn't quite sure how to ask what he actually wanted to ask. “I've been trying to figure out what's different when I watch you now versus this morning. It's not your legs. It's something else.”", "“It's exactly what happened at the creek,” Soleil said. “You wobbled on the middle stone today because you stopped in between deciding and doing. I've been doing the exact same thing on this jump for weeks. Once I stopped stopping, it just kind of worked.”", "Theo considered this with the serious expression of someone filing away information he intended to use later. “That's annoyingly simple,” he said, “for something that took you this long to figure out.”", "“Tell me about it,” Soleil said, laughing. “And I only figured it out today, technically. Ask me again tomorrow if it still works.”", "That night in the cabin, Soleil lay in her bunk listening to the wind move through the trees outside, replaying the jump over and over, unable to stop smiling in the dark. Nadia, in the bunk across from her, finally told her to please go to sleep before she wore out the memory from thinking about it too much, which only made Soleil laugh and think about it a little more before she finally drifted off.", "She took out her notebook one more time before turning off her flashlight and added a second line beneath the one from that afternoon: it also isn't really about the jump. It's about deciding, and then not taking the decision back halfway through. She thought that sentence might turn out to be useful for more than just dancing, though she wasn't sure yet what else she might need it for. She decided to keep it anyway, tucked safely at the bottom of her camp bag, in case she ever needed to remind herself of the creek again.", "The next morning, families gathered on blankets and folding chairs outside the barn studio for the camp showcase, and Soleil’s group performed a short piece that ended with a line of grand jetés across the floor, one dancer after another, legs splitting wide in the golden morning light streaming through the open barn doors. Soleil's parents had driven the two hours out from the city with her little brother, who was under strict instructions not to run onto the performance space no matter how bored he got waiting for his sister's turn.", "Soleil watched the dancers ahead of her in the line, counting down her own turn in her head, the familiar flutter rising in her stomach the way it always did right before something that mattered. She noticed, though, that the flutter felt different this time, less like dread and more like the ordinary nervousness of standing at the edge of any exciting thing, the kind of feeling that didn't need to be fixed so much as simply carried forward into the jump itself.", "Soleil’s turn came near the end. She thought, just for a flicker of a second, about Amber Creek, about the specific decision to fully commit, and then she ran, and pushed off, and flew.", "She landed cleanly this time, both legs remembering exactly what they were supposed to do, and heard, distantly, over the sound of her own pounding heart, her family clapping from somewhere in the crowd of blankets, her little brother's voice rising clearly above the rest, shouting her name with no regard at all for showcase etiquette.", "Her mother hugged her so tightly afterward that Soleil's little brother complained loudly that he wanted a turn too, and her father kept saying the word \"incredible\" so many times in a row that Soleil finally told him, laughing, that he was allowed to use other words as well. Nadia's family, camped out on the next blanket over, cheered just as loudly, and for a while the two families mingled together on the grass, trading snacks and comparing notes on the whole two weeks of camp as though they had known each other far longer than a single showcase morning.", "Afterward, walking back toward the lodge with Nadia, her legs pleasantly tired in the particular way that comes after doing something difficult and doing it well, Soleil found herself already looking forward to next August, and to the creek, and to whatever other invisible lesson might be waiting there among the stones, disguised as nothing more than an ordinary hike.", "Before her family drove home that afternoon, Soleil spotted a younger camper, a small girl of about eight who had watched the older group's showcase piece with wide, wistful eyes, practicing a hesitant little hop of her own near the edge of the barn, clearly trying and failing to imagine ever doing what she had just watched Soleil's group perform. Soleil walked over and crouched down beside her.", "“It looks impossible at first,” Soleil said. “I promise it isn't. Want to know a secret that has nothing to do with ballet at all?”", "The younger girl nodded, eyes still wide.", "“Find yourself a creek,” Soleil said, smiling, “with some good stones in it. The jump will teach you everything else.”", "The girl looked confused, glancing between Soleil and the barn, clearly wondering what a creek had to do with ballet at all, and Soleil only laughed and promised that it would make sense eventually, probably on some ordinary afternoon that wouldn't feel important until it already was."]}, {"vocab": [{"w": "release", "d": "a move where a gymnast lets go of the bar and flies briefly through the air before catching it again"}, {"w": "momentum", "d": "the force and speed built up by movement"}, {"w": "trust", "d": "a firm belief that something or someone will not let you down"}, {"w": "hesitate", "d": "to pause because you feel unsure"}, {"w": "technique", "d": "a specific method or way of doing something skillfully"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Wren learns to trust her training and let go of the bar with confidence", "Wren injures her wrist", "Wren switches to floor exercise", "The bars are broken"], "ans": 0, "why": "Wren works through her fear of release moves with help from a mentor."}, {"skill": "Details", "q": "What is a release move?", "opts": ["Letting go of the bar and flying briefly before catching it again", "A dismount", "A warm-up stretch", "A floor pass"], "ans": 0, "why": "A release move requires letting go completely for a moment."}, {"skill": "Inference", "q": "Why did the retired Olympian have Wren practice releases into a foam pit first?", "opts": ["To let her feel the letting-go motion safely before trying it on the real bar", "Because the real bars were being repaired", "Because foam pits are more fun", "To save time"], "ans": 0, "why": "The foam pit removes the danger while she builds the feeling of trust."}, {"skill": "Cause and effect", "q": "What happened when Wren hesitated during a release attempt?", "opts": ["She let go too late and did not complete the move cleanly", "She flew farther than expected", "She scored a perfect ten", "Nothing changed"], "ans": 0, "why": "Hesitating at the key moment threw off her timing."}, {"skill": "Vocabulary", "q": "What does “hesitate” mean?", "opts": ["To pause because you feel unsure", "To move very fast", "To celebrate", "To practice"], "ans": 0, "why": "Wren hesitates right before the scary part of the release."}], "title": "Learning to Let Go", "cat": "gymnastics", "blurb": "Wren can swing on the uneven bars all day, but the release move where she has to actually let go and fly through the air terrifies her. A retired Olympian teaches her that trust is a skill you can practice.", "paras": ["Wren Okafor had been swinging on the uneven bars since she was six years old, ever since her mother signed her up for a \"Mommy and Me\" tumbling class that turned out to be far too small a container for the amount of energy Wren brought to it. By the time she was seven, she had graduated out of the recreational program entirely and into the competitive team, and by eleven she could do things on that apparatus that made younger gymnasts at her gym stop and stare: giant swings that carried her all the way around the high bar in a smooth, powerful circle, handstands held perfectly still at the top of the swing, transitions between the high and low bars so quick and clean they looked almost like a single motion.", "Bars were, everyone at Cascade Gymnastics Academy agreed, Wren's event. She was not the strongest tumbler on the team, and her beam routines, while solid, never quite had the same sparkle as her work on bars. But put her on the uneven bars, with the low bar at one height and the high bar towering above it, cables and chalk dust and the particular hush that settled over the gym whenever someone attempted something difficult, and Wren simply looked like she belonged there, the way some people look like they belong on a stage or behind a piano.", "There was only one thing on the bars she could not make herself do, and it was, unfortunately, one of the most important skills at her level: the release move.", "A release move sounds exactly like what it is. In the middle of a giant swing, instead of holding on, the gymnast lets go of the bar entirely, flies through the air for a brief, weightless moment, and then catches the same bar again, or a different one, to continue the routine. It is one of the things that makes uneven bars routines look so thrilling: a gymnast's hands actually leaving the bar, her whole body airborne and unsupported, trusting completely that her own timing and her own body will bring her back to a safe catch.", "Wren could do everything leading up to a release. She could build a giant swing with perfect form, generate all the necessary momentum, position her body exactly where it needed to be, point her toes, keep her shoulders open, everything the drills had drummed into her for months. And then, every single time, right at the moment she was supposed to let go, something in her simply refused.", "\"I get to the top of the swing and my hands just won't open,\" she told her coach, Ms. Halvorsen, after her fifth failed attempt one Tuesday afternoon. Chalk dust drifted down from her palms as she flexed her fingers, as though checking that they still worked at all. \"I know what I'm supposed to do. My brain says let go. My hands say absolutely not.\"", "\"That's actually a very sensible reaction,\" said Ms. Halvorsen. \"Your hands are protecting you. The trouble is, at this point in your training, they're protecting you from something that isn't actually dangerous anymore, because you've built the strength and technique to do this safely. Your body just hasn't caught up to that fact yet.\"", "Wren dropped down from the low bar and sat on the mat, hugging her knees. \"How do I make it catch up, though? I've tried telling myself it's fine like a hundred times. It doesn't work. My hands don't listen to what I tell them.\"", "\"That,\" said Ms. Halvorsen, glancing at the clock on the far wall, \"is a very good question, and it turns out we might have exactly the right person visiting this week to help answer it.\"", "That week, the gym had a special guest: a retired Olympic gymnast named Petra Vance, who had competed on uneven bars at the international level for nearly a decade and now traveled to different gyms giving clinics on technique. Younger gymnasts on the team had been buzzing about her arrival for days, trading rumors about which countries she had competed in and whether she had actually met other famous gymnasts. Ms. Halvorsen introduced her to Wren specifically.", "\"Wren has excellent bar work,\" Ms. Halvorsen explained. \"Everything except release moves. She freezes at the moment of letting go.\"", "Petra studied Wren for a moment with a kind, knowing expression, the sort of look that suggested she had seen this particular problem a hundred times before and was not remotely worried about it. \"Ah,\" she said. \"The letting-go problem. I know it well. It took me two full years to solve it myself.\"", "\"Two years?\" Wren said, startled. She had assumed, somehow, that Olympic gymnasts had never struggled with anything the way she was struggling now, that they had simply been born knowing how to fly through the air without flinching.", "\"Two years,\" Petra confirmed. \"I competed for my national team for six years altogether, and for the first two of them, I could not perform a single release move in an actual meet, even though I could do them beautifully in practice the moment nobody was scoring me. My hands knew the technique. My nerves had not gotten the memo.\"", "\"But you still made it to the Olympics,\" Wren said. \"How does that even work if you couldn't do releases for two years?\"", "\"Very slowly, and with a great deal of patience from people around me,\" Petra said, smiling at the memory. \"I competed simpler bar routines for those two years, ones that didn't need a release at all, while I quietly kept rebuilding the skill in practice, piece by piece, the same way we're about to start rebuilding yours. By the time I finally trusted it enough to put it in a real routine, in front of real judges, I had done that release move so many thousands of times in training that my hands genuinely did not have room left to hesitate. The move had simply become part of who I was on the bars.\"", "\"What did you do?\"", "\"I nearly quit the event entirely,\" Petra admitted, sitting down on the mat across from Wren. \"My coach at the time wanted to move me to floor exercise permanently, since bars seemed like a lost cause. But I loved the bars too much to give them up without trying everything I could think of first. And I want you to know that struggling with this doesn't mean anything is wrong with you. It means you have a normal, healthy sense of self-preservation, and we simply need to teach it something new. May I show you how I finally solved it?\"", "Wren nodded eagerly.", "\"First,\" said Petra, leading her toward the gym's foam pit, a deep, cushioned pool filled with loose foam blocks, positioned beneath a low practice bar specifically for safely learning new skills, \"we take away the fear entirely, so your body can learn the feeling of letting go without your brain arguing about consequences.\"", "Wren climbed onto the low bar above the foam pit, and a few of her teammates who had been finishing their own drills wandered over to watch, curious about what the visiting Olympian had planned. \"Just swing,\" Petra instructed, \"and this time, when you reach the top, don't think about catching anything. Just let go and fall into the pit. That's the whole skill. Just the letting go part.\"", "Wren swung, reached the top of her arc, and, with the soft foam pit waiting harmlessly below instead of a hard gym floor, found it surprisingly easy to simply open her hands and drop. She landed in the foam with a satisfying whump, sinking up to her elbows in loose blocks, laughing despite herself.", "\"How did that feel?\" Petra asked.", "\"Weirdly easy,\" Wren admitted, pulling herself out of the pit with foam blocks tumbling off her shoulders. \"I think because I knew nothing bad could happen.\"", "\"Exactly,\" said Petra. \"That's the whole secret. Your body needs to feel the sensation of letting go successfully, over and over, before it will trust that same motion somewhere the consequences feel bigger. We build the trust in a safe place first, and then we move it, piece by piece, to a less safe-feeling place, even though by then, with your training, it truly is safe.\"", "For the rest of that session, Wren practiced release swings into the foam pit, dozens of times, until the motion of opening her hands at the top of the swing began to feel automatic rather than terrifying. Something in her body was slowly rewriting an old rule. By the twentieth repetition, her teammates had started counting out loud for her, cheering a little louder with each successful drop, and Wren found herself grinning every time she climbed back out of the foam, chalk-dusted and covered in loose blocks.", "\"You're smiling,\" Petra observed, amused, after one particularly enthusiastic landing. \"That is an excellent sign. Fear and smiling rarely occupy the same body at the same time.\"", "That evening, Wren's mother asked how practice had gone, and Wren found herself talking for nearly ten minutes straight about foam pits and release moves and a retired Olympian who had once struggled with the exact same thing. \"She said it took her two years,\" Wren said, still a little amazed by this fact. \"Two years, and she still ended up going to the Olympics.\"", "\"Sounds like a good person to learn from, then,\" her mother said. \"Someone who knows the hard parts don't disappear right away, but that they can still be worked through.\"", "The following week, Petra had her try something new: a release swing on the real bar, but positioned low, close to another soft mat, with a spotter — a trained coach who stands ready to help guide and catch a gymnast during a new or difficult skill — standing directly beside her.", "\"I'll be right here,\" said Ms. Halvorsen, taking her position as spotter. \"My hands will be right under you the entire time. You cannot fall wrong with me here.\"", "Wren swung. She reached the top. Her hands, remembering the dozens of successful releases into the foam pit, opened on cue, without the usual frozen hesitation. She flew for a brief, thrilling half-second, and Ms. Halvorsen's steady hands guided her safely to the mat below.", "\"There it is,\" Petra said, delighted. \"Did you feel that? That was a real release. Your body did it before your fear had time to object.\"", "Over the following weeks, Wren practiced the skill again and again, each time a little higher, a little closer to the real routine, the spotter's hands present but needed less and less. Ms. Halvorsen would stand a half-step farther back each session, close enough for Wren to feel safe, far enough that Wren's own body was doing more and more of the actual work. Petra returned twice more during this stretch, checking Wren's form, adjusting the angle of her arms at the moment of release, reminding her, again and again, that technique and trust were not two separate things but two names for the same slow-building skill.", "There were setbacks. Some days the old hesitation crept back, her hands clamping down at the crucial moment instead of opening, and Wren would leave the gym frustrated, feeling as though she had lost ground. One particularly discouraging Thursday, she failed the release five times in a row, twice nearly toppling sideways off the low bar in a clumsy half-attempt, and finally sat on the mat with her face in her hands, furious with herself for a fear she thought she had already beaten weeks earlier.", "\"That's completely normal,\" Petra told her during one of these frustrating sessions, crouching down beside her on the mat. \"Trust isn't a switch you flip once and it stays flipped forever. It's more like a muscle. Some days it's strong. Some days you have to rebuild it a little. The goal isn't to never hesitate again. The goal is to know what to do when you do hesitate: go back one step, rebuild the trust, and try again.\"", "\"It feels like I'm going backward,\" Wren said miserably.", "\"You're not going backward,\" Petra said. \"You're finding out exactly where the edge of your trust is today, so you know exactly which step to rebuild from. That's not failure. That's information. Even now, when I coach other gymnasts through this same fear, I still have days on other things, in other parts of my life, where my hands clamp down when they should open. Nobody outgrows this feeling completely. You just get better and better at knowing what to do about it.\"", "Wren went back to the foam pit that same afternoon, did ten easy, low-stakes releases into the soft blocks to remind her hands what success felt like, and left the gym in a noticeably better mood than she had started it in.", "At home that night, she found an old notebook and, feeling a little silly about it, wrote at the top of a blank page: \"Things My Hands Have Learned To Do Even Though They Were Scared At First.\" Underneath, she listed handstands, back walkovers, her very first cartwheel at age five, and, cautiously, in pencil so she could erase it if it turned out to be premature, releases. Seeing the list helped more than she expected. Every skill on it had felt impossible once, and every single one had eventually become automatic, something her hands did without a second thought. There was no reason, she decided, that releases should be any different, even if they were taking their own sweet time getting there.", "Six weeks after that first foam pit session, Wren attempted her first full, unassisted release move on the actual bars, no spotter standing beside her, no foam pit below, only the mat every gymnast trains above. Ms. Halvorsen and Petra, who had returned to check on her progress, stood nearby, watching, and several of Wren's teammates had quietly gathered near the edge of the mat as well, sensing that something important was about to happen.", "The gym had its usual late-afternoon sounds: the rhythmic thud of someone tumbling on the floor mats across the room, chalk dust hanging faintly in a shaft of window light, the low murmur of another coach spotting a beam routine nearby. Wren chalked her hands one last time, gripped the bar, and felt the familiar rough texture under her palms.", "Wren built her giant swing, feeling the familiar rush of momentum, and as she reached the top of the arc, she thought not about the danger, and not even really about letting go, but simply about the dozens of successful releases that had come before this one, each one teaching her hands a little more that this was safe.", "She let go. She flew, weightless, for a genuine, uncoached, unassisted half-second — and caught the bar again cleanly on the other side, her whole body continuing the swing without a single stumble.", "\"YES!\" shouted Ms. Halvorsen, pumping her fist, and behind her, Wren's teammates burst into applause, a few of them jumping up and down on the mats in excitement.", "Wren finished the swing and dropped to the mat, breathless, grinning so widely her cheeks ached.", "\"How did that feel?\" Petra asked, though her expression suggested she already knew the answer.", "\"Like flying,\" Wren said. \"Actual flying. I can't believe I get to feel that now.\"", "\"You always could,\" Petra said gently. \"You just needed time to teach your hands what your training already knew.\"", "Wren tried the release two more times that same session, and although the second attempt was slightly less clean than the first, her hands opened both times without hesitation, without the old frozen refusal, and by the end of practice she had done the skill five times total, each one a little steadier than the last.", "Petra stayed to watch the last two attempts before she had to leave for her next clinic across town. Before she left, she crouched down to Wren's level one more time. \"I want you to remember something,\" she said. \"The fear didn't disappear today. You'll probably still feel a flicker of it the next time you try this, and the time after that, and maybe even years from now on some brand-new skill. What changed today wasn't the fear. It was you, deciding that the fear didn't get to make the final decision anymore. That's the whole trick, on bars and everywhere else. Not becoming fearless. Becoming someone who can feel afraid and still let go anyway, when letting go is actually the safe and right thing to do.\"", "That evening, walking out of the gym with her bag over her shoulder, turning Petra's words over in her mind the way she sometimes turned over a new skill, checking it from every angle to see how it fit, Wren found herself thinking about all the other moments in her life that might work the same way: the times she held back from raising her hand in class, or trying out for something, or speaking up when she had something to say. She thought about a spelling bee she had talked herself out of entering the year before, and a solo audition for the school chorus she had almost skipped because the idea of everyone watching her alone had felt, at the time, unbearably risky.", "Maybe trust really was a muscle, one you could deliberately practice building, a little at a time, in a safe place first, until eventually it was simply strong enough to carry you the rest of the way. Maybe every scary \"let go\" moment, on the bars or off them, needed its own kind of foam pit first: a safe place to practice the feeling before the real thing ever counted.", "Wren decided, walking to her mother's car with chalk still dusting her fingers, that she was going to try out for that chorus solo after all, next time auditions came around. If her hands could learn to open at the top of a swing, she figured, the rest of her could probably learn a few new things too."]}, {"vocab": [{"w": "extraordinary", "d": "far beyond what is usual or ordinary"}, {"w": "dedication", "d": "steady, hardworking commitment to something"}, {"w": "awareness", "d": "knowing clearly what is happening around you and inside your own body"}, {"w": "withdraw", "d": "to remove yourself from something, such as a competition"}, {"w": "advocate", "d": "to speak up for yourself or for something you believe is right"}], "quiz": [{"skill": "Main idea", "q": "What is this biography mostly about?", "opts": ["Simone Biles is a record-setting gymnast who also showed courage by prioritizing her safety", "Simone Biles never won any competitions", "Gymnastics is not a real sport", "Simone Biles quit gymnastics forever"], "ans": 0, "why": "The story covers both her extraordinary skill and her brave choice at the Tokyo Olympics."}, {"skill": "Details", "q": "Who raised Simone and her siblings for most of her childhood?", "opts": ["Her grandparents, who later adopted her", "Her birth parents", "A boarding school", "She raised herself"], "ans": 0, "why": "Simone's grandparents adopted her and her sister and raised them."}, {"skill": "Inference", "q": "Why did Simone withdraw from parts of the Tokyo Olympics in 2021?", "opts": ["She lost track of her body's position in the air and continuing could have caused a serious injury", "She wanted attention", "She was bored of gymnastics", "She had a minor cold"], "ans": 0, "why": "The \"twisties\" made continuing genuinely dangerous, so she stopped to stay safe."}, {"skill": "Cause and effect", "q": "What happened after Simone spoke publicly about her decision?", "opts": ["Many people, including other athletes, praised her honesty and courage about mental health and safety", "Everyone was angry at her forever", "She was removed from the sport", "Nothing changed in gymnastics"], "ans": 0, "why": "Her openness sparked wide discussion and support around athlete wellbeing."}, {"skill": "Vocabulary", "q": "What does “advocate” mean?", "opts": ["To speak up for yourself or something you believe in", "To lose a competition", "To practice a skill", "To travel somewhere"], "ans": 0, "why": "Simone advocated for her own safety and wellbeing."}], "title": "Simone Biles and the Bravest Word", "cat": "gymnastics", "blurb": "Simone Biles is often called the greatest gymnast of all time. But one of her most important moments wasn't a gold medal. It was the day she stood in front of the whole world and said the hardest word there is: no.", "paras": ["Simone Biles has four gymnastics skills named after her. That single fact tells you something remarkable, because in gymnastics, a move only gets an athlete's name attached to it when that athlete is the very first person in the world to successfully perform it in international competition. Most elite gymnasts go their whole careers without a single skill named for them. Simone has four: two on floor exercise, one on vault, and one on balance beam, each one so difficult and so uniquely her own that judges had never seen anything quite like it before she showed them.", "She was born in Columbus, Ohio, in 1997, and her early childhood was not an easy or stable one. Her birth mother struggled with addiction and was unable to safely care for Simone and her siblings, and for a period of time, Simone and her younger sister lived in foster care. When Simone was six years old, her grandparents, Ron and Nellie Biles, made the decision to adopt her and her sister, raising them from then on as their own daughters. Simone has said many times that she considers Ron and Nellie her true parents, and that their steady, loving home in Spring, Texas, gave her the foundation she needed to eventually become one of the most decorated athletes in the world.", "Growing up, Simone was surrounded by family who supported her completely. She and her sister Adria grew up close, often training in the same gym and cheering each other on, and Simone has spoken often about how much her parents' steady, patient encouragement meant to her, especially in the early years when nobody, including Simone herself, had any idea just how far gymnastics might take her.", "Gymnastics entered her life almost by accident. On a field trip with her daycare, six-year-old Simone climbed and flipped around a gymnastics gym with such natural power and control that a coach noticed immediately and sent home a letter suggesting her family enroll her in classes. That casual field trip turned into a career that would eventually make her a household name across the entire world. Even in those very first classes, coaches noticed something unusual: a kind of explosive power in her legs and an instinctive sense, even as a young child, of exactly where her body was in the air, a skill gymnasts call air awareness.", "Simone trained for most of her career at a gym in Spring, Texas, called the World Champions Centre, which her parents eventually built and owned specifically so Simone and other young gymnasts in the area would have a world-class place to train close to home. Her earliest coach, Aimee Boorman, worked with her for more than a decade, helping shape the raw power Simone showed as a young child into the polished, precise technique elite competition demands. Later in her career, Simone trained under coaches Cecile and Laurent Land
