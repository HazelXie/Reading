 as much as the performance itself, curious to meet it again and see what new thing it might teach her.", "She carried that secret with her long after the costumes were packed and the theater lights were out. Whenever she felt nervous, before a test or a new class or a big recital, she took a slow breath, counted to four, and remembered the mouse who danced anyway, and the stage manager who still, after all these years, hummed old ballet melodies to an empty, beloved theater.", "The matinee arrived a week later, and Lena discovered that Mr. Otis had been exactly right. The butterflies came back the moment she zipped herself into her costume, right on schedule, just as insistent as ever. But this time, she didn't fight them or wish them away. She sat in the same folding chair, breathed in for four counts, held for four, breathed out for four, and let herself feel every bit of the nervousness without letting it knock her off balance.", "Mr. Otis found her there, exactly as before, and raised his eyebrows in silent question.", "\"Still nervous,\" Lena told him. \"Just not scared of being nervous anymore.\"", "\"That,\" said Mr. Otis, \"is the whole trick. That's the only trick there ever was.\"", "She danced the matinee, and then, the following weekend, the final evening show, and both times the audience gasped in all the same places and applauded in all the same places, and both times Lena felt the same warm rush of relief and joy when the curtain finally came down. By her very last bow of the run, she found she almost missed the butterflies already, the particular, electric feeling of standing in the wings with one foot in shadow and one foot in light, waiting for a story to begin."]}, {"vocab": [{"w": "astronaut", "d": "a person trained to travel and work in space"}, {"w": "shuttle", "d": "a spacecraft that carries astronauts to space and back"}, {"w": "discourage", "d": "to make someone feel less hopeful or confident"}, {"w": "spacecraft", "d": "a vehicle built to travel in space"}, {"w": "inspire", "d": "to make someone want to do something good or brave"}], "quiz": [{"skill": "Main idea", "q": "What is the main idea of this biography?", "opts": ["Mae Jemison followed several passions and succeeded in each", "You should choose only one dream", "Dancing is easier than science", "Space travel is simple"], "ans": 0, "why": "Mae combined dance, science, medicine and space travel."}, {"skill": "Details", "q": "What did Mae take into space to honor dance?", "opts": ["A poster of a dance company", "A trophy", "A camera", "A bicycle"], "ans": 0, "why": "She carried a poster from the Alvin Ailey American Dance Theater."}, {"skill": "Inference", "q": "Why did the teacher say, “Maybe you should be a nurse”?", "opts": ["She did not expect a girl like Mae to become a scientist", "She wanted Mae to be a doctor", "She loved nurses", "Mae asked for it"], "ans": 0, "why": "The teacher's comment showed low expectations, but Mae did not let it stop her."}, {"skill": "Sequence", "q": "Which happened first?", "opts": ["Mae studied at Stanford", "Mae flew on the Space Shuttle", "Mae worked in Africa as a doctor", "Mae joined NASA"], "ans": 0, "why": "She went to Stanford long before she worked as a doctor or joined NASA."}, {"skill": "Vocabulary", "q": "What does “inspire” mean?", "opts": ["To make someone want to do something great", "To fall asleep", "To be angry", "To pack a bag"], "ans": 0, "why": "Mae's story is meant to inspire kids."}], "title": "From the Dance Floor to the Stars", "cat": "ballet", "blurb": "Mae Jemison loved to dance and she loved the stars. People told her to pick one. She chose both, and became the first Black woman to travel into space.", "paras": ["When Mae Jemison was a little girl in Chicago, she looked up at the night sky and asked a question that seemed simple. “Are there people up there?”", "Nobody could tell her for sure. Mae was born in 1956 in Decatur, Alabama, and her family moved to Chicago when she was three years old, part of a wave of families seeking new opportunities in northern cities during that era. Her father worked as a roofer and a carpenter, and later as a maintenance supervisor. Her mother taught elementary school for more than twenty-five years. They believed in books, questions, and curiosity, and they made sure that Mae and her brother and sister were always learning something new, whether it was checking out stacks of library books or visiting the Chicago Museum of Science and Industry, which quickly became one of Mae's favorite places in the entire world.", "Mae was a serious student from the very beginning, the kind of child who finished her homework quickly so she could get back to whatever book she was in the middle of. She attended Morgan Park High School on Chicago's South Side, where she threw herself into as many subjects as the school day would allow, sliding effortlessly between chemistry and art, math and dance rehearsals, never quite understanding why anyone expected her to pick a favorite. Her older brother and sister, both bright and curious in their own ways, filled the house with a kind of constant, friendly competition over who could answer a question first, and Mae, the youngest, made sure she kept up. On weekends, the whole family sometimes piled into the car for the drive back to the museum, where Mae would plant herself in front of the same exhibits again and again, the model of the solar system, the case of gleaming minerals, the enormous static generator that made visitors' hair stand on end, and ask the exhibit guides so many questions that her mother would eventually have to gently steer her toward the door.", "Mae loved to look at the stars. She checked out books about astronomy from the library and read them until the covers were soft. She was especially captivated by the Apollo missions unfolding on television during her childhood, though she noticed something that bothered her even then: every astronaut she saw on the news was a white man. She dreamed of traveling to space someday anyway. She wasn't sure how, since in those days, almost all astronauts came from a narrow set of backgrounds that didn't include anyone who looked like her. But she was sure that someone should go. And she thought that someone might as well be her.", "Mae also loved to dance.", "She danced every chance she got. She danced in her living room, she danced at school, and she danced in the hallway on the way to the bathroom. When she was old enough, she took lessons in ballet, jazz, African dance, and modern dance, and she performed in local shows around Chicago. When she stepped on stage, she felt as if she were flying, a sensation not so very different, she would later realize, from the weightlessness of space itself.", "Her dance teachers noticed her discipline as much as her talent. She showed up early to warm up her own muscles before class even began, and she stayed late afterward, running through combinations one more time until they felt as natural as walking. She studied ballet's careful positions and precise lines, the loose-limbed athleticism of modern dance, the driving rhythms of jazz, and the deep, grounded movements of African dance traditions passed down through generations, and she loved noticing how differently each style asked her to use the very same body. In local recitals around Chicago, she danced everything from delicate variations on pointe to bold, percussive African dance numbers, sometimes on the very same program, changing costumes in a hurry backstage between numbers, breathless and grinning.", "At school, she loved science and art with the same fierce love. She built models, dissected frogs, read voraciously about biology and engineering, and choreographed dances in the same week. She wasn’t the kind of person who thought of these things as separate. To Mae, dance and science both asked the same questions. How do things move? How do they work? How can we make something beautiful, precise, and true, all at once?", "She kept a small notebook of her own, much like a scientist’s field journal, where she wrote down questions she didn’t yet have answers to: why the moon looked bigger near the horizon, how a caterpillar knew when to become a butterfly, why some fabrics moved so differently than others when a dancer turned. She sewed some of her own dance costumes by hand, carefully measuring and pinning fabric the same way she measured chemicals in her home experiments, delighted to discover that sewing and science asked for exactly the same kind of patience and precision.", "But some people didn’t see it that way.", "One day, when Mae was in kindergarten, her teacher asked the class, “What do you want to be when you grow up?”", "Mae raised her hand. “I want to be a scientist,” she said proudly.", "Her teacher smiled, but it wasn’t a kind smile. “Don’t you mean a nurse?” she asked.", "Mae frowned. She didn’t understand. Nurses were wonderful, and she respected them enormously, but she didn’t want to be one. “No,” she said. “A scientist.”", "The teacher looked surprised. In those days, many people believed girls, and especially Black girls, weren’t supposed to become scientists. They didn’t say it out loud. They just gave small nudges that pushed you toward a different path. Mae noticed the nudges. But she didn’t let them stop her. She decided that people who tried to discourage her simply weren’t seeing what she could do, and rather than feeling defeated, she found the whole misunderstanding almost strange, as though the teacher were describing some entirely different child.", "She told her parents about it that evening, expecting them to be as puzzled as she was. Her mother listened carefully, then knelt down and told her something Mae never forgot: that some people would always try to tell her what she was allowed to want, and that the only vote that actually counted, in the end, was her own. Her father added, more simply, that the people worth listening to were the ones who asked her what she wanted to be and then helped her figure out how to get there, and nobody else. Mae carried both of those sentences with her for the rest of her life, pulling them out again, quietly, whenever she ran into another version of the same doubtful smile.", "Mae worked harder than ever, moving through school with a rare intensity and focus. She was so good at school that she graduated from high school at sixteen and went to Stanford University in California, one of the youngest students in her incoming class. She studied chemical engineering and fulfilled the requirements for a degree in African and Afro-American studies as well, refusing, even then, to narrow herself down to just one interest. And she kept dancing. She took classes at Stanford, performed in shows, and even choreographed and produced a full musical theater production during her time there, a massive undertaking that required managing dozens of performers alongside her demanding engineering coursework. She was also often one of only a small handful of Black students in her engineering classes, and she has spoken since about how isolating that could feel, walking into a lecture hall and rarely seeing anyone who looked like her among hundreds of students. She found community instead through Stanford's Black Student Union, where she served as head, organizing events and speaking up for other students of color navigating that same unfamiliar territory, an experience she has said taught her as much about problem-solving and persistence as any of her science courses did. Some people told her she should give up dance and focus entirely on science, that trying to do both seriously would only weaken her in each. “You can’t do both well,” they said.", "Mae just kept doing both, and doing them well.", "In fact, when the time came to decide about her future, dance nearly won out entirely. After graduating from Stanford, Mae seriously considered becoming a professional dancer, and she has said in interviews since that she came close to pursuing it as her actual career rather than as a passion alongside her scientific work. It was her mother who gently urged her to attend medical school first, pointing out that she could always dance, but medical school admission windows and opportunities might not wait forever. Mae listened, though she has said she never entirely let go of wondering, in quiet moments, what that other path might have looked like.", "She went to medical school at Cornell University in New York. She became a doctor, earning her degree in 1981.", "During her years at Cornell, and in the time right after, Mae found ways to combine her medical training with her love of travel and her curiosity about the wider world. She provided primary medical care to Cambodian refugees living in a camp in Thailand, and she studied and worked in Kenya and in Cuba as well, learning firsthand how differently medicine could be practiced depending on the resources, culture, and needs of a particular community. These experiences abroad, demanding and eye-opening all at once, helped shape the doctor she would soon become, and planted the seed of an idea that would follow her for the rest of her career: that good medicine, like good science, had to pay attention to the specific people and places it was meant to serve.", "But that was not the end of her journey. After she finished her training, she worked for a period as a general practitioner in Los Angeles, and then joined the Peace Corps, a group that sends volunteers to help people around the world. Mae went to West Africa, serving as the area Peace Corps medical officer for Sierra Leone and Liberia from 1983 to 1985. It was demanding, meaningful work: she supervised the pharmacy and medical staff, developed and implemented health and safety guidelines for volunteers, wrote self-care manuals used by Peace Corps staff, and conducted medical research alongside the Centers for Disease Control on vaccines for hepatitis B, rabies, and schistosomiasis, a parasitic disease. She loved the work, and she loved discovering just how much a single dedicated person could accomplish when they refused to specialize themselves down to only one narrow skill.", "Life as a Peace Corps medical officer meant long days and constant problem-solving, often with limited supplies and no easy way to call for backup. Mae was responsible for the health of every Peace Corps volunteer serving across two countries, which meant she might spend one morning treating a tropical illness in a rural clinic and the same afternoon reviewing lab results for a research project, then spend the evening writing training materials that volunteers hundreds of miles away would use to keep themselves safe and healthy. She has said since that the work taught her to trust her own judgment completely, since there was often nobody more senior around to ask.", "Choosing the Peace Corps, and choosing West Africa in particular, felt to Mae like pulling a thread all the way back to her college studies in African and Afro-American studies at Stanford. She had spent those college years reading and thinking about the histories and cultures connecting the African continent to her own family's story, and the Peace Corps gave her a chance to live inside that connection rather than simply study it from a classroom on the other side of an ocean. She has described those two years as some of the most demanding of her entire life, and also among the ones she treasures most, precisely because they asked so much of her all at once: her medical training, her leadership, her patience, and her willingness to keep learning long after she'd already earned her degree.", "But the stars had not forgotten her.", "In 1983, Mae watched Sally Ride, the first American woman in space, lift off on the Space Shuttle. She read the news, and she thought, Maybe it’s my turn.", "She had also been inspired for years by a character on television. Nichelle Nichols played Lieutenant Uhura on Star Trek, a Black woman who worked as a communications officer on a spaceship. Mae had watched her as a child and thought, Yes. Of course. People like me belong in the future. Nichols, in fact, had spent time in the late 1970s working with NASA itself, helping recruit women and people of color to apply for the astronaut corps, a program that helped pave the way for astronauts like Mae to apply in the first place, though Mae wouldn't fully appreciate that particular connection until many years later. Years later, Mae would come to know Nichelle Nichols personally, a friendship that meant an enormous amount to her, given how much that single television role had shaped her own sense of what was possible.", "So Mae applied to NASA’s astronaut program. She was rejected the first time she applied, in 1985, because the program paused new astronaut selections after the terrible Space Shuttle Challenger accident that January. But she did not give up. She applied again the following selection cycle. In 1987, out of a pool of about two thousand applicants, NASA chose fifteen new astronauts. Mae Jemison was one of them, one of only a small handful of women, and the only Black woman, selected that year.", "The day the phone call came, Mae has said, felt almost unreal, the culmination of a dream she'd carried since she was small enough to lie on the floor of the Chicago Museum of Science and Industry and stare up at the models of the planets. Word spread quickly through Chicago's South Side, where Mae had grown up, and where more than a few kids who had never before imagined an astronaut could look like them suddenly had a very concrete reason to imagine exactly that. Mae understood, even then, that being the only Black woman in her astronaut class carried a certain weight of representation she hadn't necessarily asked for but didn't shy away from either. If people were going to look to her as proof of what was possible, she decided, she would simply have to be very, very good at her job, and let the proof speak for itself.", "Training was tough. She learned how to fly in T-38 jet trainers, how to survive emergency water landings, and how to float in a giant pool called the Neutral Buoyancy Laboratory while wearing a heavy, pressurized spacesuit, simulating the weightlessness of actual spacewalks. She studied how the Space Shuttle worked from the inside out, memorizing thousands of switches, procedures, and emergency protocols, and she practiced every conceivable emergency that might occur during launch, orbit, or reentry. She loved it all. Every moment was another step toward the stars.", "She trained alongside the rest of her astronaut class for more than a year before any of them were assigned to an actual flight, rotating through technical jobs that kept the astronaut office running: reviewing procedures for shuttle software, supporting launches from Mission Control, and helping test new equipment that future crews would rely on. It was unglamorous, detailed, occasionally tedious work, and Mae approached it the same way she approached everything else, with the quiet, thorough attention she had first practiced counting out relevés and pliés at the ballet barre. Patience, she had learned long before she ever wore a NASA flight suit, was rarely exciting to watch from the outside, but it was almost always what made the exciting part possible later.", "Finally, the day arrived. Mae stood on the launch pad gantry that morning and looked up at the enormous spacecraft towering above her, gleaming white against the dawn sky. On September 12, 1992, she strapped herself into the Space Shuttle Endeavour at the Kennedy Space Center in Florida, for mission STS-47, a joint mission between the United States and Japan. She was thirty-six years old. The engines roared, the ground shook, and the shuttle rose into the sky, faster and faster, until it was hurtling around the Earth at more than seventeen thousand miles an hour.", "She became the first Black woman to travel into space.", "The mission, known as STS-47 or Spacelab-J, was a cooperative flight between the United States and Japan, carrying dozens of scientific experiments in materials science and life sciences inside a special laboratory module tucked into the shuttle's cargo bay. Alongside Mae flew Mamoru Mohri, the first Japanese citizen ever to fly aboard a NASA space shuttle, and the two of them, along with the rest of the crew, worked around the clock in overlapping shifts so that the laboratory was staffed and the experiments were tended at every hour of the mission.", "She stayed there for nearly eight days, orbiting the Earth 127 times. She worked as a science mission specialist, conducting experiments in life sciences and material sciences, including a bone cell research experiment and a frog embryology study in which she studied how frog eggs developed and hatched in zero gravity, work that connected directly back to her childhood love of dissecting frogs and studying biology. She also took part in experiments studying how the human body adapted to weightlessness more broadly, including how fluids shifted inside the body without gravity to pull them down in their usual directions, data that would help NASA doctors keep future astronauts safer and more comfortable on longer missions. Mae found the work deeply satisfying in a way that reminded her of her Peace Corps years: careful, exacting, and aimed, in the end, at helping real people, even if those people hadn't been born yet.", "But she also carried something special. In her small bag of personal items, Mae brought a poster from the Alvin Ailey American Dance Theater, one of the most famous modern dance companies in the world, along with a small flag belonging to the organization Alpha Kappa Alpha, and a statuette representing traditional West African art. She wanted to honor her love of dance, her sorority sisters, and the West African culture she had come to know so intimately during her Peace Corps years. These reminded her that she wasn’t traveling alone. She carried all of her dreams, and the people and passions who had helped her believe in them, all at once, into orbit.", "When Mae looked out the window of the shuttle, she saw the whole Earth spread out below her. The oceans glowed blue. Storms swirled white over the land. She looked at it and thought, This is home for everyone. It is so small, and so beautiful. She said later that she felt like she belonged out there, as much as anyone.", "She thought, too, about the kindergarten teacher who had once suggested she become a nurse instead of a scientist, and about every small, doubtful smile she'd collected in the years since, and found that from this particular vantage point, floating two hundred miles above the surface of the planet, all of it seemed impossibly small and impossibly far away, which was, she realized with some amusement, exactly the point. She snapped photographs when she had a spare moment, though no photograph, she said later, ever quite captured the particular blue of the oceans as seen with her own eyes, unfiltered by any lens. Between scheduled experiments, she found herself returning to the window again and again, unable to stay away for long, the way she'd once found herself pulled back, again and again, to the library shelf of astronomy books as a little girl who wasn't yet sure how she would ever get there.", "At one point, her colleagues on the crew noticed something remarkable. Mae, floating in the middle of the shuttle during a rare quiet moment, seemed to be dancing. She spun slowly in the air, arms outstretched, moving with the deliberate, controlled grace of someone who had spent years training her body to move with exactly this kind of intention. Without gravity, she could twirl forever. Her years of dance training had taught her to feel her body in space, and it helped her move gracefully in the weightless cabin in a way that, she later noted, felt strikingly similar to certain modern dance techniques she had studied on Earth.", "“I think I was a dancer first,” she said later, laughing. “And an astronaut second.”", "When Mae returned to Earth, she was famous. People wanted to hear her story. Schools invited her to speak. Children wrote her letters. She tried to answer as many as she could. She told them what she truly believed: that no one should let others decide what they can be.", "In March of 1993, after nearly six years with NASA, Mae made the difficult decision to resign from the astronaut corps. She wanted, she explained, to focus more directly on the question of how science and technology could help solve everyday problems for ordinary people, especially in developing countries, work that felt, to her, every bit as urgent as spaceflight itself.", "After leaving NASA in 1993, Mae kept exploring. She founded a technology company and later started a science camp for kids called The Earth We Share, an international science camp where students from different countries and backgrounds solve real-world problems by working together, learning that science, like dance, often works best as a collaborative act rather than a solitary one. She led international health care projects, taught environmental studies at Dartmouth College, and even guest-starred on an episode of Star Trek: The Next Generation, playing a small role, just as she had once dreamed as a child watching Nichelle Nichols. Nichols herself was delighted when she heard the news.", "That episode, called \"Second Chances,\" aired in 1993, and it made Mae the first real astronaut ever to appear in the Star Trek universe she had loved so much as a child. She also wrote a memoir for young readers called Find Where the Wind Goes, telling her own story in her own words, in the hope that other kids weighing more than one dream might recognize themselves in it. Her technology company, the Jemison Group, worked on projects ranging from satellite-based telecommunications to renewable energy for developing regions, and she later co-founded a second company that built portable devices for monitoring the body's own signals, heart rate and breathing and more, work that traced a clean line all the way back to her years as a doctor. In 1993, the same busy year she left NASA, she was inducted into the National Women's Hall of Fame, one more marker of a life that refused to specialize itself down to just one accomplishment. In the years that followed, she received honorary doctorates from universities across the country, each one adding to a stack of degrees that had begun, decades earlier, with a stubborn kindergartner who had refused to say she wanted to be a nurse, and had insisted, quietly but firmly, on scientist instead.", "She never stopped dancing, either. She kept taking classes and performing whenever her schedule allowed. For Mae, dance and science were two parts of the same thing: a love of movement, of discovery, and of possibility. In later years, she was chosen to lead the 100 Year Starship project, an ambitious research initiative exploring what it might take for humans to travel to another star system within the next century, a project that, fittingly, requires exactly the kind of wide-ranging, cross-disciplinary thinking that had defined her entire life.", "She has spent much of her later career trying to make sure the next generation doesn't have to fight the same battles she did just to be taken seriously. Through her science camps and her public speaking, she has met thousands of kids who love more than one thing and have been told, in ways large and small, to narrow themselves down. She tells them all some version of the same story: about a girl in Chicago who loved the stars and loved to dance, who was told more than once that she'd have to choose, and who found, again and again, that the two loves were never actually in competition at all. Schools and programs across the country now carry her name, a small, permanent reminder to the students who walk through their doors every morning that curiosity, in all its directions at once, was always allowed.", "Today, when kids ask Mae Jemison for advice, she gives them a simple answer. She tells them to follow their curiosity, to never let anyone say what they can’t do, and to remember that they don’t have to choose just one dream.", "“Don’t let anyone rob you of your imagination, your creativity, or your curiosity,” she has said. “It’s your place in the world; it’s your life. Go on and do all you can with it, and make it the life you want to live.”", "Even now, decades after her flight, Mae keeps busy chasing new questions. She consults on projects about clean water and sustainable technology in communities that need them most, she speaks at schools and universities around the world, and she still, every so often, finds herself in a dance class, moving through the same kinds of exercises she practiced as a girl in Chicago, because some habits, she says, are worth keeping for an entire lifetime. When people ask her which she loved more, dancing or space travel, science or art, she tends to smile and say that she has never quite understood the question, since to her they were always different names for the very same thing: paying close, careful attention to a beautiful and complicated world, and trying, in your own particular way, to add something good to it.", "Somewhere tonight, a little girl is looking up at the stars, wondering if she could ever go there. Maybe she likes to dance. Maybe she loves science. Maybe she loves both, and someone told her that she has to pick one.", "She doesn’t.", "Mae Jemison proved it. Reach for the stars, and take your dancing shoes."]}, {"vocab": [{"w": "detective", "d": "a person who solves mysteries by finding clues"}, {"w": "clue", "d": "a piece of information that helps solve a mystery"}, {"w": "suspect", "d": "a person who might have done something wrong"}, {"w": "alibi", "d": "proof that someone was somewhere else at the time"}, {"w": "deduce", "d": "to figure something out by thinking carefully about facts"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Juniper uses clues to solve a mystery", "A ballet lesson", "Juniper's birthday", "A trip to Paris"], "ans": 0, "why": "Juniper gathers clues and deduces where the tutu went."}, {"skill": "Details", "q": "What clue did Juniper find on the floor?", "opts": ["Glitter and a tiny feather", "A key", "A red shoe", "A note"], "ans": 0, "why": "The glitter and feather led her to the real answer."}, {"skill": "Inference", "q": "Why did Juniper decide that Marcus was not the thief?", "opts": ["He had an alibi because he was fixing lights at that time", "He was in the audience", "He was sleeping", "He was on the phone"], "ans": 0, "why": "Several people saw Marcus on the ladder during the time the tutu vanished."}, {"skill": "Cause and effect", "q": "Why was the tutu in Buttons's basket?", "opts": ["A pet cat carried it there because it liked the feathers", "Someone stole it", "It fell", "It was a gift"], "ans": 0, "why": "The backstage cat had been sleeping on the soft tutu."}, {"skill": "Vocabulary", "q": "What is a clue?", "opts": ["A piece of evidence that helps solve a mystery", "A costume", "A dance", "A song"], "ans": 0, "why": "Clues are hints that lead to an answer."}], "title": "The Case of the Missing Tutu", "cat": "ballet", "blurb": "The star dancer's sparkling tutu has vanished an hour before the show. Young detective Juniper has sixty minutes to find it before the curtain rises.", "paras": ["At exactly six o'clock, Juniper Mbeki was sitting cross-legged on a costume trunk backstage, eating a peanut butter sandwich, when she heard the scream.", "\"My tutu! It's gone!\"", "Juniper dropped her sandwich. She was eleven years old, and she was the assistant to the wardrobe manager at the Rainier Ballet Theater. That meant she sewed buttons, sorted ribbons, and made sure no dancer ever walked on stage with a loose thread. But her real passion was mysteries. She read detective novels under the covers at night, and she kept a small notebook in her back pocket for jotting down clues, along with a magnifying glass her grandfather had given her for her tenth birthday, which she carried everywhere, whether or not she actually needed it.", "She hurried down the hallway toward the dressing room, where a crowd was already gathering, dancers in various stages of costume peering over each other's shoulders to see what the commotion was about.", "In the middle stood Odette Laurent, the lead dancer. She wore a robe over her leotard, and her hair was pinned back in a neat bun, not a strand out of place despite the panic rising in her voice. Her face was pale. \"It was hanging right here on this rack,\" she said, pointing to a bare metal hook. \"My white tutu, the one with the crystals. I only left for five minutes to warm up in the hallway. When I came back, it was gone.\"", "\"Which tutu?\" asked someone from the back of the crowd.", "\"The Swan Queen tutu!\" Odette wailed, her voice climbing toward real panic now. \"I wear it in the last act, for the most important solo of the entire ballet. It has three hundred handmade crystals sewn on by hand, one at a time. Madame Arnaud spent a month sewing it. There is no other tutu like it in the entire building, and there is absolutely no time to make another one before curtain.\"", "Madame Arnaud, the wardrobe manager, wrung her hands, twisting a measuring tape between her fingers without seeming to notice she was doing it. \"The show begins at seven o'clock,\" she said, checking her watch with visibly shaking hands. \"We have exactly one hour. One hour, and an entire theater full of ticket holders already arriving in the lobby.\"", "Out in the lobby, Juniper could already hear the faint hum of the first arriving audience members, the click of the box office window sliding open, the occasional burst of laughter from someone greeting a friend they hadn't seen in ages. None of them had any idea, yet, that backstage, the entire production was quietly teetering on the edge of disaster. If the tutu didn't turn up, Madame Arnaud had explained, her voice tight, there was no time to sew crystals onto a replacement, and Odette would have to dance the most important solo of her career in a plain, sparkleless understudy costume that had never been designed for that particular choreography, in front of a sold-out house.", "Juniper stepped forward and took a deep breath, the way she always did before opening a new case in her mind, the way the detectives in her books always seemed to do right before they solved everything. \"I'll find it,\" she said.", "Everyone turned to look at her. Someone in the back snickered, not unkindly, but doubtfully. \"You? You're a kid.\"", "\"I'm a detective,\" said Juniper, and she flipped open her notebook to a fresh page, the way she'd done for exactly four smaller cases before this one: a missing hairpin, a mixed-up shoe order, a torn costume nobody would admit to tearing, and once, memorably, an entire missing box of stage makeup that had simply rolled under a couch.", "Juniper's grandfather had started her on detective stories two summers earlier, handing her a battered paperback about a detective who solved crimes using nothing but a sharp eye and a stubborn refusal to believe the first explanation anyone offered. She had read her way through nearly forty more books since then, filling her own notebook with rules she'd collected from each one: Rule Four, written in her very best handwriting, said Everyone lies a little when they're nervous, even people who didn't do it. Rule Seven said The most obvious suspect is right exactly as often as they're wrong. She didn't always know yet which rule applied to which case, but she found that having them written down somewhere made her feel steadier when a room full of grown-ups was staring at her, waiting for answers she didn't have yet.", "\"Nobody leave the area, please. I need to ask some questions, and I need everyone to think very carefully before they answer.\"", "The first thing she did was study the rack itself, the way her detective books always insisted a real investigator should examine the scene before touching anything or talking to anyone. The tutu had hung on a metal hook at exactly the height of Odette's shoulder. The hook was bare, nothing dangling from it, no thread, no snag. Below it, the floor was covered with the usual backstage dust and stray sequins that seemed to collect everywhere in a ballet theater no matter how often anyone swept. She got down on her hands and knees, pressing her cheek almost to the floor, and looked closely, sweeping her magnifying glass slowly across the tile in a grid pattern, left to right, the way she'd read that real detectives searched a scene so they wouldn't miss anything by accident.", "A pinch of silver glitter sparkled near the wall, several feet from the rack, in a spot nobody would notice unless they were looking specifically for it. Beside it lay a single tiny feather, soft and white, no longer than her thumbnail.", "\"Interesting,\" she murmured to herself. She picked up the glitter with a pair of tweezers she kept clipped inside her notebook and slipped it into a small paper envelope, labeling it Clue 1: glitter, near west wall. She placed the feather in a second envelope, labeled Clue 2: feather, same location. Two clues, and she hadn't even started asking questions yet.", "She also noticed something else worth writing down: a faint smudge on the lower edge of the rack itself, at about knee height, the kind of smudge that might have been left by something brushing past it low to the ground, rather than by a person reaching up to lift a tutu off its hook. She wasn't sure yet what it meant. She wrote it down anyway. Every good detective, her books insisted, wrote down everything, even the details that didn't make sense yet, because sometimes the detail that seemed most useless turned out to matter the most.", "Next, she began interviewing the suspects, one at a time, in a quiet corner of the wardrobe room where Madame Arnaud kept a small table for pinning hems.", "The first was Marcus, the lighting technician, a lanky young man with headphones permanently draped around his neck and a utility belt jingling with tools. \"I was on the ladder all evening,\" he said, glancing nervously at the clock on the wall. \"Fixing spotlight number four. It's been flickering for three shows straight and Mr. Delacroix finally told me to sort it out before tonight no matter what. You can ask anyone. Ask Priya, she was holding the ladder steady the whole time.\"", "Priya, a stagehand with paint-stained fingers, confirmed it without hesitation when Juniper found her a moment later, coiling extension cords near the wings. \"Marcus was up on that ladder for at least forty-five minutes, maybe closer to an hour,\" she said. \"He never came down, not even once. I was standing right beneath him the entire time, holding the ladder steady and handing him tools when he asked for them. Ask anyone else backstage. Plenty of people walked past and saw us both.\"", "Juniper wrote it all down carefully. Marcus had a solid alibi, confirmed by an independent witness who had no obvious reason to lie for him. That meant, logically, he could not have taken the tutu, because he was somewhere else, doing something else, the entire time it must have vanished.", "The second suspect was Bianca Torres, a dancer who played the Black Swan and who was, according to at least three separate whispers Juniper had overheard while walking down the hallway, known to feel more than a little jealous of Odette's leading role. \"I was practicing my fouettés in the hallway the entire time,\" said Bianca crossly, crossing her arms tightly. \"Ask anybody who walked past. I didn't touch Odette's precious tutu, and frankly I resent even being asked.\"", "Juniper eyed her closely, the way her books described a good detective studying a suspect's hands, their shoes, anything that might contradict their words. There was no glitter visible on Bianca's hands or her black leotard. She had no feathers stuck to her costume either. But something about the sharpness in Bianca's voice, the way she'd answered before Juniper had even finished the question, struck Juniper as worth remembering.", "It wasn't exactly a secret, backstage, that Bianca had auditioned for the role of the Swan Queen herself just eight months earlier, and had come, by all accounts, remarkably close. Two of the younger corps dancers had whispered as much to Juniper earlier that evening, unprompted, the way backstage gossip tended to travel whether anyone asked for it or not. Motive wasn't proof of anything, Juniper reminded herself, jotting the detail down anyway. Plenty of dancers wanted roles they didn't get without ever doing anything about it besides working harder for next time.", "She decided, for now, to keep Bianca on her suspect list rather than crossing her off entirely. A detective who eliminated suspects too quickly, her books warned, often missed the real answer sitting right in front of them.", "The third suspect was Mr. Delacroix, the theater's director, a tall man who stood at the back of the crowd with his arms folded and an expression that suggested he had far bigger problems tonight than one missing costume. \"I was in my office the entire time,\" he said, \"reviewing tonight's program and going over ticket sales with the box office by phone. Nobody actually saw me in there, since I closed the door, but why on earth would I steal a tutu from my own production on opening night? It makes no sense whatsoever.\"", "Juniper tapped her pencil thoughtfully against her lip. \"That is a fair point,\" she admitted, writing No confirmed alibi, but no clear motive either next to his name. A suspect without an alibi was still worth noting, even if the motive seemed weak. She had learned that from a book where the character with the least obvious motive had turned out, three chapters later, to be entirely innocent, while someone who seemed to have no reason at all had actually been hiding something completely different.", "She interviewed a fourth person too, almost as an afterthought: Sofia Chen, one of the youngest dancers in the company, who had been hovering nervously near the dressing room the entire time, twisting the ribbon of her own costume between her fingers.", "\"Did you see anything unusual near the tutu rack this evening?\" Juniper asked her gently, sensing that Sofia might respond better to a soft approach than a direct interrogation.", "Sofia hesitated, glancing quickly toward Bianca before answering. \"I saw Bianca walk past that rack earlier,\" she admitted reluctantly, clearly uncomfortable saying it out loud. \"But I don't think she actually touched anything. She just walked past on her way to the hallway to practice. I didn't think it meant anything at the time.\"", "This was new information, and it made Juniper look at Bianca's alibi a little more carefully. Walking past a rack wasn't the same as taking something from it, but it did place Bianca physically closer to the scene than she had initially implied, and it was exactly the kind of detail a nervous suspect might conveniently leave out of their own story.", "There was one more person Juniper wanted to speak with before she circled back to the scene: Mr. Finch, who ran the little concession stand in the lobby and who also, everyone knew, fed the theater's stray cats out of a soft spot he pretended not to have. Mr. Finch had been overheard, more than once, grumbling that Odette never tipped the ushers who fussed over her costumes, and Bianca herself had mentioned it, a little too eagerly, when Juniper asked if anyone else seemed unhappy with the star dancer lately.", "Juniper found Mr. Finch behind his popcorn machine, counting bills into the register with the practiced speed of someone who had done it a thousand times. \"Where were you between five forty-five and six o'clock?\" she asked, notebook ready.", "\"Selling popcorn to the first wave of ticket holders,\" Mr. Finch said without even looking up. \"Line was out the door. Ask any of them. I didn't leave this stand once, not even to use the washroom, and believe me, I wanted to.\" He nodded toward a paper log taped beside the register, where he jotted the time whenever he restocked a flavor. The last entry, five fifty-two, backed up his story exactly.", "Juniper crossed his name off her list, though she noted, for her own records, that his grumbling about Odette had been real even if his alibi was solid too. Not every suspicious remark belonged to a guilty person, her books had taught her, but every one was still worth writing down.", "Juniper circled back to the scene itself, standing where the tutu had once hung and turning slowly in a full circle, taking in the whole room the way her books always described a detective doing at a crucial turning point in the investigation. Something still didn't add up. If a person had taken the tutu, they would have had to lift it off the hook, at shoulder height, and then carry it somewhere, out of the room, down a hallway, past who knew how many people. But the tutu was large, and stiff, and covered edge to edge with crystals that caught the light from every angle. Carrying it anywhere at all would leave some kind of trail behind, glitter shaking loose with every step, the way it always did whenever a dancer so much as brushed against her own costume.", "She checked the floor near the rack again, then widened her search outward in careful rings, the way search parties did when looking for something lost in the woods, working outward from the last known location. Sure enough, a little farther from the rack than she'd first noticed, she found a few more stray crystals scattered across the tile, small and sparkling, forming a faint, broken trail that led toward the doorway and around the corner into the hallway.", "She followed the trail one crystal at a time, like bread crumbs left behind in a fairy tale, crouching low every few steps to make sure she hadn't lost it. The trail led past the water cooler, past the closed door of the props room, past a bulletin board covered in old cast photographs, and toward a small storage closet tucked into a dead-end at the far side of the hall, a closet Juniper herself had only ever opened once or twice, mostly to look for spare thread.", "Just outside the closet door, she noticed one more thing: a small metal dish, half full of water, tucked discreetly against the wall where most people would never think to look for it, and beside it, a scattering of dry cat food kibble that somebody had clearly been refilling for quite some time. Whoever fed the theater's cats, Juniper realized, had been doing it right here, all along, practically advertising exactly where a curious cat might like to spend its evenings.", "The door was slightly open, just a few inches, with a sliver of darkness showing through the gap.", "Juniper crouched down and peeked through the gap first, the way she'd read a careful detective should always do before charging into an unknown space. Inside, in the dim light filtering through the doorway, she could make out brooms leaning in one corner, a stack of dusty cardboard boxes, and, tucked behind them, a low wicker basket lined with an old flannel blanket. In the basket, curled into a tight, contented circle, was a large orange cat, fast asleep, its sides rising and falling with slow, even breaths.", "Beneath the cat's sleeping body, just visible at the edges, was something white and shimmering.", "\"Aha,\" Juniper whispered to herself, feeling the particular thrill she always felt in her detective books at the exact moment the pieces started sliding into place.", "She crept closer, careful not to startle the animal. The cat opened one lazy eye, regarded her without much concern, gave an enormous yawn that showed off a full set of small sharp teeth, and stretched luxuriously before settling back down, apparently unwilling to relinquish such a comfortable spot without a fight. But when Juniper gently lifted one edge, there it was, unmistakably: a soft, fluffy, glittering tutu, hundreds of tiny crystals sparkling even in the closet's dim light. A scattering of white feathers, the same kind she'd found by the rack, stuck out along the tutu's trim, clearly disturbed and loosened by a great deal of cat-related activity. On the cat's whiskers, unmistakably, was a fine smear of silver glitter, exactly matching the pinch she'd collected in her first envelope.", "\"Buttons!\" cried a voice from down the hallway. Madame Arnaud, out of breath, had followed Juniper's careful trail of clues all the way to the closet door. \"That cat lives in this theater, has done for years. He wanders absolutely everywhere backstage, and he has always had a peculiar fondness for anything soft and feathery. He must have dragged the tutu off the rack himself and brought it here to sleep on.\"", "\"That is precisely what I deduced,\" said Juniper, allowing herself a small, satisfied smile as she carefully lifted the tutu free of the basket. \"The glitter and the feather by the rack, the low smudge at knee height where he must have brushed against it while pulling it down, and then the broken trail of crystals leading straight here. Every clue pointed the same direction. I wasn't entirely certain until I actually found him, curled up underneath it like it was the coziest bed in the entire theater.\"", "Buttons purred loudly at this, as if he understood perfectly well that he was being discussed, and appeared, if anything, rather pleased with the attention.", "Mr. Finch, drawn by the commotion, appeared at the end of the hallway just in time to hear the explanation, and had the grace to look thoroughly unsurprised. \"That water dish is mine,\" he admitted, a little sheepishly, to Madame Arnaud. \"I didn't think it would cause this much trouble.\"", "\"It didn't cause the trouble,\" said Juniper. \"Buttons caused the trouble. You just gave him somewhere comfortable to cause it from.\"", "Marcus and Priya, still standing nearby with the ladder, exchanged a relieved look of their own, glad to finally be entirely out of suspicion, and Mr. Delacroix, appearing at the edge of the small crowd with his arms still folded, allowed himself the faintest hint of a smile, the closest thing to relief his permanently harried expression seemed capable of showing.", "\"Is it damaged?\" asked Odette, arriving breathlessly behind Madame Arnaud, her hands already reaching out before she'd even fully caught her breath.", "Juniper held the tutu up carefully under the hallway light and inspected every inch of it with the same close attention she'd given the crime scene itself. A few loose orange cat hairs clung stubbornly to the white tulle, and one tiny crystal near the hem had come loose entirely, dangling by a single thread. Otherwise, remarkably, the tutu seemed to be in perfect condition. \"We have thirty-five minutes,\" she announced, checking the clock on the wall at the end of the hallway. \"Madame Arnaud, do you happen to have a lint roller anywhere nearby?\"", "\"I have three of them, in three different sizes, in my sewing kit,\" said the wardrobe manager, already breaking into a relieved grin despite the tight timeline. \"Follow me.\"", "Everyone sprang into action at once. Priya dashed off to fetch the lint rollers. Odette held the tutu steady at arm's length while Madame Arnaud brushed away every stray hair with quick, practiced strokes. Juniper, meanwhile, sat down cross-legged right there in the hallway and threaded a needle with trembling but determined fingers, sewing the loose crystal back into place with tiny, careful stitches, exactly the way Madame Arnaud had taught her weeks earlier during a much less urgent lesson. In just under fifteen minutes, working together, the tutu looked entirely, sparklingly new again.", "Even Sofia, once she'd finished her own hair, hurried over to help, holding a small flashlight steady so Madame Arnaud could see every last stitch clearly in the dim hallway light. \"I still can't believe it was Buttons,\" Sofia said, shaking her head as she watched Juniper's needle move in tiny, even stitches. \"He always seems so lazy during the day.\"", "\"Cats,\" said Juniper, without looking up from her sewing, \"have secret lives. Everybody backstage does, if you look closely enough. That's basically the whole job.\" She tied off the final stitch and held the tutu up to the light one more time, checking every seam with the same careful eye she'd used to examine the rack an hour earlier, just to be absolutely certain.", "\"Thank you,\" said Odette, pulling Juniper into a fierce, grateful hug the moment the last stitch was tied off. \"You genuinely saved this show. I don't know what we would have done without you.\"", "\"It was a fairly straightforward case, once I really looked at it properly,\" said Juniper modestly, though she couldn't quite keep the pride out of her voice. \"Once I actually followed the evidence instead of guessing, it all made sense in the end. Every good mystery gets solved with patience, careful observation, a willingness to ask everyone questions even when they seem annoyed by it, and admittedly, every so often, a little bit of luck.\"", "The rest of the cast, who had gathered in the hallway to watch the final stitches go in, broke into spontaneous applause. Even Bianca, who had spent the last twenty minutes as an official suspect, offered a somewhat sheepish smile in Juniper's direction. \"I'm sorry I snapped at you earlier,\" she said, and then, a little more quietly, added, \"I really was just nervous about being blamed for something I didn't do. I know I walked past that rack. I should have just said so from the start instead of getting defensive about it.\"", "\"Apology accepted, on both counts,\" said Juniper kindly. \"You had every reason to feel nervous, being a suspect is uncomfortable even when you're innocent, but you were also right that you hadn't done anything wrong. Both things were true at once. That happens more often in real mysteries than you'd think.\"", "At seven o'clock sharp, precisely on schedule despite the chaos of the hour before, the house lights dimmed and the curtain rose. The orchestra began to play, and Odette floated across the stage as the Swan Queen, wearing a glittering white tutu that shimmered magnificently under the stage lights with every single turn. The audience gasped audibly at its beauty during her opening entrance. Not one person in those seats had any idea that, less than an hour earlier, that very same tutu had been sleeping soundly beneath a highly self-satisfied orange cat.", "Juniper watched the entire performance from the wings, tucked safely out of sight behind a curtain, her notebook still open on her lap. Her sandwich, entirely forgotten on the costume trunk since the moment the scream had interrupted her dinner, had apparently been discovered and nibbled thoroughly by a rather smug orange cat sometime during the investigation. She didn't mind terribly. She found an overturned crate to sit on and finished writing up her notes by the glow of a single work light, the way she always liked to close out a case properly before the details faded from memory.", "Case closed, she wrote carefully. Suspects cleared: Marcus (solid alibi, confirmed by witness), Mr. Delacroix (no clear motive), Bianca (present near scene, but ultimately innocent), Mr. Finch (solid alibi, confirmed by his own sales log). Culprit: Buttons, age unknown, backstage resident since before anyone can quite remember. Motive: comfort, and a well-documented fondness for feathers. Key evidence: glitter, one white feather, a knee-height smudge on the rack, a water dish and kibble outside the closet, and a broken trail of crystals leading directly to the scene. Solution: three lint rollers and fifteen minutes of careful sewing.", "Then, underneath all of that, in her very best and most careful handwriting, she added one final line, the same line she tried to remember to write at the end of every case, easy or hard.", "Always follow the clues, even the ones that don't make sense yet.", "From that evening onward, the dancers and staff at the Rainier Ballet Theater took to calling her, half-jokingly and half in complete seriousness, the theater detective. And whenever anything went missing after that, a shoe, a ribbon, a hairpin, a very specific tube of stage makeup, someone would inevitably say, with a knowing look, \"Better call Juniper.\" Buttons, for his part, was given his very own soft cushion in a quiet corner of the wardrobe room, positioned deliberately far away from anything covered in crystals or trimmed with feathers.", "Mr. Finch, for his part, moved the water dish to a spot behind the concession stand, where Buttons took up a comfortable new evening routine that troubled absolutely nobody's costume rack ever again. And the very next week, when a single sequined glove went missing from the props table two hours before curtain, it was, of course, Juniper who found it, tucked inside a coat pocket where its owner had absentmindedly stuffed it before rushing off to warm up, no cats involved at all, though Juniper couldn't help feeling faintly disappointed that this particular case turned out to be so simple.", "He never went anywhere near another tutu again.", "Well. Almost never."]}, {"vocab": [{"w": "goddess", "d": "a female god in old stories"}, {"w": "archer", "d": "a person who shoots arrows with a bow"}, {"w": "elixir", "d": "a magical liquid that gives special powers"}, {"w": "harvest", "d": "the time when farmers gather their crops"}, {"w": "tradition", "d": "a custom or belief passed down from parents to children"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["A legend that explains the Moon and the Mid-Autumn Festival", "A farmer's diary", "A pirate adventure", "A cooking class"], "ans": 0, "why": "The legend is told to explain why families enjoy moon-watching."}, {"skill": "Details", "q": "Why did Hou Yi shoot down nine suns?", "opts": ["The suns were burning the Earth and the people", "He wanted to be famous", "They were too bright for the moon", "A game"], "ans": 0, "why": "Ten suns scorched the land, so he saved people by shooting down nine."}, {"skill": "Inference", "q": "Why did Chang'e swallow the elixir?", "opts": ["To protect it from a thief", "She was thirsty", "She wanted to be famous", "She was told to"], "ans": 0, "why": "Chang'e drank it so that the greedy thief could not use its power."}, {"skill": "Cause and effect", "q": "What happens when families eat mooncakes and look at the full moon?", "opts": ["They remember the legend and feel closer", "They fall asleep", "They go on a trip", "They stop working"], "ans": 0, "why": "Families keep the tradition to be together and remember the story."}, {"skill": "Vocabulary", "q": "What does “tradition” mean?", "opts": ["A custom passed from one generation to the next", "A new invention", "A kind of fruit", "A boat"], "ans": 0, "why": "Mooncakes are a tradition for Mid-Autumn Festival."}], "title": "Chang'e and the Moon", "cat": "myth", "blurb": "An old Chinese tale tells how a kind woman named Chang'e came to live on the Moon, and why families still gather under the full moon every autumn.", "paras": ["Long, long ago, in the time of ancient China, ten suns lived in the sky.", "They were the children of the Sun Emperor, and they were bright and playful. Every day, one of the ten suns would rise in the east and travel across the sky, lighting the world and warming the fields. The other nine waited quietly in a giant tree at the edge of the sea, taking turns. That is how the world had day and night, one sun at a time.", "But one morning, the ten suns grew bored. “Why should we take turns?” they said. “It’s no fun. Let’s all go out at once!”", "And so, on that fateful morning, all ten suns rose into the sky together.", "At first, the people were amazed. The whole world shone with a golden light. But soon the ground began to crack. The rivers dried up. The rice withered. The forests caught fire, and the sea boiled. People hid in caves and prayed for rain, but the heat only grew worse.", "Now, in a village near the mountains lived a brave archer named Hou Yi. He was the finest bowman in the land. His arrows never missed. He had a wife named Chang’e, a kind and gentle woman whom everyone loved. Chang’e cared for the sick and shared her food with the hungry. Her voice was as soft as a spring breeze.", "“Hou Yi,” she said one blazing afternoon, “the people are suffering. Only you can help.”", "Hou Yi looked up at the ten suns and took a deep breath. He climbed to the top of a mountain, pulled out his great bow, and aimed at the sky. One by one, he shot down nine of the suns. With each arrow, a ball of fire fell from the sky and vanished, and the land began to cool. When only one sun remained, Hou Yi stopped. “One is enough to give us light and warmth,” he said.", "The people rejoiced. They called him a hero, and they brought him gifts of rice and silk. The Queen Mother of the West, a powerful goddess who lived in the mountains, heard about his bravery. She decided to reward him with a special gift: a small golden pill, an elixir of immortality. Whoever swallowed it would live forever and rise into the heavens.", "“It is only enough for one person,” said the goddess. “Use it wisely.”", "Hou Yi carried the pill home, but he did not want to live forever without Chang’e. So he placed it in a small box and hid it beneath a beam in their house. “We will decide together what to do,” he told his wife.", "Time passed. Hou Yi grew famous. Many young men came to learn from him, and he taught them how to shoot. But among these students was a man named Feng Meng, who was greedy and cruel. He had heard about the golden pill. Every night he dreamed of stealing it and living forever.", "One day, when Hou Yi went hunting, Feng Meng crept into the house. Chang’e was alone. He drew his sword and demanded, “Give me the elixir!”", "Chang’e was very afraid. She knew she couldn’t fight him. She also knew that if Feng Meng took the elixir, he would become an immortal tyrant, and the people would suffer even more than before. Her mind raced. What could she do?", "Quickly, she took the little box from its hiding place. She opened it, and, before the thief could stop her, she swallowed the golden pill herself.", "At once, her body began to feel light as a feather. Her feet left the floor. Her robes fluttered, and she drifted through the window and out into the evening air. She rose higher and higher. She wanted to stay near Earth, near her husband, but the magic pulled her upward, toward the sky. Up and up she went, past the treetops, past the clouds, until she landed, very softly, on the Moon.", "The Moon was a quiet, silver world. There was no wind, and no sound. There was only a cold palace made of jade, a sweet-smelling cinnamon tree, and a small white rabbit who pounded herbs in a mortar. The rabbit looked up, twitching her nose. She had been there for a very long time.", "“Welcome,” said the rabbit. “You will be lonely here, I’m afraid. But you will not be alone.”", "Chang’e looked down at the Earth, glowing blue in the darkness, and tears rolled down her cheeks. She missed her husband. She missed her village. But she knew she had done the right thing.", "When Hou Yi came home and found his wife gone, he was heartbroken. He ran outside and looked up at the sky. There, on the bright face of the full Moon, he saw a beautiful woman’s shape, floating beside a tree.", "“Chang’e!” he cried.", "He was so sad that he could not eat or sleep. He walked through the village calling her name. But the goddess, who had seen everything, felt sorry for him. “Every year, on the fifteenth night of the eighth month,” she said, “when the moon is brightest and roundest, Chang’e will come to visit you. On that night, you may see her.”", "And so it was. Every autumn, on that special night, the Moon shone extra bright, and Hou Yi would set out a table beneath it. He would fill it with her favorite foods, sweet cakes, and fruit. And he would sit there, gazing up at the glowing disc, and whisper his love to the woman in the Moon.", "Soon, the villagers began to join him. They set out tables of their own, and offered fruit and round cakes to Chang’e, and thanked her for her courage. They believed she was watching from above, smiling. The custom spread from village to village, and from year to year, until every family in the land celebrated the moon on the fifteenth night of the eighth month.", "That is why, to this day, families in China and around the world celebrate the Mid-Autumn Festival. When the harvest is over and the autumn Moon is full and round, people gather outside to eat mooncakes, round pastries filled with lotus paste or sweet beans. They carry glowing lanterns through the streets. Children run laughing, holding paper rabbits and glowing stars. Grandparents tell stories of the woman who lives on the Moon.", "The round shape of the moon stands for reunion and togetherness. Even if family members are far away, they can look up at the same moon and feel close. That is the heart of the festival. It is a tradition of love, of gratitude, and of being together.", "Some people say that if you look carefully at the full Moon, you can see Chang’e, standing beside her cinnamon tree. Others see the white rabbit, still busy with her mortar and pestle. Some see a toad, or an old man, or nothing at all. Every family has its own way of seeing.", "If you go out tonight and the Moon is full, take a moment to look up. Imagine someone far away, someone you love, looking at the very same moon. It doesn’t matter how far apart you are.", "You are both under the same silver light, and the woman in the Moon is smiling down on you."]}, {"vocab": [{"w": "swift", "d": "moving very fast"}, {"w": "hero", "d": "a person admired for courage or great deeds"}, {"w": "wilderness", "d": "wild land where few people live"}, {"w": "challenge", "d": "something difficult that tests your skills"}, {"w": "clever", "d": "quick to understand and good at solving problems"}], "quiz": [{"skill": "Main idea", "q": "What is this myth mostly about?", "opts": ["A brave, fast girl who chooses her own path", "A king's treasure", "A cooking contest", "A sea voyage"], "ans": 0, "why": "Atalanta uses her skills and wisdom to run her own life."}, {"skill": "Details", "q": "Who took care of Atalanta when she was a baby?", "opts": ["A mother bear", "A king", "A wolf", "A wizard"], "ans": 0, "why": "A she-bear found her and raised her in the woods."}, {"skill": "Inference", "q": "Why did Atalanta say she would only marry a man who could beat her in a race?", "opts": ["She knew nobody could beat her", "She did not want to marry", "She wanted a fair test", "She loved races"], "ans": 0, "why": "She believed nobody was faster, so she was safe unless someone truly earned it."}, {"skill": "Cause and effect", "q": "Why did Atalanta stop to pick up the golden apples?", "opts": ["They were beautiful and she was curious", "She was hungry", "She was tired", "She lost a shoe"], "ans": 0, "why": "The shining apples caught her attention, and she stopped."}, {"skill": "Vocabulary", "q": "What does “swift” mean?", "opts": ["Very fast", "Very slow", "Very loud", "Very tall"], "ans": 0, "why": "Atalanta was swift on her feet."}], "title": "Atalanta, the Fastest Girl in Greece", "cat": "myth", "blurb": "Left in the forest as a baby and raised by a bear, Atalanta grows up to outrun everyone in Greece. But can she outrun three golden apples?", "paras": ["Long ago in ancient Greece, a baby girl was born to a king who wanted a son. When the king saw his daughter, he was so disappointed that he ordered a servant to leave her on a mountainside, far away from the palace.", "The servant felt sorry for the little girl, but he obeyed the king. He set the baby down on the cold ground, wrapped in a blanket, and walked away with tears in his eyes.", "The baby began to cry. Her small voice echoed through the trees. And then, out of the shadows, came a large brown she-bear. She sniffed the baby, tilted her head, and, very gently, picked her up with her teeth and carried her to a cave. The bear had lost her cubs, and she took the human child as her own.", "The baby grew up in the wilderness, and she was strong and free. She learned to climb trees, to swim in icy rivers, and to move silently through the forest. Some hunters found her and raised her as their own. They named her Atalanta, and she became the best runner anyone had ever seen.", "Atalanta could run like the wind. She could outrun deer and wild horses. She could run for miles without getting tired. When she ran, her feet barely touched the ground, and her long hair streamed behind her like a comet’s tail. The hunters said that she was so swift that she could run across a field of wheat without bending a single stalk.", "She was also a fine archer and wrestler, and she was clever, too. When she was still young, a legendary hero named Meleager invited her to join a great hunt. A giant wild boar had been terrorizing the countryside, trampling farms and frightening villagers. The boar was huge and fierce, with tusks as long as a man’s arm.", "Many heroes had gathered for the hunt, brave men with spears and swords. Some laughed when Atalanta arrived. “A girl?” they scoffed. “What can she do?”", "Atalanta said nothing. She simply took out her bow.", "During the hunt, when the boar charged and the men scattered in fear, Atalanta stood her ground. She drew her arrow, took careful aim, and shot. The arrow struck the boar behind the ear and wounded it. Meleager finished the job. The other heroes were speechless.", "“She was the first to draw blood,” said Meleager. “She should get the honor.” And he presented Atalanta with the boar’s hide as a prize. From that day on, nobody laughed at her again.", "Atalanta’s fame spread across Greece. Everyone talked about the swift girl who was as brave as any hero. Soon, her father, the king, heard about her, and he realized who she was. He invited her back to the palace, and Atalanta went, curious to meet the family she had never known.", "The king greeted her warmly. “My daughter,” he said. “I made a terrible mistake many years ago. I hope you can forgive me. And now, it is time for you to marry. I have chosen a husband for you.”", "Atalanta stared at him. “I didn’t ask to be married,” she said. “And I don’t plan to marry anyone you choose for me.”", "“But it is your duty,” said the king.", "Atalanta took a deep breath. She thought for a long time. She wanted to live her own life, to run in the forests and mountains, free as a bird. She did not want to be told what to do. But she also knew that the king was powerful, and that she needed a clever plan.", "“I will make an agreement,” she said at last. “I will marry the man who can beat me in a footrace. But any man who loses will have to leave forever.”", "The king agreed, thinking that some young man would surely win. But he was wrong. Atalanta was so fast that nobody could beat her. One by one, the suitors lined up, raced against her, and lost. Their faces turned red, and they gasped for breath as she crossed the finish line first, without even breathing hard.", "After a while, fewer men dared to try.", "But one young man, named Hippomenes, was different. He was clever and kind. When he first saw Atalanta run, he was amazed, and he decided he wanted to compete. But he knew he could not win by speed alone. So he prayed to Aphrodite, the goddess of love and beauty, for help.", "Aphrodite heard his prayer. She gave him three golden apples that shone like tiny suns. “Use these wisely,” she told him. “When Atalanta pulls ahead, roll one of the apples in front of her, and see what happens.”", "On the day of the race, a large crowd gathered in the stadium. Trumpets blared. Atalanta and Hippomenes crouched side by side at the starting line. Atalanta smiled confidently. She had never lost.", "“Ready,” said the judge. “Set. Go!”", "The two of them raced down the track. At first, they ran together. But soon, Atalanta began to pull ahead, her feet flying over the ground. Hippomenes pulled out the first golden apple and rolled it across the path.", "The apple glittered in the sunlight. Atalanta had never seen anything so beautiful. She slowed down and, for a moment, turned to look. Then she scooped it up, admiring it, and dashed after Hippomenes again.", "She caught up quickly. But Hippomenes tossed the second apple, farther to the side. Atalanta hesitated. The apple glowed like a tiny sun, and she couldn’t resist. She ran to pick it up, and once again lost precious seconds.", "Now the finish line was near. Atalanta put on a burst of speed. She was closing in fast. Hippomenes, panting hard, threw the third apple as far as he could. It rolled off the track and into the grass.", "Atalanta stopped. She looked at the apple, then at the finish line, then back at the apple. What a strange thing, she thought. She had never really wanted anything before. But those apples were unlike anything in the world.", "She ran to pick up the third apple, and when she looked up, Hippomenes had crossed the finish line. He had won.", "The crowd erupted. Some cheered. Some gasped. Atalanta stood there holding three golden apples, feeling a strange mix of emotions. She was surprised, but she wasn’t angry. She looked at Hippomenes, who was doubled over, gasping for air, and she realized that he had beaten her fairly. He had used his mind, not just his legs, and he had done it because he admired her.", "“You are cleverer than you look,” she said with a small smile.", "“And you are faster than anyone I have ever seen,” he replied. “I only won because I had a little help.”", "Atalanta laughed. It was the first time she had laughed in a long while. She saw that the challenge she had made was met with kindness and cleverness, and that made it worth honoring. They talked long into the evening. And in the end, she decided that she liked him.", "Some tellings of the myth say that Atalanta and Hippomenes lived happily for a time. Others say the gods played tricks on them. But the part that matters most is the beginning. Atalanta was a girl who was left alone in the wilderness, and she became strong. When other people tried to tell her who to be, she chose her own path. She was brave, she was swift, and she was wise.", "The Greeks told stories about Atalanta for thousands of years. Today, when you see a girl racing on a track, climbing a mountain, or kicking a soccer ball across a field, you might say she’s running in Atalanta’s footsteps.", "And if you are ever tempted by a shiny distraction, like a golden apple, remember what the swiftest girl in Greece learned. The greatest race is the one you run for yourself, and the best prize is knowing who you are."]}, {"vocab": [{"w": "beast", "d": "a large, wild animal"}, {"w": "village", "d": "a small community of people, smaller than a town"}, {"w": "lantern", "d": "a light inside a case of paper, glass, or metal that you can carry"}, {"w": "firecracker", "d": "a small paper tube that makes a loud bang"}, {"w": "celebrate", "d": "to do something special to show that an occasion is important"}], "quiz": [{"skill": "Main idea", "q": "What does this legend explain?", "opts": ["Why people celebrate Lunar New Year with red, lights, and noise", "How mountains are formed", "Why dragons fly", "How lanterns are made"], "ans": 0, "why": "The legend gives a reason for red decorations and firecrackers at the New Year."}, {"skill": "Details", "q": "Which three things scared Nian away?", "opts": ["Red, fire, and loud noise", "Water, wind, and snow", "Music, milk, and mice", "Gold, silver, and jade"], "ans": 0, "why": "The old man learned that red, bright light, and loud bangs frightened the beast."}, {"skill": "Inference", "q": "Why did the villagers hide in the mountains every year?", "opts": ["They were afraid of the beast", "They enjoyed camping", "They needed more food", "They lost their homes"], "ans": 0, "why": "They fled because Nian attacked the village each winter."}, {"skill": "Character", "q": "What kind of person was the old man?", "opts": ["Wise and brave", "Angry and cruel", "Silly", "Shy"], "ans": 0, "why": "He faced the beast with a plan instead of running away."}, {"skill": "Vocabulary", "q": "What is a lantern?", "opts": ["A light you can carry", "A kind of shoe", "A monster", "A mountain"], "ans": 0, "why": "People carry lanterns during the New Year festival."}], "title": "The Monster Called Nian", "cat": "myth", "blurb": "Every winter a fierce beast came down from the mountains to a small village. One clever child and one brave old man discovered what he was really afraid of.", "paras": ["A very long time ago, in a small village in China, there lived a beast called Nian.", "Nian was enormous. He had the body of a lion, the horns of a bull, and a mouth as big as a cave. His teeth were long and sharp. His eyes glowed like hot coals, and when he roared, the mountains shook. He lived in the deep sea or in the highest cave, depending on who told the story. But once every year, on the last night of winter, he came down from the mountains to look for food.", "The villagers dreaded that night. When Nian arrived, he ate their crops. He ate their chickens. Sometimes he ate the farmers’ pigs, and sometimes, people whispered, he ate much worse. So every year, as the last day of winter drew near, the villagers packed up their families, gathered their belongings, and fled into the hills to hide until the beast had gone.", "One year, a boy named Wei helped his grandmother pack her bundles. Wei was eight years old, and he was curious about everything. As they walked up the mountain trail, he asked, “Grandmother, why does Nian come?”", "“Because he is hungry,” said his grandmother. “He always has been.”", "“Why doesn’t anyone try to stop him?”", "“Hush, child. Nobody can. He is too strong.”", "Wei frowned. It seemed silly to him that a whole village should run away every year. If everyone was afraid, that was because nobody had ever tried to fight back.", "When they reached the top of the hill, an old man was coming down the path in the opposite direction. He carried a walking stick and wore a long red robe. His beard was white as snow, and his eyes were kind. He looked like someone who knew many things.", "“Excuse me,” said Wei’s grandmother. “You must be a stranger. You are going the wrong way. The beast is coming tonight.”", "“Yes,” said the old man calmly. “I know. That is why I’m going to the village.”", "Everyone stared at him. “Are you mad?” asked the grandmother. “Nian will eat you alive!”", "“Perhaps,” said the old man. “But if I stay one night, I may be able to help. May I ask for a place to sleep?”", "An old woman in the village had stayed behind, refusing to leave her home. She agreed to let the stranger stay. “I don’t know what you are planning,” she said, “but you’re braver than I am.”", "That evening, the old man walked through the village, studying the houses. He looked at the doors. He looked at the windows. He looked at the walls. He nodded thoughtfully and said, “Do you have some red paper?”", "“Red paper?” said the woman. “Why?”", "“Because I have heard that Nian is afraid of something,” he said.", "Wei, who had sneaked back down the mountain out of curiosity, hid behind a wall and listened.
