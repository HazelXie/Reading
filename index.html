nd the world still study Qi Baishi's simple, masterful shrimp paintings, still marvel at how so few confident strokes of ink and water can capture something as alive and springy as a real, swimming shrimp. Museums in China, including institutions in Beijing, continue to preserve and display large collections of his paintings, calligraphy, and carved seals, and his original works are now considered treasures of modern Chinese art, sought after by collectors and studied by scholars researching how he developed his distinctive, economical style over such a long career. Reproductions of his shrimp paintings appear on everything from postage stamps to schoolbooks in China today, and children learning to hold an ink brush for the very first time are often shown his simple, springy shrimp as an example of how much life a few confident strokes can hold, long before they are ready to attempt anything nearly so difficult themselves. It is a lesson, many art teachers point out, that reaches far beyond painting itself: that mastery rarely arrives quickly or on a fixed schedule, that late beginnings do not have to mean lesser achievements, and that the most ordinary, overlooked things in the world, watched closely enough and patiently enough, over years rather than minutes, can become the very subject of a true masterpiece. A carpenter's apprentice who did not pick up a serious paintbrush until he was nearly thirty years old went on to become one of the most recognized names in the history of Chinese art, and he did it not by rushing past the ordinary world around him, but by sitting still long enough, decade after decade, to truly see it."]}, {"vocab": [{"w": "unfamiliar", "d": "not known or recognized; strange"}, {"w": "courage", "d": "the ability to do something that feels difficult or scary"}, {"w": "awkward", "d": "uncomfortable or embarrassing"}, {"w": "welcome", "d": "to greet someone kindly and make them feel included"}, {"w": "belong", "d": "to feel accepted as part of a group"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Harper feels lonely as the new kid until someone makes an effort to include her", "Harper refuses to make friends", "The school cafeteria closes", "Harper decides to go back to her old school"], "ans": 0, "why": "The story follows Harper's loneliness and the moment someone welcomes her."}, {"skill": "Details", "q": "Why did Harper's family move to Washington?", "opts": ["Her mother got a new job", "They wanted better weather", "Harper asked to move", "Their old house burned down"], "ans": 0, "why": "A parent's new job is the reason given for the move."}, {"skill": "Inference", "q": "Why did Harper choose to sit at the edge of the cafeteria instead of near the center?", "opts": ["She felt safer and less noticeable somewhere quieter", "She wanted to see the whole room", "She was told to sit there", "She was saving seats for friends"], "ans": 0, "why": "Feeling unfamiliar and unsure, Harper sought a less exposed spot."}, {"skill": "Character", "q": "What did Mateo do that helped Harper feel less alone?", "opts": ["He sat down across from her and started a genuine conversation", "He ignored her", "He made fun of her", "He told a teacher to help her"], "ans": 0, "why": "Mateo's small act of sitting and talking made the biggest difference."}, {"skill": "Vocabulary", "q": "What does “belong” mean?", "opts": ["To feel accepted as part of a group", "To own something", "To be the tallest person", "To finish first"], "ans": 0, "why": "Harper is searching for a sense of belonging at her new school."}], "title": "The Empty Seat at Lunch", "cat": "friend", "blurb": "Moving across the country in the middle of fourth grade means Harper knows exactly nobody at her new school. Lunch, it turns out, is the loneliest forty minutes of the whole day, until one seat stops being empty.", "paras": ["Harper Voss had moved three times in her life before, but never in the exact middle of a school year, and never anywhere as far from Ohio as Redmond, Washington. Her mother had gotten a new job, a good one, the kind of opportunity you don't turn down, and so on a rainy Tuesday morning in February, Harper found herself standing in the front office of a school where she knew precisely zero other students, holding a folder of registration papers and trying very hard not to cry in front of the school secretary.", "The drive out from Ohio had taken four days, and Harper had spent most of it staring out the car window at scenery that grew steadily more unfamiliar with each state line they crossed: flat cornfields giving way to endless brown plains, then mountains, then, finally, the deep green, rain-soaked hills of western Washington, so different from anything she'd grown up with that it barely felt like the same country. Her father had tried to make it feel like an adventure, pointing out landmarks and playing road-trip games, and Harper had gone along with it well enough, but underneath the games was a steady, low hum of dread about the one part of moving nobody could turn into a game: walking into a brand-new school where she would not know a single face.", "The secretary, a kind but clearly busy woman named Mrs. Poulin, handed Harper her class schedule and a laminated map of the building that did nothing to make the hallways feel any less like a maze. \"Ms. Kessler's homeroom, right down this hall, third door on the left,\" she said. \"You'll do just fine, sweetheart. New kids always do, eventually.\"", "Harper wanted very much to believe her, and mostly managed to, for about the length of the walk down that first hallway.", "The morning wasn't so bad, actually. Her homeroom teacher, Ms. Kessler, introduced her kindly to the class, and a girl named Ainsley showed her where the bathrooms and the water fountain were, in the brisk, slightly distracted way of someone doing an assigned classroom job rather than making an actual new friend. Ainsley pointed out the cubby Harper could use, the class rules poster on the wall, and the particular squeaky floor tile just outside the classroom door that everyone apparently knew to step around, all with the efficient, slightly bored tone of someone reciting a memorized script. By the time the lunch bell rang, Harper felt cautiously, if not exactly optimistic, at least not disastrous.", "Then she walked into the cafeteria.", "It was loud, and crowded, and every single table seemed to already contain a tightly formed group of kids who clearly knew each other, laughing at jokes Harper had no context for, saving seats with backpacks and jackets for friends who hadn't arrived yet. The noise hit her first, an overwhelming wall of hundreds of separate conversations blurring together into one enormous roar, and underneath the noise, the smell of a hundred different lunches, pizza and something with garlic and someone's orange peels, all mixed together in a way that made her stomach feel strange and unsettled. Harper stood near the entrance with her lunch tray, scanning the room, feeling the particular, specific loneliness of being surrounded by more than three hundred people and not recognizing a single face among them.", "She ended up sitting at the very end of a long table near the wall, as far from the center of the noise as she could manage, at a spot that happened to be empty. She ate her sandwich slowly, staring mostly at her tray, occasionally glancing up to watch the rest of the cafeteria the way you might watch a show in a language you didn't quite speak: able to follow the general shape of what was happening, but not quite able to understand any of the specific jokes. At one table, a whole group erupted into laughter over something involving a dropped spoon, and Harper found herself almost smiling along, purely from the contagious sound of it, without having any idea what had actually happened.", "This became her routine for the rest of that first week. Same table, same end seat, same careful strategy of appearing busy with her food so that nobody would notice how completely alone she was. She learned to unwrap her sandwich slowly, to take small bites and chew for a long time, to occasionally check her backpack for something, anything, that would make her look occupied rather than simply friendless. She told herself it wasn't so bad. She told her mother, when asked how school was going, that it was \"fine,\" which was true in the narrow sense that nothing terrible had happened, and false in the larger sense that covered everything Harper actually felt during those forty silent minutes each day.", "By Thursday of that first week, Harper had started timing her walk to the cafeteria carefully, arriving slightly later than the initial rush so that the room was already loud and settled by the time she walked in, meaning fewer people would notice her scanning the tables for a place to sit. It was a small, quiet strategy, invisible to anyone else, but it made the whole process feel marginally less exposed. She'd also started bringing a book to lunch, something she'd never bothered doing at her old school in Ohio, where lunch had always meant sitting with Delia and their whole loud, familiar group. The book didn't make her feel less lonely, exactly, but it gave her hands and eyes something to do besides simply sitting there, visibly alone, and that felt like at least a small improvement.", "On Friday, a boy at a nearby table glanced over at her more than once, and Harper felt a small flicker of hope that maybe someone had noticed her, maybe someone was about to say something. He never did. By the time the bell rang to end lunch, she'd convinced herself she'd imagined the glances altogether, and walked to her afternoon classes feeling more discouraged than she had all week, though she couldn't quite explain to herself why one unrealized hope should sting worse than an ordinary lonely lunch.", "On the following Monday, Harper arrived at her usual spot and had just set down her tray when someone sat down across from her.", "\"Is this seat taken?\" asked a boy she recognized vaguely from her math class, though she didn't know his name. He had already sat down by the time he asked, which struck Harper as either extremely confident or extremely oblivious, she couldn't quite decide which.", "\"No,\" Harper said, startled. \"It's not taken.\"", "\"Cool,\" said the boy, unwrapping his own sandwich with the easy comfort of someone completely unbothered by the awkwardness Harper felt radiating off herself like heat from a stove. \"I'm Mateo. You're the new kid, right? From Ohio?\"", "\"Harper,\" she said. \"Yeah. How did you know I was from Ohio?\"", "\"Ms. Kessler mentioned it during morning announcements when you started,\" Mateo said. \"I actually have a cousin in Ohio. Columbus. Is that near where you lived?\"", "\"Pretty close, actually,\" Harper said, feeling something in her chest loosen slightly, some tight, defensive posture she hadn't fully realized she'd been holding all week. \"About forty minutes away.\"", "\"That's wild,\" Mateo said, genuinely delighted by this small coincidence in the specific way that ten-year-olds often are. \"Do you miss it? Ohio, I mean.\"", "Nobody had actually asked her that yet, not directly, not in a way that seemed to want a real answer rather than a polite, expected one. Harper found herself telling Mateo, in more detail than she'd planned, about her old street, her old best friend Delia, the specific maple tree in her old backyard that turned the most incredible shade of red every October. She told him about the ice cream shop two blocks from her old house that gave out extra sprinkles if you knew the owner's dog's name, and about how strange it still felt, waking up every morning in a house that didn't creak in any of the familiar places yet. Mateo listened, asked a few genuine follow-up questions, and shared, in exchange, a story about his own family's move from California two years earlier, and how strange and lonely his own first few weeks at this exact school had felt.", "\"Honestly,\" he said, \"I remember exactly how it feels. I used to sit by myself over there,\" he pointed toward a different empty stretch of table across the room, \"for like, two whole weeks, before anyone talked to me. It's the worst. I always told myself if I ever saw someone else going through it, I'd say something. Guess today was the day.\"", "\"Well,\" Harper said, feeling a genuine smile pull at her mouth for what felt like the first time in a week, \"I'm really glad you did.\"", "\"You should sit with me and my friends tomorrow,\" Mateo offered, gesturing vaguely toward a louder, more crowded table across the cafeteria. \"Fair warning, Devon tells a lot of very bad jokes. Like, impressively bad. But everyone's pretty nice.\"", "Harper hesitated for just a moment, the old, familiar nervousness flickering up again, the fear of walking into an unfamiliar group and not quite fitting in. It would take a small amount of courage just to carry her tray across that room tomorrow. She pictured it in her head for a second, the long walk across the crowded cafeteria floor, everyone potentially watching, and felt her stomach flip a little at the thought. But she thought about the empty seat she'd been choosing all week, and how much lonelier that quiet safety had actually felt than any awkward moment probably would.", "\"Okay,\" she said. \"Yeah. I'd like that.\"", "That evening, Harper told her mother about Mateo over dinner, the whole small, ordinary story tumbling out with more excitement than she'd expected to feel about something as simple as a boy sitting across from her at lunch. Her mother listened, smiling in the careful way parents do when they're trying not to make too big a deal out of good news, in case that scares it away. \"See,\" her mother said gently. \"I told you it takes time. Doesn't mean it isn't hard while you're waiting.\"", "\"It was still pretty hard,\" Harper admitted. \"The waiting part.\"", "\"I know, sweetheart,\" her mother said. \"I'm proud of you for getting through it.\"", "The next day, Harper carried her lunch tray across the cafeteria to Mateo's table, her heart beating a little faster than the short walk really warranted. Mateo waved her over immediately, introducing her around the table: Devon, who did indeed tell an extremely bad joke about a cafeteria taco within about ninety seconds of meeting her, a girl named Priya who asked her a dozen genuinely curious questions about Ohio, and a couple of other kids whose names Harper carefully tried to memorize. Devon's joke, something about a taco that couldn't stop repeating itself, was groan-worthy enough that the whole table laughed anyway, partly at the joke and partly at how proud Devon looked of it, and Harper found herself laughing along too, genuinely, for the first time in what felt like a very long stretch of unfamiliar days.", "During recess that same week, Harper found herself standing near the edge of a kickball game, unsure whether she'd actually been invited to join or had simply drifted close enough that it seemed rude to leave. Priya spotted her hesitating and waved her over without hesitation. \"We need one more for outfield,\" she said. \"You're on our team now, no arguing.\" It was such a small thing, being assigned to a team without needing to ask, but Harper noticed how different it felt from the careful, deliberate effort of walking her tray across the cafeteria that first time. This felt almost automatic, the way you'd wave a friend over rather than a stranger, and Harper realized, jogging out to the outfield grass, that somewhere in the last several days she had quietly stopped being the new kid to at least this small handful of people.", "Not every day at the new lunch table went smoothly. About two weeks in, Harper made an offhand joke about a television show she'd loved back in Ohio, one nobody at the table had ever heard of, and the joke landed with an awkward, confused silence rather than the laugh she'd been hoping for. For a moment, the old nervousness flared back up, hot and familiar, the fear that she'd said the wrong thing and reminded everyone all over again that she didn't quite belong. But Mateo just shrugged. \"Never heard of it,\" he said, \"but you have to show us sometime. I want to know what's so funny.\" Priya asked an actual follow-up question about the show, curious rather than dismissive, and the moment passed so quickly and so gently that Harper almost couldn't believe she'd been worried about it at all. It was a small thing, but it taught her something bigger: that belonging somewhere didn't mean never feeling out of place again, it just meant the out-of-place moments stopped feeling like emergencies.", "It wasn't instantly, magically easy. Harper still felt, for a while, like she was catching up on months of shared jokes and history the rest of the group already had together. There were references she didn't understand, a whole running joke about a substitute teacher from the fall that everyone else found hilarious and Harper could only smile politely through, and a system for who sat where that she had to slowly learn without ever being formally told. But it was different from the wall-facing loneliness of the week before, different in a way that mattered enormously: she was inside the conversation now, even the parts of it she didn't fully understand yet, rather than watching it from the far, silent end of an empty table. Being welcomed like that, she thought, mattered more than she could have explained to anyone who hadn't sat alone at that end table for a week, and slowly, she started to feel like she actually belonged there.", "Over the following weeks, Harper learned the table's unspoken rules the way you learn the layout of a new house, gradually and without really noticing it happening until one day she realized she already knew them by heart: Devon always sat closest to the trash cans because he liked being first in line to dump his tray, Priya traded her fruit cup for anyone's extra crackers without fail, and Mateo, it turned out, kept a small, battered deck of cards in his backpack for the days lunch conversation ran dry. Harper found herself, without quite planning it, becoming the person who remembered whose turn it was to pick the card game, a small, unglamorous role that nonetheless made her feel, for the first time since the move, like a specific, needed part of something rather than an interchangeable extra person filling a chair.", "Weeks later, as spring crept slowly into the Pacific Northwest and Harper had settled comfortably into her new lunch table, a new student joined her class: a quiet boy named Ollie who'd just moved from Texas, who spent his entire first lunch period sitting alone at the far end of a table near the wall, eating quickly, eyes fixed carefully on his tray.", "Harper recognized the posture immediately. She excused herself from her own table, mid-conversation, and walked over.", "\"Is this seat taken?\" she asked, already sitting down across from him.", "Ollie looked up, startled. \"No. It's not taken.\"", "\"I'm Harper,\" she said. \"You're the new kid, right? From Texas?\"", "\"Yeah,\" Ollie said, some of the tension easing visibly from his shoulders. \"How'd you know?\"", "\"Ms. Kessler mentioned it during announcements,\" Harper said, smiling. \"Also, I remember exactly what it feels like to be new here. I moved from Ohio back in February. Come sit with me and my friends tomorrow. Fair warning, Devon tells a lot of very bad jokes.\"", "Ollie laughed, a small, surprised, genuine laugh, the first one Harper had heard from him all day.", "\"Okay,\" he said. \"Yeah. I'd like that.\"", "The next afternoon, Harper watched Ollie carry his tray across the cafeteria toward their table, the same slightly nervous walk she remembered taking herself only a few weeks earlier, and felt an unexpected rush of something like pride watching him navigate it. Mateo, she noticed, made room at the table without even being asked, sliding his backpack off the seat beside him the same easy, automatic way he had for Harper on that first Monday. It occurred to Harper, watching it happen, that this was maybe how it was supposed to work all along: not a single, dramatic act of kindness that fixed everything at once, but an ordinary seat, offered again and again, to whoever happened to need it next.", "\"Devon,\" Ollie said carefully, once he'd settled in and unwrapped his own sandwich, clearly having been warned, \"I heard you tell bad jokes.\"", "Devon's whole face lit up with delight. \"Oh, buddy,\" he said. \"You have no idea.\"", "Harper caught Mateo's eye across the table, and they both smiled, the small, private smile of two people who understood exactly what Ollie was about to be subjected to, and exactly how glad they both were that he'd have somewhere to sit while it happened.", "Later that afternoon, walking home, Harper found herself thinking back to that first rainy Tuesday in the front office, how impossibly far away Ohio had felt, how certain she'd been that she would never feel anything but unfamiliar in this new, damp, green place. She still missed her old street sometimes, and Delia, and the particular maple tree that turned red every October back home. But Redmond had stopped feeling like somewhere she was merely enduring, and started feeling, in small, ordinary ways she couldn't quite pinpoint, like somewhere she actually lived. It hadn't taken a single big moment to get there. It had taken one offered seat, one bad joke, one kickball team, added up slowly, the way most important things in life seemed to add up, she was beginning to suspect, a little at a time rather than all at once."]}, {"vocab": [{"w": "apologize", "d": "to say sorry for something you did wrong"}, {"w": "assume", "d": "to believe something is true without checking or asking first"}, {"w": "misunderstanding", "d": "a situation where people fail to understand each other correctly"}, {"w": "forgive", "d": "to stop being angry at someone for something they did"}, {"w": "reconcile", "d": "to become friendly again after a disagreement"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Two best friends learn how to give and accept a real apology after a fight", "The girls stop being friends forever", "The bracelets get lost", "A teacher solves the argument for them"], "ans": 0, "why": "The heart of the story is the girls learning to repair their friendship honestly."}, {"skill": "Details", "q": "What did Tess say that hurt Nadia's feelings?", "opts": ["She said Nadia's science project idea was boring, in front of other classmates", "She lost Nadia's bracelet", "She forgot Nadia's birthday", "She moved away"], "ans": 0, "why": "Tess's careless public comment about the project sparked the conflict."}, {"skill": "Inference", "q": "Why did Nadia assume Tess meant to embarrass her on purpose?", "opts": ["She didn't ask Tess to explain and instead guessed the worst reason on her own", "Tess admitted it right away", "A teacher told her that", "She read Tess's diary"], "ans": 0, "why": "Nadia jumped to a conclusion without checking with Tess first, which is called assuming."}, {"skill": "Cause and effect", "q": "What happened after Tess gave a real apology instead of just saying sorry quickly?", "opts": ["Nadia felt heard and the two girls were able to reconcile", "Nadia stayed angry forever", "Tess got in trouble", "Nothing changed between them"], "ans": 0, "why": "A specific, sincere apology helped repair the friendship."}, {"skill": "Vocabulary", "q": "What does “assume” mean?", "opts": ["To believe something is true without checking first", "To apologize sincerely", "To celebrate a friendship", "To draw a picture"], "ans": 0, "why": "Nadia assumed the worst about Tess's intentions without asking her directly."}], "title": "The Fight Over the Friendship Bracelet", "cat": "friend", "blurb": "Nadia and Tess have been best friends since kindergarten, matching bracelets and all. When a careless comment turns into a real fight, both girls discover that saying sorry is a skill, just like any other, and it takes practice to get right.", "paras": ["Nadia Osei and Tess Lindqvist had been best friends since the first week of kindergarten, when a shy, five-year-old Nadia had offered half of her fruit snacks to an equally shy Tess during snack time, and something about that small, simple kindness had grown, over six years, into the kind of friendship that felt less like a choice and more like a fact of the world, as solid and permanent as gravity. They wore matching friendship bracelets, hand-braided out of embroidery thread the summer before third grade, faded now but never once removed.", "Over the years, the two of them had built an entire private world out of small, ordinary rituals. They saved each other seats at lunch without ever having to ask. They traded lunchbox snacks they didn't feel like eating, Nadia always handing over her pretzels in exchange for Tess's fruit cups. On the bus home, they sat in the same seat, third row from the back, and narrated whatever they saw out the window in increasingly ridiculous voices until the bus driver, Mr. Halloran, occasionally told them, not unkindly, to pipe down. Their mothers had become friends too, trading recipes and carpool shifts, so that the two families' calendars had slowly grown tangled together the way the girls' bracelets were.", "Which made the fight, when it finally happened, feel especially enormous.", "It started, as these things often do, with something small. The two girls were partnered together for a science fair project, and Nadia had proposed an idea involving homemade weather instruments, something she'd been excited about for weeks, sketching designs in her notebook during free moments. She had drawn a rain gauge made from a repurposed water bottle, a little paper wind vane, and a barometer built from a balloon stretched over a jar, and she had shown the sketches to Tess at least four separate times, each time adding some new detail she'd thought of since. Tess had agreed enthusiastically each time, saying it sounded like the most interesting project in their whole grade, and Nadia had believed her completely.", "During a group discussion in class, when their teacher asked each pair to briefly share their project idea, Tess, distracted and a little nervous speaking in front of the class, blurted out, \"We're doing something with weather stuff, I don't know, Nadia came up with it, it's kind of boring but whatever,\" and immediately sat back down, already thinking about something else entirely.", "Nadia felt the comment land like a slap. Boring. In front of the entire class. About an idea she'd been genuinely excited about, an idea Tess herself had agreed to just two days earlier. She felt her face go hot, and she stared very hard at her own desk, not daring to look up in case anyone was watching her reaction.", "She didn't say anything to Tess about it right away. Instead, she spent the rest of the school day quietly stewing, replaying the moment over and over, each replay making it feel a little worse, a little more deliberately cruel than it had probably actually been. During silent reading time, she found she'd read the same paragraph in her book four times without absorbing a single word of it, her mind stubbornly circling back to Tess's voice saying kind of boring, whatever. By the time the final bell rang, Nadia had built, in her own mind, an entire theory: Tess was embarrassed to be working with her. Tess secretly thought her ideas were bad. Tess had said it in front of everyone on purpose, to make herself look better by comparison, maybe even to make the other kids laugh at Nadia's expense.", "\"You basically called my idea stupid in front of the whole class,\" Nadia said, catching up to Tess at their lockers, her voice sharper than she meant it to sound.", "Tess blinked, genuinely confused. \"What? When?\"", "\"During group share time. You said it was 'kind of boring, whatever.' In front of everyone.\"", "\"I didn't mean it like that,\" Tess said, though something defensive had already crept into her own voice, a reflexive reaction to being accused of something. \"I was just nervous talking in front of the class. I didn't think it was a big deal.\"", "\"Well, it was a big deal to me,\" Nadia snapped, and before Tess could respond, she'd already turned and walked away, leaving Tess standing at the lockers, stunned and a little stung herself by the sharpness of Nadia's tone.", "For the rest of that week, the two girls barely spoke. They still sat near each other in class, out of habit more than anything else, but the easy, constant chatter that usually flowed between them had dried up entirely, replaced by a stiff, careful politeness that felt, to both of them, far worse than an actual argument would have. Nadia caught herself, more than once, almost turning to share some small funny observation with Tess the way she always did, before remembering, with a fresh pang, that they weren't currently doing that.", "At lunch on Tuesday, Nadia sat two seats farther down the table than usual, close enough that it would have looked strange to sit anywhere else, but far enough that the empty space between them felt like its own small, silent announcement to the rest of their friend group. Their friend Priya asked, carefully, whether everything was okay, and both girls answered \"fine\" at almost exactly the same moment, in almost exactly the same falsely bright tone, which fooled absolutely nobody.", "Their science project sat untouched in Nadia's garage, the half-finished rain gauge gathering dust on a shelf, because neither girl wanted to be the one to suggest they work on it together. Nadia found herself avoiding even looking at the water bottle she'd already started cutting the top off of, since looking at it only reminded her of how excited she'd been before the whole mess started.", "It was Nadia's older sister, Amara, who finally asked what was wrong, noticing Nadia's unusually quiet mood over dinner one evening. Nadia had barely touched her rice, pushing it around her plate in slow, distracted circles.", "\"Okay, something's wrong,\" Amara said, setting down her own fork. \"You've been weird for like four days. Spill it.\"", "\"Tess and I had a fight,\" Nadia admitted, and told her the whole story: the comment, the embarrassment, the silence that had followed, the way lunch felt wrong now, the way their science project sat abandoned in the garage.", "\"Did you tell her exactly why it hurt your feelings?\" Amara asked. \"Or did you just tell her she hurt your feelings?\"", "Nadia frowned. \"Isn't that the same thing?\"", "\"Not really,\" Amara said. \"There's a difference between saying 'you hurt me' and explaining exactly what happened and why it landed the way it did. And here's another question: did you ask her why she said it, or did you just decide you already knew why?\"", "Nadia thought about this uncomfortably. She hadn't actually asked Tess why she'd said it. She had simply assumed, filled in the blank herself with the worst possible explanation, and reacted to that assumption as though it were an established fact.", "\"I kind of just assumed she meant to embarrass me,\" Nadia admitted slowly.", "\"Assuming is where a lot of fights actually come from,\" Amara said. \"Not from what someone actually did, necessarily, but from the story we tell ourselves about why they did it, without ever checking if that story is even true. I did the same thing to my friend Delphine last year. I was so sure she'd ditched me on purpose for a different lab group, and it turned out our teacher had just rearranged the seating chart without telling anyone. I spent a whole week being mad at her for something that wasn't even her fault.\"", "\"What did you do?\"", "\"Eventually I just asked her, straight out, instead of stewing about it,\" Amara said. \"Turns out asking is faster than guessing. It just feels scarier in the moment.\"", "Nadia lay awake a little longer than usual that night, turning the whole thing over. She kept picturing Tess's face at the lockers, the surprised, hurt look that had flickered across it right before Nadia had walked away. It bothered her more than she expected, that flicker. She hadn't given Tess a single chance to explain before deciding the worst.", "The next morning, Nadia found Tess before homeroom, her stomach tight with nervousness. \"Can we talk?\" she asked. \"Actually talk, I mean. Not just be weird and quiet at each other.\"", "Tess looked relieved, some of the guardedness leaving her shoulders immediately. \"Yeah. Please. This whole week has felt terrible.\"", "They found a quiet spot near the school's side entrance, away from the crowd of kids heading toward the building. A custodian was sweeping leaves nearby, the scratchy rhythm of the broom the only sound besides their own voices.", "\"When you said my idea was boring in front of everyone,\" Nadia started, choosing her words carefully this time, \"it really embarrassed me. I'd been excited about it for weeks. I'd shown you my sketches like four times. And I guess I decided, without actually asking you, that you meant to make me look bad on purpose. That's probably not fair of me. But that's what it felt like in the moment.\"", "Tess's face crumpled slightly. \"I didn't mean it like that at all. I was just so nervous talking in front of everyone that the words came out wrong, way more careless than I meant them. My hands were literally shaking. I actually think your weather instrument idea is really cool. I've been looking forward to building it with you, especially the barometer with the balloon, that part seemed like actual magic to me. I'm really sorry, Nadia. Not just sorry you're upset — sorry for what I actually said. I should have thought about how it would sound before I said it, especially about something I knew mattered to you.\"", "Nadia felt something in her chest, tight and knotted all week, finally begin to loosen. \"That actually helps,\" she said. \"Hearing you say specifically what you're sorry for. It's different than just 'sorry.'\"", "\"I've been thinking about that all week too,\" Tess said. \"My mom always says a real apology names the actual thing, instead of just being a quick word to make an awkward moment end faster. She calls it a specific apology instead of a general one.\"", "\"I should apologize too,\" Nadia said. \"I didn't ask you why you said it. I just decided I already knew, and got angry at the version of you I made up in my head instead of actually talking to the real you. This whole week was really just one big misunderstanding that neither of us bothered to check on. I'm sorry I stormed off at the lockers without even letting you finish a sentence.\"", "\"We're both kind of bad at this, huh,\" Tess said, a small, hopeful smile starting to appear.", "\"Maybe it's a skill,\" Nadia said, thinking of what Amara had told her. \"Like anything else. You get better at it with practice.\"", "\"Practice apologizing? That sounds terrible,\" Tess said, laughing now, and Nadia laughed too, the familiar, easy sound of it landing between them like something clicking back into its proper place.", "Nadia found, somewhat to her own surprise, that she had already forgiven Tess completely, the tight, angry knot she'd carried all week simply gone now that the real apology had actually landed. There was no dramatic moment of deciding to forgive; it had simply happened, quietly, the moment Tess had named exactly what she was sorry for.", "They spent the rest of that walk into school talking through their actual weather instrument project, ideas flowing easily again between them the way they always had before, the careful stiffness of the past week finally dissolving, the two of them well and truly reconciled. By the time they reached their classroom, they had already agreed to work on the rain gauge again that very afternoon, and to bring the barometer jar in by the end of the week so it would have plenty of time to be tested before the fair.", "That afternoon, working together at Nadia's kitchen table sketching out their rain gauge design, the two of them fell easily back into their old rhythm, Tess measuring the water bottle while Nadia carefully marked lines with a permanent marker. Nadia's mother, passing through the kitchen with a basket of laundry, paused for a moment at the sight of the two of them laughing over a slightly crooked measurement, and said nothing, but smiled to herself in a way that suggested she'd noticed the quiet week that had come before it.", "Partway through their work, Tess noticed her friendship bracelet had slipped nearly off her wrist, the knot worn thin after years of daily wear. \"I think mine's about to fall apart,\" she said, holding up her wrist.", "\"Mine too, probably,\" Nadia said, checking her own, the thread gone soft and fuzzy with age. \"Want to make new ones this weekend? We could add something new to the pattern. Like a little symbol for figuring out how to actually fix a fight instead of just staying mad.\"", "\"What would that symbol even look like?\" Tess asked, grinning.", "Nadia thought about it. \"Maybe just two different colored threads, tangled together in the middle, and then coming out the other side straighter than they went in.\"", "\"I like that,\" Tess said. \"Let's make that one.\"", "That weekend, they did exactly that, sitting cross-legged on Nadia's bedroom floor, a plastic bin of embroidery thread spread open between them, sorting through colors for nearly twenty minutes before settling on a deep blue and a warm yellow, the two colors crossing directly through the center of each bracelet. They braided two new bracelets side by side, each one including, right in the middle, a small, deliberately tangled section where the two different threads crossed and knotted together before straightening back out, a tiny woven reminder that even the best friendships sometimes needed real, honest work to stay strong, and that the work, done properly, was always worth it.", "When they finished, they tied the new bracelets onto each other's wrists, right over the pale mark left by the old, worn-out ones, and sat for a moment admiring the little tangled knot in the middle of the pattern.", "\"We should keep the old ones somewhere,\" Tess said. \"As proof we survived our first real fight.\"", "\"Deal,\" Nadia said, and tucked both faded bracelets into the small wooden keepsake box on her dresser, right next to a photo of the two of them from their very first kindergarten snack time, six years and one solved misunderstanding ago.", "The science fair itself was still two weeks away, and once the awkwardness between them had fully melted, the two girls threw themselves into the project with the same enthusiasm Nadia had felt back when she'd first sketched it in her notebook. They spent three afternoons at Nadia's kitchen table, and one entire rainy Saturday in Tess's garage, testing their homemade rain gauge by pouring measured cups of water into it and checking the markings against a real measuring cup, adjusting the lines with a fine-tipped marker whenever they didn't quite match.", "\"This is actually harder than I thought it would be,\" Tess admitted, squinting at a line that seemed slightly crooked no matter how many times she redrew it.", "\"That's what Ms. Okafor said would happen,\" Nadia said. \"She told us real scientists redo their measurements like five times before they trust them.\"", "\"Then I guess we're real scientists now,\" Tess said, \"because I have redone this line approximately five hundred times.\"", "The barometer, built from a balloon stretched tight over the mouth of a jar with a drinking straw taped to its surface as a pointer, turned out to be the trickiest part of all. The first attempt sagged uselessly, the balloon too loose to register any change in air pressure at all, and the second attempt popped entirely when Tess pulled the balloon too tight while stretching it over the rim. Nadia laughed so hard at the sudden bang and Tess's startled yelp that she had to sit down on the garage floor for a minute, and even Tess, brushing rubber shreds off her sleeve, admitted it had probably looked pretty funny from the outside.", "\"Okay, but the third one has to work,\" Tess said, still catching her breath from laughing. \"We're out of balloons.\"", "The third attempt held, and when they marked its pointer's position each morning for a week and compared it to the weather report, the little straw genuinely seemed to dip lower on the cloudy days and rise on the clear ones, which felt, to both of them, like an almost unbelievable kind of magic for something built out of a balloon and a jam jar.", "On the morning of the fair itself, they arrived early to set up their table, arranging the rain gauge, the wind vane, and the slightly battered but functioning barometer in a neat row, along with a poster board covered in Nadia's careful handwriting explaining how each instrument worked. Ms. Okafor stopped by their table twice during the judging, asking real questions about how they'd calibrated the rain gauge, and nodding approvingly when Tess explained, without any hesitation this time, exactly how the balloon barometer responded to changing air pressure.", "They didn't win first place, that honor going to a pair of sixth graders with an elaborate volcano model, but they earned a ribbon for Most Creative Design, which they agreed afterward was honestly the better prize, since it meant the judges had noticed how much genuine thought had gone into building something from scratch. Walking home with the ribbon carefully tucked into Nadia's backpack so it wouldn't crease, Tess bumped her shoulder lightly against Nadia's.", "\"Can you believe we almost didn't finish this because of one dumb sentence I said without thinking?\" Tess said.", "\"We didn't almost not finish it,\" Nadia said. \"We just took a slightly complicated detour on the way. The important part is we actually talked about it instead of just letting it sit there getting worse.\"", "\"Look at you, sounding like your sister,\" Tess teased.", "\"She's occasionally right about things,\" Nadia admitted. \"Don't tell her I said that.\"", "That evening, showing her parents the Most Creative Design ribbon, Nadia found herself explaining not just the barometer and the rain gauge, but the whole story behind them, the careless comment, the silent week, the conversation by the side entrance, the new bracelets with the tangled thread in the middle. Her mother listened quietly, then reached over and tapped the ribbon gently.", "\"You know,\" she said, \"I think this might actually be the most impressive part of the whole project. Not the barometer. The part where you two figured out how to fix something instead of just letting it break.\"", "Nadia thought about that for a long moment, turning the ribbon over in her hands, then glanced down at the new bracelet on her wrist, the little knot of blue and yellow thread crossing in the middle before straightening back out, and decided her mother was probably right."]}, {"vocab": [{"w": "exclude", "d": "to leave someone out or keep them from joining a group"}, {"w": "include", "d": "to allow someone to be part of a group or activity"}, {"w": "bystander", "d": "a person who sees something happening but does not take part"}, {"w": "empathy", "d": "the ability to understand and share the feelings of another person"}, {"w": "initiative", "d": "the ability to take action on your own, without being told to"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Grace decides to include a classmate who is often left out, instead of just noticing and doing nothing", "Felix moves to a different school", "Grace gets in trouble at recess", "The other kids are punished"], "ans": 0, "why": "The story centers on Grace's choice to take action rather than remain a bystander."}, {"skill": "Details", "q": "Where does Felix usually sit during lunch and recess?", "opts": ["Alone at the edge of the blacktop", "With the soccer team", "In the school library", "With his older sibling"], "ans": 0, "why": "Felix sits alone at the edge of the blacktop every day."}, {"skill": "Inference", "q": "Why did Grace hesitate for so long before inviting Felix to join her group?", "opts": ["She worried about what her friends would think and whether it would feel awkward", "She didn't notice him at all", "She didn't like him", "She was told not to talk to him"], "ans": 0, "why": "Grace's hesitation came from social worry, not dislike of Felix."}, {"skill": "Cause and effect", "q": "What happened after Grace actually invited Felix to play four square with her group?", "opts": ["Felix turned out to be funny and skilled, and the group welcomed him warmly", "Everyone ignored Felix anyway", "Felix said no and walked away", "The teacher stopped the game"], "ans": 0, "why": "Taking the small risk led to a genuinely positive outcome for everyone."}, {"skill": "Vocabulary", "q": "What does “bystander” mean?", "opts": ["A person who sees something happening but does not take part", "A person who plays sports", "A new student", "A teacher's assistant"], "ans": 0, "why": "Grace realizes she has been acting as a bystander instead of taking action."}], "title": "Room for One More", "cat": "friend", "blurb": "Every day at recess, Grace watches a boy named Felix eat lunch alone at the edge of the blacktop, and every day she tells herself someone else will invite him over. One day, she stops waiting for someone else.", "paras": ["For three weeks, Grace Delacroix had noticed the same thing at recess, nearly every single day: a boy from her class named Felix Ramirez, sitting by himself at the very edge of the blacktop, eating his snack slowly, occasionally glancing toward the games and clusters of kids nearby, never quite approaching any of them.", "She noticed it the way you notice something out of the corner of your eye, again and again, without ever quite deciding to do anything about it. Someone else will probably invite him over, she told herself, most days. Or maybe he actually likes sitting alone. Maybe I'm reading too much into it.", "Recess at Fircrest Elementary followed the same basic shape every single day. The moment the doors opened, kids scattered across the blacktop and the adjoining field in a burst of noise and motion: the kickball crowd claimed the painted diamond near the fence, the younger kids swarmed the tire swings, and Grace's own group, six or seven girls who had drifted together gradually over the past two years, staked out their usual square of pavement near the basketball hoops for four square. Felix's spot, the narrow strip of curb near the supply shed, sat almost exactly halfway between the kickball diamond and Grace's four square square, close enough that she passed within twenty feet of him nearly every day without ever quite crossing the distance.", "But there was a particular expression Felix wore during those recess minutes, a careful, neutral blankness that Grace recognized, somewhere in the back of her mind, as the exact same expression she herself had worn during the two miserable weeks in second grade when her own best friend had briefly moved away and she'd had nobody to sit with at lunch. She remembered exactly how those minutes had dragged, how she'd learned to study the pattern of cracks in the blacktop rather than look up and confirm that everyone else was talking to someone and she wasn't. That flash of empathy, remembering exactly how it had felt, told her, without needing to ask him, that it did not feel good to sit there.", "Still, she didn't do anything about it. Not for three whole weeks.", "It wasn't that she disliked Felix. She barely knew him, actually, beyond a few brief group project interactions in class, during which he'd struck her as quiet but genuinely funny in a dry, understated way that made her laugh more than once. She remembered a partner assignment on rocks and minerals back in October, when Felix had labeled his sample of pumice \"extremely lightweight, like my hopes and dreams,\" deadpan, without even looking up from his worksheet, and she had laughed out loud before catching herself, surprised that such a quiet kid had such a sharp sense of humor hiding just under the surface. The hesitation lived somewhere else entirely: a nervous, hard-to-explain worry about what her friend group might think if she suddenly brought over a boy nobody really talked to, whether it would feel awkward, whether Felix himself would even want to be invited, or whether he might say no and make the whole thing feel worse for both of them.", "Some days, she almost talked herself into it. She'd feel her feet actually turn slightly in his direction before her nerve failed and she veered back toward the four square game instead, telling herself she'd definitely do it tomorrow. Tomorrow, reliably, arrived, and reliably, nothing changed.", "She found out, eventually, a little of why Felix ended up alone in the first place, though not from Felix himself. Wren mentioned, during a slow moment at the end of art class, that Felix had transferred in from a different elementary school back in October, partway through the year, after his family moved across town, which meant he'd landed in a class where every other kid already had a settled group of friends built up over years, with no obvious gap for a new kid to slide into. Starting in September, when everyone was meeting everyone for the first time anyway, might have been easy. Starting in October, into groups that had already hardened into place, was something else entirely.", "\"That's rough,\" Grace had said at the time, filing the information away, feeling a fresh twist of guilt she didn't examine too closely.", "\"Yeah,\" Wren had said, already moving on to something else, the way kids do when a piece of information doesn't yet feel like it requires anything of them personally.", "But it stuck with Grace longer than she expected. She kept picturing what it might feel like to walk into a classroom in October, when the seating charts and the friend groups and the inside jokes had all already settled into their final shapes, like wet cement gone hard, and to have absolutely no idea how to find a crack to fit yourself into.", "\"You've mentioned that kid like four times this week,\" her older brother Theo observed one evening, only half paying attention as he did his own homework at the kitchen table. \"The one who sits alone at recess.\"", "\"I have?\" Grace said, surprised. She hadn't fully realized how much she'd been thinking about it.", "\"Yeah. What are you gonna do about it?\"", "\"I don't know,\" Grace admitted. \"It feels weird to just walk up to someone.\"", "Theo shrugged. \"It's always gonna feel a little weird the first time. That doesn't mean it's the wrong thing to do. It just means it's a new thing to do.\"", "\"That's easy for you to say. You're in middle school. Nobody watches what you do at recess anymore.\"", "\"Fair,\" Theo said, tapping his pencil against his workbook. \"But I remember being your age. Everybody's too busy worrying about what everyone else thinks of them to actually notice what you do half the time. You're probably building this up bigger in your head than it actually is out there.\"", "Grace turned this over for the rest of the evening, feeling, uncomfortably, a term she'd learned recently in a school assembly about kindness surface in her mind: bystander. Someone who notices something happening and does nothing about it, not because they support what's happening, but simply because acting feels harder than staying quiet. She hadn't excluded Felix herself. But watching it happen, day after day, and doing nothing, she was starting to realize, wasn't quite as innocent as it had felt. The assembly speaker, a woman who visited schools talking about friendship and kindness, had used the exact phrase \"watching and doing nothing is its own kind of choice,\" and Grace had nodded along politely at the time without really feeling it apply to her own life. Now it felt uncomfortably specific.", "That night, lying in bed, she found herself running through excuses one more time, the same ones she'd used for three weeks. What if my friends think it's weird. What if he says no. What if it makes recess awkward for everyone instead of just for him. But underneath the excuses, she noticed something else now, something Theo's comment and the assembly memory had stirred loose: what if none of those things happen, and I just keep walking past him for the rest of the year anyway, telling myself tomorrow, until it's June and I never did anything at all.", "The next day at recess, Grace's group of friends gathered for their usual game of four square near the edge of the blacktop, close enough, she suddenly noticed, that Felix's usual solitary spot was barely twenty feet away. She watched him settle into his familiar position, snack in hand, eyes drifting occasionally toward their game. He had a small paperback book tucked under one leg, she noticed for the first time, as if he'd brought something to do in case nobody ever asked, which struck her, watching it, as somehow the saddest detail of the whole three weeks.", "Her heart started beating a little faster, the way it did before doing something that felt bigger than it probably actually was.", "\"Be right back,\" she told her friends, and before she could talk herself out of it, she took the initiative and walked over to where Felix sat, rather than waiting one more day for someone else to do it first. Her legs felt strangely heavy the whole twenty feet, and she found herself rehearsing the exact sentence in her head one more time so she wouldn't fumble it once she actually got there.", "\"Hey,\" she said. \"We're one person short for four square. Want to play? We'd really like to include you.\"", "Felix looked up, visibly startled, as though the possibility hadn't occurred to him as something that might actually happen. \"Me?\" he said.", "\"Yeah, you,\" Grace said, feeling suddenly a little silly for how big this moment felt, given how small the actual words were. \"Unless you're busy doing something else.\"", "\"I'm not busy,\" Felix said, standing up quickly, brushing off his pants, the paperback book tumbling unnoticed to the ground before he scooped it back up and shoved it into his jacket pocket. \"I mean — yeah. I'd like that. Thanks.\"", "They walked back to the game together, and Grace introduced him quickly to her friends, feeling a flutter of nervousness about how the group would react. But her friends, as it turned out, barely blinked, simply making room in the rotation and explaining the specific rules their group used for four square, which apparently differed slightly from the official rules in ways that took genuine debate to sort out. Wren, in particular, launched immediately into a passionate three-minute explanation of exactly why their group played \"no interference\" rules instead of standard rules, an explanation Felix listened to with visible amusement.", "\"So basically you made up your own sport,\" Felix said once Wren finished.", "\"We perfected an existing sport,\" Wren corrected, without missing a beat, and the whole group laughed, Felix included.", "Felix, it turned out, was surprisingly good at four square, quick and strategic in a way that quickly earned him respect from the rest of the group. He had a habit of calling out exactly where he intended to hit the ball a half-second before he did it, which somehow made him more impressive rather than easier to beat, since he kept landing it exactly where he'd promised anyway. He was also, exactly as Grace had suspected from their brief group project interactions, genuinely funny, offering a string of dry, perfectly timed comments throughout the game that had the whole group laughing within ten minutes.", "\"Where have you been all year?\" one of Grace's friends, Wren, asked him at one point, only half joking. \"You're hilarious.\"", "Felix's expression flickered, something complicated passing across his face before he answered, lightly, \"Nowhere special. Just around.\"", "Grace caught the flicker and understood, without needing him to explain further, exactly what it meant: he had been around the whole time, sitting twenty feet away at the edge of the blacktop, simply never invited close enough for anyone to notice.", "When the bell rang to signal the end of recess, the whole group walked back toward the building together, still arguing cheerfully about a disputed call from the last round. Felix fell into step beside Grace for a moment.", "\"Thanks for asking me,\" he said quietly, just to her, not performing it the way he'd performed his jokes for the whole group. \"I wasn't sure anyone was going to.\"", "\"Sorry it took so long,\" Grace said, and meant it.", "\"You still asked,\" Felix said. \"That's the part that actually counts.\"", "Over the following weeks, Felix became a regular part of Grace's recess group, not because of any single dramatic gesture, but through the accumulated weight of small, ordinary invitations, again and again: a saved spot in the four square line, an easy \"you coming?\" before heading out to recess, a genuine laugh at one of his jokes that made it clear he was welcome rather than merely tolerated. He started bringing his paperback books to recess less often, and when he did, he read them out loud in funny voices to whoever wanted to listen during water breaks, which turned out to be most of the group, most days.", "Grace noticed other small changes too. Felix answered more questions in class now, sitting a little straighter, raising his hand with the easy confidence of someone who had somewhere to sit at lunch and knew it. Their teacher, Mr. Whitfield, even commented once, gently, that Felix seemed to be having \"a really good stretch\" lately, without knowing quite why, and Grace, hearing it, felt a small, private glow of satisfaction she didn't mention to anyone.", "One afternoon, weeks later, Grace noticed a new student, a nervous-looking girl named Priya, sitting alone at lunch on her very first day, in almost exactly the spot Felix used to occupy. Grace felt the familiar hesitation rise up immediately, the same social worry, the same uncertainty about whether to act.", "Before she could decide what to do, Felix was already walking over, snack in hand, sitting down across from Priya with an easy, \"Hey, I'm Felix. You want to sit with us at recess? Fair warning, our four square rules are extremely complicated and everyone will argue about them.\"", "Grace watched, smiling, as Priya's shoulders visibly relaxed, the same relief Felix himself had shown weeks earlier washing over her face. Priya glanced past Felix toward the rest of the group already gathering their things, a flicker of hope crossing her face, as if she hadn't quite believed, until that exact moment, that today might turn out differently than she'd feared on the walk to school that morning.", "\"You're good at that now,\" Grace told Felix later, as they walked out to recess together, Priya trailing along beside them, already laughing at something Wren had said.", "\"I had a good teacher,\" Felix said, glancing at her sideways. \"Someone showed me it only takes about ten seconds to change someone's entire day. Once you know that, it's hard to just stand around watching and not do it.\"", "Grace thought about the three weeks she'd spent noticing Felix and doing nothing, and the ten seconds it had actually taken, once she finally acted, to change things completely. Both were true at the same time: it had taken her far too long to work up the courage, and it had taken almost no time at all, once she finally did.", "\"I'm glad I finally did it,\" she said.", "\"Me too,\" Felix said, and this time, when they reached the blacktop, there was no hesitation at all, no careful, empty spot at the edge waiting to be filled. There was simply a group, a little bigger now than it used to be, with room, as it turned out, for exactly one more person than anyone had originally planned.", "That evening, telling Theo about Priya over dinner, Grace found herself explaining the whole chain of it: how she'd finally invited Felix after three weeks of noticing him, how Felix had turned around and done the exact same thing for someone else within about ten seconds of meeting her.", "\"Sounds like it's spreading,\" Theo said, grinning.", "\"That's kind of the idea,\" Grace said. \"I keep thinking about how easy it would have been for nobody to ever say anything. Felix could still be sitting by that shed right now. And now Priya isn't even going to have a first lonely week at a new school, because Felix didn't wait three weeks like I did.\"", "\"You started it, though,\" Theo pointed out. \"Doesn't matter that it took you three weeks. You still started it.\"", "Grace thought about that, turning her fork over in her hand. \"I guess bystander doesn't have to be permanent,\" she said slowly, mostly to herself. \"You can stop being one whenever you actually decide to.\"", "\"Look at you, using your vocabulary words outside of school,\" Theo teased, and Grace threw a balled-up napkin at him, laughing, feeling, for the first time in longer than she could quite remember, entirely unbothered about who was watching.", "A few weeks after that, near the very end of the school year, Mr. Whitfield asked the class to write a short reflection about something they'd learned that year that wasn't strictly a school subject. Most kids wrote about tying knots at camp, or learning to ride a bike without training wheels, or finally beating a video game level. Grace sat with her pencil hovering over the blank page for a long minute before she started writing about Felix, though she was careful, out of some instinct she couldn't fully explain, not to make it sound like she was asking for credit for it.", "She wrote about noticing him for three weeks and not doing anything, and about the assembly speaker's line about watching and doing nothing being its own kind of choice, and about how it had taken her exactly ten seconds, once she finally walked over, to change the whole shape of someone's day. She wrote about Priya, too, and about Felix turning around and doing for someone else what Grace had eventually worked up the nerve to do for him.", "When Mr. Whitfield handed the reflections back the following week, he had written a single line in the margin next to Grace's, in his small, neat handwriting: This is exactly the kind of thing that matters more than it seems like it does in the moment. Grace read it three times before tucking the paper carefully into her backpack to bring home, deciding, privately, that it was the best grade she'd gotten on anything all year, even though Mr. Whitfield hadn't actually put a grade on it at all.", "At recess that same afternoon, watching Felix explain the four square rules to yet another new kid who had just moved to the district, patiently walking through the \"no interference\" clause exactly the way Wren once had for him, Grace thought about how strange it was that the hardest part of the whole thing had been the twenty feet she'd walked on that one ordinary Tuesday, and how everything that mattered afterward had simply followed from that single small decision to finally cross it."]}, {"vocab": [{"w": "correspond", "d": "to communicate with someone regularly, especially through letters"}, {"w": "custom", "d": "a traditional way of doing something, shared by a group of people"}, {"w": "translate", "d": "to change words from one language into another"}, {"w": "perspective", "d": "a particular way of looking at or understanding something"}, {"w": "connection", "d": "a bond or relationship between people"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["A pen pal exchange helps two girls from different countries build a genuine friendship", "The class project is cancelled", "Ruby learns to speak fluent Chinese instantly", "The letters get lost in the mail"], "ans": 0, "why": "The growing friendship between Ruby and her pen pal Lin is the heart of the story."}, {"skill": "Details", "q": "What city in China does Ruby's pen pal live in?", "opts": ["Wuxi", "Beijing", "Shanghai", "Hong Kong"], "ans": 0, "why": "The story specifies that Lin's class is in Wuxi, China."}, {"skill": "Inference", "q": "Why did Ruby feel nervous about her first letter sounding boring?", "opts": ["She worried her ordinary daily life wouldn't be interesting to someone from far away", "She didn't know how to write in cursive", "She didn't have a pen", "She didn't want a pen pal at all"], "ans": 0, "why": "Ruby doubted her everyday details would be interesting to someone overseas."}, {"skill": "Cause and effect", "q": "What happened after Ruby and Lin kept writing letters over several months?", "opts": ["They discovered they had very similar feelings and interests despite living far apart", "They stopped writing after one letter", "They got into an argument", "They forgot about each other"], "ans": 0, "why": "Continued correspondence revealed how much common ground they shared."}, {"skill": "Vocabulary", "q": "What does “correspond” mean?", "opts": ["To communicate with someone regularly, especially by letter", "To translate a language", "To travel somewhere", "To draw a picture"], "ans": 0, "why": "Ruby and Lin correspond through letters throughout the story."}], "title": "Dear Friend Across the Ocean", "cat": "friend", "blurb": "When Ms. Alvarez's class is paired with a classroom in Wuxi, China for a pen pal project, Ruby expects a few polite letters and nothing more. She doesn't expect to find a friend who understands her better than almost anyone at her own school.", "paras": ["When Ms. Alvarez announced that the class would be starting a pen pal exchange with a fourth-grade classroom in Wuxi, China, Ruby Park's first reaction was mild curiosity, followed quickly by a nervous, sinking feeling as she considered what she would actually have to say.", "\"You'll each correspond with one student in Wuxi for the rest of the school year,\" Ms. Alvarez explained, handing out a stack of soft blue airmail envelopes and a world map showing exactly how far away Wuxi actually was: thousands of miles, across an entire ocean, in a country Ruby knew only from a handful of facts memorized for a geography quiz the previous semester. \"Your pen pal is a real student, just like you, living a completely different daily life on the other side of the world. I want you to write honestly about your own life, and ask genuine questions about theirs.\"", "She pinned the world map to the whiteboard and traced a line with her finger from Redmond, Washington, out across the Pacific Ocean to a small dot near the eastern coast of China, labeled Wuxi in careful print. The distance, drawn out flat like that on paper, looked almost impossibly far, and Ruby found herself trying, without much success, to imagine what it would actually feel like to be a kid sitting in a classroom on the exact opposite side of that blue expanse.", "\"Is anyone actually going to write back?\" asked a boy near the front, Desmond, half joking. \"What if my pen pal just doesn't want to?\"", "\"They agreed to this exchange just like you did,\" Ms. Alvarez said. \"Give it a real chance before you decide it won't work.\"", "Ruby stared at her blank sheet of paper that evening, chewing the end of her pencil, feeling strangely paralyzed. What could she possibly say that would interest someone living an entire ocean away? Her actual daily life felt, from this angle, almost embarrassingly ordinary: soccer practice on Tuesdays, a little brother who wouldn't stop humming the same song, a favorite spot by the window where she liked to read on rainy afternoons, which in Redmond, Washington, was most afternoons.", "She crossed out her first attempt entirely, an overly formal paragraph that sounded, reading it back, like something out of a textbook rather than an actual letter from an actual kid. She crossed out her second attempt too, which had swung too far the other way, crammed with so many exclamation points that it read as though she were shouting the entire time. Her third attempt, slower and quieter, finally felt closer to something true.", "She finally wrote a short, careful letter, describing her family, her favorite subjects at school, the rain that fell almost constantly where she lived, and a few questions about her pen pal's own daily life, feeling the whole time that the letter was probably far too plain to be interesting to anyone. She sealed it into one of the soft blue airmail envelopes Ms. Alvarez had handed out, printed the unfamiliar address as carefully as she could copy it from the slip of paper she'd been given, and handed it to Ms. Alvarez the next morning with a small, private worry that it might simply vanish somewhere over the ocean and never arrive at all.", "Six weeks later, an envelope arrived at the classroom covered in unfamiliar stamps, addressed in careful, looping handwriting to Ruby Park. Ruby's stomach did a small flip when Ms. Alvarez called her name and handed it over, the paper feeling strangely delicate, as though it had traveled a very long way to reach her, which, of course, it had. Inside was a letter from a girl named Lin Wei, who, it turned out, lived in an apartment near a lake in Wuxi, had a little brother of her own who also wouldn't stop humming the same song, and loved reading by her own window on rainy afternoons, of which, she wrote, Wuxi also seemed to have quite a lot.", "Dear Ruby, the letter began, in careful, practiced English that Lin had clearly worked hard to translate from her own first thoughts in Chinese, I was so happy to receive your letter. I was worried my life would seem boring compared to someone living in America, but I read your letter three times, and I think maybe we are not so different after all. My favorite subject is math, though my teacher says my drawings are also quite good. I have a question for you: is it true that in America, students eat lunch in only twenty minutes? My friend told me this and I found it hard to believe, because lunch here often takes much longer, and it is one of my favorite parts of the day.", "Ruby read the letter three times herself, delighted by the small, specific coincidences: the little brother, the rainy window, the shared worry about being boring. She even read a few lines aloud to her own little brother, Sam, who mostly just wanted to know whether Lin's brother hummed the same song Sam himself was currently obsessed with, a question Ruby promised, laughing, to actually include in her next letter. She wrote back almost immediately, describing her twenty-minute lunch period in detail, along with a dozen new questions of her own: what does a typical school day look like in Wuxi, what games did Lin play with her friends, what did the lake near her apartment look like in different seasons.", "Over the following months, the letters continued to arrive, roughly every six weeks, each one a little longer and more detailed than the last, as the initial careful politeness between the two girls gradually gave way to something warmer and more genuine. Ruby began keeping all of Lin's letters in a shoebox decorated with stickers, arranged in order, and found herself, on slow afternoons, occasionally rereading the older ones just to notice how much more comfortable and specific Lin's writing had become since that very first careful letter.", "Lin described the Mid-Autumn Festival, when her family gathered to eat mooncakes and look at the full moon together, explaining the old legend of Chang'e, the woman said to live on the moon, a story Ruby found so beautiful she asked Lin to tell her more, and Lin happily obliged in her next letter, filling two full pages with details of the legend: how Chang'e had swallowed a magic elixir to keep it from falling into the wrong hands, how she had drifted up into the sky and settled on the moon, how her husband still gazed up at the full moon each autumn missing her, which was why families gathered together on that particular night, to be near the people they loved while looking up at the same moon that watched over Chang'e. Ruby read that letter to her whole family at dinner, translating none of it wrong because Lin had already done the translating herself, carefully, word by word, from her own language into Ruby's.", "In exchange, Ruby described Halloween, a holiday that seemed to fascinate Lin enormously, particularly the custom of dressing in costumes and going door to door for candy, which struck Lin as delightfully strange and wonderful in equal measure. \"We do not have this exact custom here,\" Lin wrote, \"but I think I would like it very much. Please describe your costume in great detail. I am trying to picture it exactly.\" Ruby spent an entire evening writing back a page devoted solely to her butterfly costume from that year, describing the exact shade of purple on the wings, the way the antennae bounced when she walked, and the specific size of pillowcase she used for collecting candy because a regular trick-or-treating bag, in her professional opinion, simply did not hold enough.", "Somewhere around the fourth or fifth exchange of letters, Ruby noticed that she had started thinking of Lin not as a school assignment, a pen pal she was obligated to write to, but as something closer to an actual friend, someone she genuinely looked forward to hearing from, someone whose opinion on a tricky problem she'd started to wonder about between letters. When Ruby struggled with a difficult math concept at school, she found herself thinking, I should ask Lin how her class learned this, since Lin had mentioned loving math in her very first letter. When Lin wrote about feeling nervous before a class presentation, Ruby recognized the exact same nervous feeling from her own experience with presentations, and wrote back a long, encouraging letter describing exactly how she managed her own nerves, complete with the specific breathing trick her own teacher had taught the class.", "Ruby began noticing, too, how much of what she and Lin wrote about turned out to circle back to the same small worries, dressed in different details. Lin worried her drawings weren't as good as her math grades suggested she should be at everything. Ruby worried, some weeks, that she wasn't fast enough at soccer to keep her spot on the team. Neither worry had anything to do with the ocean between them, and somehow writing them down for someone so far away made them feel smaller and more manageable than complaining about them out loud ever had.", "Not every exchange went smoothly. One letter, sent in the middle of winter, seemed to take far longer than the usual six weeks, and Ruby found herself checking the classroom mail bin nearly every day for almost two months, a small worry growing steadily that something had gone wrong, that Lin had lost interest, or that the letter had simply been lost somewhere over the ocean the way Ruby had feared, all the way back in September, her very first letter might be.", "\"Maybe she just got busy,\" Ms. Alvarez suggested gently, noticing Ruby's daily trips to check the mail bin. \"International mail can be unpredictable, especially around the holidays there. Try not to assume the worst before you actually know anything.\"", "Ruby tried to take the advice, though it was harder than it sounded. She occupied herself by rereading Lin's older letters again, and by starting a list of new questions for whenever the next one finally did arrive, a list that grew longer by the day as her worry, oddly, seemed to produce even more curiosity rather than less. When the letter finally did appear, nearly nine weeks after Ruby's had been sent, Lin explained apologetically that her family had traveled to visit her grandparents in a different city for the Spring Festival, the biggest holiday of the year in China, and that she'd written her reply from her grandparents' apartment but hadn't been able to mail it until they returned home. She'd included, tucked carefully inside the fold of the letter, a small paper cutting shaped like a rabbit, explaining that her grandmother had taught her to make them for good luck, and that this particular year, according to the Chinese zodiac, happened to belong to the rabbit.", "Ruby pinned the little paper rabbit to the corkboard above her desk, where it stayed for the rest of the school year, a small, delicate reminder that a long silence didn't always mean something had gone wrong, sometimes it just meant life, on the other side of the world, had gotten busy in ordinary, forgivable ways.", "Ruby also started, gradually, picking up small pieces of Lin's language along the way. Lin had begun signing her letters with a line or two of Chinese beneath her English name, always followed by a careful translation in parentheses, and Ruby had taken to practicing the words out loud in her room, stumbling over the unfamiliar sounds until they started to feel less foreign in her mouth. She learned that \"xie xie\" meant thank you, that \"peng you\" meant friend, and she began ending her own letters with a wobbly, hand-copied \"peng you,\" proud each time she managed to draw the characters correctly enough that Lin could actually recognize them.", "\"Your Chinese is improving letter by letter,\" Lin wrote once, and Ruby, reading it, felt a small glow of pride entirely out of proportion to two single words, though it didn't feel that way to her at all.", "\"It's strange,\" Ruby told her mother one evening, reading over Lin's most recent letter for a third time. \"I've never actually met her. I don't even know what her voice sounds like. But I think she might understand some things about me better than some kids at my actual school do.\"", "\"That happens sometimes,\" her mother said. \"Real understanding doesn't always depend on how physically close two people are. Sometimes writing your actual thoughts down carefully, the way you have to in a letter, helps people understand each other even more clearly than a quick conversation might. Hearing about her perspective on things, and sharing yours, is building a real connection, even across an entire ocean.\"", "Ruby thought about that for a while after her mother left the room, turning it over the way she sometimes turned over a tricky math problem, testing it from different angles. She thought about how, at school, conversations often moved so quickly there wasn't always time to explain exactly why something bothered her or excited her. In a letter, there was nothing to do but slow down and get it right, since Lin wouldn't be able to ask a follow-up question for six more weeks.", "Near the end of the school year, Ms. Alvarez arranged a special video call between the two classrooms, so that all the pen pals could finally see and hear each other for the first time. The class had spent the whole morning in a state of barely contained excitement, several kids checking the classroom clock every few minutes as though that might somehow speed things along. Ruby felt an unexpected wave of nervousness as the call connected, the screen filling with rows of unfamiliar faces in a classroom on the literal opposite side of the planet, sunlight streaming through windows that, Ruby realized with a small jolt, were currently showing
