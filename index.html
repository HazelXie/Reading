kill": "Main idea", "q": "What is the main lesson of this story?", "opts": ["Some people are born to be gymnasts", "Progress often comes slowly, and persistence matters", "Quit when it is hard", "Only winners are happy"], "ans": 1, "why": "Ruby improves little by little, and that leads to success."}, {"skill": "Details", "q": "What did Ruby's coach have her practice before the back tuck?", "opts": ["Cartwheels only", "Back rocks and jumps onto a big mat", "Reading", "Running laps"], "ans": 1, "why": "The story shows Ruby practicing smaller steps that build up to a back tuck."}, {"skill": "Inference", "q": "Why did Ruby feel better after watching an old video of herself?", "opts": ["She saw how much she had already improved", "She saw her friends", "The video was funny", "The coach was mad"], "ans": 0, "why": "The video reminded her that she used to be unable to do a cartwheel."}, {"skill": "Character", "q": "How did Ruby's feelings change during the story?", "opts": ["From frustrated to proud", "From proud to sad", "From bored to angry", "They did not change"], "ans": 0, "why": "She moved from frustration to pride as she made progress."}, {"skill": "Vocabulary", "q": "What does “persistence” mean?", "opts": ["Giving up", "Sleeping", "Continuing to try when it is hard", "Being silly"], "ans": 2, "why": "Persistence is trying again and again."}], "title": "The Flip That Wouldn't Come", "cat": "gymnastics", "blurb": "Everyone on the team can do a back tuck except Ruby. Week after week, she tries and fails. What she learns about practice surprises even her coach.", "paras": ["Ruby Park loved everything about gymnastics except one thing. She could not do a back tuck.", "A back tuck is a backward flip. You jump up, pull your knees into your chest, spin all the way around in the air, and land on your feet. To Ruby, it looked like magic. Every girl on her team could do one. Even Ella, who was two years younger, could throw a perfect back tuck across the floor. Ruby had been trying for six months and had not managed a single one.", "“Just jump and go,” said her teammate, Priya. “It’s easy.”", "“It’s not easy,” said Ruby.", "“It is if you don’t think about it.”", "But Ruby couldn’t stop thinking about it. Every time she stood with her back to the mat, her brain went, What if I land on my head? Her legs went stiff, and she jumped, and she didn’t flip at all. She just sort of squatted backward, plopped onto her bottom, and looked silly.", "After practice one Tuesday, she sat on the bench, pulled off her wrist guards, and blinked back tears.", "Coach Andre sat beside her. He was a tall man with a gray beard and a booming laugh, and he had been coaching gymnasts for thirty years. “What’s wrong, Ruby?”", "“I’ll never learn it,” said Ruby. “I’m the only one who can’t.”", "“That’s not true,” said Coach Andre. “Everyone learns at a different speed. Do you know how long it took me to learn a back tuck?”", "“How long?”", "“One year,” he said. “One whole year. I fell, I chickened out, I cried, and I nearly quit. And then one Thursday, I did it. And I’ve never forgotten how it felt.”", "Ruby sniffled. “A year? But you’re a coach.”", "“Coaches used to be kids who couldn’t do stuff,” said Coach Andre. “The only difference between me and you is that I didn’t stop.”", "Ruby thought about that all the way home.", "The next day, Coach Andre pulled out a big notebook. “Let’s make a plan. A back tuck isn’t one skill. It’s lots of tiny skills stacked together, like blocks in a tower. If one block is wobbly, the tower falls. So let’s check each block, one at a time.”", "He wrote them down: a strong jump, a powerful arm swing, a tight body shape, a tucked position, and a safe landing. “We’ll practice each part separately. Then we’ll put them together.”", "For two weeks, Ruby practiced small drills. First she jumped straight up as high as she could, reaching for the ceiling. Next she swung her arms in a big circle, and jumped again. Then she lay on her back on the floor and practiced pulling her knees into a tight ball. Then she rolled backward on a wedge-shaped mat, going over slowly, then faster.", "It was not glamorous. It didn’t feel like flipping. It felt like doing the same boring things again and again. Sometimes she felt frustrated, and sometimes she wanted to skip practice. But every time she felt that way, she remembered Coach Andre’s year.", "Three weeks in, Coach Andre set up a stack of soft mats, about as high as her waist, and placed a spotter beside it. A spotter is a person who stands close by and helps a gymnast stay safe. “Jump from the top mat backward onto the thick mat behind it. Tuck your knees, and I’ll be right here.”", "Ruby climbed onto the stack. She looked over her shoulder. Her stomach dropped.", "“I can’t,” she said.", "“You can,” said the coach. “I promise I won’t let you fall on your head. Trust me.”", "She took a breath. She swung her arms. She jumped.", "For a moment, everything spun. The ceiling lights flashed. She felt Coach Andre’s hand on her back, guiding her over. Then she landed on the mat in a heap, on her back.", "“I did a flip!” she shouted.", "“A backward roll from a height,” said Coach Andre, grinning. “That is real progress. Do it again.”", "She did it again. And again. By the end of the day, she had done ten. Her landings improved. Her tuck got tighter. By the end of the week, she was landing on her feet.", "But she still couldn’t do it on the floor.", "The floor was different. On the floor, there was no stack of mats to give her extra time in the air. She had to jump higher and spin faster. Every time she tried, her old fear crept back, and her body froze.", "One day, she stood on the floor with her back to the mat, and she couldn’t move. The whole team watched. Ruby felt her cheeks burn. She stepped away and stormed to the bench.", "“I quit,” she said, and threw her wrist guards into her bag. “I’m done. I’m never going to get it.”", "Coach Andre didn’t argue. He just said, “Okay. Can I show you something first?”", "He brought out a tablet and played a video. It was an old clip from last year. There was a small, nervous-looking girl attempting a cartwheel. She kicked her leg up, wobbled, and collapsed. She tried again, and again, and again. A voice in the background said, “Good try, Ruby.”", "Ruby’s eyes widened. “That’s me.”", "“That’s you, ten months ago,” said Coach Andre. “Can you do a cartwheel now?”", "“Of course. I can do a hundred.”", "“Exactly. You couldn’t do a cartwheel then, and now you do them without thinking. Progress is sneaky. It hides. Day by day, you can’t see it, but over months it adds up.”", "Ruby stared at the screen. It was strange to see herself so small and so unsure. She had forgotten how hard a cartwheel had once felt.", "“Someday,” said Coach Andre, “you’ll watch a video of yourself today, and you’ll think, That girl had no idea how close she was.”", "Ruby took a deep breath. She picked up her wrist guards and put them back on.", "The next Thursday, the gym was quiet. Only a few gymnasts were left, stretching in the corner. Ruby stood on the floor with her back to the mat. Coach Andre stood nearby, ready to spot her.", "She thought of the mats. She thought of the little girl on the video. She thought of the year it took Coach Andre.", "“Ready?” he asked.", "“Ready.”", "Arms up. Arms down. Jump.", "Her body lifted. Her knees flew to her chest. The world flipped upside down, and for one glorious second she felt like she was floating. Then her feet hit the floor, and she stood there, wobbling, her arms out to the sides.", "She had landed on her feet.", "“I DID IT!” she screamed. “COACH! I DID IT!”", "The whole gym cheered. Even Ella clapped, and Priya ran across the floor to hug her. Coach Andre’s eyes were wet. He laughed his big booming laugh and lifted his fist in the air.", "“That’s persistence,” he said. “That’s what it looks like.”", "That night, Ruby wrote in her journal. She wrote, Today I learned that hard things are just easy things I haven’t practiced enough yet. Then she drew a small picture of a stick figure doing a flip, with a big smile on its face.", "She still wasn’t the best gymnast on the team. She never would be, and she was fine with that. But she had learned something more valuable than any skill. She had learned that if you keep trying, even when it feels impossible, you eventually surprise yourself."]}, {"vocab": [{"w": "rotate", "d": "to turn around a center point"}, {"w": "momentum", "d": "the amount of motion an object has, based on its weight and speed"}, {"w": "tuck", "d": "to pull your arms and legs in close to your body"}, {"w": "compact", "d": "packed tightly into a small space"}, {"w": "gravity", "d": "the force that pulls things toward the ground"}], "quiz": [{"skill": "Main idea", "q": "What does the story teach about flips?", "opts": ["Tucking your body makes you spin faster", "Flips need a trampoline", "Heavy people can not flip", "Gymnasts never fall"], "ans": 0, "why": "The story explains that pulling your body into a tuck speeds up spinning."}, {"skill": "Details", "q": "What did Nora and Theo use to test spinning?", "opts": ["A bicycle wheel and a spinning chair", "A pool", "A kite", "A drum"], "ans": 0, "why": "Theo used a swivel chair and weights to show how spinning changes."}, {"skill": "Inference", "q": "Why did Nora's arms out to the side slow her spin in the chair?", "opts": ["Her mass was farther from the center", "She was tired", "The chair was broken", "She was heavy"], "ans": 0, "why": "Mass far from the center slows spinning; pulling it in speeds it up."}, {"skill": "Cause and effect", "q": "What happens after Nora opens her body before landing?", "opts": ["She slows down and can land safely", "She speeds up", "She floats", "She stops in the air"], "ans": 0, "why": "Opening the body slows the spin so she can see the floor and land."}, {"skill": "Vocabulary", "q": "What does “rotate” mean?", "opts": ["To turn around", "To fall", "To jump", "To hide"], "ans": 0, "why": "Rotate means to spin around a center."}], "title": "The Science of a Flip", "cat": "gymnastics", "blurb": "Nora wants to spin faster in the air, and her big brother says physics can help. Discover why tucking makes a gymnast twirl like a tornado.", "paras": ["Nora Lindqvist could jump high, and she could run fast. But when she tried a back tuck, she never seemed to spin quite fast enough. Every time she leaped into the air, she got about three-quarters of the way around, and then thud. She landed on her seat.", "“It’s like there’s a magic trick I’m missing,” she told her big brother, Theo, one Saturday morning. She sat on the back porch with her chin in her hands.", "Theo was sixteen and loved physics. He was always building something out of parts he found in the garage, and he had a habit of explaining everything. He put down his sandwich and grinned. “It’s not magic. It’s science. And I can show you.”", "“Show me what?”", "“How a flip really works,” he said. “Come on. I’ll get the chair.”", "They marched into the garage, where Theo dragged out an old swivel office chair. It had wheels and a cushion that turned smoothly on its base. He also pulled two heavy books from a shelf. “Sit down.”", "Nora sat. Theo handed her a book in each hand. “Hold your arms straight out to the sides, like a plane. Now I’m going to give you a little spin.”", "He turned the chair. Nora began to rotate slowly, like a merry-go-round. The garage walls drifted by. “Now pull your arms in, close to your chest. Keep holding the books.”", "Nora tucked her arms in. Whoosh! The chair spun much faster. The garage became a blur, and she squealed. “Whoa! What just happened?”", "“Do it again,” said Theo. “Arms out.”", "She stretched her arms out. The chair slowed down, as if someone had pressed a brake.", "“Arms in.” Whoosh! Faster.", "“Arms out.” Slower.", "Nora laughed until she was dizzy. “It’s like the chair knows what my arms are doing!”", "“It’s not the chair,” said Theo. “It’s something called angular momentum. Momentum is the amount of motion an object has. Angular momentum is the amount of spinning motion. And here’s the big secret. Once you start spinning, your spinning stays the same, unless something pushes on you from outside. Physicists call that conservation.”", "“Conservation,” Nora repeated. “Like saving.”", "“Exactly. The amount of spin gets saved. But it depends on two things: how fast you’re spinning, and how far your mass is from the center. When you hold your arms out, your mass is far from the center, so you spin slowly. When you pull your arms in, your mass is close to the center. But the total spin has to stay the same, so you speed up.”", "Nora gaped at him. “So if I pull my legs in when I flip, I’ll go faster?”", "“Bingo,” said Theo. “That is the reason gymnasts, divers, and figure skaters do it. A tuck makes you compact, and compact makes you fast.”", "Nora stared at the books in her hands. It was as if a secret door had swung open. “That’s what the coach keeps telling me! Tighter, Nora. Pull your knees in tighter!”", "“Now you know why,” said Theo.", "They went back to the yard, where a big trampoline sat under an oak tree. Theo set up his phone to record video. “Let’s test it. Do three jumps, and each time, tuck a little tighter.”", "Nora climbed on. She bounced a few times to get her balance. Then, on the first jump, she leaped up and tucked her knees loosely, and she rotated about halfway. On the second, she pulled her knees closer to her chest and wrapped her arms around her shins. She spun more, almost three-quarters of a turn. On the third jump, she squeezed her body into the tightest ball she could, chin down and elbows in.", "She whirled around in the air. The sky, the tree, the grass, the sky again. She landed on her feet.", "“YES!” she shouted.", "Theo showed her the video, playing it in slow motion. She could see the difference. In the first jump, she looked like a floppy starfish. In the last one, she looked like a spinning wheel.", "“Let’s figure out why you need to jump high, too,” said Theo. “When you jump, gravity pulls you back down. That means you have a limited amount of time in the air. Do you know how long a great gymnast is in the air during a back tuck?”", "“A minute?”", "“Less than a second,” he said. “Roughly half a second. So in that tiny time, you have to spin all the way around. That is why the height of your jump and the tightness of your tuck both matter. More height means more time. Tighter tuck means faster spin.”", "“Height and tightness,” said Nora. She repeated it like a mantra.", "“One more thing,” said Theo. “Once you’ve spun all the way around, what do you need to do before you land?”", "“Open up?” guessed Nora.", "“Yes. If you stay in a tuck when you hit the ground, you will spin right past your feet. So at the right moment, you reach your arms and legs out. That slows your spin down, just like the chair. It gives you time to see the floor and land on your feet.”", "Nora tried it. She bounced up, tucked in tight, and spun fast. Then, at the top, she opened her body like a flower. She slowed down, and she saw the trampoline rushing up. She landed on both feet, arms stretched high.", "“That was perfect,” Theo said, “and it took physics to do it.”", "The following week, Nora brought her new knowledge to the gym. Her coach, Ms. Dubois, watched her practice a back tuck on the trampoline. “Your tuck is tighter,” she said. “What changed?”", "“I did some science,” said Nora proudly. She told her about the chair, the arms, and the conservation of spin.", "Ms. Dubois smiled. “That’s wonderful. A lot of the best gymnasts understand physics without realizing it. Their bodies just know. You get to learn it with your brain too.”", "Nora practiced her back tuck every day. She measured how many times she could spin. She tracked how tightly she folded her knees. She made a chart in a notebook, and slowly she saw the numbers rise. By the end of the month, she could throw a clean back tuck on the floor, no trampoline needed.", "At her next meet, Nora stood on the floor with her back to the mat. Her heart thumped in her chest. She thought of the swivel chair, and the heavy books, and the whoosh of speeding up.", "Arms swing. Jump high. Tuck tight.", "She spun in the air, quick and light, a small whirlwind. Then she opened up her body at exactly the right moment, and her feet touched the ground.", "The crowd applauded. She landed with a small bounce, arms high, grinning from ear to ear.", "Afterward, Theo found her in the crowd. “Nice one, shorty.”", "“Thanks for the physics lesson,” said Nora.", "“It’s not just for gymnastics,” said Theo. “You’ll see it everywhere. Ice skaters, divers, even planets and galaxies. The whole universe is one giant spinning trick.”", "Nora looked up at the sky. Somewhere, the Earth was turning beneath her feet, and the Moon was circling the Earth, and the Sun was carrying them all around the galaxy. It was the biggest flip of all.", "She smiled, and tucked her arms in tight. And, just for fun, she spun around and around until she felt dizzy, like a little planet all her own."]}, {"vocab": [{"w": "teammate", "d": "a member of the same team"}, {"w": "sprained", "d": "hurt a joint by twisting it too far"}, {"w": "encourage", "d": "to give someone courage or hope"}, {"w": "qualify", "d": "to earn the right to take part in something"}, {"w": "sportsmanship", "d": "fair and kind behavior when playing or competing"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Winning at all costs", "Team members supporting each other", "A dangerous sport", "A girl who moves away"], "ans": 1, "why": "The team learns that supporting each other matters more than trophies."}, {"skill": "Details", "q": "What injury did Jada have?", "opts": ["A sprained ankle", "A broken arm", "A cold", "A sore back"], "ans": 0, "why": "Jada sprained her ankle during practice."}, {"skill": "Inference", "q": "Why did Sam want to give Jada her spot at the meet?", "opts": ["Sam wanted to quit", "Sam knew Jada worked hard and wanted her to be included", "Sam was afraid", "Sam was tired"], "ans": 1, "why": "Sam wanted Jada to be part of the team, even without competing."}, {"skill": "Character", "q": "How does Coach Reyes act when the team is upset?", "opts": ["Calm and encouraging", "Angry", "Silly", "Distant"], "ans": 0, "why": "She listens and helps them think clearly."}, {"skill": "Vocabulary", "q": "What does “encourage” mean?", "opts": ["To give hope and confidence", "To argue", "To leave", "To ignore"], "ans": 0, "why": "The girls encourage each other by cheering."}], "title": "Team Sparks", "cat": "gymnastics", "blurb": "When their best gymnast is hurt right before the big meet, the Sparks must decide what a team really is. Sometimes cheering is the hardest routine of all.", "paras": ["The Sparks were the smallest gymnastics team in Spokane, and they liked it that way. There were only five of them: Jada, Sam, Pilar, Wren, and Tess. They had practiced together for three years, and they knew each other better than anyone. They knew who liked to sing during warm-ups, who was scared of the high bar, and who always forgot her wrist guards. They even had a secret handshake, which involved a spin, a snap, and a fist bump.", "The team was getting ready for the biggest event of the year: the State Team Championships in Tacoma. If the Sparks placed in the top three, they would qualify for the Regional Meet, something no team from their gym had ever done before. Every day after school, they practiced their routines until their hands were red and their legs shook.", "Jada was the star. She was the strongest on the beam and the fastest on the vault, and she had never once missed a landing in practice. But she never bragged about it. When someone else was struggling, she was the first to say, “You’ve got this.”", "Three weeks before the meet, disaster struck.", "It was a Tuesday afternoon. Jada was practicing her vault, a running leap over a padded table with a twist in the air. She took off, flew high, and twisted. But when she landed, her foot rolled to the side with a small, sickening pop.", "“Ow!” she cried. She dropped to the mat, gripping her ankle.", "Everyone froze. Coach Reyes came running, her whistle bouncing on her chest. She knelt beside Jada and gently touched her foot. “Don’t move. Tell me where it hurts.”", "“Here,” said Jada. Tears rolled down her cheeks. “It really, really hurts.”", "The coach carried Jada to the bench. Sam ran to get ice. Pilar held Jada’s hand, and Tess and Wren stood nervously in the background, twisting their fingers. Jada’s dad arrived, and drove her to the doctor.", "That evening, the phone rang at Sam’s house. It was Coach Reyes. Sam listened, and then sank slowly into a chair. “Oh no,” she whispered. “How long?”", "The next day at practice, Coach Reyes gathered the team in a circle. Her face was serious. “I have news about Jada. She has a sprained ankle. It’s a bad one. The doctor says she can’t compete for at least six weeks.”", "“But the meet is in three weeks,” said Wren.", "“I know,” said the coach.", "Nobody spoke. Tess started to cry. Pilar wiped her eyes. Sam stared at the floor. Without Jada, their team had only four gymnasts, and a team needed at least five to score properly. It felt like the whole season had just fallen apart.", "“What are we going to do?” asked Pilar.", "“There’s something I want you to think about,” said Coach Reyes. “I will not pretend this isn’t hard. It is. But let’s remember that a team is more than a scoreboard. Let’s talk about what we can control.”", "That afternoon, the girls went to visit Jada. She was sitting on her couch with her foot in a big black boot. A pile of pillows propped her leg up, and the TV was on, but she wasn’t watching it.", "“I’m so sorry,” she said as soon as they walked in. “I ruined everything.”", "“You didn’t ruin anything,” said Sam. “You got hurt. That isn’t your fault.”", "“But you can’t compete without me,” Jada said. Her voice cracked. “Five people. That’s the rule.”", "The girls looked at each other. Then Sam had an idea. “What if we found a fifth teammate?”", "“Who?” asked Wren.", "“There’s a new girl in the beginner group,” said Sam. “Her name is Luz. She’s only been at the gym for a year, but she’s really good at floor.”", "“She’s in the beginner group,” said Tess. “She’s never competed.”", "“Then we’ll teach her,” said Sam.", "The next day, the Sparks asked Luz if she would join their team. Her eyes went wide. “Me? Really?”", "“Really,” said Sam. “We need someone brave.”", "Luz’s face lit up. “I’d love to!”", "For the next three weeks, the Sparks trained harder than they ever had. Sam taught Luz the floor routine. Pilar helped her practice the beam. Wren spotted her on the bars, and Tess taught her the secret handshake. Luz was nervous at first, but the team was kind to her, and she quickly grew more confident.", "And Jada came to practice every single day, on crutches. She sat on the bench and cheered as loudly as she could. She told Luz, “Keep your chin up.” She told Pilar, “Point your toes.” She timed their routines, and she wrote down notes.", "“You’re like a second coach,” said Coach Reyes one afternoon.", "“It’s the only thing I can do,” said Jada, with a sad smile.", "“It’s the most important thing,” said the coach. “Encouragement makes a team better than anything else. Never doubt it.”", "At the meet in Tacoma, the arena was enormous. Twelve teams competed, and hundreds of people filled the seats. The girls wore matching red leotards with silver stars, and Jada wore a red jacket and sat in a chair right next to the floor, her crutches resting against the wall.", "The Sparks did well, but not perfectly. Pilar wobbled on the beam. Wren stepped out of bounds on the floor. But Luz, who had never competed before, nailed her routine, and the crowd cheered. Sam had her best vault ever. Tess stuck every landing.", "When the scores were posted at the end of the day, the Sparks were in fourth place. Only a few tenths of a point behind third.", "The girls stared at the board. Fourth. So close. Wren’s shoulders sagged. Tess sniffled. Nobody said anything.", "Then, from the sideline, they heard a voice. “Hey! Sparks!” It was Jada. She was standing, balancing on her crutches, with a huge grin. “That was awesome! I am so proud of you!”", "“But we didn’t make it,” said Pilar.", "“So what?” said Jada. “You were amazing! You did the hardest thing. You stuck together.”", "The girls looked at each other. Then, one by one, they started to smile. Jada was right. They hadn’t qualified for Regionals, but they had made a team out of a broken one. They had welcomed a new friend. They had cheered each other on. Nobody could say they hadn’t done their best.", "Just then, the girls from the third-place team walked past. Their captain stopped beside the Sparks. “Nice job,” she said. “Really. That was a great meet.”", "“Thanks,” said Sam. “You too.”", "Sportsmanship, thought Coach Reyes. It was the best routine of all.", "That night, the Sparks celebrated at a pizza restaurant. They laughed and ate and told stories about the day. Jada wore a paper crown that Wren had made. Luz taught them a new clapping game. They did the secret handshake so many times that the waiter asked what it meant.", "“It means we’re a team,” said Sam.", "“No matter what,” added Jada.", "The next year, the Sparks came back stronger than ever. Jada healed, Luz kept improving, and this time, they placed second. They qualified for Regionals, and hugged each other on the podium. But if you asked any of them, they would tell you the most important day wasn’t the one with the medals.", "It was the day they lost, and found out that they were winners after all."]}, {"vocab": [{"w": "pointe", "d": "dancing on the tips of the toes in special stiff shoes"}, {"w": "graceful", "d": "moving in a smooth, beautiful way"}, {"w": "strengthen", "d": "to make stronger"}, {"w": "balance", "d": "to stay steady without falling"}, {"w": "patience", "d": "staying calm while waiting or working on something slowly"}], "quiz": [{"skill": "Main idea", "q": "What lesson does Lena learn?", "opts": ["Magic is only for adults", "Real skill comes from patient practice, not shortcuts", "Shoes do all the work", "Dancing is easy"], "ans": 1, "why": "The shoes teach her that grace comes from slow, careful practice."}, {"skill": "Details", "q": "Where does Lena find the shoes dancing?", "opts": ["In the dance studio after closing", "In her bedroom", "In the park", "At school"], "ans": 0, "why": "She sneaks back to the studio and finds the shoes dancing in the moonlight."}, {"skill": "Inference", "q": "Why do the shoes want to help Lena?", "opts": ["They are bored", "They remember every dancer who wore them and want her to succeed", "They were told to", "They are mean"], "ans": 1, "why": "The shoes have memories of dancers and want Lena to grow."}, {"skill": "Cause and effect", "q": "What happens when Lena tries to rush her practice?", "opts": ["Her foot hurts and her balance gets worse", "She becomes a star instantly", "Nothing", "She wins"], "ans": 0, "why": "Rushing leads to sore feet and mistakes, so she slows down."}, {"skill": "Vocabulary", "q": "What does “patience” mean?", "opts": ["Being able to wait calmly", "Running fast", "Being loud", "Being tired"], "ans": 0, "why": "Patience is staying calm while you practice."}], "title": "The Pointe Shoes That Danced Alone", "cat": "ballet", "blurb": "Every night after the studio closes, a pair of pointe shoes starts to dance by themselves. Lena discovers their secret, and it changes how she practices.", "paras": ["Madame Orlova’s ballet studio smelled like floor polish and old wood. It had tall windows that faced the street, a long mirror along one wall, and a wooden barre where the dancers held on while they stretched. The floor was scratched and worn, and if you looked closely, you could see the faint shapes of a thousand tiny footprints.", "At the very back of the studio, on a high shelf, sat a pair of old pointe shoes.", "They were pale pink and a little scuffed, and their ribbons were frayed at the ends. Nobody remembered who had worn them last. Madame Orlova said they had been there when she first bought the studio, and she never wanted to throw them away. “They are part of the building,” she said. “Like the mirror and the piano.”", "Lena Vasquez was nine years old, and she was desperate to go on pointe. Pointe is a special kind of ballet in which a dancer rises up and balances on the tips of her toes. The shoes have a hard, boxy toe and strong ribbons that wrap around the ankle. It takes years of training to be ready, and Madame Orlova had said Lena’s feet were not strong enough yet.", "“Not yet,” said the teacher every time Lena asked. “Patience, dear. Patience.”", "But Lena was tired of waiting. Her friend Sofia had already gotten her first pair. Her cousin Camila danced en pointe in a big theater show. Everyone else seemed to be moving on. Lena felt like she was stuck at the bottom of a staircase, looking up.", "On Friday afternoon, after class ended, Lena stayed behind to tie her ballet slippers. She realized that she had left her water bottle in the studio. When she went back for it, Madame Orlova was locking the door.", "“Oh, it’s all right,” said Lena. “I’ll get it tomorrow.”", "But she had a strange feeling as she walked home. She couldn’t stop thinking about the shoes on the high shelf. That night, she couldn’t fall asleep. She rolled over and looked out at the moon. It was big and round, glowing like a lantern. Something tugged at her. It was as if the shoes were calling her.", "Lena slipped on her jacket and tiptoed downstairs. Her family lived in the apartment above the bakery on the corner, just across from the studio. She had a spare key that Madame Orlova had given her for emergencies. She crossed the quiet street, unlocked the door, and stepped inside.", "The studio was silent. Moonlight poured through the tall windows and lay on the floor in long silver rectangles. The barre cast shadows like bars of a cage. And there, in the middle of the room, something was moving.", "Lena gasped and covered her mouth.", "Two pale pink shoes were dancing. They rose onto their tips, all by themselves, without a single foot inside them. They glided across the floor in a graceful arc, ribbons swirling behind them. They spun once, twice, three times, and landed lightly on the wood. Then they rose again, balanced on their toes, and stayed perfectly still.", "Lena stared. She couldn’t breathe. She was sure she was dreaming.", "The shoes turned. They seemed to notice her. For a moment, they hovered in the moonlight, and then they made a small, polite bow.", "“Hello,” whispered Lena. It sounded silly, but she didn’t know what else to say.", "The shoes tapped twice on the floor, as if to say, Hello.", "Lena stepped closer. “Are you alive?”", "Tap. Tap.", "“Can you teach me?”", "The shoes hopped in a circle, as though they were laughing. Then they glided over to her and settled at her feet.", "Lena knelt. “But I’m not allowed to wear pointe shoes. Madame Orlova says I’m not ready.”", "The shoes tapped once. That meant no. Then they tapped twice more and slid to the barre. They stood upright, and they began to demonstrate. They showed her how to stand tall, how to point her toes, and how to lift her heels a tiny bit at a time. They did a slow, careful movement called a relevé, rising onto the balls of the feet and lowering back down.", "“Oh,” said Lena. “You’re showing me the basics.”", "Tap. Tap.", "She took off her slippers and stood beside the shoes, holding the barre. She rose onto the balls of her feet, and lowered. Rise, lower. Rise, lower. The shoes watched closely and tapped whenever she made a mistake. She wobbled, and they tapped. She locked her knees, and they tapped. Slowly, she began to understand.", "“Slow down,” she whispered to herself. “Use the whole foot.”", "They practiced for an hour. Lena’s calves burned. Her toes ached. But she was learning something she had never learned in class, because there had never been time. She was learning to feel her foot the way a musician feels a violin.", "When the moon slipped behind a cloud, the shoes gave a final bow and floated back to the high shelf. They tucked themselves neatly into place and lay still, as if nothing had ever happened.", "Lena tiptoed home. She was so tired that she fell asleep before her head hit the pillow.", "The next night, she went back. And the next. Every night, the shoes were waiting for her in the moonlight. They taught her how to strengthen her ankles with small rises. They taught her how to balance on one leg without tipping. They taught her how to listen to the music before moving.", "One night, Lena was so eager that she tried to rush. She started to rise onto her toes faster and faster, hoping to get better more quickly. Her foot twisted, and she winced.", "The shoes tapped angrily, three times, and shook their ribbons. They hopped in front of her, and stopped her.", "“I just want to be good,” said Lena. Her eyes filled with tears. “I want to go on pointe like everyone else. I’m tired of waiting.”", "The shoes were quiet. Then, slowly, they lowered themselves to the floor and sat beside her, and one of the ribbons draped across her knee. It was a gentle, comforting touch.", "“Oh,” said Lena. “You’re telling me it’s okay.”", "Tap.", "“That you waited a long time too.”", "Tap.", "Lena looked at the shoes. In the moonlight she noticed small stitches, and patches, and signs of repair. These shoes had been worn by many dancers, over many years. They had been mended and mended again. They had seen a hundred girls just like Lena, girls who wanted to hurry, and they knew something those girls had to learn.", "“Real skill takes time,” said Lena slowly. “It grows like a plant. You can’t force it.”", "The shoes gave a little bounce, almost like a nod.", "In the following months, Lena practiced her rises and her balances every day, slowly, carefully. In class, Madame Orlova noticed. “Your ankles are stronger,” she said. “Your posture is beautiful. What have you been doing?”", "“Practicing,” said Lena, and she smiled.", "On her tenth birthday, Madame Orlova called her into the office. She held a box tied with a pink ribbon. “I believe you are ready.”", "Lena opened the box, and gasped. Inside was a pair of brand-new pointe shoes, gleaming like satin. “Really?”", "“Really,” said Madame Orlova. “You have earned them.”", "Lena hugged her teacher. When she looked up, she noticed the old pair on the high shelf, and she could have sworn that one of the ribbons wiggled.", "That night, she went to the studio one last time. Moonlight filled the room. She wore her new shoes and rose onto the tips of her toes. She felt light, steady, and strong. Behind her, the old pair rose into the air and danced beside her, ribbons swirling.", "They danced together for a long, quiet hour, one girl and two shoes, and neither of them made a sound."]}, {"vocab": [{"w": "nervous", "d": "worried or a little scared about something"}, {"w": "costume", "d": "special clothes worn for a performance"}, {"w": "backstage", "d": "the area behind or beside a stage where performers get ready"}, {"w": "spotlight", "d": "a bright beam of light that shines on a performer"}, {"w": "applause", "d": "the sound of people clapping to show they enjoyed something"}], "quiz": [{"skill": "Main idea", "q": "What is the main idea of this story?", "opts": ["Being nervous is normal, and you can still do a great job", "Costumes are important", "Ballet is easy", "The stage is huge"], "ans": 0, "why": "Lena feels scared but performs anyway with help from a friend."}, {"skill": "Details", "q": "What does the stagehand teach Lena to do when she is nervous?", "opts": ["Run away", "Breathe slowly and count", "Sing loudly", "Close her eyes for ten minutes"], "ans": 1, "why": "He teaches her a breathing trick where she counts to four."}, {"skill": "Inference", "q": "Why did Mr. Otis tell Lena about his own first time on stage?", "opts": ["To show that even grown-ups feel nervous", "To scare her", "To brag", "To make her laugh at him"], "ans": 0, "why": "Sharing his story helps Lena see that being nervous is normal."}, {"skill": "Sequence", "q": "What happened right before Lena walked onto the stage?", "opts": ["She took a deep breath and counted", "She lost her shoe", "She called her mom", "She ate lunch"], "ans": 0, "why": "She breathed and counted to four, then stepped out."}, {"skill": "Vocabulary", "q": "What does “applause” mean?", "opts": ["Clapping to show you enjoyed something", "A costume", "A kind of shoe", "A song"], "ans": 0, "why": "The audience gave applause at the end."}], "title": "Lena and the Nutcracker Night", "cat": "ballet", "blurb": "Ten minutes before the curtain rises, Lena's stage fright is huge. A stagehand, a spare ribbon, and a surprising secret help her find the courage to dance.", "paras": ["Backstage at the Emerald City Theater, it was chaos. Dancers in glittering costumes ran up and down the hallway. Someone was shouting for a missing shoe. A girl dressed as a snowflake sat on the floor, sewing a loose button back onto her tutu. The air smelled like hairspray, sweat, and fresh flowers, and somewhere beyond the walls, an orchestra was warming up.", "In the middle of it all, Lena Vasquez sat in a folding chair and felt like she might throw up.", "It was the opening night of The Nutcracker, the famous holiday ballet. Lena, who was ten, had been chosen to play Clara, a girl who receives a magical toy nutcracker on Christmas Eve and follows him into a land of dancing snowflakes and sweets. It was the biggest role she had ever had. She had rehearsed it for four months. Her family, her friends, and her teachers were all in the audience.", "And now, in ten minutes, she was supposed to walk onto a stage in front of a thousand people.", "Lena stared at her hands. They were shaking. Her costume was a beautiful light-blue dress with a white satin ribbon at the waist, and she wore her hair in a tight bun with a sparkling clip. She looked exactly like a storybook girl. But she didn’t feel like one.", "“What if I forget the steps?” she whispered to herself. “What if I trip? What if everyone laughs?”", "She glanced at the clock on the wall. Nine minutes.", "A man in a black T-shirt and headphones walked by, carrying a coil of rope. He stopped when he saw her face. “Hey there, Clara,” he said kindly. “You look a bit green.”", "“I’m fine,” said Lena, but her voice wobbled.", "The man set down his rope and sat on a nearby crate. He had gray hair and a thick beard, and the name tag on his shirt said OTIS, STAGE MANAGER. “Can I tell you a secret?”", "Lena nodded.", "“Thirty years ago, I was a dancer here,” said Mr. Otis. “My very first performance, I was eleven years old. I played a mouse. Only a tiny mouse, with a tail made of yarn. And do you know what I did?”", "“What?”", "“I threw up in a bucket, right before I walked on stage.”", "Lena’s mouth fell open. “You did not.”", "“I sure did,” said Mr. Otis, laughing. “And then I went out and danced. I was so nervous that my knees knocked together. But do you know what happened?”", "“What?”", "“Nothing terrible. The audience didn’t notice. They saw a small mouse who danced with all his heart.” He leaned forward. “Being nervous doesn’t mean you’re not ready. It means you care. Everyone who performs feels butterflies. Even the star. Even me, and I don’t perform anymore.”", "Lena bit her lip. “But how do I make them go away?”", "“You don’t,” said Mr. Otis. “You make them fly in formation.”", "“What does that mean?”", "“Butterflies can’t be stopped. But you can teach them to work with you. Let me show you a trick.” He held up his hand with four fingers spread. “This is called box breathing. You breathe in slowly for four counts. Hold it for four. Breathe out for four. Then hold again for four. Try it.”", "Lena tried. She breathed in, one, two, three, four. She held her breath, one, two, three, four. She breathed out. She held. She repeated it three times. To her surprise, her hands stopped shaking, and her heartbeat slowed.", "“That’s actually working,” she said.", "“It works for astronauts and pilots too,” said Mr. Otis. “When your body settles, your mind follows.”", "Just then, a girl in a white dress hurried by. It was Sofia, who played the Sugar Plum Fairy. “Lena! Your ribbon!” she gasped. “It’s coming loose!”", "Lena looked down. The satin ribbon at her waist had come untied and was dangling by a thread. “Oh no,” she said, panicking. “What do I do?”", "“Don’t worry,” said Mr. Otis, calmly. He reached into his pocket and pulled out a tiny sewing kit. “I keep this for emergencies. Stand up.”", "He knelt, threaded a needle in half a second, and stitched the ribbon back in place. It took less than a minute. “Good as new,” he said, biting off the thread. “In this business, there is always a problem. The trick is to fix it and keep going.”", "“Thank you,” said Lena. She felt a lot better.", "A loudspeaker crackled. “Five minutes to curtain. Places, please.”", "The hallway grew quiet. The dancers lined up along the wall. Lena could hear the audience murmuring through the curtain, like the sound of a distant ocean. Her stomach did a small flip.", "“Are you ready?” asked Mr. Otis.", "Lena took a deep breath. In for four, hold for four, out for four. “I think so.”", "“Then here is one more piece of advice,” he said. “When you go out there, don’t think about the audience. Think about Clara. Think about the story. You aren’t Lena on a stage. You are Clara, meeting a magical world for the first time. Be curious. Be surprised. If you tell the story, the steps will take care of themselves.”", "Lena closed her eyes and imagined the Christmas tree growing tall, the nutcracker coming to life, the snowflakes swirling. When she opened her eyes, she felt different. She felt like Clara.", "The music swelled. The curtain was still closed, but the stage manager’s voice rang out over the headset. “Stand by. Lights. Curtain up.”", "The heavy red curtain rose, inch by inch. A golden glow spilled onto the stage. Lena stood in the wings, her heart pounding, one foot in the shadows and one in the light.", "“Go get ’em, Clara,” whispered Mr. Otis.", "Lena stepped forward.", "The spotlight found her at once. It was warm and bright, like the sun. She blinked against the glare and, beyond it, saw a dark sea of faces. But she didn’t think about them. She thought of a little girl who has just been given a wonderful gift.", "She held up a small toy nutcracker, and gasped with delight. She turned, and twirled, and skipped across the stage. The music lifted her along like a leaf on the wind. Her steps were light and sure. Her arms flowed like water. Once she wobbled, just a little, in a turn, and she didn’t panic. She corrected and kept smiling.", "The performance flew by. She danced with the Nutcracker Prince. She met the snowflakes, whirling in a blizzard of white. She watched Sofia float across the stage as the Sugar Plum Fairy, and she clapped along with the rest of the cast. Every step felt easier than the one before.", "When the final scene ended, the music faded and the stage went dark. For a moment there was total silence. Then the whole theater exploded with applause. People stood. They cheered and whistled. Lena felt tears prickle her eyes. It was the most beautiful sound she had ever heard.", "The cast lined up for the final bow. Lena took Sofia’s hand and stepped forward, and the applause grew even louder. She looked out at the dark seats and thought, I did it.", "Somewhere in the crowd, she heard her little brother shout, “That’s my sister!”", "Backstage, the dancers hugged and laughed. Mr. Otis stood by the wall with his arms folded, and a big smile hidden in his beard.", "“Well?” he said when Lena ran up to him.", "“I was so scared,” she said. “But I did it. And it was the best feeling in the world.”", "“That’s the secret of the stage,” said Mr. Otis. “The fear and the joy live in the same place. You can’t have one without the other.”", "Lena hugged him. “Thank you for the mouse story.”", "“Anytime,” he said. “Just don’t tell anyone about the bucket.”", "Lena grinned and zipped her lips. It was the best secret she had ever been given. She carried it with her long after the costumes were packed and the theater lights were out. Whenever she felt nervous, before a test or a new class or a big recital, she took a slow breath, counted to four, and remembered the mouse who danced anyway."]}, {"vocab": [{"w": "astronaut", "d": "a person trained to travel and work in space"}, {"w": "doctor", "d": "a person trained to help sick or hurt people get well"}, {"w": "discourage", "d": "to make someone feel less hopeful or confident"}, {"w": "shuttle", "d": "a spacecraft that carries astronauts to space and back"}, {"w": "inspire", "d": "to make someone want to do something good or brave"}], "quiz": [{"skill": "Main idea", "q": "What is the main idea of this biography?", "opts": ["You should choose only one dream", "Mae Jemison followed several passions and succeeded in each", "Dancing is easier than science", "Space travel is simple"], "ans": 1, "why": "Mae combined dance, science, medicine and space travel."}, {"skill": "Details", "q": "What did Mae take into space to honor dance?", "opts": ["A poster of a dance company", "A trophy", "A camera", "A bicycle"], "ans": 0, "why": "She carried a poster from the Alvin Ailey American Dance Theater."}, {"skill": "Inference", "q": "Why did the teacher say, “Maybe you should be a nurse”?", "opts": ["She wanted Mae to be a doctor", "She did not expect a girl like Mae to become a scientist", "She loved nurses", "Mae asked for it"], "ans": 1, "why": "The teacher's comment showed low expectations, but Mae did not let it stop her."}, {"skill": "Sequence", "q": "Which happened first?", "opts": ["Mae flew on the Space Shuttle", "Mae studied at Stanford", "Mae worked in Africa as a doctor", "Mae joined NASA"], "ans": 1, "why": "She went to Stanford long before she worked as a doctor or joined NASA."}, {"skill": "Vocabulary", "q": "What does “inspire” mean?", "opts": ["To make someone want to do something great", "To fall asleep", "To be angry", "To pack a bag"], "ans": 0, "why": "Mae's story is meant to inspire kids."}], "title": "From the Dance Floor to the Stars", "cat": "ballet", "blurb": "Mae Jemison loved to dance and she loved the stars. People told her to pick one. She chose both, and became the first Black woman to travel into space.", "paras": ["When Mae Jemison was a little girl in Chicago, she looked up at the night sky and asked a question that seemed simple. “Are there people up there?”", "Nobody could tell her for sure. Mae was born in 1956 in Alabama, and her family moved to Chicago when she was three years old. Her father worked as a roofer and a carpenter. Her mother taught elementary school. They believed in books, questions, and curiosity, and they made sure that Mae and her brother and sister were always learning something new.", "Mae loved to look at the stars. She checked out books about astronomy from the library and read them until the covers were soft. She dreamed of traveling to space someday. She wasn’t sure how, since in those days, almost all astronauts were white men. But she was sure that someone should go. And she thought that someone might as well be her.", "Mae also loved to dance.", "She danced every chance she got. She danced in her living room, she danced at school, and she danced in the hallway on the way to the bathroom. When she was old enough, she took lessons in ballet, jazz, and African dance, and she performed in shows. When she stepped on stage, she felt as if she were flying.", "At school, she loved science and art with the same fierce love. She built models, dissected frogs, and choreographed dances in the same week. She wasn’t the kind of person who thought of these things as separate. To Mae, dance and science both asked the same questions. How do things move? How do they work? How can we make something beautiful?", "But some people didn’t see it that way.", "One day, when Mae was in kindergarten, her teacher asked the class, “What do you want to be when you grow up?”", "Mae raised her hand. “I want to be a scientist,” she said proudly.", "Her teacher smiled, but it wasn’t a kind smile. “Don’t you mean a nurse?” she asked.", "Mae frowned. She didn’t understand. Nurses were wonderful, and she respected them, but she didn’t want to be one. “No,” she said. “A scientist.”", "The teacher looked surprised. In those days, many people believed girls, and especially Black girls, weren’t supposed to become scientists. They didn’t say it out loud. They just gave small nudges that pushed you toward a different path. Mae noticed the nudges. But she didn’t let them stop her. She decided that people who tried to discourage her simply weren’t seeing what she could do.", "Mae worked harder than ever. She was so good at school that she graduated from high school at sixteen and went to Stanford University in California. She studied chemical engineering and African-American studies, and she kept dancing. She took classes, she performed in shows, and she even choreographed a dance production. Some people told her she should give up dance and focus on science. “You can’t do both,” they said.", "Mae just kept doing both.", "After Stanford, she went to medical school at Cornell University in New York. She became a doctor. But that was not the end of her journey. After she finished her training, she joined the Peace Corps, a group that sends volunteers to help people around the world. Mae went to West Africa, to the countries of Sierra Leone and Liberia. She worked as a medical officer, caring for patients, running a clinic, and doing research on illnesses. It was hard, meaningful work, and she loved it.", "But the stars had not forgotten her.", "In 1983, Mae watched Sally Ride, the first American woman in space, lift off on the Space Shuttle. She read the news, and she thought, Maybe it’s my turn.", "She had also been inspired by a character on television. Nichelle Nichols played Lieutenant Uhura on Star Trek, a Black woman who worked as a communications officer on a spaceship. Mae had watched her as a child and thought, Yes. Of course. People like me belong in the future.", "So Mae applied to NASA’s astronaut program. She was rejected the first time, because the program paused after a terrible accident with the Space Shuttle Challenger. But she did not give up. She applied again. In 1987, out of thousands of applicants, NASA chose fifteen new astronauts. Mae Jemison was one of them.", "Training was tough. She learned how to fly in jets, how to survive in the ocean, and how to float in a giant pool while wearing a heavy spacesuit. She studied how the Space Shuttle worked from the inside out, and she practiced every emergency that might occur. She loved it all. Every moment was another step toward the stars.", "Finally, the day arrived. On September 12, 1992, Mae Jemison strapped herself into the Space Shuttle Endeavour at the Kennedy Space Center in Florida. She was thirty-six years old. The engines roared, the ground shook, and the shuttle rose into the sky, faster and faster, until it was hurtling around the Earth at more than seventeen thousand miles an hour.", "She became the first Black woman to travel into space.", "She stayed there for about eight days, orbiting the Earth more than a hundred times. She worked as a science mission specialist. She helped run experiments with frogs and with tiny fish, and she studied how weightlessness affects the human body. She also studied how to help people avoid feeling sick in space.", "But she also carried something special. In her small bag of personal items, Mae brought a poster from the Alvin Ailey American Dance Theater, one of the most famous dance companies in the world. She wanted to honor her love of dance. She also brought a small statue from West Africa, and a flag from a school in Chicago. These reminded her that she wasn’t traveling alone. She carried all of her dreams, and the people who had helped her believe in them.", "When Mae looked out the window of the shuttle, she saw the whole Earth spread out below her. The oceans glowed blue. Storms swirled white over the land. She looked at it and thought, This is home for everyone. It is so small, and so beautiful. She said later that she felt like she belonged out there, as much as anyone.", "At one point, her colleagues on the crew noticed something funny. Mae, floating in the middle of the shuttle, seemed to be dancing. She spun slowly in the air, arms outstretched, like a ballerina in a dream. Without gravity, she could twirl forever. Her years of dance training had taught her to feel her body in space, and it helped her move gracefully in the weightless cabin.", "“I think I was a dancer first,” she said later, laughing. “And an astronaut second.”", "When Mae returned to Earth, she was famous. People wanted to hear her story. Schools invited her to speak. Children wrote her letters. She tried to answer as many as she could. She told them what she truly believed: that no one should let others decide what they can be.", "After leaving NASA, Mae kept exploring. She started a science camp for kids called The Earth We Share, where students solve real-world problems by working together. She led projects to bring technology and health care to people in need. She even guest-starred on an episode of Star Trek, playing a small role, just as she had once dreamed. Nichelle Nichols, the woman who had inspired her, was delighted.", "She never stopped dancing, either. She kept taking classes and performing. For Mae, dance and science were two parts of the same thing: a love of movement, of discovery, and of possibility.", "Today, when kids ask Mae Jemison for advice, she gives them a simple answer. She tells them to follow their curiosity, to never let anyone say what they can’t do, and to remember that they don’t have to choose just one dream.", "“Don’t let anyone rob you of your imagination, your creativity, or your curiosity,” she has said. “It’s your place in the world; it’s your life. Go on and do all you can with it, and make it the life you want to live.”", "Somewhere tonight, a little girl is looking up at the stars, wondering if she could ever go there. Maybe she likes to dance. Maybe she loves science. Maybe she loves both, and someone told her that she has to pick one.", "She doesn’t.", "Mae Jemison proved it. Reach for the stars, and take your dancing shoes."]}, {"vocab": [{"w": "detective", "d": "a person who solves mysteries by finding clues"}, {"w": "clue", "d": "a piece of information that helps solve a mystery"}, {"w": "suspect", "d": "a person who might have done something wrong"}, {"w": "alibi", "d": "proof that someone was somewhere else at the time"}, {"w": "deduce", "d": "to figure something out by thinking carefully about facts"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Juniper uses clues to solve a mystery", "A ballet lesson", "Juniper's birthday", "A trip to Paris"], "ans": 0, "why": "Juniper gathers clues and deduces where the tutu went."}, {"skill": "Details", "q": "What clue did Juniper find on the floor?", "opts": ["Glitter and a tiny feather", "A key", "A red shoe", "A note"], "ans": 0, "why": "The glitter and feather led her to the real answer."}, {"skill": "Inference", "q": "Why did Juniper decide that Marcus was not the thief?", "opts": ["He had an alibi because he was fixing lights at that time", "He was in the audience", "He was sleeping", "He was on the phone"], "ans": 0, "why": "Several people saw Marcus on the ladder during the time the tutu vanished."}, {"skill": "Cause and effect", "q": "Why was the tutu in Buttons's basket?", "opts": ["A pet cat carried it there because it liked the feathers", "Someone stole it", "It fell", "It was a gift"], "ans": 0, "why": "The backstage cat had been sleeping on the soft tutu."}, {"skill": "Vocabulary", "q": "What is a clue?", "opts": ["A piece of evidence that helps solve a mystery", "A costume", "A dance", "A song"], "ans": 0, "why": "Clues are hints that lead to an answer."}], "title": "The Case of the Missing Tutu", "cat": "ballet", "blurb": "The star dancer's sparkling tutu has vanished an hour before the show. Young detective Juniper has sixty minutes to find it before the curtain rises.", "paras": ["At exactly six o’clock, Juniper Mbeki was sitting cross-legged on a costume trunk backstage, eating a peanut butter sandwich, when she heard the scream.", "“My tutu! It’s gone!”", "Juniper dropped her sandwich. She was eleven years old, and she was the assistant to the wardrobe manager at the Rainier Ballet Theater. That meant she sewed buttons, sorted ribbons, and made sure no dancer ever walked on stage with a loose thread. But her real passion was mysteries. She read detective novels under the covers at night, and she kept a small notebook in her back pocket for jotting down clues.", "She hurried down the hallway toward the dressing room, where a crowd was gathering.", "In the middle stood Odette Laurent, the lead dancer. She wore a robe over her leotard, and her hair was pinned back in a neat bun. Her face was pale. “It was hanging right here on this rack,” she said, pointing. “My white tutu, the one with the crystals. I only left for five minutes to warm up. When I came back, it was gone.”", "“Which tutu?” asked someone.", "“The Swan Queen tutu!” Odette wailed. “I wear it in the last act. It has three hundred handmade crystals. Madame Arnaud spent a month sewing it.”", "Madame Arnaud, the wardrobe manager, wrung her hands. “The show begins at seven. We have exactly one hour.”", "Juniper stepped forward and took a deep breath. “I’ll find it.”", "Everyone turned to look at her. Someone snickered. “You? You’re a kid.”", "“I’m a detective,” said Juniper, and she flipped open her notebook. “Nobody leave the area, please. I need to ask some questions.”", "The first thing she did was study the rack. The tutu had hung on a metal hook. The hook was bare. Below it, the floor was covered with dust and sequins. She got down on her hands and knees and looked closely. A pinch of silver glitter sparkled near the wall. Beside it lay a single tiny feather, soft and white.", "“Interesting,” she said. She picked up the glitter with tweezers and slipped it into an envelope. She placed the feather in another. Clue number one.", "Next, she interviewed the suspects.", "The first was Marcus, the lighting technician. He was a lanky young man with headphones around his neck. “I was on the ladder all evening,” he said. “Fixing spotlight number four. You can ask anyone. Ask Priya.”", "Priya, a stagehand, confirmed it. “Marcus was on that ladder for forty-five minutes. He never came down. I was standing right beneath him, holding it steady.”", "Juniper wrote it down. Marcus had an alibi. That meant he could not have taken the tutu, because he was somewhere else at the time.", "The second suspect was Bianca, a dancer who played the Black Swan. She was known to be jealous of Odette. “I was practicing in the hallway,” said Bianca crossly. “Ask anybody. I didn’t touch it.”", "Juniper eyed her closely. There was no glitter on her hands. Her costume was a black leotard. She had no feathers, either. But something was off. She decided to keep Bianca on the list for now.", "The third suspect was Mr. Delacroix, the director. He stood at the back with his arms folded. “I was in my office,” he said, “reviewing the program. Nobody saw me. But why would I steal a tutu for my own show?”", "Juniper tapped her pencil against her lip. “Good point,” she said.", "She circled back to the scene. Something didn’t add up. If someone had taken the tutu, they would have had to carry it out. But the tutu was big, and fluffy, and covered with crystals. It would leave a trail.", "She checked the floor again. Sure enough, she found a few more crystals in the hallway, small and sparkling, leading around the corner. She followed them, one by one, like bread crumbs. They led past the water cooler, past the props room, and toward a small storage closet at the end of the hall.", "The door was slightly open.", "Juniper peeked in. The closet was full of brooms, mops, and old boxes. In the corner sat a wicker basket, and inside it, curled up, was a large orange cat. It was fast asleep. Beneath the cat was something white and shimmering.", "“Aha,” whispered Juniper.", "She crept closer. The cat opened one eye. It gave a huge yawn and stretched. And there, beneath it, was a soft, fluffy, glittering tutu, with hundreds of tiny crystals sparkling in the light. A few white feathers stuck out from the trim. On the cat’s whiskers was a smear of silver glitter.", "“Buttons!” cried a voice. Madame Arnaud had followed Juniper down the hall. “That cat lives in the theater. He wanders everywhere. He must have dragged the tutu here.”", "“That’s what I deduced,” said Juniper. “The glitter on the floor, the feather, and the trail of crystals. They all pointed the same way. But I wasn’t sure until I found him. Buttons must have decided the tutu was the coziest bed in the theater.”", "Buttons purred loudly, as if he knew he was being discussed. He seemed very pleased with himself.", "“Is it damaged?” asked Odette, rushing up.", "Juniper lifted the tutu carefully and inspected it. A few cat hairs clung to the tulle, and one tiny crystal had come loose. But otherwise, it was perfect. “We have forty minutes,” she said. “Madame Arnaud, do you have a lint roller?”", "“I have three,” said the wardrobe manager, grinning.", "Everyone jumped into action. Priya fetched the lint roller. Odette held the tutu while Madame Arnaud brushed away the hair. Juniper sewed the loose crystal back on with tiny, careful stitches. In fifteen minutes, the tutu looked as good as new.", "“Thank you,” said Odette, hugging Juniper. “You saved the show.”", "“It was an easy case,” said Juniper modestly. “Once I followed the evidence, it all made sense. Every good mystery is solved with patience, observation, and a little bit of luck.”", "The rest of the cast crowded around, clapping. Even Bianca, who had been a suspect, offered a sheepish smile. “I’m sorry I was grumpy earlier,” she said.", "“Apology accepted,” said Juniper. “You had a reason to be upset, but you didn’t do anything wrong.”", "At seven o’clock sharp, the curtain rose. The music began, and Odette floated across the stage as the Swan Queen, wearing a glittering white tutu that shimmered in the lights. The audience gasped at its beauty. Nobody knew it had been sleeping under a cat an hour earlier.", "Juniper watched from the wings. Her sandwich, forgotten on the trunk, had been nibbled by a very smug orange cat. She didn’t mind. She sat on a crate and opened her notebook. She wrote a note.", "Case closed. Culprit: Buttons, age unknown. Motive: comfort. Solution: lint roller.", "Then, underneath, in her best handwriting, she added one more line.", "Always follow the clues.", "From that day on, the dancers at the Rainier Ballet Theater called her the theater detective. And whenever anything went missing, a shoe, a ribbon, a hairpin, someone would whisper, “Call Juniper.” Buttons, meanwhile, was given his own soft cushion in the wardrobe room. He never went near a tutu again.", "Well, almost never."]}, {"vocab": [{"w": "goddess", "d": "a female god in old stories"}, {"w": "archer", "d": "a person who shoots arrows with a bow"}, {"w": "elixir", "d": "a magical liquid that gives special powers"}, {"w": "harvest", "d": "the time when farmers gather their crops"}, {"w": "tradition", "d": "a custom or belief passed down from parents to children"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["A legend that explains the Moon and the Mid-Autumn Festival", "A farmer's diary", "A pirate adventure", "A cooking class"], "ans": 0, "why": "The legend is told to explain why families enjoy moon-watching."}, {"skill": "Details", "q": "Why did Hou Yi shoot down nine suns?", "opts": ["The suns were burning the Earth and the people", "He wanted to be famous", "They were too bright for the moon", "A game"], "ans": 0, "why": "Ten suns scorched the land, so he saved people by shooting down nine."}, {"skill": "Inference", "q": "Why did Chang'e swallow the elixir?", "opts": ["To protect it from a thief", "She was thirsty", "She wanted to be famous", "She was told to"], "ans": 0, "why": "Chang'e drank it so that the greedy thief could not use its power."}, {"skill": "Cause and effect", "q": "What happens when families eat mooncakes and look at the full moon?", "opts": ["They remember the legend and feel closer", "They fall asleep", "They go on a trip", "They stop working"], "ans": 0, "why": "Families keep the tradition to be together and remember the story."}, {"skill": "Vocabulary", "q": "What does “tradition” mean?", "opts": ["A custom passed from one generation to the next", "A new invention", "A kind of fruit", "A boat"], "ans": 0, "why": "Mooncakes are a tradition for Mid-Autumn Festival."}], "title": "Chang'e and the Moon", "cat": "myth", "blurb": "An old Chinese tale tells how a kind woman named Chang'e came to live on the Moon, and why families still gather under the full moon every autumn.", "paras": ["Long, long ago, in the time of ancient China, ten suns lived in the sky.", "They were the children of the Sun Emperor, and they were bright and playful. Every day, one of the ten suns would rise in the east and travel across the sky, lighting the world and warming the fields. The other nine waited quietly in a giant tree at the edge of the sea, taking turns. That is how the world had day and night, one sun at a time.", "But one morning, the ten suns grew bored. “Why should we take turns?” they said. “It’s no fun. Let’s all go out at once!”", "And so, on that fateful morning, all ten suns rose into the sky together.", "At first, the people were amazed. The whole world shone with a golden light. But soon the ground began to crack. The rivers dried up. The rice withered. The forests caught fire, and the sea boiled. People hid in caves and prayed for rain, but the heat only grew worse.", "Now, in a village near the mountains lived a brave archer named Hou Yi. He was the finest bowman in the land. His arrows never missed. He had a wife named Chang’e, a kind and gentle woman whom everyone loved. Chang’e cared for the sick and shared her food with the hungry. Her voice was as soft as a spring breeze.", "“Hou Yi,” she said one blazing afternoon, “the people are suffering. Only you can help.”", "Hou Yi looked up at the ten suns and took a deep breath. He climbed to the top of a mountain, pulled out his great bow, and aimed at the sky. One by one, he shot down nine of the suns. With each arrow, a ball of fire fell from the sky and vanished, and the land began to cool. When only one sun remained, Hou Yi stopped. “One is enough to give us light and warmth,” he said.", "The people rejoiced. They called him a hero, and they brought him gifts of rice and silk. The Queen Mother of the West, a powerful goddess who lived in the mountains, heard about his bravery. She decided to reward him with a special gift: a small golden pill, an elixir of immortality. Whoever swallowed it would live forever and rise into the heavens.", "“It is only enough for one person,” said the goddess. “Use it wisely.”", "Hou Yi carried the pill home, but he did not want to live forever without Chang’e. So he placed it in a small box and hid it beneath a beam in their house. “We will decide together what to do,” he told his wife.", "Time passed. Hou Yi grew famous. Many young men came to learn from him, and he taught them how to shoot. But among these students was a man named Feng Meng, who was greedy and cruel. He had heard about the golden pill. Every night he dreamed of stealing it and living forever.", "One day, when Hou Yi went hunting, Feng Meng crept into the house. Chang’e was alone. He drew his sword and demanded, “Give me the elixir!”", "Chang’e was very afraid. She knew she couldn’t fight him. She also knew that if Feng Meng took the elixir, he would become an immortal tyrant, and the people would suffer even more than before. Her mind raced. What could she do?", "Quickly, she took the little box from its hiding place. She opened it, and, before the thief could stop her, she swallowed the golden pill herself.", "At once, her body began to feel light as a feather. Her feet left the floor. Her robes fluttered, and she drifted through the window and out into the evening air. She rose higher and higher. She wanted to stay near Earth, near her husband, but the magic pulled her upward, toward the sky. Up and up she went, past the treetops, past the clouds, until she landed, very softly, on the Moon.", "The Moon was a quiet, silver world. There was no wind, and no sound. There was only a cold palace made of jade, a sweet-smelling cinnamon tree, and a small white rabbit who pounded herbs in a mortar. The rabbit looked up, twitching her nose. She had been there for a very long time.", "“Welcome,” said the rabbit. “You will be lonely here, I’m afraid. But you will not be alone.”", "Chang’e looked down at the Earth, glowing blue in the darkness, and tears rolled down her cheeks. She missed her husband. She missed her village. But she knew she had done the right thing.", "When Hou Yi came home and found his wife gone, he was heartbroken. He ran outside and looked up at the sky. There, on the bright face of the full Moon, he saw a beautiful woman’s shape, floating beside a tree.", "“Chang’e!” he cried.", "He was so sad that he could not eat or sleep. He walked through the village calling her name. But the goddess, who had seen everything, felt sorry for him. “Every year, on the fifteenth night of the eighth month,” she said, “when the moon is brightest and roundest, Chang’e will come to visit you. On that night, you may see her.”", "And so it was. Every autumn, on that special night, the Moon shone extra bright, and Hou Yi would set out a table beneath it. He would fill it with her favorite foods, sweet cakes, and fruit. And he would sit there, gazing up at the glowing disc, and whisper his love to the woman in the Moon.", "Soon, the villagers began to join him. They set out tables of their own, and offered fruit and round cakes to Chang’e, and thanked her for her courage. They believed she was watching from above, smiling. The custom spread from village to village, and from year to year, until every family in the land celebrated the moon on the fifteenth night of the eighth month.", "That is why, to this day, families in China and around the world celebrate the Mid-Autumn Festival. When the harvest is over and the autumn Moon is full and round, people gather outside to eat mooncakes, round pastries filled with lotus paste or sweet beans. They carry glowing lanterns through the streets. Children run laughing, holding paper rabbits and glowing stars. Grandparents tell stories of the woman who lives on the Moon.", "The round shape of the moon stands for reunion and togetherness. Even if family members are far away, they can look up at the same moon and feel close. That is the heart of the festival. It is a tradition of love, of gratitude, and of being together.", "Some people say that if you look carefully at the full Moon, you can see Chang’e, standing beside her cinnamon tree. Others see the white rabbit, still busy with her mortar and pestle. Some see a toad, or an old man, or nothing at all. Every family has its own way of seeing.", "If you go out tonight and the Moon is full, take a moment to look up. Imagine someone far away, someone you love, looking at the very same moon. It doesn’t matter how far apart you are.", "You are both under the same silver light, and the woman in the Moon is smiling down on you."]}, {"vocab": [{"w": "swift", "d": "moving very fast"}, {"w": "hero", "d": "a person admired for courage or great deeds"}, {"w": "wilderness", "d": "wild land where few people live"}, {"w": "challenge", "d": "something difficult that tests your skills"}, {"w": "clever", "d": "quick to understand and good at solving problems"}], "quiz": [{"skill": "Main idea", "q": "What is this myth mostly about?", "opts": ["A brave, fast girl who chooses her own path", "A king's treasure", "A cooking contest", "A sea voyage"], "ans": 0, "why": "Atalanta uses her skills and wisdom to run her own life."}, {"skill": "Details", "q": "Who took care of Atalanta when she was a baby?", "opts": ["A mother bear", "A king", "A wolf", "A wizard"], "ans": 0, "why": "A she-bear found her and raised her in the woods."}, {"skill": "Inference", "q": "Why did Atalanta say she would only marry a man who could beat her in a race?", "opts": ["She knew nobody could beat her", "She did not want to marry", "She wanted a fair test", "She loved races"], "ans": 0, "why": "She believed nobody was faster, so she was safe unless someone truly earned it."}, {"skill": "Cause and effect", "q": "Why did Atalanta stop to pick up the golden apples?", "opts": ["They were beautiful and she was curious", "She was hungry", "She was tired", "She lost a shoe"], "ans": 0, "why": "The shining apples caught her attention, and she stopped."}, {"skill": "Vocabulary", "q": "What does “swift” mean?", "opts": ["Very fast", "Very slow", "Very loud", "Very tall"], "ans": 0, "why": "Atalanta was swift on her feet."}], "title": "Atalanta, the Fastest Girl in Greece", "cat": "myth", "blurb": "Left in the forest as a baby and raised by a bear, Atalanta grows up to outrun everyone in Greece. But can she outrun three golden apples?", "paras": ["Long ago in ancient Greece, a baby girl was born to a king who wanted a son. When the king saw his daughter, he was so disappointed that he ordered a servant to leave her on a mountainside, far away from the palace.", "The servant felt sorry for the little girl, but he obeyed the king. He set the baby down on the cold ground, wrapped in a blanket, and walked away with tears in his eyes.", "The baby began to cry. Her small voice echoed through the trees. And then, out of the shadows, came a large brown she-bear. She sniffed the baby, tilted her head, and, very gently, picked her up with her teeth and carried her to a cave. The bear had lost her cubs, and she took the human child as her own.", "The baby grew up in the wilderness, and she was strong and free. She learned to climb trees, to swim in icy rivers, and to move silently through the forest. Some hunters found her and raised her as their own. They named her Atalanta, and she became the best runner anyone had ever seen.", "Atalanta could run like the wind. She could outrun deer and wild horses. She could run for miles without getting tired. When she ran, her feet barely touched the ground, and her long hair streamed behind her like a comet’s tail. The hunters said that she was so swift that she could run across a field of wheat without bending a single stalk.", "She was also a fine archer and wrestler, and she was clever, too. When she was still young, a legendary hero named Meleager invited her to join a great hunt. A giant wild boar had been terrorizing the countryside, trampling farms and frightening villagers. The boar was huge and fierce, with tusks as long as a man’s arm.", "Many heroes had gathered for the hunt, brave men with spears and swords. Some laughed when Atalanta arrived. “A girl?” they scoffed. “What can she do?”", "Atalanta said nothing. She simply took out her bow.", "During the hunt, when the boar charged and the men scattered in fear, Atalanta stood her ground. She drew her arrow, took careful aim, and shot. The arrow struck the boar behind the ear and wounded it. Meleager finished the job. The other heroes were speechless.", "“She was the first to draw blood,” said Meleager. “She should get the honor.” And he presented Atalanta with the boar’s hide as a prize. From that day on, nobody laughed at her again.", "Atalanta’s fame spread across Greece. Everyone talked about the swift girl who was as brave as any hero. Soon, her father, the king, heard about her, and he realized who she was. He invited her back to the palace, and Atalanta went, curious to meet the family she had never known.", "The king greeted her warmly. “My daughter,” he said. “I made a terrible mistake many years ago. I hope you can forgive me. And now, it is time for you to marry. I have chosen a husband for you.”", "Atalanta stared at him. “I didn’t ask to be married,” she said. “And I don’t plan to marry anyone you choose for me.”", "“But it is your duty,” said the king.", "Atalanta took a deep breath. She thought for a long time. She wanted to live her own life, to run in the forests and mountains, free as a bird. She did not want to be told what to do. But she also knew that the king was powerful, and that she needed a clever plan.", "“I will make an agreement,” she said at last. “I will marry the man who can beat me in a footrace. But any man who loses will have to leave forever.”", "The king agreed, thinking that some young man would surely win. But he was wrong. Atalanta was so fast that nobody could beat her. One by one, the suitors lined up, raced against her, and lost. Their faces turned red, and they gasped for breath as she crossed the finish line first, without even breathing hard.", "After a while, fewer men dared to try.", "But one young man, named Hippomenes, was different. He was clever and kind. When he first saw Atalanta run, he was amazed, and he decided he wanted to compete. But he knew he could not win by speed alone. So he prayed to Aphrodite, the goddess of love and beauty, for help.", "Aphrodite heard his prayer. She gave him three golden apples that shone like tiny suns. “Use these wisely,” she told him. “When Atalanta pulls ahead, roll one of the apples in front of her, and see what happens.”", "On the day of the race, a large crowd gathered in the stadium. Trumpets blared. Atalanta and Hippomenes crouched side by side at the starting line. Atalanta smiled confidently. She had never lost.", "“Ready,” said the judge. “Set. Go!”", "The two of them raced down the track. At first, they ran together. But soon, Atalanta began to pull ahead, her feet flying over the ground. Hippomenes pulled out the first golden apple and rolled it across the path.", "The apple glittered in the sunlight. Atalanta had never seen anything so beautiful. She slowed down and, for a moment, turned to look. Then she scooped it up, admiring it, and dashed after Hippomenes again.", "She caught up quickly. But Hippomenes tossed the second apple, farther to the side. Atalanta hesitated. The apple glowed like a tiny sun, and she couldn’t resist. She ran to pick it up, and once again lost precious seconds.", "Now the finish line was near. Atalanta put on a burst of speed. She was closing in fast. Hippomenes, panting hard, threw the third apple as far as he could. It rolled off the track and into the grass.", "Atalanta stopped. She looked at the apple, then at the finish line, then back at the apple. What a strange thing, she thought. She had never really wanted anything before. But those apples were unlike anything in the world.", "She ran to pick up the third apple, and when she looked up, Hippomenes had crossed the finish line. He had won.", "The crowd erupted. Some cheered. Some gasped. Atalanta stood there holding three golden apples, feeling a st
