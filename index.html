i, a husband-and-wife coaching team who helped guide her through some of the most difficult and important competitions of her life.", "By her teenage years, it was clear that Simone possessed a rare combination of raw power, extraordinary body control in the air, and fearless dedication to training. She trained many hours a day, most days of the week, developing not only the physical strength gymnastics requires but also the specific, repetitive discipline of running the same skill hundreds of times until every detail, down to the exact position of a fingertip or the precise angle of a toe, became automatic. She began competing at the elite level, and by 2013, at just sixteen years old, she won her first world championship all-around title. She would go on to win the all-around world title four times in a row, an achievement no other woman had accomplished in the sport's history.", "Before those Olympics, Simone made an unusual choice for a young athlete of her caliber. She had earned a spot on the gymnastics team at the University of California, Los Angeles, and could have competed there as a college athlete. Instead, she decided to become a professional gymnast right away, which meant she was allowed to earn money from sponsors and endorsement deals to help support her family, but had to give up her college scholarship and college eligibility to do it. It was a difficult, grown-up decision to make as a teenager, choosing a harder and less certain path because it was the one that made the most sense for her family at the time.", "At the 2016 Olympics in Rio de Janeiro, Simone won four gold medals and one bronze, cementing her reputation as one of the most dominant gymnasts ever to compete. She performed skills of such difficulty that other elite gymnasts sometimes seemed to be competing in an entirely different, gentler version of the sport. Commentators ran out of ways to describe what she could do. She seemed, to many people watching, almost impossibly good, gravity itself apparently optional whenever she took flight. Her floor exercise routines combined tumbling passes with so much height and so many twists that broadcasters sometimes had to replay them in slow motion just so viewers at home could see everything that had actually happened in the brief seconds she was airborne.", "What made Simone's gymnastics so extraordinary was not only the difficulty of her skills but the way she performed them: with a kind of joyful showmanship, often smiling mid-routine, clearly delighting in movements that terrified nearly everyone else in the sport. Young gymnasts around the world began attempting versions of her skills in backyards and local gyms, even though coaches often had to remind them just how many years of careful, gradual training stood behind moves that looked, on television, almost effortless.", "Two of her four named skills are on floor exercise: a tumbling pass with so much height and so many twists in the air that no other gymnast had landed it safely in competition before her. Another is on vault, a version of a difficult vault called a Yurchenko, except performed with two complete flips packed into the air after launching off the table, a skill so difficult that for years afterward, almost no other gymnast in the world attempted it in competition. Her fourth named skill is on balance beam. Simone has often said that she likes wearing a small charm shaped like a goat on her leotard during competitions, a playful nod to being nicknamed the G.O.A.T., short for \"Greatest Of All Time,\" a nickname fans and commentators gave her because of exactly how far ahead of the competition her skills had become.", "Five years later, at the delayed 2020 Tokyo Olympics, held in the summer of 2021 because of a global pandemic, Simone arrived as the presumed favorite to win gold in nearly every event she entered. Expectations were, by any measure, enormous: magazine covers, television specials, and endorsement deals had already begun treating her presence at the Games as something close to inevitable history in the making. And then something happened that nobody, including Simone herself, had fully expected.", "During the team competition, in the middle of her vault, Simone suddenly experienced what gymnasts call \"the twisties,\" a frightening and dangerous phenomenon in which a gymnast, mid-air, suddenly loses track of exactly where her body is in space. Imagine spinning through the air and, for a terrifying instant, genuinely not knowing which way is up, which way is down, or how many rotations your body has already completed. For most people, a moment of confusion is merely embarrassing. For an elite gymnast twisting and flipping many feet above a hard floor, that same moment of confusion can result in a landing so badly misjudged that it causes severe, career-ending, or even life-threatening injury.", "Gymnasts who have experienced the twisties often describe it as their mind and body suddenly disconnecting mid-air, as though a signal that had always arrived instantly and automatically simply failed to arrive at all. It is not something an athlete can simply decide to fix by trying harder or being braver in the moment. Many gymnasts who develop the twisties, even briefly, need weeks or months of careful, patient retraining, often starting from the very simplest versions of a skill, before their mind and body reliably reconnect.", "Simone landed her vault that day only barely safely, her body instinctively protecting itself even though her mind had lost track of the skill mid-air. She immediately understood what had happened, and she made a decision that would end up mattering as much to the world as any of her gold medals: she withdrew from the rest of the team competition, and eventually from most of her individual events at those Olympics, choosing not to compete rather than risk a serious injury while her body and mind were not synchronized enough to perform safely.", "This was an enormously difficult decision, made under an almost unimaginable amount of pressure. Simone was competing on the largest stage in her sport, representing her entire country, with millions of people around the world watching and expecting her to win. Stepping back, rather than pushing through, went against nearly everything elite athletes are traditionally taught to do. Many athletes throughout history have been praised specifically for competing through pain or fear, for \"toughing it out\" no matter what. Simone chose a different, and in many ways much harder, kind of courage: the courage to say, publicly, in front of the entire world, \"not today, because it would not be safe.\"", "Rather than risk a serious injury, Simone made the difficult decision to withdraw from several individual events, stepping back to protect herself even as cameras from around the world watched. \"I have to focus on my mental health,\" she told reporters afterward, her voice steady even though the moment was clearly painful, choosing in that moment to advocate for her own safety instead of pushing through in silence. \"We have to protect our minds and our bodies, and not just go out there and do what the world wants us to do.\"", "She also spoke, in the days that followed, about wanting to compete for herself and not only for the weight of everyone else's expectations, a distinction that struck many people, young athletes especially, as a genuinely new way of thinking about what it means to represent your country or your team. Simone made clear that stepping back was not the same as giving up on gymnastics altogether. She stayed at the Olympic venue, in her team uniform, cheering loudly for her teammates from the sidelines through the rest of the competition, showing that supporting a team and protecting yourself were not opposites at all.", "Because Simone stepped back, other members of the United States team had to step forward and compete additional events under enormous pressure with very little warning. Jordan Chiles and Grace McCallum, alongside Sunisa Lee, helped the team earn a silver medal in the team competition, and a few days later, in the individual all-around final, it was Sunisa Lee, a teammate Simone had trained beside for years, who won the gold medal that most people had expected would belong to Simone. Simone cheered for Sunisa from the stands with total, visible joy, another small example of the same lesson: that this was never only about her.", "The reaction to her decision was not universally kind at first. Some critics accused her of giving up, of letting her team and her country down. But as more people came to understand exactly what the twisties actually involved, and how genuinely dangerous it would have been for her to compete while experiencing them, public opinion shifted dramatically. Fellow athletes, across many different sports, spoke up in support of her decision, sharing their own stories of pressure and fear that they had rarely felt safe admitting out loud before. Mental health professionals praised her for demonstrating, on an enormous global stage, that listening to your own body and mind is not weakness, but genuine strength and self-awareness. Simone later received major honors and recognitions specifically for her courage in speaking openly about athlete wellbeing, an area of sports that had rarely received this much public attention before.", "The months after Tokyo were not simple ones. Simone has spoken about how strange it felt to come home without the medals everyone had expected, and about needing real time away from the sport to rest, to process what had happened, and to decide, on her own terms, whether and how she wanted to return to competitive gymnastics at all. She has been open about working with mental health professionals during this period, describing therapy as something that helped her, the same way regular training helped her body, and encouraging other young athletes not to be ashamed of needing that same kind of support.", "Simone returned to competition two years later, in 2023, working carefully and patiently through the twisties with her coaches, rebuilding her connection between mind and body one careful step at a time. Her comeback did not happen all at once. She and her coaches rebuilt her skills gradually, sometimes returning to simpler versions of moves she had already mastered years earlier, checking again and again that her mind and body were fully back in sync before adding any real difficulty back in. Watching her compete again, friends and commentators alike described the return as its own kind of remarkable achievement, entirely separate from any medal count.", "She competed at the 2024 Paris Olympics and won three more gold medals, in the team competition, the individual all-around, and vault, along with a silver medal on floor exercise, adding to a career total that makes her, by nearly every measure gymnastics experts use, the most decorated gymnast, of any gender, in the sport's history. Crowds in Paris cheered for her with a warmth that felt different from the awe of Rio, a kind of cheering that seemed to celebrate not only her extraordinary skill but the entire journey that had brought her back to that arena at all.", "On the floor exercise podium in Paris, Simone shared the moment warmly with two other gymnasts, including Rebeca Andrade of Brazil, who won the gold that day. Photographs of the three athletes bowing toward each other on the podium, showing obvious respect and affection rather than rivalry, appeared in newspapers around the world, becoming almost as memorable to many fans as any individual gold medal. To Simone, this seemed to matter as much as the medals themselves: gymnastics, at its best, was still a sport that could hold both fierce competition and genuine warmth between competitors at the very same time.", "By the time the Paris Games ended, Simone had also become one of the most recognizable athletes in the world outside of gymnastics itself, appearing in television specials, documentaries, and interviews where she talked openly about both her success and her struggles. She has spoken about marrying football player Jonathan Owens, about the ordinary parts of her life away from the gym, and about wanting young fans to understand that even someone with her extraordinary talent still has hard days, still needs rest, and still has to ask for help sometimes.", "But when people ask Simone Biles which moment of her career matters most to her, she does not always point to a gold medal. She often points back to Tokyo, to the moment she chose to stop, because it required a different kind of extraordinary: not the extraordinary of doing something no human body had done before, but the extraordinary of speaking one honest, difficult word, in front of the whole world, when everyone expected her to say something else entirely.", "Simone has continued speaking about this part of her story long after the medals were awarded, visiting schools and speaking with young athletes about the importance of knowing your own limits and trusting your own awareness of your body, even when a stadium full of people wants something different from you. She has said that she hopes the lesson people take from Tokyo is not really about gymnastics at all, but about permission: the permission every person has to say, honestly, when something isn't safe, no matter how much pressure surrounds that decision.", "Coaches who have worked with young gymnasts in the years since often mention Simone's example specifically when talking with their own athletes about pushing through pain versus recognizing real danger, using her story as proof that even the most extraordinarily gifted athlete in the history of the sport still had to learn, and relearn, exactly when to trust that inner alarm rather than override it.", "It is worth remembering, too, just how unlikely Simone's whole story once looked. A little girl born into an unstable, difficult situation, moved between foster homes before she turned six, could easily have grown up without ever discovering gymnastics at all, if not for a coach on a random daycare field trip who happened to notice a burst of raw talent and cared enough to send a letter home. Ron and Nellie Biles, choosing to adopt Simone and her sister and build a steady, loving home around them, gave her the foundation that eventually let all of that natural talent turn into something extraordinary. Every gold medal that followed rested on that much quieter, much less famous decision, made years before anyone in the world had ever heard the name Simone Biles.", "Extraordinary talent, extraordinary dedication, and extraordinary courage: those three words, Simone's own vocabulary of sorts, describe three very different parts of her story, and none of them, on their own, would have been enough. The talent got noticed on a field trip. The dedication built giant swings and double flips out of thousands of repeated, unglamorous hours in the gym. But the courage, the part that let her stand in front of the entire world and say the hardest word there is, was the part that turned her from simply the greatest gymnast anyone had ever seen into something more: an example, for kids everywhere, of what real strength actually looks like.", "\"No,\" she said, and the world, eventually, learned to hear it not as weakness, but as one of the bravest things a champion can say."]}, {"vocab": [{"w": "stereotype", "d": "an unfair, oversimplified belief about a whole group of people"}, {"w": "confidence", "d": "a feeling of trust in your own abilities"}, {"w": "ally", "d": "someone who supports and stands up for another person"}, {"w": "discipline", "d": "steady, controlled effort and practice"}, {"w": "resilience", "d": "the ability to recover and keep going after something difficult"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Marcus faces teasing about being a boy in gymnastics and learns to stand up for himself and others", "Marcus quits gymnastics", "Marcus wins a gold medal", "Marcus changes schools"], "ans": 0, "why": "Marcus's growth in confidence and standing up for a teammate is the heart of the story."}, {"skill": "Details", "q": "What event does Marcus especially love that most people don't realize is very difficult?", "opts": ["Still rings, which require enormous upper body strength", "Balance beam", "Swimming", "Floor music"], "ans": 0, "why": "Still rings require holding the body motionless with immense strength, which the story explains."}, {"skill": "Inference", "q": "Why did Marcus decide to speak up when a boy teased the new student, DeShawn?", "opts": ["He remembered how it felt to be teased and didn't want DeShawn to feel alone", "He wanted to get DeShawn in trouble", "He was told to by a teacher", "He didn't care either way"], "ans": 0, "why": "Marcus's own experience made him want to protect someone else from the same pain."}, {"skill": "Cause and effect", "q": "What happened after Marcus explained how much strength gymnastics actually requires?", "opts": ["Some classmates' attitudes began to change as they learned more about the sport", "Everyone immediately apologized", "Nothing changed at all", "Marcus quit talking about gymnastics"], "ans": 0, "why": "Understanding replaced some of the teasing, though change took ongoing effort."}, {"skill": "Vocabulary", "q": "What does “stereotype” mean?", "opts": ["An unfair, oversimplified belief about a whole group of people", "A type of gymnastics move", "A kind of trophy", "A training schedule"], "ans": 0, "why": "The idea that \"gymnastics is only for girls\" is a stereotype the story challenges."}], "title": "Marcus Sticks the Landing", "cat": "gymnastics", "blurb": "Marcus is the only boy in his level at the gym, and some kids at school won't let him forget it. When a new teammate needs an ally, Marcus discovers that the strongest thing he owns isn't a skill on the rings. It's his voice.", "paras": ["Marcus Whitfield was the only boy in the entire eleven-and-under level at Cascade Gymnastics Academy, and for the most part, he didn't think about it much. Inside the gym, nobody cared whether he was a boy or a girl. What mattered was whether you could hold a handstand, whether your toes were pointed, whether you had the discipline to run the same tumbling pass twenty times until it was clean. Marcus loved the gym precisely because of that fairness. Strength and hard work spoke louder than anything else there.", "He had started gymnastics at age five, mostly because his older cousin did it and Marcus, at the time, wanted to do absolutely everything his cousin did. His cousin quit after two years to play baseball instead. Marcus stayed. Something about the sport had gotten into him early and simply never let go: the specific, satisfying click of a skill finally clicking into place after weeks of near-misses, the particular quiet of the gym early on Saturday mornings before anyone else arrived, the six different events, each demanding an entirely different kind of strength and courage from his body.", "Outside the gym was a different story.", "\"Isn't gymnastics, like, a girl sport?\" a boy named Tyler asked him one day at lunch, not unkindly exactly, more curious in an oblivious way, but the question still landed like a small, familiar sting. It was not the first time someone had asked him something like this. It would not, Marcus already suspected, be the last.", "\"There's men's gymnastics in the Olympics,\" Marcus said, the same explanation he always gave. \"Rings, pommel horse, parallel bars, high bar, vault, and floor. Six events. It's actually really different from what girls compete in.\"", "\"Huh,\" said Tyler, already losing interest, already moving on to some other topic, leaving Marcus with the same small, sour feeling he always got after conversations like this one: not quite anger, not quite sadness, just a tiredness at having to explain, yet again, that the thing he loved most in the world was allowed to be his.", "Marcus had lost count, by this point, of how many times he had given some version of that same explanation. He had given it to a substitute teacher who assumed, upon hearing \"gymnastics,\" that Marcus must mean he watched his sister's meets. He had given it to a well-meaning neighbor who suggested, gently, that maybe he'd rather try soccer, \"since that's more of a boys' thing.\" Each time, he answered patiently, because that was easier than the alternative, but each time, a small amount of something tired settled a little further into him.", "At the gym, Marcus's favorite event was still rings, a piece of apparatus most people at school had never even heard of. Two rings hang from cables, and a gymnast must hold his entire body weight, supported only by his own arms and shoulders, in a series of positions that require almost unbelievable strength: an iron cross, arms spread wide to the sides, body hanging perfectly still and motionless, or a handstand held steady on rings that naturally want to wobble and swing. It took Marcus over a year of dedicated strength training just to hold a basic support position without shaking. It was, by a wide margin, the hardest physical thing he had ever attempted, and every small improvement felt earned in a way that made him fiercely proud.", "His training on rings followed a routine that never got any easier no matter how strong he grew: sets of slow, controlled pull-ups with his toes pointed the entire time, holds at the bottom of a dip position until his shoulders trembled, careful, painstaking drills just to train his body to keep the rings from swinging wildly while he tried to hold still inside them. Mr. Duarte liked to remind him that gymnasts on rings were judged as much on stillness as on difficulty, which meant Marcus had to fight his own shaking muscles and the rings' natural sway at the exact same time, using nothing but strength and precise technique to look, for a few impossible seconds, completely calm.", "\"People think gymnastics is just about being flexible and pretty,\" he told his coach, Mr. Duarte, one afternoon after a particularly grueling ring strength session. \"Nobody at school has any idea how much raw strength this actually takes.\"", "\"Most people haven't tried it,\" said Mr. Duarte. \"It's hard to respect what you don't understand. That's not really their fault. It's just a gap in their experience.\"", "\"Doesn't make it feel less annoying,\" Marcus muttered, flexing his sore forearms.", "\"No,\" Mr. Duarte agreed. \"It probably doesn't. But you get to decide what you do with that annoyance. You can let it make you smaller, or you can let it make you the kind of person who explains things clearly and doesn't back down. That second option takes a lot more discipline than the first one, for what it's worth.\"", "Marcus wasn't always sure how to explain, even to himself, why the comments bothered him as much as they did. Nobody at school had ever told him to quit. Nobody had ever been outright cruel about it, not exactly. It was more the constant, low hum of surprise every time it came up, the way people's faces did a small double-take, as though his hobby needed to be double-checked and re-filed somewhere. His older sister, Talia, who ran track, never got that same look when she mentioned practice. She simply said \"track\" and people nodded and moved on. Marcus said \"gymnastics\" and braced himself, every single time, for at least one raised eyebrow.", "\"Does it bother you that people always ask that?\" his mother asked one evening, noticing the particular quiet way Marcus had come in from school that day.", "\"It's not a big deal,\" Marcus said, which was what he usually said.", "\"You can think something's not a big deal and still be allowed to be tired of it,\" his mother said. \"Those aren't opposites.\"", "Marcus considered that for a moment, turning a chalky rings grip over in his hands. \"I guess I just wish people asked me about my scores instead of asking whether I'm even allowed to be doing this.\"", "\"Then next time somebody asks the wrong question,\" his mother said, \"you answer with a fact so good they can't help but ask a better one next.\"", "A few weeks later, a new student joined Marcus's class at school: a quiet boy named DeShawn who, it turned out, had trained in gymnastics for years at his old gym before his family moved to the area. He mentioned it, a little nervously, during a class icebreaker activity where everyone had to share something interesting about themselves.", "\"I do gymnastics,\" DeShawn said. \"Rings and pommel horse, mostly.\"", "A ripple of quiet snickering moved through part of the classroom. Marcus felt his stomach clench with a familiar, unwelcome feeling.", "At recess, Marcus watched from across the blacktop as a cluster of boys surrounded DeShawn, one of them doing an exaggerated, mocking imitation of a dance move, the others laughing. DeShawn's face had gone carefully blank in the specific way Marcus recognized immediately, because he had made that same expression himself more times than he could count: the look of someone trying very hard not to let teasing show that it was working.", "Marcus stood frozen for a moment, caught in an old, familiar instinct to simply not get involved, to let it pass, the way he usually did when comments came his own way. His heart was pounding an uncomfortable amount for something that, technically, had nothing to do with him. He thought about all the other times he had let a comment slide, telling himself it wasn't worth the argument, that people would get bored and move on eventually anyway. But something about watching it happen to someone else, someone brand new and alone and clearly already uncertain about whether he'd made a mistake mentioning gymnastics at all, made that old instinct feel suddenly unbearable.", "Marcus walked over.", "\"Hey,\" he said, planting himself next to DeShawn, \"you do rings? What's your max hold on an iron cross?\"", "DeShawn blinked, caught off guard by the question. \"Um. About eight seconds. My coach says that's actually pretty solid for my age.\"", "\"Eight seconds is really good,\" Marcus said, and meant it completely. \"I'm barely at five. That's one of the hardest strength skills in the entire sport, by the way,\" he added, turning slightly to address the boys who had been laughing, who had gone quiet, apparently unsure what to make of this conversation. \"Most adults can't even do an iron cross at all. It takes years of specific strength training that almost nobody outside the sport even knows exists.\"", "\"Wait, you do gymnastics too?\" Tyler asked, surprised.", "\"Been doing it since I was five,\" Marcus said. \"Rings are my favorite event. I train four days a week. My shoulders are basically made of rope right now from how sore they get.\"", "There was a pause. Marcus could feel the moment balanced on some invisible edge, unsure which way it would tip.", "Marcus felt his pulse still going fast, adrenaline left over from crossing the blacktop in the first place, but underneath the nervousness there was something steadier too, something that felt almost like the calm he had to find right before mounting the rings for a real routine: a decision, already made, that he was not going to back down from this conversation just because it was uncomfortable.", "\"That's actually kind of cool,\" said one of the other boys, slowly, almost reluctantly, as though admitting it cost him something. \"I thought gymnastics was just, like, ribbons and stuff.\"", "\"That's rhythmic gymnastics, that's a whole different thing, and that takes incredible skill too, honestly,\" Marcus said. \"But men's gymnastics is six events, and rings alone will make your whole upper body feel like it's on fire by the end of a normal practice. Try holding your arms straight out to the sides for even ten seconds. Most people can't do it for five.\"", "A couple of the boys actually tried it, right there on the blacktop, arms extended, faces screwing up with effort within a few seconds, laughing in genuine surprise at how hard even that small piece of it turned out to be. One boy, a wiry kid named Andre who played travel soccer and had never given gymnastics a second thought, lasted eleven seconds and looked genuinely stunned by how much his shoulders burned afterward.", "\"Okay, that's actually really hard,\" Andre admitted. \"I thought this would be easy.\"", "\"Nobody thinks it's hard until they try it,\" Marcus said. \"That's kind of the whole problem.\"", "The teasing didn't vanish completely, not that afternoon and not overnight. Stereotypes, Marcus was slowly learning, don't disappear the moment someone offers one good explanation; they fade slowly, chipped away a little at a time, through patient repetition and small moments exactly like this one. There were still a couple of boys who rolled their eyes when gymnastics came up, still occasional comments muttered just loud enough to be heard and not quite loud enough to properly call out. But something had shifted. A few of the boys started asking DeShawn real questions at lunch instead of mocking ones: what does a pommel horse actually look like, how do you not fall off the rings, does it hurt when you land wrong. DeShawn, cautious at first, began answering more openly, his shoulders gradually losing the defensive set they'd carried since that first recess.", "By the end of that week, Tyler had actually watched a video of Olympic rings competition on his own, unprompted, and brought it up at lunch the next day with something close to genuine awe in his voice. \"That guy's whole body was basically frozen sideways in the air,\" he said. \"How does that not just, like, fall over?\"", "\"Core strength, mostly,\" Marcus said, unable to hide a small, satisfied smile. \"And about a thousand hours nobody sees.\"", "DeShawn started sitting with Marcus and a couple of the other boys at lunch after that, and slowly, over the following weeks, the conversation at their table drifted less toward whether gymnastics counted as a \"real\" sport and more toward ordinary things: video games, an upcoming school field trip, whether the cafeteria pizza had gotten worse or whether everyone had simply gotten used to better pizza somewhere else. Marcus noticed the shift without saying anything about it, the quiet, comfortable feeling of a stereotype losing its grip one lunch period at a time.", "Not every conversation went smoothly. One boy, a sixth grader named Preston who Marcus barely knew, made a comment in the hallway a week later that stung more than Tyler's had, something sharper and less curious, clearly meant to needle rather than genuinely ask. Marcus felt the old flush of embarrassment rise in his chest, the urge to just keep walking and pretend he hadn't heard. Instead, he stopped.", "\"You're welcome to think whatever you want,\" Marcus said, keeping his voice level, \"but I train four days a week doing something that would probably make your arms shake in under a minute. I don't need you to like it. I just need you to not say stuff like that around me.\"", "Preston, clearly not expecting a calm, direct answer, mumbled something noncommittal and walked off. It wasn't a triumphant moment exactly, no cheering crowd, no dramatic reversal. But Marcus noticed that his own heart wasn't racing afterward the way it usually did after a confrontation. He had said exactly what he meant, without shouting, without shrinking, and that steadiness felt like its own small, private victory, the kind nobody else needed to witness for it to count.", "\"Thanks,\" DeShawn said quietly to Marcus later that week, as they walked toward the buses. \"For back there. I wasn't sure what to do.\"", "\"I know exactly what that feels like,\" Marcus said. \"Being the only one. It's a specific kind of lonely, even when nobody's being mean about it. I figured you shouldn't have to go through it by yourself if I could help.\"", "\"Maybe we could train together sometime,\" DeShawn said. \"Compare notes on rings. Misery loves company, my old coach used to say.\"", "Marcus laughed. \"Yeah. I'd like that. And if anybody gives you a hard time again, I've got your back. That's what an ally is supposed to do, right? Actually show up, not just feel bad about it privately.\"", "\"I think a lot of people feel bad about stuff privately and call it done,\" DeShawn said. \"You actually walked over.\"", "\"Barely,\" Marcus admitted. \"My legs felt like jelly the whole way. I almost talked myself out of it about four different times.\"", "\"Well, I'm glad you didn't,\" DeShawn said.", "That evening, hanging from the rings during his regular strength training, arms trembling with the effort of holding a support position just two seconds longer than the day before, Marcus thought about resilience, a word Mr. Duarte used often, about how it wasn't only about pushing through physical difficulty in the gym. It was also, he was realizing, about pushing through the harder, less visible difficulty of being different from what people expected, and doing it without letting that difference shrink you, and sometimes, when you had the strength for it, using your own hard-won confidence to make a little more room for somebody else too.", "Mr. Duarte, watching from across the gym, noticed the extra effort in Marcus's hold and walked over. \"You've got good form today,\" he said. \"Something on your mind?\"", "\"Just thinking about a kid at school,\" Marcus said, still holding steady, forearms burning. \"He does rings too. I think he's going to be pretty good, once people stop being weird about it.\"", "\"Sounds like he's lucky to have you around, then,\" Mr. Duarte said. \"Not everybody who gets teased turns around and looks out for the next person going through the same thing. That takes a specific kind of strength, and it's not the kind we train on rings.\"", "\"Feels like the same muscle, kind of,\" Marcus said. \"Just a different shape.\"", "Mr. Duarte laughed. \"I like that. Write that one down somewhere. You'll want it later.\"", "His arms shook. He held the position two full seconds longer than his personal best.", "He didn't let go.", "A few days after that, DeShawn actually visited Cascade Gymnastics Academy for an open tryout session, something Marcus's parents had arranged after Marcus mentioned, more than once at dinner, how good DeShawn already was on rings. Watching DeShawn move through a basic strength routine, hitting a support hold with steadier form than plenty of gymnasts twice his time in the sport, Marcus felt something unexpectedly close to pride, as though DeShawn's success were, in some small way, also his own.", "\"He's got real potential,\" Mr. Duarte said afterward, watching DeShawn towel off across the gym. \"Good instincts. Strong shoulders already.\"", "\"Told you,\" Marcus said, grinning.", "DeShawn joined the team the following month, in a different age group but training in the same gym on the same afternoons, and within a few weeks, the two of them had fallen into an easy rhythm: comparing sore-shoulder stories after practice, trading tips about grip chalk, occasionally competing, half-seriously, over who could hold a support position longer before their arms gave out. Marcus liked, more than he expected to, no longer being the only boy walking into that gym after school. It wasn't that he had minded being alone in it before. It was simply better, he discovered, having someone else who understood exactly what a bad ring day felt like, without needing it explained.", "Walking out of the gym one evening not long after, bag slung over one aching shoulder, Marcus thought about how strange it was that the hardest, most invisible parts of gymnastics, the years of quiet strength training nobody at school ever saw, had ended up teaching him something that had nothing to do with rings at all: that discipline wasn't only for building an iron cross, and resilience wasn't only for getting back up after a bad landing. Both of those things, it turned out, worked just as well out on the blacktop, in a hallway, or at a lunch table, whenever somebody needed a person willing to hold steady and not let go."]}, {"vocab": [{"w": "runway", "d": "the long strip a gymnast sprints down before launching into a vault"}, {"w": "adrenaline", "d": "a chemical the body releases that causes a racing heart and burst of energy, often from excitement or fear"}, {"w": "curiosity", "d": "a strong desire to know or learn something"}, {"w": "block", "d": "the powerful push a gymnast's hands make off the vaulting table"}, {"w": "breakthrough", "d": "a sudden, important improvement or discovery after a period of difficulty"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Amara learns to face her fear of vault by getting curious about the sensation instead of fighting it", "Amara switches to a different sport", "The vaulting table breaks", "Amara never overcomes her fear"], "ans": 0, "why": "A shift from fear to curiosity is the turning point of the story."}, {"skill": "Details", "q": "What physical reaction does Amara notice happening in her body at the start of the runway?", "opts": ["Her heart races and her legs feel shaky, which is adrenaline", "She feels sleepy", "She feels too hot", "She feels hungry"], "ans": 0, "why": "The story explains this as adrenaline, a normal body response."}, {"skill": "Inference", "q": "Why did Coach Reyes ask Amara to describe the feeling out loud instead of telling her to just be brave?", "opts": ["Naming and studying the feeling made it less overwhelming than trying to ignore it", "It was a punishment", "It wasted time", "It was required by gym rules"], "ans": 0, "why": "Turning fear into an object of curiosity gave Amara a sense of control."}, {"skill": "Cause and effect", "q": "What happened after Amara started narrating her sprint down the runway out loud during practice?", "opts": ["She was able to run all the way to the vaulting table without slowing down or stopping", "She got in trouble for talking", "She ran even slower", "Nothing changed"], "ans": 0, "why": "Focusing her attention on describing each step kept her moving forward instead of freezing."}, {"skill": "Vocabulary", "q": "What does “adrenaline” mean?", "opts": ["A chemical the body releases that causes a racing heart and burst of energy", "A type of gymnastics apparatus", "A kind of injury", "A coaching method"], "ans": 0, "why": "Adrenaline explains Amara's racing heart before vaulting."}], "title": "The Vault That Took Her Breath Away", "cat": "gymnastics", "blurb": "Everyone else on the team sprints down the vault runway without a second thought. For Amara, the runway feels like a cliff edge every single time. Her coach has an unusual prescription: stop trying to be brave, and get curious instead.", "paras": ["The vault runway at Cascade Gymnastics Academy was exactly seventy-five feet long, a narrow strip of springy blue matting stretching from the back wall of the gym to a padded vaulting table positioned at the far end. Every gymnast on Amara Whitlock's team could sprint down that runway and launch themselves over the table without a second thought. For Amara, that same seventy-five feet felt, every single time, like standing at the edge of something enormous and uncertain.", "It hadn't always been this way. Amara remembered, faintly, actually liking vault when she first started the event years earlier, back when the whole skill was still new and exciting rather than something she had thought about too much. Something had shifted somewhere along the way, quietly, the way fears sometimes do, without any single dramatic moment she could point back to and blame. One day vault had simply become the part of practice her stomach dreaded most, and by the time she noticed the dread clearly, it had already settled in and made itself comfortable.", "It wasn't that she lacked the skill. She had strong legs, quick reflexes, and had successfully performed her vault, a handspring with a small twist, dozens of times in practice. The problem was what happened in the moments before she ran: a racing heart, shaky legs, a strange tightness in her chest that made her want to step off the runway entirely and pretend she'd forgotten something important in her gym bag.", "Amara's actual vault, once she committed to it, was technically solid. Her hands hit the table at exactly the right angle, and she used a strong, sharp block, the powerful push a gymnast's hands make off the vaulting table, to send her body up and around for the twist. Ms. Reyes had told her more than once that her block was one of the best on the team. The trouble had never really been the vaulting itself. It was everything that happened in the six or seven seconds before her hands ever touched that table.", "Vault, more than any other event in gymnastics, asks a gymnast to commit fully to something before she can possibly know how it will turn out. On beam or bars, a gymnast can pause, reset her hands, take an extra breath before continuing. Vault offers no such luxury. A gymnast sprints at full speed toward a solid table, launches off a springboard, and in the span of a couple of seconds must complete an entire skill in the air with no opportunity to slow down, reconsider, or start over partway through. Once a gymnast leaves the springboard, the vault is already happening, whether she feels ready or not. Amara understood this fact perfectly well, and somehow, understanding it only ever seemed to make the runway feel longer.", "Her teammates never seemed to have this particular problem. She watched them, practice after practice, sprint down the exact same seventy-five feet without so much as a flicker of hesitation, launch themselves into the air, and land, seemingly without a single doubt crossing their minds beforehand. Amara sometimes wondered, privately, what was different about her, why the same event that felt like nothing at all to her teammates could turn her stomach into knots every single time she stood at that same starting mark.", "\"I don't understand what's wrong with me,\" she told her coach, Ms. Reyes, after stopping halfway down the runway for the third time in one practice, unable to make herself continue toward the table. \"I know I can do this vault. I've done it a hundred times. But every time I start running, something in my body just says stop.\"", "Ms. Reyes sat down on a nearby mat, patting the space beside her. \"Can I ask you something? When that feeling happens, right at the start of the runway, what exactly does it feel like? Not 'scared.' I mean specifically, in your body.\"", "Amara thought about it. \"My heart starts pounding really fast. My legs feel shaky, almost like they're buzzing. My stomach feels tight, like right before a test I haven't studied for. And there's this feeling like I need to either run really fast or not move at all.\"", "\"That's adrenaline,\" said Ms. Reyes. \"Your body's built-in alarm system. It's actually the exact same chemical that would help you run from real danger, or lift something heavy in an emergency. Your body doesn't fully know the difference between 'this is actually dangerous' and 'this feels intense and unfamiliar.' It just floods you with the same energy either way.\"", "\"Do the other girls not feel this?\" Amara asked. \"Because they never look like they're about to throw up before they run.\"", "\"Some of them feel a version of it,\" Ms. Reyes said. \"Some of them just show it differently, or they've had more practice not showing it at all, which isn't the same thing as not feeling it. I promise you, nobody sprints toward a vaulting table for the very first time in their life without some part of their brain wondering whether that's actually a good idea.\"", "\"So how do I make it stop?\"", "\"Here's the thing,\" said Ms. Reyes. \"I don't think you should try to make it stop. I think you should get curious about it instead.\"", "Amara frowned. \"Curious? It feels awful.\"", "\"It feels intense,\" Ms. Reyes corrected gently. \"Awful and intense aren't always the same thing, even though they can feel similar at first. Athletes at the very highest levels of every sport still feel that racing heart, that shaky-leg feeling, before a big moment. The difference isn't that they've made the feeling disappear. The difference is what they've decided that feeling means. You're treating it like a stop sign. What if, instead, you treated it like information? A sign that says, this matters to you, and your body is getting ready to do something big?\"", "Amara wasn't sure she believed this yet, but she was willing to try. \"How would I actually do that? Like, in the moment?\"", "\"Let's practice something,\" said Ms. Reyes. \"Stand at the start of the runway. When that feeling comes, instead of trying to push it away, I want you to describe it out loud, right as it's happening. Just narrate it, like a sports announcer describing what's going on inside you.\"", "Amara stood at the start of the runway, feeling faintly ridiculous, and began, haltingly, to speak. \"Um. Heart's beating fast. Legs feel shaky. Stomach's tight.\"", "\"Good,\" said Ms. Reyes. \"Keep going. Now start running, and keep narrating.\"", "Amara took a breath and started forward, forcing herself to keep talking even as her legs carried her down the runway. \"Heart's pounding. Still running. Legs feel weird but they're still working. Getting closer to the springboard. Still talking. Still running—\"", "She hit the springboard, her hands found the vaulting table exactly where they were supposed to, and her body, which had performed this exact motion hundreds of times before, simply did what it already knew how to do. She landed the vault cleanly, stumbling only slightly, and stood there for a moment, breathless and a little astonished.", "\"I did the whole thing,\" she said. \"I didn't stop.\"", "\"What was different?\" asked Ms. Reyes.", "Amara thought about it. \"I think... when I was talking about the feeling, I wasn't trying to fight it anymore. I was just watching it happen, almost like I was describing someone else's heart racing instead of just being stuck inside my own.\"", "\"That's exactly it,\" said Ms. Reyes. \"When we fight a feeling, we end up spending all our attention on the fight instead of on the vault. When we get curious about a feeling instead, describing it, naming it, almost studying it like a scientist, it takes up less room. There's more space left over for the actual task.\"", "That same afternoon, a teammate named Priya, who had watched the whole exchange from the sidelines while waiting for her turn on beam, wandered over during a water break. \"That was actually really cool,\" Priya said. \"The talking-out-loud thing. Does that seriously work?\"", "\"I don't know yet,\" Amara admitted. \"Today it did. Ask me again tomorrow.\"", "\"I get nervous before beam sometimes,\" Priya said. \"Not as bad as what you were describing, but still. Maybe I'll try narrating it too. Feels less lonely than just standing there trying not to think about it.\"", "\"Misery loves company,\" Amara said, echoing something she'd heard a teammate say once, and both girls laughed.", "Over the next several practices, Amara refined the technique further, almost by accident. She noticed that narrating in full sentences sometimes took too much of her attention right at the moment she needed to focus on her hand placement on the table, so she experimented with shortening the narration down to single words, timed almost like a countdown: heart... legs... stomach... go. She found that saying the words in rhythm with her own running steps helped even more, turning what had once been a wall of dread into something closer to a chant, a kind of private drumbeat that carried her all the way to the springboard.", "Ms. Reyes noticed the change too. \"You're making it your own,\" she said one afternoon, watching Amara run the sequence smoothly for the third time in a row. \"That's usually how you know a tool is actually starting to work, rather than just being something someone else told you to try. You stop following the instructions exactly and start bending them into whatever actually fits your body.\"", "Amara practiced this technique for weeks: narrating the adrenaline out loud at first, then quietly in her head, then eventually barely needing to narrate it at all, because the simple habit of noticing the feeling with curiosity rather than dread had, over time, changed her relationship with it entirely. The shaky legs and racing heart never fully disappeared. Ms. Reyes had been honest about that from the start. But they stopped feeling like a wall blocking her path down the runway, and started feeling more like a strange, familiar companion that showed up right before something exciting was about to happen.", "Not every practice went smoothly during those weeks. There was a Thursday, about halfway through, when Amara froze twice in a row despite her narrating, her feet simply refusing to leave the mark at the start of the runway no matter how many sentences she fed herself about racing hearts and shaky legs. She sat down hard on a mat afterward, frustrated and close to tears, feeling like all the progress from the weeks before had somehow evaporated overnight.", "\"This isn't working anymore,\" she told Ms. Reyes, wiping her eyes with the back of her wrist.", "\"It's working exactly as much as it worked yesterday,\" Ms. Reyes said, sitting beside her. \"You just had a harder day today. That happens with real skills, not just fake ones. Some days a cartwheel feels wobbly for no clear reason either. It doesn't mean you've forgotten how to cartwheel. It means today was a wobbly day. Try one more, and this time, don't try to fix the wobble. Just narrate the wobble itself. Tell me what a hard day feels like, out loud, while you run.\"", "Amara tried it, describing, in halting, breathless bursts, exactly how discouraged and shaky and frustrated she felt with every stride down the runway, and to her surprise, narrating the frustration itself seemed to loosen its grip on her just as effectively as narrating the ordinary adrenaline had. She landed the vault, wobbly but complete, and allowed herself a small, exhausted laugh.", "\"See?\" said Ms. Reyes. \"The tool doesn't only work on good days. That's actually the whole point of it.\"", "At home that evening, Amara mentioned the wobbly practice to her older brother, Desmond, who played baseball and had, in his own way, dealt with a similar problem standing at the plate against a fast pitcher. \"I get that,\" he said, surprising her. \"Right before a pitch, my hands sometimes shake so bad I can barely feel the bat. Coach always tells us to breathe out slow right before the windup. Does something like that work for you?\"", "\"Kind of,\" Amara said. \"Mine's more like talking to myself instead of breathing, but it's the same idea, I think. Naming the scary thing instead of just being scared.\"", "\"Huh,\" Desmond said. \"Maybe that works for anything, then. Scary stuff hates being looked straight at, I guess.\"", "Amara turned that thought over for the rest of the evening, deciding that she liked the way her brother had put it better than the way Ms. Reyes usually put it, even though they clearly meant the same thing.", "The weeks leading up to the regional meet brought their own kind of pressure. Ms. Reyes posted the qualifying lineup on the gym's bulletin board, and Amara's name appeared next to vault for the very first time in a real competition setting, rather than merely practicing the event in the safety of an ordinary Tuesday afternoon. Seeing her own name printed there, official and unavoidable, sent a fresh jolt of the familiar racing-heart feeling through her chest, different this time only in that she recognized it immediately for exactly what it was.", "\"Nervous?\" Priya asked, reading over Amara's shoulder.", "\"Racing heart, shaky legs, tight stomach,\" Amara recited, almost cheerfully. \"The usual. Just bigger this time.\"", "\"That's such a weird way to be nervous,\" Priya said, laughing. \"Like you're reading off a grocery list instead of actually panicking.\"", "\"That's kind of the whole point,\" Amara said.", "At the regional qualifying meet that spring, Amara stood at the start of the vault runway, her heart already racing the familiar way it always did before a big moment. The arena buzzed around her: other teams warming up nearby, a judge's whistle somewhere off to her left, the particular hollow echo that always seemed to fill large gyms during a big meet. Amara noticed all of it, catalogued it almost automatically now, the way she had trained herself to notice her own racing heart.", "There, she thought, almost fondly. Right on time.", "She narrated it silently to herself, just for a second: heart's racing, legs feel shaky, this matters to me. And then, instead of freezing, she ran.", "Her vault that day was the cleanest she had ever performed, her landing sticking firmly with barely a hop, and when she turned to salute the judges, breathless and grinning, she caught Ms. Reyes's eye in the crowd, who gave her a small, knowing nod, the kind that said, without any words at all, I told you it was information, not a stop sign.", "From the team bench, Priya let out a whoop loud enough to turn a few heads, pumping both fists in the air. Amara laughed, some of the adrenaline still buzzing pleasantly through her arms and legs, no longer anything she needed to fight.", "Amara scored high enough that day to qualify for the state meet for the first time in her gymnastics career. But when people later asked her what her biggest breakthrough of the season had been, she rarely talked about the score at all. She talked instead about learning to sit inside a racing heart without needing it to go away first, and discovering that bravery, it turned out, was never really about not feeling afraid. It was about running down the runway anyway, shaky legs and all, curious about what would happen next instead of dreading it.", "In the weeks after regionals, Amara found herself using the same narrating trick in places that had nothing to do with vault at all: standing backstage before a school talent show, waiting nervously in the dentist's chair, even once before raising her hand to answer a hard question in math class. Heart's racing, she would think each time, almost smiling now at the familiar sensation. This matters to me. And then, instead of freezing, she would go ahead and do the thing anyway.", "She started keeping a small notebook by her bed where she jotted down, after each meet, exactly what her body had felt like beforehand and what she had said to herself about it, a kind of running record of her own adrenaline over time. Flipping back through the pages months later, she was struck by how much steadier her handwriting had gotten, how much shorter and calmer the entries had become, as though the racing heart itself had slowly stopped needing quite so many words to describe.", "At the state meet that followed a few weeks later, Amara's vault runway felt, for the very first time in her memory, almost ordinary: still fast, still full of that same familiar racing heart, but no longer a cliff edge. Just a runway, seventy-five feet of springy blue matting between her and a table she had trained her whole body to trust.", "She thought of Ms. Reyes's words again as she chalked her hands and found her mark: not a stop sign, just information. Then she ran.", "Ms. Reyes watched from the sideline, clipboard forgotten under one arm, and later told Amara's mother that the moment had felt, in its own small way, like watching a genuine breakthrough happen live. Not because the vault itself was flawless, though it very nearly was, but because Amara's face at the top of the runway had shown something Ms. Reyes had waited more than a year to see: recognition instead of dread, a kind of calm greeting rather than a battle. \"She wasn't fighting anything up there anymore,\" Ms. Reyes said. \"She was just running.\"", "Amara herself thought about that moment often in the months that followed, long after the medals and the qualifying scores had faded into the background of an increasingly busy season. What she remembered most clearly wasn't the height of her flight or the stick of her landing, but the small, private conversation she'd had with her own racing heart in the two seconds before she moved: an old fear, greeted now almost like an old friend, walked alongside instead of run from. That, she had come to believe, was the real breakthrough hiding underneath the obvious one. Not a fearless runway. A runway she no longer needed to be fearless to run down."]}, {"vocab": [{"w": "rival", "d": "a person competing against you for the same goal or prize"}, {"w": "sportsmanship", "d": "fair, honest, and gracious behavior in competition, whether you win or lose"}, {"w": "composure", "d": "staying calm and in control of your emotions, especially under pressure"}, {"w": "empathy", "d": "the ability to understand and share the feelings of another person"}, {"w": "gracious", "d": "polite, kind, and generous, especially in victory or defeat"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Kayla learns that showing compassion toward a rival makes her a better competitor and person", "Kayla loses every event on purpose", "Bianca quits the sport forever", "The coaches cancel the meet"], "ans": 0, "why": "Kayla's choice to support her struggling rival is the story's central lesson."}, {"skill": "Details", "q": "What happens to Bianca during the beam routine at the state meet?", "opts": ["She falls twice and loses her composure, visibly shaken", "She scores a perfect ten", "She injures her ankle badly", "She refuses to compete"], "ans": 0, "why": "Bianca's fall and visible distress set up the story's turning point."}, {"skill": "Inference", "q": "Why did Kayla walk over to Bianca after her fall, even though they were competing against each other?", "opts": ["She recognized Bianca's distress and felt empathy despite their rivalry", "She wanted to distract her", "A coach ordered her to", "She wanted to make Bianca feel worse"], "ans": 0, "why": "Kayla's empathy overcomes the instinct to focus only on winning."}, {"skill": "Cause and effect", "q": "What did Kayla say to help Bianca regroup before her floor routine?", "opts": ["She reminded her that one bad routine doesn't erase years of hard work", "She told her to quit", "She told her not to worry about scoring", "She said nothing at all"], "ans": 0, "why": "Kayla's encouragement helps Bianca find her composure again."}, {"skill": "Vocabulary", "q": "What does “rival” mean?", "opts": ["A person competing against you for the same goal", "A teammate", "A coach", "A trophy"], "ans": 0, "why": "Kayla and Bianca are rivals who compete for the same top spot."}], "title": "The Girl Who Cheered for Her Rival", "cat": "gymnastics", "blurb": "For two years, Kayla and Bianca have battled for first place at every single meet. When Bianca falls apart on the biggest stage of the season, Kayla must decide whether a rival can also, somehow, be a friend.", "paras": ["Kayla Simmons and Bianca Torres had been rivals for exactly two years, ever since they both moved up to the same competitive level within a few months of each other and discovered, almost immediately, that they were the two strongest gymnasts in their entire region. At every single meet since then, the two of them had gone back and forth for first place in the all-around standings, sometimes separated by a full point, sometimes by mere hundredths, but always, somehow, the two names at the very top of the results sheet.", "They were not friends, exactly. They competed for different gyms, on opposite sides of the city, and rarely spoke beyond a brief, polite \"good luck\" before a meet began and a stiffer, more careful \"good job\" afterward, depending on who had won. Kayla thought about Bianca constantly during training, though: every new skill she added to her routines, she added partly because she knew Bianca was likely working on something similarly difficult. Their rivalry, unspoken and fierce, had quietly pushed both of them to become better gymnasts than either might have become alone.", "Kayla's coach, Ms. Okonkwo, had noticed this particular dynamic long ago and, rather than discouraging it, had learned to use it carefully. \"Bianca added a full turn on beam last month,\" she might mention casually during warm-up, watching with quiet satisfaction as Kayla's next few beam attempts sharpened with new focus. It wasn't that Ms. Okonkwo wanted Kayla obsessing over her rival exactly. It was more that she recognized, correctly, that some competitors simply brought out a gear in each other that no amount of ordinary coaching could reach on its own.", "Kayla still remembered the very first time she had competed against Bianca, two years earlier, at a mid-level regional meet neither of them had expected much from. Bianca had been the new gymnast that day, having just moved up from a lower level, and Kayla remembered feeling a flicker of surprise, then a much sharper flicker of alarm, watching Bianca's bar routine unfold with a cleanness and difficulty far beyond what Kayla had expected from someone so unfamiliar. Bianca had won the all-around that day by four tenths of a point. Kayla had gone home and added an extra tumbling pass to her floor routine within the week, purely out of a stubborn refusal to let that gap stand.", "Their rivalry had a strange rhythm to it over those two years, one that outsiders rarely understood. Teammates on both sides sometimes assumed the two girls must dislike each other, given how fiercely they competed, but the truth was more complicated than that. Kayla genuinely admired Bianca's bar work, the effortless-looking way she flowed between releases that took most gymnasts years to trust. Bianca, for her part, had once told a teammate, without any bitterness at all, that Kayla's floor choreography was the best in the region and that she'd studied videos of it more than once, trying to understand exactly what made it work so well. Neither girl had ever said any of this directly to the other. It simply wasn't the kind of thing rivals said out loud, or so both of them had always assumed.", "The state championship meet that spring was, everyone agreed, likely to come down to the two of them once again. Kayla arrived at the enormous arena with her stomach doing familiar nervous flips, scanning the competition floor until she spotted Bianca across the room, stretching with her own team, her focused, determined expression exactly the one Kayla had come to recognize and, in a strange way, respect over two years of fierce competition.", "The arena itself felt bigger than usual, banners from years past hanging from the rafters, the stands slowly filling with parents and teammates and younger gymnasts craning their necks to watch the older girls compete. Kayla ran through her mental checklist while she stretched: chalk her grips before bars, double-check her beam mount, save just a little extra energy for the final tumbling pass on floor, the one that always felt hardest after everything that had come before it. It was the exact same checklist she ran through before every meet, and running through it now, familiar and steady, helped settle some of the nervous flipping in her stomach.", "The meet began well for both of them. Kayla posted strong scores on vault and bars, her giant swings on the high bar drawing an appreciative murmur from the crowd. Bianca matched her nearly point for point, her own bar routine, the one Kayla privately admired more than she'd ever admit, flowing smoothly from one release to the next without a single visible hesitation. By the time the rotation reached balance beam, the two of them remained locked in an extremely close battle for first place, with only floor exercise still to come after beam.", "Kayla competed her own beam routine first, hitting it cleanly, earning one of the best scores of her season. She sat down on her team's bench afterward, breathing hard, and turned to watch Bianca's turn, the way she always did, unable to look away even though they were, technically, opponents.", "Bianca saluted the judges and began her routine. For the first thirty seconds, it was beautiful, precise, exactly the kind of composed, controlled performance Kayla had come to expect from her fiercest competitor. And then, in the middle of a difficult turning sequence, Bianca's foot slipped.", "She fell off the beam entirely, landing hard on the mat below, and the whole arena seemed to draw in a collective breath. Bianca climbed back up quickly, as gymnasts are trained to do, but something had clearly shaken loose. Her composure, so solid moments before, had cracked. On her very next skill, a difficult series of turns, she wobbled badly and fell again.", "She finished the routine somehow, her face a careful, brittle mask, and walked off the podium toward her team's bench with her eyes fixed firmly on the floor, clearly fighting back tears.", "A hush had fallen over the section of the arena where Bianca's teammates sat, the particular helpless quiet of watching someone you care about struggle in front of hundreds of strangers with absolutely no way to help. One of Bianca's younger teammates, a ten-year-old still competing at a much lower level, had her hands pressed over her mouth, eyes wide, clearly unsure whether it was appropriate to look worried or to keep cheering as though nothing had happened.", "Kayla knew, with the cold clarity of pure competitive math, exactly what this meant. Bianca's two falls had almost certainly cost her the all-around title. Kayla, barring some disaster of her own on the final event, was likely about to win the state championship for the first time in her career.", "She felt the flicker of excitement she expected to feel. And right behind it, unexpectedly, she felt something else entirely: a sharp, genuine ache of empathy for the girl sitting alone on the opposite bench, shoulders curled inward, visibly trying not to fall apart in front of the entire arena. Kayla could imagine, all too clearly, exactly what that felt like from the inside. She remembered her own worst meet, the year before, when a bad ankle roll on vault had cost her a medal she'd trained all season for, and how badly she had wanted, in that moment, for even one person watching to say something kind instead of simply moving on toward their own celebration.", "Ms. Okonkwo, sensing something in Kayla's expression, leaned over. \"You've got two minutes before we start warming up floor,\" she said. \"Whatever you're thinking about doing, you've got two minutes to do it.\"", "Kayla's own coach called her over to begin warming up for floor exercise, the final event. Kayla nodded, but before she went, she did something that surprised even herself. She walked directly across the competition floor to where Bianca sat.", "\"Hey,\" Kayla said quietly, crouching down beside her rival.", "Bianca looked up, startled, her eyes red-rimmed. \"What do you want?\" she asked, not unkindly, just defensively, bracing for something.", "\"I know we're not exactly friends,\" Kayla said. \"And I know this is probably weird. But I've watched you compete for two years, and I know exactly how hard you've worked to get here. Two falls on one bad day doesn't erase any of that. You're still one of the best gymnasts I've ever competed against, and I mean that completely. Whatever happens on floor, that doesn't change.\"", "Bianca stared at her for a long moment, clearly surprised, perhaps even suspicious at first that this was some kind of strategy, a competitor trying to unsettle her further. But something in Kayla's expression must have convinced her it was genuine, because her shoulders, which had been rigid with tension, dropped slightly.", "\"Why are you being nice to me?\" Bianca asked. \"You're probably about to beat me for state champion. Isn't this exactly what you wanted?\"", "Kayla considered the question honestly. \"I want to win,\" she admitted. \"I'm not going to pretend I don't. But I don't want to win because you fell apart out there. I want to beat the version of you that's actually at her best. And besides,\" she added, \"watching someone have their worst moment in front of a huge crowd, and not saying anything, when I could have said something kind instead — that's not really who I want to be. Rival or not.\"", "Bianca let out a small, surprised laugh, more relief than humor. \"That's a very gracious thing to say to someone you're trying to beat.\"", "\"Maybe,\" Kayla said, standing up and offering Bianca a hand. \"Or maybe good sportsmanship and wanting to win aren't actually opposites. Go warm up. Show everyone what you can really do on floor. I'll be rooting for a great routine, even if I'm still trying to beat it.\"", "Bianca took her hand, pulled herself up, and managed a small, genuine smile. \"Thanks, Kayla. I mean it.\"", "\"For what it's worth,\" Kayla added, already turning to head toward her own warm-up area, \"the turning sequence you fell on? I've fallen on that exact same skill probably a dozen times in practice. It's a genuinely hard one. You're not the only person that skill has ever humbled.\"", "Bianca managed something closer to a real laugh this time. \"Somehow that actually helps.\"", "Both girls headed to their own team areas to prepare, and Kayla noticed, glancing over during her own warm-up tumbling pass, that Bianca's coach had her running a much simpler, calmer drill than usual, clearly aiming to rebuild her composure one small success at a time rather than pile on more pressure before the biggest routine of the day. Kayla recognized the strategy immediately. It was almost exactly what Ms. Okonkwo would have done in the same position.", "Ms. Okonkwo, watching Kayla's own warm-up with a careful eye, seemed to sense that something had shifted in her gymnast since the beam rotation. \"You look calmer than I expected,\" she said, chalking Kayla's grips for her out of habit. \"Given everything.\"", "\"I feel calmer,\" Kayla admitted, surprising herself with how true it was. \"I thought talking to her might make me more nervous, actually. Like maybe I'd start second-guessing whether I even deserved to win if it came down to her having a bad day. But it's the opposite. I know exactly what I need to do out there now. Hit my routine, the best version of it, regardless of what anyone else's day looked like.\"", "\"That's about the healthiest way I've ever heard a competitor describe wanting to win,\" Ms. Okonkwo said. \"Most people your age think composure means not feeling anything. You clearly felt plenty back there. You just didn't let it knock you off your own plan.\"", "Kayla filed that thought away for later, the way she sometimes filed away a coaching correction mid-routine, to think about properly once the adrenaline of the moment had faded.", "Both girls competed their floor routines a short while later. Bianca's was strong, composed, and clean, a clear sign that whatever had rattled her on beam had not followed her to the final event. She landed her opening tumbling pass with real confidence, and by the time she hit her final pose, arms raised, chest heaving, the arena gave her a warm, appreciative round of applause, the kind reserved for a gymnast who has visibly fought her way back from something difficult.", "Kayla's was, by a narrow margin, slightly stronger, enough to secure her the state all-around championship for the first time in her career, with Bianca finishing a close second.", "When the results were announced, Kayla stood on the top step of the podium, medal around her neck, and looked over at Bianca standing one step down, applauding along with everyone else despite the disappointment still visible in her eyes.", "After the ceremony, Bianca approached her, medal in hand. \"Congratulations,\" she said, and this time the word carried none of the stiff formality it usually did between them. \"Really. You earned that.\"", "\"You'll get me next time,\" Kayla said, grinning. \"You always push me to be better. I mean that as a real compliment, not just a nice thing to say.\"", "\"Same,\" Bianca said. And then, after a small pause, she added, \"Do you want to get food with our teams after this? I feel like two years of being rivals should probably come with at least one actual conversation that isn't about beam scores.\"", "Kayla laughed. \"Yeah. I'd really like that.\"", "Later, sitting across from each other at a crowded pizza place packed with both of their teams, medals still hanging around their necks, Kayla learned things about Bianca she never would have guessed from two years of watching her compete: that Bianca had started gymnastics almost by accident, tagging along to her older cousin's practices until a coach finally let her join in; that she was terrified of the color-guard tryouts her school held every fall, an entirely different kind of nervous than anything a beam routine had ever given her; that she'd actually admired Kayla's bar work for years and had quietly copied one of her handstand drills after watching her do it at a meet.", "\"Wait, seriously?\" Kayla said, delighted. \"I made that drill up because my old one wasn't working. I didn't think anyone was even paying attention.\"", "\"Everyone pays attention to you,\" Bianca said. \"That's kind of the problem with being your rival for two years.\"", "\"Same problem, other direction,\" Kayla said. \"I've watched more film of your bar routines than I've probably watched of my own.\"", "Bianca laughed, nearly knocking over her water cup. \"That's either really flattering or really strange, and I genuinely can't decide which.\"", "\"Both, probably,\" Kayla said. \"I think that's just what two years of this does to a person.\"", "Their teammates, scattered around the same crowded table, had long since stopped paying attention to the two rivals talking quietly at one end, absorbed instead in their own celebrations and consolations, passing slices of pizza back and forth, comparing bruises and grip tears from the day's competition. Kayla found herself grateful for the noise around them, the ordinary, unremarkable clatter of a team dinner, because it meant nobody was watching closely enough to notice how strange and how good this particular conversation actually felt.", "They walked off the competition floor together, still, technically, rivals, medals of different colors hanging around their necks, but something between them had shifted into something new: not quite friendship yet, but the genuine beginning of it, built, unexpectedly, out of a fall, a hand extended at exactly the right moment, and the discovery that competing fiercely against someone and caring about them were never actually opposites at all.", "In the weeks that followed, Kayla found herself thinking differently about rivalry altogether. She had always assumed, without really examining the assumption, that caring about a competitor's feelings would somehow make her a softer, less serious athlete, someone not quite hungry enough to win. What she discovered instead was almost the opposite: that the moment on the beam-side bench with Bianca had not cost her anything on floor exercise. If anything, she had competed that final routine with a steadier kind of focus, freed up, in some way she couldn't fully explain, by having already done the harder, kinder thing before her feet ever touched the floor mat.", "Ms. Okonkwo mentioned this to her during the drive home that evening. \"You know,\" she said, \"some of the best competitors I've ever coached were also some of the kindest. People assume those two things pull against each other. I've never actually seen it work that way.\"", "\"I used to think being nice to Bianca would feel like giving something away,\" Kayla said, watching the arena lights fade in the rearview mirror. \"Like there wasn't enough room to want to win and also want good things for her.\"", "\"And now?\"", "Kayla thought about it for a long moment. \"Now I think maybe composure and empathy come from the same place. Staying calm enough to notice someone else is struggling, and staying calm enough to hit your own routine anyway. Might be the same muscle.\"", "Ms. Okonkwo smiled and said nothing else the rest of the drive, letting Kayla sit with the thought a while longer, turning her state championship medal over slowly in her hands the whole way home.", "The following week at practice, a younger gymnast on Kayla's own team, a nervous nine-year-old named Ruby who had just moved up a level, mentioned quietly that she was dreading her first meet against an older, more experienced rival from a neighboring gym. Kayla, chalking her hands before a bar routine, found herself repeating almost word for word what she'd told Bianca on that bench weeks earlier.", "\"She's not your enemy,\" Kayla said. \"She's just someone who happens to be really good at the exact same thing you're trying to get really good at. That's actually kind of rare and kind of wonderful, if you think about it the right way. It means you get to have someone pushing you to be better, whether either of you planned on it or not.\"", "Ruby considered this with the serious, careful attention younger gymnasts often gave to advice from older teammates. \"Did you used to hate your rival?\"", "\"Never hated her,\" Kayla said. \"Definitely wanted to beat her, every single time. Still do. Turns out those two things were never actually opposites. I just took two years to figure that out.\""]}, {"vocab": [{"w": "observe", "d": "to watch something closely and carefully"}, {"w": "contour", "d": "the outline or shape of an object's edge"}, {"w": "detail", "d": "a small, specific part of something"}, {"w": "naturalist", "d": "a person who studies plants, animals, and the natural world"}, {"w": "perspective", "d": "the way something looks from a particular position or point of view"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Priya learns that careful observation, not memory, is the key to drawing things accurately", "Drawing is impossible to learn", "Bugs are dangerous to draw", "Only professional artists can draw well"], "ans": 0, "why": "The naturalist teaches Priya to truly observe rather than draw from assumption."}, {"skill": "Details", "q": "What tool does the naturalist give Priya to help her slow down and look closely?", "opts": ["A magnifying glass", "A camera", "A paintbrush", "A ruler"], "ans": 0, "why": "The magnifying glass helps her see details she had been missing."}, {"skill": "Inference", "q": "Why did Priya's maple leaf drawings all look the same even though real leaves are different?", "opts": ["She was drawing from a general idea of a leaf in her head instead of really looking at each one", "She was tracing them", "She used the wrong paper", "She drew too fast on purpose"], "ans": 0, "why": "She had been drawing a mental symbol of \"leaf\" rather than the actual leaf in front of her."}, {"skill": "Cause and effect", "q": "What happened after Priya practiced contour drawing without looking at her paper?", "opts": ["She began noticing far more real detail in the edges of objects than before", "Her drawings became messier and she gave up", "She drew faster than ever", "Nothing changed"], "ans": 0, "why": "Blind contour drawing trains the eye to
