range mix of emotions. She was surprised, but she wasn’t angry. She looked at Hippomenes, who was doubled over, gasping for air, and she realized that he had beaten her fairly. He had used his mind, not just his legs, and he had done it because he admired her.", "“You are cleverer than you look,” she said with a small smile.", "“And you are faster than anyone I have ever seen,” he replied. “I only won because I had a little help.”", "Atalanta laughed. It was the first time she had laughed in a long while. She saw that the challenge she had made was met with kindness and cleverness, and that made it worth honoring. They talked long into the evening. And in the end, she decided that she liked him.", "Some tellings of the myth say that Atalanta and Hippomenes lived happily for a time. Others say the gods played tricks on them. But the part that matters most is the beginning. Atalanta was a girl who was left alone in the wilderness, and she became strong. When other people tried to tell her who to be, she chose her own path. She was brave, she was swift, and she was wise.", "The Greeks told stories about Atalanta for thousands of years. Today, when you see a girl racing on a track, climbing a mountain, or kicking a soccer ball across a field, you might say she’s running in Atalanta’s footsteps.", "And if you are ever tempted by a shiny distraction, like a golden apple, remember what the swiftest girl in Greece learned. The greatest race is the one you run for yourself, and the best prize is knowing who you are."]}, {"vocab": [{"w": "beast", "d": "a large, wild animal"}, {"w": "village", "d": "a small community of people, smaller than a town"}, {"w": "lantern", "d": "a light inside a case of paper, glass, or metal that you can carry"}, {"w": "firecracker", "d": "a small paper tube that makes a loud bang"}, {"w": "celebrate", "d": "to do something special to show that an occasion is important"}], "quiz": [{"skill": "Main idea", "q": "What does this legend explain?", "opts": ["Why people celebrate Lunar New Year with red, lights, and noise", "How mountains are formed", "Why dragons fly", "How lanterns are made"], "ans": 0, "why": "The legend gives a reason for red decorations and firecrackers at the New Year."}, {"skill": "Details", "q": "Which three things scared Nian away?", "opts": ["Red, fire, and loud noise", "Water, wind, and snow", "Music, milk, and mice", "Gold, silver, and jade"], "ans": 0, "why": "The old man learned that red, bright light, and loud bangs frightened the beast."}, {"skill": "Inference", "q": "Why did the villagers hide in the mountains every year?", "opts": ["They were afraid of the beast", "They enjoyed camping", "They needed more food", "They lost their homes"], "ans": 0, "why": "They fled because Nian attacked the village each winter."}, {"skill": "Character", "q": "What kind of person was the old man?", "opts": ["Wise and brave", "Angry and cruel", "Silly", "Shy"], "ans": 0, "why": "He faced the beast with a plan instead of running away."}, {"skill": "Vocabulary", "q": "What is a lantern?", "opts": ["A light you can carry", "A kind of shoe", "A monster", "A mountain"], "ans": 0, "why": "People carry lanterns during the New Year festival."}], "title": "The Monster Called Nian", "cat": "myth", "blurb": "Every winter a fierce beast came down from the mountains to a small village. One clever child and one brave old man discovered what he was really afraid of.", "paras": ["A very long time ago, in a small village in China, there lived a beast called Nian.", "Nian was enormous. He had the body of a lion, the horns of a bull, and a mouth as big as a cave. His teeth were long and sharp. His eyes glowed like hot coals, and when he roared, the mountains shook. He lived in the deep sea or in the highest cave, depending on who told the story. But once every year, on the last night of winter, he came down from the mountains to look for food.", "The villagers dreaded that night. When Nian arrived, he ate their crops. He ate their chickens. Sometimes he ate the farmers’ pigs, and sometimes, people whispered, he ate much worse. So every year, as the last day of winter drew near, the villagers packed up their families, gathered their belongings, and fled into the hills to hide until the beast had gone.", "One year, a boy named Wei helped his grandmother pack her bundles. Wei was eight years old, and he was curious about everything. As they walked up the mountain trail, he asked, “Grandmother, why does Nian come?”", "“Because he is hungry,” said his grandmother. “He always has been.”", "“Why doesn’t anyone try to stop him?”", "“Hush, child. Nobody can. He is too strong.”", "Wei frowned. It seemed silly to him that a whole village should run away every year. If everyone was afraid, that was because nobody had ever tried to fight back.", "When they reached the top of the hill, an old man was coming down the path in the opposite direction. He carried a walking stick and wore a long red robe. His beard was white as snow, and his eyes were kind. He looked like someone who knew many things.", "“Excuse me,” said Wei’s grandmother. “You must be a stranger. You are going the wrong way. The beast is coming tonight.”", "“Yes,” said the old man calmly. “I know. That is why I’m going to the village.”", "Everyone stared at him. “Are you mad?” asked the grandmother. “Nian will eat you alive!”", "“Perhaps,” said the old man. “But if I stay one night, I may be able to help. May I ask for a place to sleep?”", "An old woman in the village had stayed behind, refusing to leave her home. She agreed to let the stranger stay. “I don’t know what you are planning,” she said, “but you’re braver than I am.”", "That evening, the old man walked through the village, studying the houses. He looked at the doors. He looked at the windows. He looked at the walls. He nodded thoughtfully and said, “Do you have some red paper?”", "“Red paper?” said the woman. “Why?”", "“Because I have heard that Nian is afraid of something,” he said.", "Wei, who had sneaked back down the mountain out of curiosity, hid behind a wall and listened. His heart was pounding.", "The old man told the woman what he had noticed. Long ago, he explained, when he was a traveler in the mountains, he had once seen the beast. It had been walking through a village, and it stopped short when it saw a child wearing a red coat. It growled and backed away. He had noticed the same thing a second time, when a bright fire burned near a house. Nian had stayed far away. And a third time, when a loud noise made him flinch.", "“I believe,” said the old man, “that Nian is afraid of three things. The color red. Bright light. And loud noise.”", "“Are you sure?” asked the woman.", "“No,” he said honestly. “But it’s worth trying.”", "Together, they worked quickly. They cut long strips of red paper and pasted them on all the doors. They hung red cloth across the windows. They lit lanterns and candles until the whole house glowed like a small sun. And the old man gathered bamboo stalks, dry and hollow, and piled them near the fire.", "“What are these for?” asked the woman.", "“You’ll see,” said the old man.", "Night fell. The village grew silent. The wind whispered through the empty streets. Then, from far away, there came a low rumble. The ground began to tremble. Nian was coming.", "He crashed down from the mountain, his eyes flashing and his roar echoing off the hills. He sniffed the air. He smelled food. He thundered into the village, past the empty houses, until he reached the small house at the end of the road.", "But the house looked different. It blazed with light. Red banners flapped in the breeze. Nian stopped, confused. He had never seen anything like it. The color red made his skin prickle. His ears flattened.", "“Now!” whispered the old man.", "He threw a handful of bamboo into the fire. They crackled and popped. Bang! Bang! Crack! The sound exploded through the night like thunder. Nian jumped a foot in the air and let out a yelp.", "Bang! Bang! Crack! Crack! The old man tossed in more, and the noise grew louder. Wei, hiding behind the wall, covered his ears. Even the old woman flinched.", "Nian howled. He turned around and ran. He crashed through the village and up the mountain, faster than he had ever run before, and vanished into the darkness. The pops and bangs echoed after him, and they didn’t stop until the sky began to turn pink with dawn.", "When morning came, the villagers crept back from the hills. They were surprised to find their homes untouched. Nothing had been eaten. No fences had been broken. And in the middle of the village stood the old man, leaning on his walking stick, smiling.", "“How did you do it?” they asked.", "“Nian is not invincible,” said the old man. “He is only a beast. And all beasts fear something. All you needed to do was find out what.”", "Wei ran up to him. “Will he come back?”", "“He may,” said the old man. “But now you know what to do.”", "The villagers were overjoyed. They thanked the old man and asked him to stay, but he only shook his head. “I have somewhere else to go,” he said. And he vanished into the morning mist. Some people say he was a god, or a wise traveler. Nobody ever saw him again.", "The following winter, on the last night of the year, the villagers remembered what they had learned. They hung red paper on their doors. They lit lanterns until the streets glowed. They lit bamboo, and later firecrackers, and the whole village rang with noise. Nian never returned to bother them.", "Instead, it became a celebration. Everyone gathered at midnight, told stories, shared a huge meal, and welcomed the new year with joy. Children were given red envelopes with lucky money inside. Families wore red clothes. They hung red lanterns in the streets and pasted red paper couplets with good wishes on their doors. And they stayed up late, laughing and eating dumplings, watching the fireworks light up the sky.", "The tradition spread from village to village, and from generation to generation. Even today, when families celebrate the Lunar New Year, also called the Spring Festival, they use red for luck and happiness. They hang lanterns, set off fireworks, and gather with those they love. The word for New Year in Chinese, nian, is the same as the name of the beast. Some people say that the festival is called guo nian, which can mean either “to pass the year” or “to get past Nian.”", "Many years later, when Wei was old and gray, his grandchildren asked him about the monster. “Was it real, Grandfather?”", "Wei smiled and stirred his tea. “Maybe,” he said. “Maybe not. But I’ll tell you what I learned. When you’re afraid of something, don’t run right away. Look closely. Ask questions. Find out what it’s really afraid of. Often the scariest monsters are more frightened than they look.”", "Outside, firecrackers popped, and paper lanterns swayed in the wind. The whole street was glowing red.", "“And that,” said Wei, “is how we chased away the New Year’s monster.”"]}, {"vocab": [{"w": "whisper", "d": "to speak very softly"}, {"w": "mysterious", "d": "strange and hard to explain"}, {"w": "investigate", "d": "to look into something carefully to find out the truth"}, {"w": "echo", "d": "a sound that bounces off a surface and repeats"}, {"w": "explanation", "d": "a reason that tells why something happens"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Juniper solves a mystery about strange whispers in the library", "A kid who hates books", "A new library opening", "A haunted house"], "ans": 0, "why": "She investigates and finds a real explanation."}, {"skill": "Details", "q": "Where did the whispering sound come from?", "opts": ["A vent connected to the old reading room", "A ghost", "A radio", "The basement"], "ans": 0, "why": "The whispers were voices traveling through the air vent."}, {"skill": "Inference", "q": "Why did Mrs. Okafor think the library was haunted?", "opts": ["She heard voices when nobody was there", "She saw a ghost", "She dreamed it", "A friend told her"], "ans": 0, "why": "The voices seemed to come from empty places."}, {"skill": "Cause and effect", "q": "Why could Juniper hear the story club through the vent?", "opts": ["Sound traveled through the old ventilation pipes", "She had a radio", "The wall was thin", "She was standing next to them"], "ans": 0, "why": "Pipes carried the sound like a telephone."}, {"skill": "Vocabulary", "q": "What does “investigate” mean?", "opts": ["To look into something carefully", "To ignore", "To hide", "To laugh"], "ans": 0, "why": "Juniper investigates the whispers."}], "title": "Juniper and the Whispering Library", "cat": "adventure", "blurb": "Strange whispers come from the shelves of the Bothell library every night. Detective Juniper investigates a very quiet mystery with a very loud ending.", "paras": ["The Bothell library was the quietest place in the whole world, or so Juniper Mbeki had always believed. It had tall shelves and soft carpets and a big, round clock that ticked so softly that you had to hold your breath to hear it. The only sounds were the turning of pages and the occasional cough.", "That’s why Mrs. Okafor, the head librarian, looked so worried on Monday morning.", "“I need your help, Juniper,” she said, wringing her hands. “Something strange is going on in this library. It has been happening for a week now.”", "Juniper was eleven years old, and she was well known around town as a detective. She had solved the case of the missing tutu, the mystery of the lost lunchbox, and the puzzle of who had been eating the school garden’s tomatoes. She always carried a small notebook, and a magnifying glass on a chain around her neck.", "“What kind of strange?” she asked, flipping open her notebook.", "Mrs. Okafor leaned in and lowered her voice. “Whispers,” she said. “Every evening, after closing time, when I’m alone, I hear whispers. They come from the back of the library, near the old reading room. I can’t make out the words, but they’re definitely voices. And nobody is there.”", "A small shiver ran down Juniper’s back. But she stayed calm. “When do the whispers start?”", "“Always around six o’clock,” said Mrs. Okafor. “Right after we lock the doors. The whispering goes on for about an hour, and then it stops.”", "“Have you looked for the source?”", "“Of course. I searched every corner. There is no one. I’m starting to think the library is haunted.” She glanced nervously around. “Some of the regular readers have heard it too. Mr. Ivanov said he heard a voice say, ‘Beware the dragon.’”", "Juniper tapped her pencil on her notebook. “Interesting,” she said. “Ghosts don’t generally give advice about dragons. I’ll investigate.”", "That evening, Juniper arrived at the library just before closing time. She brought a flashlight, a thermos of hot chocolate, and her best friend, Sam, who loved mysteries almost as much as she did, and who was extremely afraid of ghosts.", "“Are you sure this is a good idea?” whispered Sam, gripping the flashlight so hard his knuckles turned white.", "“Scientific investigation requires courage,” said Juniper. “Also, snacks.”", "They found a hiding spot behind a large bookshelf in the reading room. Mrs. Okafor locked the doors and went to her desk, and the library grew still. The big clock ticked. A radiator hissed. Outside, the sky turned purple.", "At six o’clock exactly, they heard it.", "At first it was so faint that Juniper thought she was imagining it. A soft, low murmur, like wind in far-off trees. Then it grew clearer. Voices. Many voices, speaking softly, all at once.", "“…and then the dragon rose from the lake…”", "“…don’t forget the map…”", "“…the king will never find it…”", "Sam’s eyes went wide. “Juniper,” he whispered. “Those are ghosts.”", "“Ghosts don’t have Northwest accents,” said Juniper. “Listen carefully.”", "They crept closer. The voices seemed to come from the far wall, where an old iron grate covered a vent in the plaster. Juniper pulled out her magnifying glass. The grate was dusty. But on the floor below it, she saw something odd: a scrap of paper, folded neatly in half. She unfolded it. On it was a drawing of a dragon, and beneath it, a line of writing in pencil. Chapter Three.", "“Chapter Three,” Juniper murmured. “That’s not a ghost. That’s a story.”", "“What?” asked Sam.", "“Someone is telling a story. The voices are coming from somewhere else, and they’re traveling through this vent.” She pressed her ear against the grate. “The sound is louder here. It’s like a giant telephone.”", "“But where is it coming from?”", "Juniper looked up. The vent was connected to a pipe that ran along the ceiling and disappeared through the wall. “Follow the pipe,” she said.", "They tiptoed along the wall, tracing the pipe with their flashlight. It curved around a corner, past the nonfiction section, and across the ceiling, and it led, at last, to a locked door at the back of the library. A brass sign read, STAFF ONLY. BASEMENT.", "Sam swallowed. “Are we really going down there?”", "“Where else would the pipe lead?” said Juniper.", "She turned the knob, and to her surprise, the door was unlocked. Beyond it, a set of wooden stairs descended into the dark. From below came the sound of the voices again, clearer and louder. And now Juniper thought she could smell something else: popcorn.", "Slowly, the two friends crept down the stairs. At the bottom, they found a long, dim hallway lit with warm yellow light. At the end was a half-open door. Through it came laughter.", "Juniper peeked inside. She burst out laughing.", "The basement was full of kids and grown-ups, sitting on cushions and old couches, in a big circle. Bowls of popcorn passed from hand to hand. A woman in a purple scarf sat in a rocking chair, holding a thick, battered book. She read aloud in a deep, dramatic voice.", "“And then the great dragon rose from the lake!” she cried, spreading her arms wide. “Its scales shone like a thousand mirrors!”", "“Ooooh,” said the audience.", "“Wow,” said Sam. “It’s a story club.”", "Just then, the woman noticed them. “Well, hello,” she said, smiling. “Are you here for the meeting?”", "“I’m sorry,” said Juniper. “We didn’t mean to interrupt. We thought there was a ghost.”", "The woman burst out laughing. “A ghost? Oh dear. We’ve been meeting here every evening for a week. We’re the Basement Book Club. We read fantasy stories out loud. Nobody told you?”", "“We didn’t know,” said Juniper. She glanced back at the door. “The library staff never mentioned it.”", "“Oh, we asked Mr. Delaney, the custodian,” said the woman. “He let us use the room. We didn’t realize the old vent would carry the sound all the way upstairs. It seems to work like a whispering gallery.”", "Juniper smiled. That was a good explanation. Long ago, builders had discovered that certain shapes of rooms and pipes could carry whispers over great distances. The sound waves bounced along the walls, like a ball rolling down a tunnel, and came out the other end. The voices had traveled through the pipe, through the vent, and into the reading room. It was the echo of a story, not the sound of a ghost.", "“You solved the mystery,” said the woman.", "“I guess I did,” said Juniper. “But it was more of a quiet mystery than a spooky one.”", "They climbed back upstairs and told Mrs. Okafor. She was so relieved that she hugged them both. “A book club! What a wonderful thing. And here I thought we were haunted.”", "“Perhaps you could put a sign on the vent,” suggested Juniper. “Or move the club to a different room.”", "“Or,” said Mrs. Okafor, her eyes twinkling, “maybe we could let everyone hear. A story hour for the whole library, every evening at six. A whispering story hour.”", "Sam looked thrilled. “That’s a great idea! Can we join?”", "“Of course,” said Mrs. Okafor. “I believe you’ve earned it.”", "The next evening, Juniper and Sam sat in the basement with the rest of the Basement Book Club. The woman in the purple scarf read from her big book. It was a story of a girl and a dragon and a lost map. Juniper sat on a cushion with a bowl of popcorn in her lap, listening, wide-eyed, as the words danced across the room. Even Sam forgot to be scared.", "When the chapter ended, Juniper wrote in her notebook. Case closed. The mysterious whispers were a story club. Cause: sound traveling through an old vent. She paused, and added one more line at the bottom.", "Sometimes the scariest sounds have the most wonderful explanations.", "From then on, the library at six o’clock was not quiet at all. But nobody complained. The whispers drifted up through the vent like gentle music, and everyone who heard them stopped to listen. It turned out that even a silent library likes a good story."]}, {"vocab": [{"w": "treasure", "d": "a collection of valuable things, like gold or jewels"}, {"w": "ferry", "d": "a boat that carries people and vehicles across water"}, {"w": "compass", "d": "a tool with a needle that shows directions"}, {"w": "cove", "d": "a small, sheltered bay on the coast"}, {"w": "landmark", "d": "an easy-to-see object or place that helps you find your way"}], "quiz": [{"skill": "Main idea", "q": "What is the story mostly about?", "opts": ["Two kids follow a map and discover something meaningful", "A pirate war", "Learning to swim", "A broken boat"], "ans": 0, "why": "They find a family treasure that matters more than gold."}, {"skill": "Details", "q": "What did the children find inside the metal box?", "opts": ["Photographs, letters, and a small brass compass", "Gold coins", "A sword", "A crown"], "ans": 0, "why": "The treasure was made of family memories."}, {"skill": "Inference", "q": "Why did Grandpa hide the map?", "opts": ["He wanted the kids to enjoy an adventure and learn about the family", "He was mean", "He forgot", "He wanted to sell it"], "ans": 0, "why": "He planned a treasure hunt to share his memories."}, {"skill": "Sequence", "q": "What was the last landmark on the map?", "opts": ["A lighthouse", "A bridge", "A cave", "A church"], "ans": 0, "why": "The map ended at an old lighthouse."}, {"skill": "Vocabulary", "q": "What is a landmark?", "opts": ["An easily seen object that helps you find your way", "A kind of map", "A sea animal", "A bridge"], "ans": 0, "why": "The lighthouse and the twisted tree were landmarks."}], "title": "The Treasure Map in Grandpa's Attic", "cat": "adventure", "blurb": "A crumbling map hidden inside an old trunk leads Owen and his cousin across the San Juan Islands on a hunt for treasure. The prize is not what they expect.", "paras": ["When Owen Reyes turned ten, his grandfather gave him the strangest gift he had ever received. It was a brass key. It was small and heavy, about as long as his finger, and tied to a leather cord.", "“What does it open?” asked Owen.", "“You’ll have to find out,” said Grandpa Joe with a wink. He was a retired ferry captain, with a face like weathered wood and a laugh like a foghorn. He lived in an old white house on Orcas Island, in Washington’s San Juan Islands, where the tide rose and fell twice a day and eagles nested in the tall fir trees. Every summer, Owen and his cousin Mila came to stay for a week.", "This summer, the key was waiting on Owen’s pillow.", "“There’s a hint,” said Grandpa Joe. “Look in the attic.”", "Owen and Mila raced up the creaky stairs. The attic was warm and dusty. Sunbeams slanted through a round window. Boxes and trunks were stacked everywhere, and cobwebs hung like curtains. Mila sneezed. “It smells like a museum.”", "“Look,” said Owen. In the corner was an old wooden trunk with a keyhole. He slipped in the key, and it turned with a soft click.", "Inside the trunk, on top of a moth-eaten wool blanket, lay a rolled-up piece of yellowed paper. Owen unrolled it carefully. It was a map, drawn in faded blue ink. There was a coastline, a few small islands, and a dotted line that wound from a place marked HOME to a small red X.", "Beneath the X, someone had written in tiny letters: Follow the compass. Find what matters most.", "“It’s a treasure map,” breathed Mila. “A real treasure map!”", "“Grandpa must have made it for us,” said Owen. “Or maybe it was his grandfather’s. Look, there are clues.”", "Along the dotted line, small drawings marked the way. A twisted tree. A stone bridge. A tall rock shaped like a whale’s tail. At the very end, a tiny lighthouse stood beside the X.", "“I know that lighthouse,” said Mila. “It’s at the far end of the island.”", "“Then let’s go,” said Owen.", "They packed a backpack with water, sandwiches, a flashlight, and a notebook. Mila grabbed Grandpa’s old compass, a round brass one with a swinging needle that always pointed north. Owen tucked the map safely into his jacket. Grandpa Joe waved from the porch. “Be back before dinner,” he called. “And watch the tide!”", "The first landmark was easy. They followed a dirt road through the forest until they found a tree with a trunk twisted like a corkscrew. Long ago, it had been struck by lightning and had grown back crooked. Mila checked the compass. “The map says to go southeast from here.”", "“Which way is that?” asked Owen.", "“It’s where the needle points, plus a little bit,” said Mila, who had learned to use a compass at summer camp. “See? The N stands for north. Southeast is halfway between south and east.”", "They trudged through ferns and moss. The forest smelled like rain and cedar. Squirrels chattered overhead. After half an hour, they heard the burble of a stream, and around the next bend they saw a bridge made of gray stone, covered in moss.", "“Second clue,” said Mila. She checked the map. “Now we follow the stream to the sea.”", "The stream twisted and tumbled over rocks, and by the time they reached the shore, they were hot and tired. They sat on a driftwood log and ate their sandwiches. The sea spread out before them, blue and sparkling. Seagulls cried. A ferry chugged slowly across the horizon.", "“How much farther?” asked Owen.", "“Not far,” said Mila. She pointed. “Look. That’s the whale tail rock.”", "Sure enough, a huge black rock jutted out of the water, shaped exactly like a whale’s tail. The tide was low, and a narrow path of wet stones led out toward it, glistening in the sun. “The map says to go around it,” Mila said. “But be careful. The tide is coming in.”", "They picked their way over slippery rocks. Little crabs scuttled out of the way. Starfish clung to the stones in purple and orange. It felt like walking through a giant aquarium. When they reached the far side of the rock, they saw a small cove, and beyond it, at the end of a long, rocky point, the white lighthouse.", "“That’s it!” cried Owen.", "They raced along the beach. The lighthouse was old and weathered, with peeling paint, and its lantern room had long since gone dark. A rusty door stood at the base. Owen checked the map. “The X is inside.”", "Mila pushed the door open. It creaked. Inside, a spiral staircase wound upward into shadow. Dust floated in the shafts of light. At the foot of the stairs, they found a small stone alcove. And in the alcove sat a metal box.", "Their hearts thudded. Owen knelt and lifted the lid. Inside were dozens of old photographs, yellowed with age. A bundle of letters tied with string. A folded flag. And at the very bottom, a small brass compass, just like the one in Mila’s hand.", "“This is it?” said Mila, a little disappointed. “There’s no gold.”", "Owen picked up a photograph. It showed a young man with a big grin, standing on the deck of a ferry. On the back, in careful handwriting, someone had written, Captain Joe, my first day. He turned over another. It showed a boy and a girl standing on a beach, holding fishing poles. He recognized them. “That’s my mom. And your mom.”", "“They’re so little!” Mila said.", "They spread the pictures on the floor. There were photos of Grandpa Joe with his father, hauling nets. Photos of Grandma Rose, who had died before they were born, laughing in a garden. A picture of the whole family at a picnic, years and years ago, everyone squinting into the sun. There was a lighthouse in every single one of them.", "The letters were addressed to Joe from his father, and from his own grandfather. Owen opened one and read aloud. “My dear son, the sea will teach you three things: patience, courage, and how to find your way home. Keep this compass close.”", "Mila’s eyes shone. “It’s a family treasure.”", "“Grandpa made the map for us,” said Owen slowly. “He wanted us to find this.”", "They heard footsteps on the stairs. Grandpa Joe stood in the doorway, a little out of breath, leaning on his cane. He had followed them, staying just out of sight. His eyes twinkled.", "“You found it,” he said.", "“Grandpa,” said Owen, “why did you hide it?”", "The old captain lowered himself onto the bottom step. “When I was a boy, my own father did the same for me. He led me through these woods, and I discovered our family’s history. I wanted you to have the same chance. It isn’t gold that makes a family rich. It’s the stories that we pass on.”", "Owen held up the compass from the box. “This was your dad’s?”", "“And his father’s before him. It has guided the men and women of this family across the water for more than a hundred years.” Grandpa Joe smiled. “Now it’s yours to keep, Owen. You’ll pass it on someday, too.”", "Owen turned the compass over. On the back, tiny letters were engraved: Find your way home. His throat tightened. “Thank you.”", "“And Mila,” said Grandpa, “I have something for you.” He reached into his pocket and drew out a small silver whistle on a chain. “Your grandmother used to blow this to call us in for dinner. It’s a little rusty, but it still works.”", "Mila took the whistle and blew. It made a high, sweet sound that echoed up the spiral staircase. A gull flapped out of the lighthouse and flew away over the sea.", "They walked home together in the golden light of the late afternoon. Grandpa Joe told them stories about the islands, about storms he had weathered, and about the time a whale had come right up next to his ferry. Owen held the compass in his hand. Mila blew the whistle now and then, just for fun.", "That night, after dinner, Owen sat on the porch under a sky full of stars. He looked at the old map. He could see now that the red X didn’t only mark a place. It marked a beginning. He unrolled a blank sheet of paper, took out a pencil, and began to draw a map of his own, one that he would give to his grandchildren someday.", "At the top, he wrote in careful letters, Follow the compass. Find what matters most."]}, {"vocab": [{"w": "bilingual", "d": "able to speak two languages"}, {"w": "vocabulary", "d": "all the words a person knows"}, {"w": "belong", "d": "to feel that you are part of a group and are welcome there"}, {"w": "culture", "d": "the food, language, holidays, and customs of a group of people"}, {"w": "courage", "d": "the strength to do something even when you are afraid"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Speaking two languages can be a strength that helps others", "Chinese is hard to learn", "Moving is exciting", "Lunch is important"], "ans": 0, "why": "Mei uses both of her languages to help a new friend feel welcome."}, {"skill": "Details", "q": "What did Mei bring for lunch that some kids teased her about?", "opts": ["Dumplings", "A sandwich", "Pizza", "Soup"], "ans": 0, "why": "Some kids made fun of her lunch, and she felt embarrassed."}, {"skill": "Inference", "q": "Why did Mei feel two different ways at home and school?", "opts": ["She felt like she had to hide one part of herself", "She was tired", "She was sick", "She hated school"], "ans": 0, "why": "She worried that people would not accept her home language and food."}, {"skill": "Cause and effect", "q": "How did Mei help Anya?", "opts": ["By teaching her words in English and showing her around", "By doing her homework ere trading vocabulary, like collectors trading cards.", "Then, one Friday afternoon, Ms. Alvarez called Mei to her desk. “I’ve been watching you,” she said, with a smile. “You’ve been very kind to Anya. That is not always easy. It takes courage to reach out.”", "“It wasn’t hard,” said Mei. “She was just lonely.”", "“You are bilingual,” said Ms. Alvarez. “That means you have two languages inside you. Do you know what that gives you? A superpower. You can build a bridge between different people.”", "Mei frowned. “But I never thought it was a superpower. I always thought it made me different.”", "“It does,” said Ms. Alvarez. “But different is often what makes a person special. What if we celebrated it? We have a Culture Day coming up next week. Would you like to share something about your home?”", "Mei’s stomach flipped. She thought about the boys and the dumplings. But then she thought about Anya, and her grandmother, and the way it felt to have two voices.", "“I would,” she said.", "On Culture Day, the classroom was full of color. Kids brought flags, photographs, and foods from their families. A girl showed a beaded necklace from Nigeria. A boy sang a song in Spanish. Anya brought a tiny wooden doll, painted with flowers, and said a few words in English that she had practiced, very slowly.", "Then it was Mei’s turn. She stood at the front of the room with her thermos. Her heart was pounding.", "“This is my grandmother’s recipe,” she said. “They are called jiaozi. In English, we say dumplings. Some people think they look strange. But in my family, they are for the New Year, to bring luck. Each one is folded by hand.” She took a deep breath and looked at the boy who had teased her. “Would you like to try one?”", "The boy looked at her, then at the dumpling. He hesitated. Then he took a bite. His eyebrows rose.", "“It’s good,” he said, surprised. “It’s really good.”", "Mei smiled so wide that her cheeks hurt.", "One by one, the students tasted the dumplings. Some asked function scene(cat){ return '<svg class="scene" viewBox="0 0 160 120" aria-hidden="true">'+BADGE+(ILLUS[cat]||'')+'</svg>'; }
const WPM = 165; // words per minute at speech rate 1
const PROGRESS_KEY = 'storycove.v1';

/* ---------- state ---------- */
function loadState(){
  let s = {};
  try { s = JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch(e){}
  s.done = s.done || {}; s.minutes = s.minutes || 0; s.days = s.days || [];
  s.prefs = Object.assign({rate:0.9, fs:1.28, follow:true, voice:''}, s.prefs||{});
  return s;
}
let state = loadState();
function saveState(){ try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(state)); } catch(e){} }
function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchDay(){ const t=today(); if(!state.days.includes(t)){ state.days.push(t); state.days=state.days.slice(-120); } }
function streak(){
  const set = new Set(state.days); let n=0; const d=new Date();
  if(!set.has(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())) d.setDate(d.getDate()-1);
  while(set.has(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())){ n++; d.setDate(d.getDate()-1); }
  return n;
}
document.documentElement.style.setProperty('--fs', state.prefs.fs+'rem');

/* ---------- helpers ---------- */
const $ = (s, r=document)=>r.querySelector(s);
function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function minutesFor(words, rate){ return words/(WPM*rate); }
function fmtMin(m){ m=Math.max(0,m); return m<1?'less than 1 min':'about '+Math.round(m)+' min'; }
function splitSentences(p){
  let t = p.replace(/\b(Mrs|Mr|Ms|Dr|St|Jr)\./g,'$1\u0001').replace(/\b([ap])\.m\./gi,'$1\u0001m\u0001');
  const re=/[^.!?]+(?:[.!?]+[”"’)]*)?/g; const out=[]; let m;
  while((m=re.exec(t))){
    const s=m[0].trim(); if(!s) continue;
    if(out.length && /^[a-z]/.test(s)) out[out.length-1]+=' '+s; else out.push(s);
  }
  return out.map(s=>s.replace(/\u0001/g,'.'));
}
STORIES.forEach((st,i)=>{
  st.n=i+1;
  st.sents=[]; st.paras=st.paras.map((p,pi)=>{
    const ss=splitSentences(p); ss.forEach(s=>st.sents.push({text:s,para:pi})); return ss;
  });
  st.words=st.sents.reduce((a,s)=>a+s.text.split(/\s+/).length,0);
});
function vocabHTML(text, st){
  let out=esc(text);
  const stems=st.vocab.map(v=>{ let w=v.w.toLowerCase(); if(w.length>=7 && w.endsWith('e')) w=w.slice(0,-1); return w; });
  const re=new RegExp('\\b('+stems.join('|')+')\\w*','gi');
  return out.replace(re,(m)=>{
    const lm=m.toLowerCase(); const vi=stems.findIndex(s=>lm.startsWith(s));
    if(vi<0) return m;
    st._seen=st._seen||{}; st._seen[vi]=(st._seen[vi]||0)+1;
    if(st._seen[vi]>3) return m;
    return '<button class="vw" data-v="'+vi+'" aria-label="Word: '+esc(m)+'">'+m+'</button>';
  });
}

/* ---------- badges ---------- */
function badgeList(){
  const done=Object.keys(state.done).map(Number); const cnt=done.length;
  const inCat=c=>STORIES.filter(s=>s.cat===c).every(s=>state.done[s.n]);
  const perfect=Object.values(state.done).filter(d=>d.score===d.total).length;
  return [
    {n:'First story', ok:cnt>=1, i:'1'},
    {n:'Bookworm (5 stories)', ok:cnt>=5, i:'5'},
    {n:'Explorer (10 stories)', ok:cnt>=10, i:'10'},
    {n:'Story Master (all 20)', ok:cnt>=STORIES.length, i:'20'},
    {n:'Science Star', ok:inCat('science'), i:'S'},
    {n:'Gym Champ', ok:inCat('gymnastics'), i:'G'},
    {n:'Ballerina', ok:inCat('ballet'), i:'B'},
    {n:'Quiz Ace (3 perfect scores)', ok:perfect>=3, i:'Q'},
    {n:'3-day streak', ok:streak()>=3, i:'3d'}
  ];
}

/* ---------- speech ---------- */
const TTS = ('speechSynthesis' in window);
const P = {story:null,i:0,playing:false,token:0,utt:null,voice:null,voices:[]};
function rankVoice(v){
  let s=0; if(/^en[-_]US/i.test(v.lang)) s+=3; else if(/^en[-_](GB|AU|CA)/i.test(v.lang)) s+=1;
  if(/Samantha|Ava|Allison|Susan|Zoe|Karen|Serena|Aria|Jenny|Google US English|Natural|Premium|Enhanced|Siri/i.test(v.name)) s+=5;
  if(/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Organ|Ralph|Trinoids|Whisper|Zarvox|Fred|Superstar|Wobble|Jester|Junior|Grandma|Grandpa|Rocko|Shelley|Sandy|Eddy|Flo|Reed/i.test(v.name)) s-=20;
  return s;
}
function loadVoices(){
  if(!TTS) return;
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang));
  vs.sort((a,b)=>rankVoice(b)-rankVoice(a));
  P.voices=vs;
  P.voice = vs.find(v=>v.voiceURI===state.prefs.voice) || vs[0] || null;
  const sel=$('#voiceSel'); if(sel) fillVoices(sel);
}
function fillVoices(sel){
  sel.innerHTML=P.voices.map(v=>'<option value="'+esc(v.voiceURI)+'"'+(P.voice&&P.voice.voiceURI===v.voiceURI?' selected':'')+'>'+esc(v.name)+'</option>').join('') || '<option>Default voice</option>';
}
if(TTS){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }

function stopSpeech(){ P.playing=false; P.token++; if(TTS) speechSynthesis.cancel(); }
function setPlayUI(){
  const b=$('#playBtn'); if(!b) return;
  b.innerHTML = P.playing ? '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 4.5 L20 12 L7 19.5 Z"/></svg>';
  b.setAttribute('aria-label', P.playing?'Pause':'Play');
  const sb=$('#startBtn'); if(sb) sb.hidden = P.i>0 || P.playing;
}
function markOn(i){
  document.querySelectorAll('.s.on').forEach(e=>e.classList.remove('on'));
  const el=$('.s[data-i="'+i+'"]'); if(!el) return;
  el.classList.add('on');
  if(state.prefs.follow){
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});
  }
}
function updateProgress(){
  const st=P.story; if(!st) return;
  const total=st.sents.length; const bar=$('#barFill'); if(bar) bar.style.width=Math.min(100,(P.i/total)*100)+'%';
  let remaining=0; for(let k=P.i;k<total;k++) remaining+=st.sents[k].text.split(/\s+/).length;
  const info=$('#pTime'); if(info) info.textContent='Sentence '+Math.min(P.i+1,total)+' of '+total+' · '+fmtMin(minutesFor(remaining,state.prefs.rate))+' left';
}
function speakFrom(i){
  if(!TTS) return;
  hideWord();
  const st=P.story; P.i=Math.max(0,Math.min(i,st.sents.length-1));
  speechSynthesis.cancel(); P.token++; const tok=P.token; P.playing=true; setPlayUI();
  setTimeout(()=>step(tok),80);
}
function step(tok){
  if(tok!==P.token||!P.playing) return;
  const st=P.story;
  if(P.i>=st.sents.length){ finishListening(); return; }
  markOn(P.i); updateProgress();
  const text=st.sents[P.i].text;
  const u=new SpeechSynthesisUtterance(text);
  u.rate=state.prefs.rate; u.pitch=1; u.lang='en-US';
  if(P.voice){ u.voice=P.voice; u.lang=P.voice.lang; }
  u.onend=()=>{
    if(tok!==P.token) return;
    state.minutes+=minutesFor(text.split(/\s+/).length,state.prefs.rate); touchDay();
    P.i++; step(tok);
  };
  u.onerror=(e)=>{ if(tok!==P.token) return; if(e.error==='interrupted'||e.error==='canceled') return; P.i++; step(tok); };
  P.utt=u; speechSynthesis.speak(u);
}
function pauseSpeech(){ P.playing=false; P.token++; if(TTS) speechSynthesis.cancel(); saveState(); setPlayUI(); }
function finishListening(){
  P.playing=false; P.i=0; saveState(); setPlayUI(); updateProgress();
  document.querySelectorAll('.s.on').forEach(e=>e.classList.remove('on'));
  const q=$('#quiz'); if(q) q.scrollIntoView({behavior:'smooth',block:'start'});
}
function togglePlay(){ if(P.playing) pauseSpeech(); else speakFrom(P.i); }
function skip(d){ const wasPlaying=P.playing; const ni=Math.max(0,Math.min(P.story.sents.length-1,P.i+d)); if(wasPlaying) speakFrom(ni); else { P.i=ni; markOn(ni); updateProgress(); } }

/* ---------- word card ---------- */
function showWord(st,vi){
  pauseSpeech(); hideWord();
  const v=st.vocab[vi]; const d=document.createElement('div'); d.className='wcard'; d.id='wcard';
  d.style.setProperty('--c','var('+CATS[st.cat].c+')');
  d.innerHTML='<h3>'+esc(v.w)+'</h3><p>'+esc(v.d)+'</p><div class="row"><button class="btn" id="wHear">Hear it</button><button class="btn alt" id="wGo">Keep listening</button><button class="btn alt" id="wX">Close</button></div>';
  document.body.appendChild(d);
  $('#wHear').onclick=()=>{ if(!TTS) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(v.w+'. '+v.d); u.rate=Math.min(state.prefs.rate,0.9); if(P.voice){u.voice=P.voice;u.lang=P.voice.lang;} P.utt=u; speechSynthesis.speak(u); };
  $('#wGo').onclick=()=>{ hideWord(); speakFrom(P.i); };
  $('#wX').onclick=hideWord;
}
function hideWord(){ const d=$('#wcard'); if(d) d.remove(); }

/* ---------- views ---------- */
const app=$('#app');
function topBar(){
  return '<div class="top"><a class="brand" href="#" aria-label="Story Cove home"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 30 Q20 8 36 30 Z" fill="var(--accent)"/><path d="M4 30 Q12 24 20 30 T36 30 V36 H4 Z" fill="var(--c-adventure)" opacity=".85"/><circle cx="29" cy="12" r="4" fill="var(--hl)"/></svg>Story Cove</a></div>';
}
let filter='all';
function homeView(){
  stopSpeech(); hideWord(); P.story=null;
  const cnt=Object.keys(state.done).length;
  const totalMin=Math.round(STORIES.reduce((a,s)=>a+minutesFor(s.words,0.9),0));
  const badges=badgeList();
  const cards=STORIES.filter(s=>filter==='all'||s.cat===filter).map(s=>{
    const cat=CATS[s.cat];
    return '<a class="card" href="#story-'+s.n+'" style="--c:var('+cat.c+')"><div class="art"><span class="no">STORY '+s.n+'</span>'+(state.done[s.n]?'<span class="done" title="Finished"><svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg></span>':'')+scene(s.cat)+'</div><div class="body"><h3>'+esc(s.title)+'</h3><p>'+esc(s.blurb)+'</p><div class="meta"><span class="dot">'+cat.label+'</span><span>'+fmtMin(minutesFor(s.words,0.9)).replace('about ','')+' listen</span></div></div></a>';
  }).join('');
  const chips=[['all','All stories']].concat(Object.entries(CATS).map(([k,v])=>[k,v.label])).map(([k,l])=>'<button class="chip" data-f="'+k+'" aria-pressed="'+(filter===k)+'">'+l+'</button>').join('');
  app.innerHTML=topBar()+
   '<section class="hero"><h1>Press play and read along.</h1><p>'+STORIES.length+' stories for 4th grade readers about science, gymnastics, ballet, legends, and adventure. Watch each sentence light up as you listen, tap a dotted word to learn it, then check what you understood.</p>'+
   '<div class="stats"><div class="stat"><b>'+cnt+' / '+STORIES.length+'</b><span>Stories finished</span></div><div class="stat"><b>'+Math.round(state.minutes)+'</b><span>Minutes listened</span></div><div class="stat"><b>'+streak()+'</b><span>Day streak</span></div></div></section>'+
   '<section class="shelf"><h2>Trophy shelf</h2><div class="badges">'+badges.map(b=>'<span class="badge'+(b.ok?'':' off')+'"><i>'+b.i+'</i>'+b.n+'</span>').join('')+'</div></section>'+
   '<div class="filters" role="group" aria-label="Filter stories">'+chips+'</div><div class="grid">'+cards+'</div>'+
   '<p class="note" style="margin-top:26px">Each story takes about '+Math.round(totalMin/STORIES.length)+' minutes to listen to at the default speed. Change the speed in the player if you want it slower or faster. Your progress is saved in this browser.</p>';
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; homeView(); });
  window.scrollTo(0,0);
}

function storyView(n){
  const st=STORIES[n-1]; if(!st){ location.hash=''; return; }
  stopSpeech(); hideWord(); st._seen={}; P.story=st; P.i=0;
  const cat=CATS[st.cat];
  let idx=0;
  const paras=st.paras.map(ss=>'<p>'+ss.map(s=>{ const h='<span class="s" data-i="'+idx+'">'+vocabHTML(s,st)+'</span>'; idx++; return h; }).join(' ')+'</p>').join('');
  const words='<section class="words"><h2>Word box</h2><ul class="wlist">'+st.vocab.map(v=>'<li><b>'+esc(v.w)+'</b> · '+esc(v.d)+'</li>').join('')+'</ul></section>';
  const quiz='<section class="quiz" id="quiz"><h2>Show what you know</h2>'+st.quiz.map((q,qi)=>'<div class="q" data-q="'+qi+'"><span class="sk">'+esc(q.skill)+'</span><span class="qt">'+esc(q.q)+'</span>'+q.opts.map((o,oi)=>'<button class="opt" data-o="'+oi+'">'+esc(o)+'</button>').join('')+'<p class="why" hidden></p></div>').join('')+'<div id="result"></div></section>';
  const nextN=n<STORIES.length?n+1:null;
  app.innerHTML=topBar()+'<a class="back" href="#">&larr; All stories</a>'+
   '<header class="sh" style="--c:var('+cat.c+')"><div class="sh-top"><div class="badge-ill">'+scene(st.cat)+'</div><div><span class="pill">'+cat.label+' · Story '+n+'</span><h1>'+esc(st.title)+'</h1></div></div><p>'+esc(st.blurb)+'</p><p style="font-size:.95rem">'+st.words+' words · '+fmtMin(minutesFor(st.words,state.prefs.rate))+' at your speed</p>'+
   (TTS?'<button class="startbtn" id="startBtn"><svg viewBox="0 0 24 24"><path d="M7 4.5 L20 12 L7 19.5 Z"/></svg>Listen to this story</button>':'<div class="note">This browser cannot read aloud. Try Chrome, Edge, or Safari to hear the story. You can still read it below.</div>')+'</header>'+
   '<article class="text" style="--c:var('+cat.c+')" id="text">'+paras+'</article>'+
   '<div style="--c:var('+cat.c+')">'+words+'</div><div style="--c:var('+cat.c+')">'+quiz+'</div>'+
   '<div class="row" style="margin-top:28px">'+(nextN?'<a class="btn" href="#story-'+nextN+'">Next story &rarr;</a>':'')+'<a class="btn alt" href="#">Back to all stories</a></div>'+
   playerHTML();
  window.scrollTo(0,0);
  bindStory(st);
  updateProgress(); setPlayUI();
}
function playerHTML(){
  if(!TTS) return '';
  return '<div class="player" role="region" aria-label="Story player"><div class="pin">'+
   '<div class="bar" id="bar" role="progressbar" aria-label="Story progress"><i id="barFill"></i></div>'+
   '<div class="prow"><button class="pbtn" id="prevBtn" aria-label="Previous sentence"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 5h2.5v14H6zM20 5v14L10 12z"/></svg></button>'+
   '<button class="pbtn main" id="playBtn" aria-label="Play"></button>'+
   '<button class="pbtn" id="nextBtn" aria-label="Next sentence"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 5H18v14h-2.5zM4 5l10 7-10 7z"/></svg></button>'+
   '<div class="pinfo"><b>'+esc(P.story.title)+'</b><small id="pTime"></small></div></div>'+
   '<div class="prefs"><label>Speed <select id="rateSel">'+[0.7,0.8,0.9,1,1.1,1.25].map(r=>'<option value="'+r+'"'+(r===state.prefs.rate?' selected':'')+'>'+r+'x</option>').join('')+'</select></label>'+
   '<label class="hide-s">Voice <select id="voiceSel"></select></label>'+
   '<label><input type="checkbox" id="followChk"'+(state.prefs.follow?' checked':'')+'> Auto-scroll</label>'+
   '<span>Text <button class="mini" id="fsMinus" aria-label="Smaller text">A-</button> <button class="mini" id="fsPlus" aria-label="Larger text">A+</button></span></div></div></div>';
}
function bindStory(st){
  const text=$('#text');
  text.addEventListener('click',e=>{
    const w=e.target.closest('.vw'); if(w){ e.stopPropagation(); showWord(st,+w.dataset.v); return; }
    const s=e.target.closest('.s'); if(s && TTS) speakFrom(+s.dataset.i);
  });
  if(TTS){
    $('#playBtn').onclick=togglePlay; $('#startBtn')&&($('#startBtn').onclick=()=>speakFrom(0));
    $('#prevBtn').onclick=()=>skip(-1); $('#nextBtn').onclick=()=>skip(1);
    $('#bar').onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(); const i=Math.floor(((e.clientX-r.left)/r.width)*st.sents.length); if(P.playing) speakFrom(i); else { P.i=Math.max(0,Math.min(st.sents.length-1,i)); markOn(P.i); updateProgress(); } };
    $('#rateSel').onchange=e=>{ state.prefs.rate=+e.target.value; saveState(); updateProgress(); if(P.playing) speakFrom(P.i); };
    fillVoices($('#voiceSel'));
    $('#voiceSel').onchange=e=>{ const v=P.voices.find(v=>v.voiceURI===e.target.value); if(v){ P.voice=v; state.prefs.voice=v.voiceURI; saveState(); if(P.playing) speakFrom(P.i); } };
    $('#followChk').onchange=e=>{ state.prefs.follow=e.target.checked; saveState(); };
    const setFs=d=>{ state.prefs.fs=Math.max(1,Math.min(2,+(state.prefs.fs+d).toFixed(2))); document.documentElement.style.setProperty('--fs',state.prefs.fs+'rem'); saveState(); };
    $('#fsMinus').onclick=()=>setFs(-0.12); $('#fsPlus').onclick=()=>setFs(0.12);
  }
  // quiz
  let answered=0, score=0;
  document.querySelectorAll('.q').forEach(qEl=>{
    const q=st.quiz[+qEl.dataset.q];
    qEl.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const pick=+b.dataset.o; qEl.querySelectorAll('.opt').forEach(o=>o.disabled=true);
      qEl.querySelectorAll('.opt')[q.ans].classList.add('right');
      if(pick===q.ans) score++; else b.classList.add('wrong');
      const why=$('.why',qEl); why.textContent=(pick===q.ans?'Correct! ':'Not quite. ')+q.why; why.hidden=false;
      answered++;
      if(answered===st.quiz.length) showResult(st,score);
    });
  });
}
function showResult(st,score){
  const total=st.quiz.length; const first=!state.done[st.n];
  const prev=state.done[st.n]; if(!prev || score>=prev.score) state.done[st.n]={score,total,date:today()};
  touchDay(); saveState();
  const msg=score===total?'Perfect score! You understood this story very well.':score>=total-1?'Great job! You caught almost everything.':score>=Math.ceil(total/2)?'Good work. Listen again and try to catch what you missed.':'Nice try. Listen once more, then take the quiz again.';
  $('#result').innerHTML='<div class="result"><h3>You got '+score+' out of '+total+'</h3><div class="stars" aria-hidden="true">'+Array.from({length:total},(_,i)=>'<span class="'+(i<score?'f':'')+'">&#9733;</span>').join('')+'</div><p style="margin:0">'+msg+(first?' Story finished and saved to your shelf.':'')+'</p></div>';
  $('#result').scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- router ---------- */
function route(){
  const m=location.hash.match(/^#story-(\d+)$/);
  document.querySelectorAll('.wcard').forEach(e=>e.remove());
  if(m) storyView(+m[1]); else homeView();
}
window.addEventListener('hashchange',route);
window.addEventListener('pagehide',()=>{ stopSpeech(); saveState(); });
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && P.story && TTS && !/^(BUTTON|SELECT|INPUT|A|TEXTAREA)$/.test(document.activeElement.tagName)){ e.preventDefault(); togglePlay(); }
});
route();
</script>
</body></html>
