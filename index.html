early evening in Wuxi while it was still Ruby's own morning in Redmond.", "When Lin's face finally appeared, waving enthusiastically at the camera, Ruby felt an immediate, warm rush of recognition, despite never having actually seen her pen pal's face before that exact moment. It somehow already felt familiar, shaped by months of careful, honest letters.", "\"Hello, Ruby!\" Lin called out, her spoken English a little more hesitant than her careful written letters, but her smile unmistakably warm and genuine. \"I am so happy to finally see you!\"", "\"Me too!\" Ruby called back, waving just as enthusiastically. \"I feel like I already know you.\"", "\"Me too,\" Lin agreed. \"Is it really raining there right now? You always write about the rain.\"", "Ruby laughed, glancing out the classroom window at the familiar gray drizzle. \"It's always raining here. You'll have to visit someday and see for yourself.\"", "\"I would like that very much,\" Lin said. \"And you must visit Wuxi too, to see the lake I always write about, and to try real mooncakes, not just the ones you found at your store.\"", "Around them, the rest of the two classrooms buzzed with their own small reunions, pairs of pen pals waving and calling out questions across the video call, a low hum of overlapping English and Chinese and laughter filling both rooms at once. Desmond, Ruby noticed, was holding up a drawing his pen pal had apparently sent him weeks earlier, showing it proudly to the camera, while his pen pal grinned and held up an answering drawing of his own.", "\"Peng you,\" Ruby said carefully, testing the words out loud for the first time instead of just writing them, watching Lin's face on the screen to see if she'd said it right.", "Lin's whole face lit up. \"Yes! Exactly right! You have been practicing.\"", "\"A little,\" Ruby admitted, laughing, suddenly shy about how much time she'd actually spent practicing in her room, sounding out the unfamiliar syllables until they stopped feeling so foreign in her mouth.", "\"Show-off,\" Desmond called out from across the room, grinning, and Ruby just shrugged, unbothered, because for once she didn't mind at all being caught trying hard at something that mattered to her.", "After the call ended, Ruby sat for a while at her desk, thinking about the strange, wonderful fact that a simple exchange of letters, six weeks apart, across an entire ocean, had somehow built something as real and warm as any friendship she had with kids she saw every single day at school. Distance, she was realizing, mattered less than she'd always assumed. What actually mattered was the honest, careful attention two people paid to each other, page after page, letter after letter, regardless of how many miles happened to sit in between them.", "She began her next letter to Lin that very evening, filling the page with more questions than she'd ever asked in a single letter before, already looking forward, six weeks in advance, to whatever answers might eventually arrive. She told Lin about the video call, about how strange and wonderful it had felt to finally hear an actual voice attached to all those careful letters, and she asked, at the very end, the question that had been sitting in the back of her mind since the map first went up on the whiteboard back in September: whether Lin thought they would still be writing to each other next year, even after the class assignment officially ended.", "The answer arrived, as answers from Wuxi always did, six patient weeks later, in Lin's familiar careful handwriting: Dear Ruby, of course we will still write. I do not think of you as a school assignment anymore, and I do not think you think of me that way either. Some friendships, I think, do not need to be close by to be real. They only need both people to keep writing the letters. Ruby read that particular line more than three times, folded the letter carefully back into its envelope, and added it to the very front of her sticker-covered shoebox, where she could find it easily whenever she needed reminding of exactly what an ocean could and could not actually separate."]}, {"vocab": [{"w": "evidence", "d": "facts or objects that help prove something is true"}, {"w": "alibi", "d": "proof that a person was somewhere else when something happened"}, {"w": "motive", "d": "a reason someone might have for doing something, especially something wrong"}, {"w": "witness", "d": "a person who sees an event happen and can describe it"}, {"w": "deduce", "d": "to figure something out using logic and evidence"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Juniper uses logical evidence to solve the mystery of a missing violin", "The talent show is cancelled", "Juniper learns to play violin", "A new detective takes over the case"], "ans": 0, "why": "Juniper gathers evidence and reasons through the case to find the truth."}, {"skill": "Details", "q": "Where was the violin last seen before it disappeared?", "opts": ["Locked in the music room case", "On the school bus", "In the cafeteria", "At the violinist's house"], "ans": 0, "why": "The violin vanished from its locked case in the music room."}, {"skill": "Inference", "q": "Why did Juniper rule out Mr. Feldman as a suspect?", "opts": ["He had a solid alibi, being seen by several people in the auditorium the whole time", "He confessed immediately", "He does not like music", "He was the one who reported it missing"], "ans": 0, "why": "Multiple witnesses placed him elsewhere during the window when the violin vanished."}, {"skill": "Cause and effect", "q": "What clue led Juniper to the true location of the violin?", "opts": ["A smudge of rosin dust leading toward a supply closet", "A note left behind", "A muddy footprint outside", "A phone call"], "ans": 0, "why": "The rosin dust trail was the key physical evidence in the case."}, {"skill": "Vocabulary", "q": "What does “motive” mean?", "opts": ["A reason someone might have for doing something", "A type of evidence", "A missing object", "A talent show act"], "ans": 0, "why": "Understanding motive helps Juniper figure out who might want the violin gone."}], "title": "The Vanishing Violin", "cat": "adventure", "blurb": "Ten minutes before the school talent show, the star violinist's instrument disappears from a locked classroom. Detective Juniper is back on the case, and this time, the clues are hiding in plain sight.", "paras": ["Ten minutes before the Rainier Elementary talent show was set to begin, the music room erupted into panic.", "\"It's gone!\" cried Beatrix Okonkwo, the fifth grade's star violinist, staring into an open, empty case where her great-grandmother's violin was supposed to be resting, tuned and ready for her solo performance. \"I locked it in here myself during lunch. I know I did!\"", "Word of the missing violin spread through backstage faster than the actual show could start, and within minutes, Juniper Mbeki, the school's unofficial but thoroughly reliable resident detective, had been pulled from the audience and briefed on the situation. Juniper had been sitting in the third row with her little cousin, who had come to watch the show specifically to see the dance numbers, and she'd had just enough time to hand him her program and whisper \"save my seat\" before Beatrix's friend Owen came sprinting up the aisle, out of breath, asking if Juniper could come backstage immediately.", "This wasn't Juniper's first case at Rainier Elementary. Back in the fall, she'd solved the mystery of the vanishing ballet slippers before the winter recital, tracking a pair of misplaced shoes through three separate hiding spots before finding them exactly where logic had suggested they'd be all along, and ever since then, kids at school had taken to bringing her their smaller mysteries too: a missing retainer, a stolen seat at lunch, a suspicious note passed during silent reading. Juniper kept a small spiral notebook in her back pocket at all times, just in case, and today, backstage, chaos swirling around her, she was glad she had it.", "\"Walk me through exactly what happened,\" Juniper said, flipping open her notebook, her magnifying glass already swinging from its chain around her neck.", "\"I put my violin in its case after lunch rehearsal,\" Beatrix explained, her voice tight with panic. \"I locked the case with this little combination lock, right here on the case's handle. Then I locked the music room door itself, because Mr. Feldman said we're supposed to when instruments are left inside. I came back just now to get it for the show, and both locks were still locked, but when I opened the case, it was empty.\"", "Juniper examined the case carefully. The combination lock was indeed still fastened, undamaged, showing no obvious sign of being forced open. She turned the case over in her hands, checking every hinge and clasp, running a finger along the felt lining inside, out of long habit rather than any real expectation of finding a clue there. \"Who else has access to this room, or knows the door's key code?\"", "\"Just Mr. Feldman, the music teacher,\" Beatrix said. \"And maybe the janitor. And I guess anyone who was around when I set my combination lock, if they were watching closely enough to memorize it.\"", "\"Who was around at that moment?\"", "Beatrix thought hard. \"A few kids from the after-lunch music club. Owen Castillo, definitely. And Priya Sathe. And I think Mr. Feldman walked through at some point too, though I don't remember exactly when.\"", "Juniper wrote all three names down carefully, underlining each one, then drawing a small box beside each name where she planned to write either cleared or suspect once she'd gathered more information. \"Motive,\" she murmured to herself. \"Who would actually want your violin missing, specifically, right before the show?\"", "\"That's what I don't understand,\" Beatrix said, wringing her hands. \"Everyone knows how much that violin means to me. It belonged to my great-grandmother. Nobody who actually knows me would want to hurt me like this.\"", "\"Not everyone thinks the same way you do,\" Juniper said gently. \"Let's find out where everyone actually was during the window when this could have happened. What time did you lock the case, and what time did you discover it empty?\"", "\"I locked it right at the end of lunch, so about twelve forty,\" Beatrix said. \"And I just found it empty five minutes ago, so about now, one fifteen.\"", "Juniper noted the window carefully: thirty-five minutes, give or take. Not a huge amount of time, but enough for someone who knew exactly what they were doing and didn't waste any of it hesitating.", "Juniper's first stop was Mr. Feldman himself, found backstage adjusting the sound equipment for the upcoming show, looking harried and stressed about far more immediate problems than a missing violin. A tangle of extension cords snaked across the floor near his feet, and he kept glancing anxiously at the clock mounted above the stage door.", "\"Where were you between twelve forty and one fifteen today?\" Juniper asked him directly.", "Mr. Feldman blinked, startled by the direct question. \"I was in the auditorium the entire time, setting up chairs and testing the sound system for the show. Ask anyone. I had at least six different students helping me the whole time, including Owen, actually.\"", "\"You never stepped away? Not even for a minute?\"", "\"Not once,\" Mr. Feldman said. \"We were behind schedule the entire lunch period. Believe me, I wish I'd had a spare minute to myself.\"", "Juniper found Owen Castillo next, sorting through a box of talent show props near the stage, a tangle of paper streamers draped over one shoulder. \"Can you confirm Mr. Feldman was with you setting up the auditorium between twelve forty and one fifteen today?\"", "\"Yeah, the whole time,\" Owen said immediately. \"He never left. We were stringing up decorations and testing microphones. It took forever. My arms are still sore from holding the ladder.\"", "\"Did you see Priya Sathe at all during that time?\"", "Owen thought about it, scratching his head. \"Not really. She was in the music room earlier, before lunch ended, but I don't remember seeing her in the auditorium at all. She might have been in the hallway somewhere. I wasn't really paying attention to anyone besides Mr. Feldman and the ladder I was holding.\"", "That gave Mr. Feldman a solid alibi, confirmed by multiple witnesses. Juniper crossed his name off her suspect list, writing cleared in the little box beside his name, and turned her attention to Priya Sathe, whom she found sitting quietly near the edge of the backstage curtain, looking unusually nervous for someone about to perform a simple poetry reading. Priya's fingers were twisting a folded index card, the same card, Juniper guessed, that held the poem she was about to read.", "\"Where were you between twelve forty and one fifteen?\" Juniper asked her.", "Priya's eyes darted away for just a fraction of a second, a small, telling flicker that Juniper's detective instincts immediately noted. \"I was just... around. In the hallway, mostly. Getting ready for my reading.\"", "\"Anyone see you there?\"", "\"I don't know. Maybe. I wasn't really paying attention to who was around.\"", "This vague, evasive answer, so different from Owen's immediate, confident confirmation, struck Juniper as significant. She noticed, too, the way Priya kept glancing toward the supply closet at the far end of the room, quick, involuntary glances that lasted less than a second each but that Priya seemed unable to stop herself from making. Juniper thanked Priya and moved on, but made a careful note in her book: Priya — no confirmed alibi, seemed nervous, kept glancing at supply closet.", "She briefly considered whether Priya might simply be nervous about her upcoming performance, the way plenty of kids got nervous before talent shows, and made a mental note not to jump to conclusions before she had actual evidence to back them up. A good detective, she reminded herself, followed the clues, not just the nervous faces.", "Before returning to the music room, Juniper made one more stop, tracking down the school's janitor, Mr. Grissom, who was pushing a supply cart down the hallway near the gymnasium. She'd learned, from her ballet slipper case back in the fall, never to skip a witness just because they seemed unlikely to matter.", "\"Did you go into the music room at all between twelve forty and one fifteen today?\" she asked him.", "Mr. Grissom thought about it, leaning on his cart. \"I passed by the hallway outside it a few times, sweeping up after lunch, but I never went inside. Door was shut the whole time I walked past. Why, something happen in there?\"", "\"Someone's violin went missing,\" Juniper said.", "\"Huh,\" Mr. Grissom said, shaking his head. \"Wish I could help more. I did notice the window in there was propped open a crack when I swept past around one o'clock, now that you mention it. Music room gets stuffy this time of year.\"", "This detail snagged Juniper's attention immediately, and she thanked him and hurried back to the music room to examine the window herself, wondering if she'd missed an entirely different possibility: that someone had climbed in from outside rather than using either door. The window did indeed sit propped open a few inches, exactly as Mr. Grissom had described, looking out onto a narrow strip of grass along the building's side wall.", "She leaned out, checking the ground below for footprints or scuff marks, and examined the windowsill itself for any smudges or fibers that might suggest someone climbing through. She found nothing. The sill sat dusty and undisturbed, the kind of undisturbed dust that only builds up over several days of nobody touching a surface at all, which told her clearly enough that nobody had used this window as an entrance, exit, or anything else that afternoon. It had simply been left open for fresh air, an ordinary detail that had nearly sent her whole investigation down the wrong path entirely.", "\"Good thing to check, but not the answer,\" she murmured to herself, jotting a note in her book: window — propped for air only, no entry, ruled out. A real detective, she reminded herself, checked every possibility carefully, even the ones that turned out to lead nowhere, because the only way to know a lead was wrong was to actually follow it far enough to be sure.", "Juniper returned to the empty music room to examine the scene more carefully, running her magnifying glass slowly across the floor near the instrument shelf where Beatrix's case had been locked. The afternoon light slanted in through the tall windows, throwing long shadows across the tile, and Juniper crouched low, nearly at eye level with the floor, the way she'd learned worked best for spotting anything too faint to notice standing up. Near the base of the shelf, she noticed a faint trail of pale, powdery dust, barely visible against the tile floor, leading away from the shelf toward a supply closet at the far end of the room.", "She recognized the substance immediately: rosin, the sticky, powdery substance violinists rub onto their bows to help them grip the strings properly, which often leaves a fine dust behind wherever a violin case has recently been opened. She dabbed a fingertip against the trail and held it up to the light, confirming the pale, faintly waxy texture against her skin.", "Juniper followed the faint trail to the supply closet door, which, unlike the music room's main door, had no lock at all, simply a standard latch. She opened it carefully, her heart beating a little faster despite herself, the way it always did in the last few moments before a mystery resolved itself.", "Inside, tucked behind a stack of folding chairs, wrapped carefully in a spare curtain from the stage props, sat Beatrix's violin, completely undamaged, its case's lock still fastened uselessly around empty air back in the music room.", "\"Found it!\" Juniper called out, and within moments, Beatrix came rushing in, tears of relief immediately springing to her eyes as she gathered up her great-grandmother's violin and checked it carefully for damage, running her fingers along the strings, the neck, the delicate curl of the scroll at the top, relief spreading visibly across her face with every intact inch she checked.", "\"It's not hurt,\" Beatrix said, sagging with relief. \"But how did it even get in here? The case was still locked!\"", "Juniper had already worked out the answer, piecing together the evidence as she'd followed the trail, ready to deduce exactly how the trick had been done. \"Your combination lock secures the case itself,\" she explained, \"but it doesn't actually secure the violin to the case's interior. Someone must have opened the case using a spare key, not the combination lock at all — most instrument cases have a simple key lock built into the latch alongside any combination padlock added later, and the school's spare key ring includes a copy for every instrument case, kept in exactly this supply closet for emergencies. Someone took the violin out through that separate key lock, then locked your combination padlock back onto the empty case afterward, to make it look untouched.\"", "\"But who would even know about that spare key lock?\" Beatrix asked.", "Juniper's gaze drifted meaningfully toward the closet's small metal key box, mounted on the inside wall, clearly labeled Instrument Case Keys. \"Someone who spends a lot of time around this closet,\" she said. \"Someone with access to the music room during lunch, who happened to have no confirmed alibi for the exact window in question.\"", "She flipped back through her notebook, tapping the page where she'd written Priya's name, the little box beside it still blank. Everything pointed the same direction: the missing alibi, the nervous glances toward the closet, the fact that Priya, as a member of the after-lunch music club, would have known exactly where the spare key box was kept.", "When Juniper gently confronted Priya a short while later, finding her still sitting near the backstage curtain, the folded index card now creased nearly in half from all the anxious folding and unfolding, the whole story finally came tumbling out. Priya, it turned out, had been deeply anxious about her own upcoming poetry reading, worried it would seem boring compared to Beatrix's violin solo, which was always the show's most anticipated act. She'd watched Beatrix rehearse during lunch, the whole music room falling silent and awestruck at the sound, and had felt, watching it, a hot, sinking certainty that her own poem, however hard she'd practiced it, would land with nothing but polite, distracted applause right afterward. In a moment of panic she deeply regretted almost immediately, she had hidden the violin, not to keep it forever, simply hoping to delay Beatrix's performance long enough that her own reading might get more attention by comparison, before planning to reveal its location once the show had properly started.", "\"I know it was a terrible idea the second I did it,\" Priya admitted, near tears herself, the index card crumpling further in her fist. \"I panicked. I'm really sorry, Beatrix. I never should have touched it. I was going to tell someone where it was, I promise, I just kept losing my nerve every time I tried.\"", "Beatrix, clutching her recovered violin, looked more relieved than angry. \"I'm just glad it's not damaged,\" she said. \"But Priya, your poetry reading doesn't have to compete with my violin. They're just different. Both things can be good at the same time.\"", "\"I really am sorry,\" Priya said again. \"I should have just told you I was nervous instead of doing something so ridiculous.\"", "\"Everybody gets nervous before something like this,\" Beatrix said. \"I was shaking so hard tuning my violin at lunch I almost couldn't turn the pegs. You didn't need to hide anything to make your poem worth listening to.\"", "Juniper closed her notebook for a moment, watching the two girls talk it through, and found herself thinking that this part, the actual conversation happening now, mattered just as much as the detective work that had led up to it. Finding the violin was one thing. Making sure Priya walked into the show without carrying that shame the whole time was another.", "The talent show started only fifteen minutes late, and Beatrix's violin solo, played on an instrument with quite an adventurous afternoon behind it, earned a standing ovation, the whole auditorium rising to its feet as the last note faded into the rafters. Priya's poetry reading, performed right afterward with a newfound honesty about nervousness that she wove directly into her closing lines, describing exactly how her hands had shaken and her voice had wobbled and how she'd decided to keep going anyway, earned one too, several audience members wiping their eyes as she stepped back from the microphone.", "Afterward, Juniper closed her notebook with a satisfied nod, adding one final line beneath her case notes, right under the little box beside Priya's name, where she finally wrote the word she'd been waiting to write since the case first began.", "Case closed. Culprit: nervousness, disguised as a missing violin. Lesson learned: everyone's talent is allowed to shine, without anyone else's light needing to go out first.", "Juniper tucked her notebook back into her pocket, the magnifying glass swinging gently against her chest as she made her way back out to the audience, sliding into her seat just as the next act, a group of second graders attempting a slightly chaotic tap dance routine, took the stage. Her cousin leaned over and whispered, \"Did you actually solve it?\" and Juniper simply smiled and nodded toward the stage, where Beatrix and Priya were both now sitting together in the front row, applauding the second graders with equal enthusiasm, as if the whole ordeal from earlier that afternoon had never happened at all.", "\"You have to tell me everything at home,\" her cousin whispered, practically bouncing in his seat. \"Was it like the ballet slipper case? Did you use the magnifying glass the whole time?\"", "\"Almost the whole time,\" Juniper whispered back. \"This one had a rosin trail instead of a footprint. Every case has its own kind of clue, if you look closely enough.\"", "\"What if there's never another mystery at this school again?\" her cousin asked, only half joking.", "Juniper considered this seriously, the way she considered most things. \"There's always another mystery,\" she said. \"People are complicated. Something's always getting lost, or hidden, or misunderstood. My job's just to actually go look instead of guessing.\"", "Her cousin seemed satisfied with this answer, turning his attention back to the stage, where one of the second graders had just tripped slightly and recovered with a dramatic bow that earned the loudest applause of the routine so far. Juniper settled back into her seat, notebook safely tucked away, already fairly confident that whatever the next case turned out to be, whenever it arrived, she'd be ready for it."]}, {"vocab": [{"w": "trail", "d": "a marked path through wilderness used for hiking"}, {"w": "disoriented", "d": "confused about which direction you are facing or where you are"}, {"w": "landmark", "d": "a noticeable feature used to help find your way"}, {"w": "hypothermia", "d": "a dangerous drop in body temperature caused by cold"}, {"w": "resourceful", "d": "able to find clever ways to solve problems using what is available"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Nora uses calm thinking and wilderness skills to keep herself and her brother safe until they are found", "The family gets lost forever", "A bear chases them", "The hike is cancelled"], "ans": 0, "why": "Nora's calm, resourceful response to being lost is the heart of the story."}, {"skill": "Details", "q": "What is the very first rule Nora remembers for what to do when lost?", "opts": ["Stop moving and stay in one place", "Keep walking until you find the trail", "Climb the nearest tree", "Start running downhill"], "ans": 0, "why": "The story teaches the real wilderness safety rule: stop and stay put."}, {"skill": "Inference", "q": "Why did Nora have Theo put on his extra jacket right away, even though he said he wasn't cold yet?", "opts": ["Getting too cold before you feel it is how hypothermia becomes dangerous", "She just liked the jacket's color", "It was going to rain heavily", "The jacket had a whistle in the pocket"], "ans": 0, "why": "Preventing cold before it becomes severe is safer than reacting after the fact."}, {"skill": "Cause and effect", "q": "What helped the search party find Nora and Theo before dark?", "opts": ["The whistle blasts and the bright jacket Nora spread out on a rock", "A cell phone call", "A campfire signal", "Theo's shouting alone"], "ans": 0, "why": "The whistle signal and visible bright marker were what search members noticed."}, {"skill": "Vocabulary", "q": "What does “resourceful” mean?", "opts": ["Able to find clever ways to solve problems using what is available", "Able to run very fast", "Afraid of the outdoors", "Always right about directions"], "ans": 0, "why": "Nora shows resourcefulness by using her whistle, jacket, and knowledge calmly."}], "title": "Lost Trail at Mount Rainier", "cat": "adventure", "blurb": "A wrong turn on a family hike near Mount Rainier separates Nora and her little brother Theo from the rest of the group. With the fog rolling in and daylight running short, Nora must remember everything she's ever learned about staying found.", "paras": ["The Marchetti family had hiked the Sunrise trail near Mount Rainier every August for as long as Nora could remember, a wide, well-marked path that wound through subalpine meadows before climbing toward a viewpoint where, on a clear day, the mountain's snowy summit seemed close enough to touch. Nora, at eleven, knew this particular trail almost as well as she knew her own neighborhood.", "This year's hike had started out exactly like every other one. They'd left their campsite before eight in the morning, thermoses of hot cocoa still warm in their backpacks, the meadows around Sunrise Point spread out in every direction, dotted with wildflowers just past their summer peak, purple lupine and white avalanche lilies bobbing gently in the morning breeze. Marmots whistled from rocky outcrops nearby, and at one point the whole family had stopped to watch a hawk circle lazily overhead, riding some current of air none of them could feel from the ground. Nora's father had pointed out the mountain itself every twenty minutes or so, as if it might have changed since the last time he mentioned it, and Nora's mother had teased him gently about it each time, the same familiar joke they always made on this hike.", "Which was exactly why, when her seven-year-old brother Theo spotted a deer trail branching off the main path and begged to follow it \"just for a minute\" to get a closer look, Nora agreed without much worry at all.", "\"Just a minute,\" she called ahead to her parents, who were a short distance up the main trail, deep in conversation and clearly assuming the two kids were right behind them. \"We're checking out a deer trail!\"", "If her parents heard, they didn't turn around. Nora and Theo ducked off the main path, following the narrow, winding deer trail through a stand of low trees, catching one brief, thrilling glimpse of an actual deer bounding away through the underbrush before it vanished entirely.", "\"That was so cool,\" Theo said, delighted, already turning to head back toward the main trail.", "Except, when they turned around, the main trail wasn't where either of them expected it to be.", "\"It's this way,\" Nora said, choosing a direction with more confidence than she actually felt, and they walked for several minutes through unfamiliar trees before she was forced to admit, with a sinking feeling in her stomach, that this clearly was not leading them back to the main path at all. The trees here looked subtly different from the ones near the main trail, closer together, with less light filtering down between the branches, and the ground had grown noticeably steeper underfoot without either of them quite noticing the change happening.", "\"Are we lost?\" Theo asked, his voice already climbing toward panic, both of them completely disoriented among trees that all looked exactly the same.", "Nora made herself stop walking immediately, forcing her own racing heart to slow down enough to think clearly. Her hands felt cold and a little shaky, and for one long, terrible moment, her mind went completely blank, offering nothing useful at all. Then, slowly, she remembered, with sudden, sharp clarity, a wilderness safety lesson from a Junior Ranger program she'd completed the previous summer at this exact park: the moment you realize you're lost, the very first and most important thing to do is stop moving.", "\"We're going to be okay,\" she told Theo, with far more confidence in her voice than she entirely felt inside, though she noticed, gratefully, that saying it out loud steadily made it feel a little more true. \"But we need to stop walking right now. Walking more when you're already lost usually just makes things worse, because you end up farther from where people will actually look for you.\"", "\"But how will anyone find us if we just stand here?\" Theo asked, his eyes wide.", "\"Mom and Dad will notice we're missing really soon,\" Nora said, thinking it through out loud partly to reassure herself as much as Theo. \"And when hikers get lost, search parties usually look near the main trail first, working outward in circles from wherever the person was last seen. If we keep moving randomly, we might accidentally walk farther from where they'll actually be searching. If we stay in one place, close to where we left the main trail, we're much easier to find.\"", "She looked around, trying to orient herself the way her Junior Ranger badge instructor had taught her. A short distance away stood a large, distinctively shaped boulder, half-covered in bright green moss, tall enough to be visible from a reasonable distance. \"We'll go stand by that big rock,\" she decided. \"It's a good landmark. Easy to spot, easy to describe if we need to.\"", "They settled near the boulder, and Nora, remembering the next rule from her training, immediately turned her attention to keeping them both safe and comfortable while they waited. The afternoon air, though not yet freezing, had a noticeable chill to it, especially now that they'd stopped moving and generating body heat through hiking. A light breeze rustled through the branches overhead, carrying with it the faint, mineral smell of the mountain's higher slopes, and somewhere in the distance, a bird called out three quick notes, then fell silent.", "\"Put your extra jacket on,\" she told Theo, unzipping her own backpack to retrieve his spare layer, which their mother, thankfully, insisted they each carry on every hike regardless of the day's forecast.", "\"I'm not cold yet,\" Theo protested.", "\"That's exactly why you need to put it on now,\" Nora said firmly, echoing something she remembered clearly from her training. \"If you wait until you actually feel cold, your body's already losing heat faster than it should. Getting too cold, especially if it happens slowly without you noticing, is called hypothermia, and it's dangerous. It's way easier to stay warm than to warm back up once you're already cold.\"", "Theo, a little reluctantly, put on his jacket. Nora put on her own extra layer as well, and pulled two granola bars from her backpack, handing one to Theo.", "\"Eating helps your body make heat too,\" she explained, remembering this detail from her training as well. \"And it'll keep our energy up while we wait.\"", "Theo unwrapped his granola bar slowly, picking out the chocolate chips first the way he always did, a habit that, in this particular moment, struck Nora as strangely comforting, a small piece of ordinary life continuing on exactly as normal even though nothing else about the afternoon felt ordinary at all.", "\"Do you think Mom and Dad are scared?\" Theo asked quietly, after a while.", "\"Probably a little,\" Nora admitted. \"But they know what to do too. Dad's done Junior Ranger training same as me, back when he was a kid at this exact park, actually. Grandpa told me that once. And they'll have told a ranger by now if they haven't found us themselves yet. There's a lot of people who know how to help with this kind of thing.\"", "\"I wish we never followed that dumb deer,\" Theo said, his voice wobbling slightly.", "\"The deer wasn't dumb, it was actually really pretty,\" Nora said, trying for a small joke to lighten the mood. \"We just followed it a little farther than we should have. That part was on us, not the deer.\"", "Theo managed a small, watery laugh at that, which Nora counted as a genuine victory.", "As the two of them sat together near the boulder, munching their granola bars, a thin fog began drifting slowly through the trees around them, the kind of low mountain fog that could roll in quickly at this elevation, reducing visibility significantly within minutes. Nora felt a fresh flicker of worry, but pushed it firmly aside, focusing instead on what she could actually control.", "She remembered one more crucial tool from her training: the small emergency whistle clipped to the strap of her backpack, which her mother insisted every family member carry on every hike, and which Nora, until this exact moment, had always privately considered a slightly excessive precaution.", "\"Three sharp blasts,\" she told Theo, pulling the whistle free. \"That's the universal signal for help in the wilderness. It's much easier for searchers to hear a whistle from far away than to hear us shouting, and shouting will also tire out our voices a lot faster.\"", "She blew three sharp blasts, waited about a minute in careful silence, listening hard for any response, then blew three more. She repeated this pattern every few minutes, resisting the urge to blow constantly, remembering that conserving her own energy mattered too, since nobody could predict exactly how long they might need to wait.", "Between whistle blasts, she pulled her own bright orange rain jacket from her backpack and spread it across the top of the mossy boulder, remembering another detail from her training: bright colors stand out clearly against the muted greens and grays of the forest, making a stranded hiker's location far easier to spot from a distance, especially for search teams scanning a wide area.", "\"You're really good at this,\" Theo said, watching her work, some of the panic finally fading from his young voice, replaced by something closer to genuine trust.", "\"I paid attention during Junior Ranger training,\" Nora said, trying to sound more confident than nervous. \"I never actually thought I'd need any of it for real.\"", "They waited nearly forty-five minutes, the fog thickening steadily around them, Nora blowing her whistle every few minutes, both kids huddled close together near the boulder for warmth and comfort. At one point, Theo thought he heard something rustling in the bushes nearby and grabbed Nora's arm in alarm, both of them holding perfectly still, hearts pounding, until the sound resolved itself into nothing more than a squirrel darting across a fallen log, and they both let out shaky, relieved laughs afterward.", "\"I really thought that was a bear,\" Theo admitted.", "\"Bears are actually pretty rare to run into around here, especially with us making noise every few minutes with the whistle,\" Nora said, though privately she'd felt her own heart jump at the sound too. \"Loud noise usually keeps them away, not draws them closer. We're probably one of the least appealing things in these woods right now anyway. We don't even have food that smells interesting, just granola bar wrappers.\"", "Theo grew quiet and a little scared as the light began to dim, and Nora, despite her own mounting worry, kept talking to him steadily, quizzing him gently on constellations, describing what dinner she hoped they'd have once they got back to their campsite, anything to keep both their minds occupied and calm. She asked him to name every dinosaur he could think of, a game he usually loved, and though his answers came slower and quieter than usual, he kept playing along, which Nora took as a good sign that he wasn't slipping into real panic.", "She checked on him constantly without making it obvious she was checking, watching for the little signs her training had mentioned: excessive shivering, slurred words, confusion, the kind of things that might mean the cold was becoming more serious than either of them realized. Theo seemed tired and scared, but alert, answering her questions clearly enough, his hands still moving normally when he reached for another sip of water from his bottle, which reassured her more than she let on.", "\"How much longer do you think?\" Theo asked eventually, his voice small.", "\"I don't know exactly,\" Nora said honestly, because she'd decided, somewhere in the last half hour, that honest was better than falsely certain. \"But every minute that passes is a minute closer to someone finding us. That's just true, whether it feels like it or not.\"", "At one point, during a long stretch of silence between whistle blasts, Theo asked, in a very small voice, whether they might have to spend the whole night out there. Nora had wondered the exact same thing herself, though she'd been careful not to say it out loud.", "\"I don't think so,\" she said instead, keeping her voice steady. \"We're not that far off the main trail, honestly. Search parties are usually pretty fast once they know roughly where to look, and Mom and Dad know almost exactly where we left the path. But even if it did take longer, we have jackets, we have a landmark, and we have each other. Those are the things that actually matter most.\"", "\"I guess that's true,\" Theo said, sounding slightly comforted, curling in a little closer against her side.", "Nora checked her watch again, more out of habit than because the number would actually tell her anything useful, and tucked her cold hands into her jacket pockets, keeping half her attention on the fog and half on Theo, who had gone quiet again, watching a beetle make its slow, determined way across a patch of moss near his sneaker.", "Finally, distant and faint through the fog, Nora heard something that made her heart leap: an answering whistle blast, followed by her father's voice, hoarse from shouting, calling their names.", "\"HERE!\" Nora screamed back, immediately blowing three more sharp blasts on her own whistle. \"WE'RE HERE! BY THE BIG ROCK!\"", "Theo scrambled to his feet beside her, cupping his own hands around his mouth. \"WE'RE OKAY! WE'RE RIGHT HERE!\"", "Within minutes, her parents emerged from the fog, accompanied by a park ranger who had joined the search after Nora's parents reported the two kids missing. Nora's mother swept both children into a fierce, relieved hug, tears streaming down her face, murmuring their names over and over, while Nora's father knelt down and simply held onto both of them without saying anything at all for a long moment, his own eyes suspiciously bright. The ranger crouched down to examine the boulder and the bright orange jacket spread carefully across its top.", "\"Smart thinking with the jacket,\" the ranger said approvingly, glancing at Nora with genuine respect. \"And staying put instead of wandering was exactly the right call. A lot of adults panic and start walking randomly when they realize they're lost, which honestly makes our job a lot harder. You handled this better than plenty of grown-ups I've helped find over the years.\"", "\"I learned it in Junior Ranger training,\" Nora said, still a little shaky with relief but undeniably proud. \"I didn't think I'd actually ever need it.\"", "\"That's exactly why we teach it,\" the ranger said, smiling. \"The best skills are the ones you hope you'll never need, but you're always glad you have anyway.\"", "She turned to Theo, crouching down to his level. \"And you did a good job too, staying calm with your sister and helping call back once you heard us close by. That mattered.\"", "Theo, still holding tightly onto Nora's sleeve, nodded seriously, clearly proud of the small compliment.", "As the family made their way carefully back toward the main trail, Theo's small, cold hand tucked firmly into Nora's, Theo looked up at his sister with open admiration. \"You were really brave back there,\" he said. \"I was really scared, but you didn't seem scared at all.\"", "Nora considered this honestly. \"I was pretty scared too, actually,\" she admitted. \"I just tried to remember what I was supposed to do instead of just thinking about being scared. It turns out that helps a lot, having something specific to actually do.\"", "\"How did you remember all that stuff, though? I would've just forgotten everything.\"", "\"I don't know,\" Nora said, thinking about it seriously. \"I think it helped that I'd practiced it before, even just in a classroom. Like how you practice spelling words even though you hope you never actually need to spell 'necessary' out loud in an emergency.\"", "Theo laughed at that, some of the last of the day's fear finally draining out of his voice. \"I don't think spelling 'necessary' is ever actually an emergency.\"", "\"You never know,\" Nora said, smiling despite everything.", "Her mother, walking just behind them, reached out and squeezed Nora's shoulder gently. \"I'm so proud of you,\" she said quietly. \"I was so scared the whole time we were searching, but the second the ranger mentioned the whistle signals and the jacket on the rock, I knew exactly what had happened, and I knew you were going to be okay. You did everything right.\"", "\"I was scared I wouldn't remember it all in time,\" Nora admitted. \"It all kind of came back at once, once I actually stopped and thought instead of panicking.\"", "That evening, back at their campsite, wrapped in warm blankets beside a crackling campfire, hot cocoa steaming in their mugs, the whole ordeal already beginning to feel, strangely, like something that had happened to someone else, a story rather than an actual afternoon they had lived through. Nora's father handed her a fresh Junior Ranger badge he'd picked up at the ranger station, a small bronze pin marked Wilderness Skills: Demonstrated.", "\"You earned this today for real,\" he said. \"Not just in a classroom.\"", "Nora pinned it carefully to her jacket, right next to the badge she'd earned the previous summer in training, and found herself thinking, as she watched the campfire's flames dance against the darkening sky, that all those seemingly excessive precautions her family had always taken, the spare jackets, the whistles, the careful lessons about staying calm and staying put, had turned out, when it actually mattered, to be exactly the kind of resourcefulness that made the difference between a frightening afternoon and a genuine emergency.", "Theo, already half asleep against their mother's shoulder, mumbled something about wanting to do Junior Ranger training too, next summer, so he'd know what to do if it ever happened again. Nora smiled at that, tucking the thought away to remind him of it later, once he wasn't quite so exhausted to actually follow through. Above them, the fog had cleared entirely, and the mountain's dark silhouette stood outlined against a sky gone thick with stars, patient and enormous and, for tonight at least, no longer anything to be afraid function scene(cat){ return '<svg class="scene" viewBox="0 0 160 120" aria-hidden="true">'+BADGE+(ILLUS[cat]||'')+'</svg>'; }
const WPM = 165; // words per minute at speech rate 1
const PROGRESS_KEY = 'storycove.v1';

/* ---------- state ---------- */
function loadState(){
  let s = {};
  try { s = JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch(e){}
  s.done = s.done || {}; s.minutes = s.minutes || 0; s.days = s.days || [];
  s.favs = Array.isArray(s.favs) ? s.favs : [];
  s.prefs = Object.assign({rate:0.9, fs:1.28, follow:true, voice:''}, s.prefs||{});
  return s;
}
let state = loadState();
function saveState(){ try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(state)); } catch(e){} }
function today(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function touchDay(){ const t=today(); if(!state.days.includes(t)){ state.days.push(t); state.days=state.days.slice(-120); } }
function streak(){
  const set = new Set(state.days); let n=0; const d=new Date();
  if(!set.has(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())) d.setDate(d.getDate()-1);
  while(set.has(d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate())){ n++; d.setDate(d.getDate()-1); }
  return n;
}
document.documentElement.style.setProperty('--fs', state.prefs.fs+'rem');

/* ---------- helpers ---------- */
const $ = (s, r=document)=>r.querySelector(s);
function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function minutesFor(words, rate){ return words/(WPM*rate); }
function fmtMin(m){ m=Math.max(0,m); return m<1?'less than 1 min':'about '+Math.round(m)+' min'; }
function splitSentences(p){
  let t = p.replace(/\b(Mrs|Mr|Ms|Dr|St|Jr)\./g,'$1\u0001').replace(/\b([ap])\.m\./gi,'$1\u0001m\u0001');
  const re=/[^.!?]+(?:[.!?]+[”"’)]*)?/g; const out=[]; let m;
  while((m=re.exec(t))){
    const s=m[0].trim(); if(!s) continue;
    if(out.length && /^[a-z]/.test(s)) out[out.length-1]+=' '+s; else out.push(s);
  }
  return out.map(s=>s.replace(/\u0001/g,'.'));
}
STORIES.forEach((st,i)=>{
  st.n=i+1;
  st.sents=[]; st.paras=st.paras.map((p,pi)=>{
    const ss=splitSentences(p); ss.forEach(s=>st.sents.push({text:s,para:pi})); return ss;
  });
  st.words=st.sents.reduce((a,s)=>a+s.text.split(/\s+/).length,0);
});
function vocabHTML(text, st){
  let out=esc(text);
  const stems=st.vocab.map(v=>{ let w=v.w.toLowerCase(); if(w.length>=7 && w.endsWith('e')) w=w.slice(0,-1); return w; });
  const re=new RegExp('\\b('+stems.join('|')+')\\w*','gi');
  return out.replace(re,(m)=>{
    const lm=m.toLowerCase(); const vi=stems.findIndex(s=>lm.startsWith(s));
    if(vi<0) return m;
    st._seen=st._seen||{}; st._seen[vi]=(st._seen[vi]||0)+1;
    if(st._seen[vi]>3) return m;
    return '<button class="vw" data-v="'+vi+'" aria-label="Word: '+esc(m)+'">'+m+'</button>';
  });
}

/* ---------- badges ---------- */
function badgeList(){
  const done=Object.keys(state.done).map(Number); const cnt=done.length;
  const inCat=c=>STORIES.filter(s=>s.cat===c).every(s=>state.done[s.n]);
  const perfect=Object.values(state.done).filter(d=>d.score===d.total).length;
  return [
    {n:'First story', ok:cnt>=1, i:'1'},
    {n:'Bookworm (5 stories)', ok:cnt>=5, i:'5'},
    {n:'Explorer (10 stories)', ok:cnt>=10, i:'10'},
    {n:'Story Master (all 20)', ok:cnt>=STORIES.length, i:'20'},
    {n:'Science Star', ok:inCat('science'), i:'S'},
    {n:'Gym Champ', ok:inCat('gymnastics'), i:'G'},
    {n:'Ballerina', ok:inCat('ballet'), i:'B'},
    {n:'Quiz Ace (3 perfect scores)', ok:perfect>=3, i:'Q'},
    {n:'3-day streak', ok:streak()>=3, i:'3d'}
  ];
}

}

function updateFavIcons(){

    const n=+b.dataset.fav, on=isFav(n);
    b.classList.toggle('on',on);
    b.setAttribute('aria-pressed',on);
    b.setAttribute('aria-label', on?'Remove from favorites':'Add to favorites');
    const lbl=b.querySelector('span'); if(lbl) lbl.textContent=on?'Favorited':'Favorite';
  });
}
function toggleFav(n){
  const i=state.favs.indexOf(n);
  if(i>=0) state.favs.splice(i,1); else state.favs.push(n);
  saveState();
  syncFavsToCloud();
  if(filter==='fav' && !P.story) homeView(); else updateFavIcons();
}

/* ---------- optional cross-device sync via the Claude artifact db capability ----------
   Works only when this page is opened as the published Story Cove artifact, signed in.
   A plain saved copy of this file (e.g. opened from a folder on a computer) has no
   window.claude bridge, so favorites simply stay in this browser's local storage. */
let dbDoc=null, dbWriteChain=Promise.resolve();
function mergeRemoteFavs(remote){
  if(!Array.isArray(remote)) return;
  const set=new Set(state.favs); let changed=false;
  remote.forEach(id=>{ if(!set.has(id)){ state.favs.push(id); set.add(id); changed=true; } });
  if(changed){ saveState(); updateFavIcons(); if(filter==='fav'&&!P.story) homeView(); }
}
function setRemoteFavs(remote){
  if(!Array.isArray(remote)) return;
  const a=state.favs.slice().sort().join(','), b=remote.slice().sort().join(',');
  if(a===b) return;
  state.favs=remote.slice(); saveState(); updateFavIcons();
  if(filter==='fav' && !P.story) homeView();
}
function syncFavsToCloud(){
  if(!dbDoc) return;
  dbWriteChain=dbWriteChain.then(()=>dbDoc.set({ids:state.favs}).catch(()=>{}));
}
async function initCloudFavs(){
  if(!(window.claude && window.claude.use)) return;
  let db=null;
  try{ db=await window.claude.use('db'); }catch(e){ db=null; }
  if(!db) return;
  try{
    dbDoc=db.doc('favs/emma');
    const snap=await dbDoc.get();
    if(snap.exists){ mergeRemoteFavs(snap.data().ids||[]); }
    syncFavsToCloud();
    dbDoc.onSnapshot(snap=>{ if(snap.exists) setRemoteFavs(snap.data().ids||[]); }, ()=>{});
  }catch(e){ dbDoc=null; }
}
initCloudFavs();

/* ---------- speech ---------- */
const TTS = ('speechSynthesis' in window);
const P = {story:null,i:0,playing:false,token:0,utt:null,voice:null,voices:[]};
// Voice tiers: 3 = neural (Edge "Natural", Apple "Premium"), 2 = Apple "Enhanced", 1 = decent, 0 = robotic
// Safari/iPad name Apple voices just "Ava" etc. -- the quality only shows in voiceURI
// (com.apple.voice.premium.en-US.Ava / .enhanced. / .compact.), so check both.
function voiceId(v){ return v.name+' '+(v.voiceURI||''); }
function voiceTier(v){
  const n=voiceId(v);
  if(/\(Natural\)|Neural|Online|Premium/i.test(n)) return 3;
  if(/Enhanced/i.test(n)) return 2;
  if(/Compact/i.test(n)) return 0;
  if(/Samantha|Ava|Allison|Susan|Zoe|Serena|Google US English|Google UK English Female/i.test(n)) return 1;
  return 0;
}
function isNice(v){ return voiceTier(v)>=2; }
function rankVoice(v){
  let s=voiceTier(v)*10;
  if(/^en[-_]US/i.test(v.lang)) s+=3; else if(/^en[-_](GB|AU|CA|IE)/i.test(v.lang)) s+=1;
  // warm storyteller voices get a small nudge within their tier
  if(/Ava|Emma|Jenny|Aria|Andrew|Brian|Zoe|Libby|Sonia|Natasha/i.test(v.name)) s+=2;
  if(/Compact|eSpeak/i.test(voiceId(v))) s-=8;
  if(/Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Organ|Ralph|Trinoids|Whisper|Zarvox|Fred|Superstar|Wobble|Jester|Junior|Grandma|Grandpa|Rocko|Shelley|Sandy|Eddy|Flo|Reed/i.test(v.name)) s-=50;
  return s;
}
function voiceLabel(v){
  let n=v.name.replace(/^Microsoft\s+/,'').replace(/\s*Online\s*\(Natural\)/i,'').replace(/\s*-\s*English.*$/i,'').replace(/^Google\s+/,'Google ');
  const reg=(v.lang.split(/[-_]/)[1]||'').toUpperCase();
  const q=/premium/i.test(v.voiceURI||'')&&!/premium/i.test(n)?' (Premium)':/enhanced/i.test(v.voiceURI||'')&&!/enhanced/i.test(n)?' (Enhanced)':'';
  return (isNice(v)?'✨ ':'')+n+q+(reg&&!n.includes(reg)?' ('+reg+')':'');
}
function loadVoices(){
  if(!TTS) return;
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang));
  vs.sort((a,b)=>rankVoice(b)-rankVoice(a));
  P.voices=vs;
  const saved = vs.find(v=>v.voiceURI===state.prefs.voice);
  P.voice = (saved && voiceTier(saved)>=voiceTier(vs[0]||saved)) ? saved : (vs[0] || null);
  const sel=$('#voiceSel'); if(sel) fillVoices(sel);
  showVoiceTip();
}
function fillVoices(sel){
  sel.innerHTML=P.voices.map(v=>'<option value="'+esc(v.voiceURI)+'"'+(P.voice&&P.voice.voiceURI===v.voiceURI?' selected':'')+'>'+esc(voiceLabel(v))+'</option>').join('') || '<option>Default voice</option>';
}
function showVoiceTip(){
  const tip=$('#voiceTip'); if(!tip) return;
  const hasNice=P.voices.some(isNice);
  if(hasNice){ tip.hidden=true; return; }
  const ua=navigator.userAgent, apple=/Mac|iPhone|iPad/.test(ua);
  tip.hidden=false;
  tip.innerHTML = apple
    ? '💡 Want a more natural voice? Download one on this device: <b>Settings → Accessibility → Spoken Content → Voices → English</b> (Mac: <b>System Settings → Accessibility → Spoken Content → System voice → Manage Voices</b>), pick <b>Ava (Premium)</b> or <b>Zoe (Premium)</b>, then reload this page. Or open Story Cove in <b>Microsoft Edge</b>.'
    : '💡 Want a more natural voice? Open Story Cove in <b>Microsoft Edge</b> — it has free, human-sounding “Natural” voices like Ava and Emma.';
}
if(TTS){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; setTimeout(loadVoices,700); }

function stopSpeech(){ P.playing=false; P.token++; if(TTS) speechSynthesis.cancel(); }
function setPlayUI(){
  const b=$('#playBtn'); if(!b) return;
  b.innerHTML = P.playing ? '<svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M7 4.5 L20 12 L7 19.5 Z"/></svg>';
  b.setAttribute('aria-label', P.playing?'Pause':'Play');
  const sb=$('#startBtn'); if(sb) sb.hidden = P.i>0 || P.playing;
}
function markOn(i){
  document.querySelectorAll('.s.on').forEach(e=>e.classList.remove('on'));
  const el=$('.s[data-i="'+i+'"]'); if(!el) return;
  el.classList.add('on');
  if(state.prefs.follow){
    const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});
  }
}
function updateProgress(){
  const st=P.story; if(!st) return;
  const total=st.sents.length; const bar=$('#barFill'); if(bar) bar.style.width=Math.min(100,(P.i/total)*100)+'%';
  let remaining=0; for(let k=P.i;k<total;k++) remaining+=st.sents[k].text.split(/\s+/).length;
  const info=$('#pTime'); if(info) info.textContent='Sentence '+Math.min(P.i+1,total)+' of '+total+' · '+fmtMin(minutesFor(remaining,state.prefs.rate))+' left';
}
function speakFrom(i){
  if(!TTS) return;
  hideWord();
  const st=P.story; P.i=Math.max(0,Math.min(i,st.sents.length-1));
  speechSynthesis.cancel(); P.token++; const tok=P.token; P.playing=true; setPlayUI();
  setTimeout(()=>step(tok),80);
}
function step(tok){
  if(tok!==P.token||!P.playing) return;
  const st=P.story;
  if(P.i>=st.sents.length){ finishListening(); return; }
  markOn(P.i); updateProgress();
  const text=st.sents[P.i].text;
  const u=new SpeechSynthesisUtterance(text);
  u.rate=state.prefs.rate; u.pitch=1; u.lang='en-US';
  if(P.voice){ u.voice=P.voice; u.lang=P.voice.lang; }
  u.onend=()=>{
    if(tok!==P.token) return;
    state.minutes+=minutesFor(text.split(/\s+/).length,state.prefs.rate); touchDay();
    const cur=st.sents[P.i], nxt=st.sents[P.i+1];
    let gap = !nxt ? 0 : (nxt.para!==cur.para ? 650 : 180);
    if(/[?!][”"’)]*$/.test(cur.text)) gap+=80;
    P.i++; setTimeout(()=>step(tok), gap/state.prefs.rate);
  };
  u.onerror=(e)=>{ if(tok!==P.token) return; if(e.error==='interrupted'||e.error==='canceled') return; P.i++; step(tok); };
  P.utt=u; speechSynthesis.speak(u);
}
function pauseSpeech(){ P.playing=false; P.token++; if(TTS) speechSynthesis.cancel(); saveState(); setPlayUI(); }
function finishListening(){
  P.playing=false; P.i=0; saveState(); setPlayUI(); updateProgress();
  document.querySelectorAll('.s.on').forEach(e=>e.classList.remove('on'));
  const q=$('#quiz'); if(q) q.scrollIntoView({behavior:'smooth',block:'start'});
}
function togglePlay(){ if(P.playing) pauseSpeech(); else speakFrom(P.i); }
function skip(d){ const wasPlaying=P.playing; const ni=Math.max(0,Math.min(P.story.sents.length-1,P.i+d)); if(wasPlaying) speakFrom(ni); else { P.i=ni; markOn(ni); updateProgress(); } }

/* ---------- word card ---------- */
function showWord(st,vi){
  pauseSpeech(); hideWord();
  const v=st.vocab[vi]; const d=document.createElement('div'); d.className='wcard'; d.id='wcard';
  d.style.setProperty('--c','var('+CATS[st.cat].c+')');
  d.innerHTML='<h3>'+esc(v.w)+'</h3><p>'+esc(v.d)+'</p><div class="row"><button class="btn" id="wHear">Hear it</button><button class="btn alt" id="wGo">Keep listening</button><button class="btn alt" id="wX">Close</button></div>';
  document.body.appendChild(d);
  $('#wHear').onclick=()=>{ if(!TTS) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(v.w+'. '+v.d); u.rate=Math.min(state.prefs.rate,0.9); if(P.voice){u.voice=P.voice;u.lang=P.voice.lang;} P.utt=u; speechSynthesis.speak(u); };
  $('#wGo').onclick=()=>{ hideWord(); speakFrom(P.i); };
  $('#wX').onclick=hideWord;
}
function hideWord(){ const d=$('#wcard'); if(d) d.remove(); }

/* ---------- views ---------- */
const app=$('#app');
function topBar(){
  return '<div class="top"><a class="brand" href="#" aria-label="Story Cove home"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M4 30 Q20 8 36 30 Z" fill="var(--accent)"/><path d="M4 30 Q12 24 20 30 T36 30 V36 H4 Z" fill="var(--c-adventure)" opacity=".85"/><circle cx="29" cy="12" r="4" fill="var(--hl)"/></svg>Story Cove</a></div>';
}
let filter='all';
function homeView(){
  stopSpeech(); hideWord(); P.story=null;
  const cnt=Object.keys(state.done).length;
  const totalMin=Math.round(STORIES.reduce((a,s)=>a+minutesFor(s.words,0.9),0));
  const badges=badgeList();
  const shown=STORIES.filter(s=>filter==='all'?true:filter==='fav'?isFav(s.n):s.cat===filter);
  const cards=shown.map(s=>{
    const cat=CATS[s.cat];
    return '<a class="card" href="#story-'+s.n+'" style="--c:var('+cat.c+')"><div class="art"><span class="no">STORY '+s.n+'</span>'+(state.done[s.n]?'<span class="done" title="Finished"><svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg></span>':'')+favBtn(s.n,'iconfav')+scene(s.cat)+'</div><div class="body"><h3>'+esc(s.title)+'</h3><p>'+esc(s.blurb)+'</p><div class="meta"><span class="dot">'+cat.label+'</span><span>'+fmtMin(minutesFor(s.words,0.9)).replace('about ','')+' listen</span></div></div></a>';
  }).join('');
  const emptyFav = (filter==='fav' && !shown.length) ? '<p class="note">No favorites yet. Tap the star on any story to save it here.</p>' : '';
  const chips=[['all','All stories'],['fav','★ Favorites']].concat(Object.entries(CATS).map(([k,v])=>[k,v.label])).map(([k,l])=>'<button class="chip" data-f="'+k+'" aria-pressed="'+(filter===k)+'">'+l+'</button>').join('');
  app.innerHTML=topBar()+
   '<section class="hero"><h1>Press play and read along.</h1><p>'+STORIES.length+' stories for 4th grade readers about science, gymnastics, ballet, legends, art, friendship, and adventure. Watch each sentence light up as you listen, tap a dotted word to learn it, tap the star to save a favorite, then check what you understood.</p>'+
   '<div class="stats"><div class="stat"><b>'+cnt+' / '+STORIES.length+'</b><span>Stories finished</span></div><div class="stat"><b>'+Math.round(state.minutes)+'</b><span>Minutes listened</span></div><div class="stat"><b>'+streak()+'</b><span>Day streak</span></div><div class="stat"><b>'+state.favs.length+'</b><span>Favorites saved</span></div></div></section>'+
   '<section class="shelf"><h2>Trophy shelf</h2><div class="badges">'+badges.map(b=>'<span class="badge'+(b.ok?'':' off')+'"><i>'+b.i+'</i>'+b.n+'</span>').join('')+'</div></section>'+
   '<div class="filters" role="group" aria-label="Filter stories">'+chips+'</div>'+emptyFav+'<div class="grid">'+cards+'</div>'+
   '<p class="note" style="margin-top:26px">Each story takes about '+Math.round(totalMin/STORIES.length)+' minutes to listen to at the default speed. Change the speed in the player if you want it slower or faster. Your progress is saved in this browser.</p>';
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ filter=b.dataset.f; homeView(); });
  bindFavButtons(app);
  window.scrollTo(0,0);
}

function storyView(n){
  const st=STORIES[n-1]; if(!st){ location.hash=''; return; }
  stopSpeech(); hideWord(); st._seen={}; P.story=st; P.i=0;
  const cat=CATS[st.cat];
  let idx=0;
  const paras=st.paras.map(ss=>'<p>'+ss.map(s=>{ const h='<span class="s" data-i="'+idx+'">'+vocabHTML(s,st)+'</span>'; idx++; return h; }).join(' ')+'</p>').join('');
  const words='<section class="words"><h2>Word box</h2><ul class="wlist">'+st.vocab.map(v=>'<li><b>'+esc(v.w)+'</b> · '+esc(v.d)+'</li>').join('')+'</ul></section>';
  const quiz='<section class="quiz" id="quiz"><h2>Show what you know</h2>'+st.quiz.map((q,qi)=>'<div class="q" data-q="'+qi+'"><span class="sk">'+esc(q.skill)+'</span><span class="qt">'+esc(q.q)+'</span>'+q.opts.map((o,oi)=>'<button class="opt" data-o="'+oi+'">'+esc(o)+'</button>').join('')+'<p class="why" hidden></p></div>').join('')+'<div id="result"></div></section>';
  const nextN=n<STORIES.length?n+1:null;
  app.innerHTML=topBar()+'<a class="back" href="#">&larr; All stories</a>'+
   '<header class="sh" style="--c:var('+cat.c+')"><div class="sh-top"><div class="badge-ill">'+scene(st.cat)+'</div><div><div class="pillrow"><span class="pill">'+cat.label+' · Story '+n+'</span>'+favBtn(n,'shfav')+'</div><h1>'+esc(st.title)+'</h1></div></div><p>'+esc(st.blurb)+'</p><p style="font-size:.95rem">'+st.words+' words · '+fmtMin(minutesFor(st.words,state.prefs.rate))+' at your speed</p>'+
   (TTS?'<button class="startbtn" id="startBtn"><svg viewBox="0 0 24 24"><path d="M7 4.5 L20 12 L7 19.5 Z"/></svg>Listen to this story</button>':'<div class="note">This browser cannot read aloud. Try Chrome, Edge, or Safari to hear the story. You can still read it below.</div>')+'</header>'+
   '<article class="text" style="--c:var('+cat.c+')" id="text">'+paras+'</article>'+
   '<div style="--c:var('+cat.c+')">'+words+'</div><div style="--c:var('+cat.c+')">'+quiz+'</div>'+
   '<div class="row" style="margin-top:28px">'+(nextN?'<a class="btn" href="#story-'+nextN+'">Next story &rarr;</a>':'')+'<a class="btn alt" href="#">Back to all stories</a></div>'+
   playerHTML();
  window.scrollTo(0,0);
  bindStory(st);
  bindFavButtons(app);
  updateProgress(); setPlayUI();
}
function playerHTML(){
  if(!TTS) return '';
  return '<div class="player" role="region" aria-label="Story player"><div class="pin">'+
   '<div class="bar" id="bar" role="progressbar" aria-label="Story progress"><i id="barFill"></i></div>'+
   '<div class="prow"><button class="pbtn" id="prevBtn" aria-label="Previous sentence"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 5h2.5v14H6zM20 5v14L10 12z"/></svg></button>'+
   '<button class="pbtn main" id="playBtn" aria-label="Play"></button>'+
   '<button class="pbtn" id="nextBtn" aria-label="Next sentence"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M15.5 5H18v14h-2.5zM4 5l10 7-10 7z"/></svg></button>'+
   '<div class="pinfo"><b>'+esc(P.story.title)+'</b><small id="pTime"></small></div></div>'+
   '<div class="prefs"><label>Speed <select id="rateSel">'+[0.7,0.8,0.9,1,1.1,1.25].map(r=>'<option value="'+r+'"'+(r===state.prefs.rate?' selected':'')+'>'+r+'x</option>').join('')+'</select></label>'+
   '<label>Voice <select id="voiceSel"></select></label>'+
   '<label><input type="checkbox" id="followChk"'+(state.prefs.follow?' checked':'')+'> Auto-scroll</label>'+
   '<span>Text <button class="mini" id="fsMinus" aria-label="Smaller text">A-</button> <button class="mini" id="fsPlus" aria-label="Larger text">A+</button></span></div><div id="voiceTip" class="vtip" hidden></div></div></div>';
}
function bindStory(st){
  const text=$('#text');
  text.addEventListener('click',e=>{
    const w=e.target.closest('.vw'); if(w){ e.stopPropagation(); showWord(st,+w.dataset.v); return; }
    const s=e.target.closest('.s'); if(s && TTS) speakFrom(+s.dataset.i);
  });
  if(TTS){
    $('#playBtn').onclick=togglePlay; $('#startBtn')&&($('#startBtn').onclick=()=>speakFrom(0));
    $('#prevBtn').onclick=()=>skip(-1); $('#nextBtn').onclick=()=>skip(1);
    $('#bar').onclick=e=>{ const r=e.currentTarget.getBoundingClientRect(); const i=Math.floor(((e.clientX-r.left)/r.width)*st.sents.length); if(P.playing) speakFrom(i); else { P.i=Math.max(0,Math.min(st.sents.length-1,i)); markOn(P.i); updateProgress(); } };
    $('#rateSel').onchange=e=>{ state.prefs.rate=+e.target.value; saveState(); updateProgress(); if(P.playing) speakFrom(P.i); };
    fillVoices($('#voiceSel'));
    $('#voiceSel').onchange=e=>{ const v=P.voices.find(v=>v.voiceURI===e.target.value); if(v){ P.voice=v; state.prefs.voice=v.voiceURI; saveState(); if(P.playing) speakFrom(P.i); } };
    $('#followChk').onchange=e=>{ state.prefs.follow=e.target.checked; saveState(); };
    const setFs=d=>{ state.prefs.fs=Math.max(1,Math.min(2,+(state.prefs.fs+d).toFixed(2))); document.documentElement.style.setProperty('--fs',state.prefs.fs+'rem'); saveState(); };
    $('#fsMinus').onclick=()=>setFs(-0.12); $('#fsPlus').onclick=()=>setFs(0.12);
    showVoiceTip();
  }
  // quiz
  let answered=0, score=0;
  document.querySelectorAll('.q').forEach(qEl=>{
    const q=st.quiz[+qEl.dataset.q];
    qEl.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const pick=+b.dataset.o; qEl.querySelectorAll('.opt').forEach(o=>o.disabled=true);
      qEl.querySelectorAll('.opt')[q.ans].classList.add('right');
      if(pick===q.ans) score++; else b.classList.add('wrong');
      const why=$('.why',qEl); why.textContent=(pick===q.ans?'Correct! ':'Not quite. ')+q.why; why.hidden=false;
      answered++;
      if(answered===st.quiz.length) showResult(st,score);
    });
  });
}
function showResult(st,score){
  const total=st.quiz.length; const first=!state.done[st.n];
  const prev=state.done[st.n]; if(!prev || score>=prev.score) state.done[st.n]={score,total,date:today()};
  touchDay(); saveState();
  const msg=score===total?'Perfect score! You understood this story very well.':score>=total-1?'Great job! You caught almost everything.':score>=Math.ceil(total/2)?'Good work. Listen again and try to catch what you missed.':'Nice try. Listen once more, then take the quiz again.';
  $('#result').innerHTML='<div class="result"><h3>You got '+score+' out of '+total+'</h3><div class="stars" aria-hidden="true">'+Array.from({length:total},(_,i)=>'<span class="'+(i<score?'f':'')+'">&#9733;</span>').join('')+'</div><p style="margin:0">'+msg+(first?' Story finished and saved to your shelf.':'')+'</p></div>';
  $('#result').scrollIntoView({behavior:'smooth',block:'center'});
}

/* ---------- router ---------- */
function route(){
  const m=location.hash.match(/^#story-(\d+)$/);
  document.querySelectorAll('.wcard').forEach(e=>e.remove());
  if(m) storyView(+m[1]); else homeView();
}
window.addEventListener('hashchange',route);
window.addEventListener('pagehide',()=>{ stopSpeech(); saveState(); });
document.addEventListener('keydown',e=>{
  if(e.code==='Space' && P.story && TTS && !/^(BUTTON|SELECT|INPUT|A|TEXTAREA)$/.test(document.activeElement.tagName)){ e.preventDefault(); togglePlay(); }
});
route();
</script>
</body></html>
