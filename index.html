<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Story Cove</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EAF3F5; --surface:#FFFFFF; --ink:#172B3A; --muted:#4F6675; --line:#C9DCE1;
  --accent:#0B6E78; --accent-ink:#FFFFFF; --hl:#FFE27A; --hl-ink:#172B3A;
  --good:#1F7A3E; --good-bg:#DDF3E2; --bad:#B3341F; --bad-bg:#FBE3DD;
  --shadow:0 1px 2px rgba(23,43,58,.08),0 8px 22px rgba(23,43,58,.07);
  --c-science:#0E7C86; --c-gymnastics:#D9512F; --c-ballet:#B0437F; --c-myth:#A97300; --c-adventure:#3563C4; --c-friend:#48892F; --c-art:#7A4FA3;
  --fs:1.28rem;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1D26; --surface:#162A35; --ink:#E9F1F4; --muted:#9DB3BE; --line:#28434F;
    --accent:#52C2CB; --accent-ink:#06222A; --hl:#6E5B0C; --hl-ink:#FFF6D0;
    --good:#7BD394; --good-bg:#17382A; --bad:#FF9C86; --bad-bg:#43211B;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3);
    --c-science:#3CB4BE; --c-gymnastics:#FF7F63; --c-ballet:#E07DB4; --c-myth:#E3B043; --c-adventure:#7C9CF0; --c-friend:#7FC162; --c-art:#C9A3E8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1D26; --surface:#162A35; --ink:#E9F1F4; --muted:#9DB3BE; --line:#28434F;
  --accent:#52C2CB; --accent-ink:#06222A; --hl:#6E5B0C; --hl-ink:#FFF6D0;
  --good:#7BD394; --good-bg:#17382A; --bad:#FF9C86; --bad-bg:#43211B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3);
  --c-science:#3CB4BE; --c-gymnastics:#FF7F63; --c-ballet:#E07DB4; --c-myth:#E3B043; --c-adventure:#7C9CF0; --c-friend:#7FC162; --c-art:#C9A3E8;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.05rem;line-height:1.55}
button,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:18px 150px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:1.5rem;text-decoration:none}
.brand svg{width:34px;height:34px}
.hero{display:grid;gap:18px;margin-bottom:26px}
.hero h1{font-size:clamp(1.8rem,5.5vw,2.8rem);font-weight:700;max-width:22ch}
.hero p{margin:0;max-width:60ch;color:var(--muted);font-size:1.1rem}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:130px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.85rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.shelf{margin-bottom:28px}
.shelf h2{font-size:1.25rem;margin-bottom:10px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.92rem}
.badge i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--hl);color:var(--hl-ink);font-style:normal;font-family:var(--display);font-weight:700;font-size:.85rem}
.badge.off{opacity:.55}
.badge.off i{background:var(--line);color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;box-shadow:var(--shadow);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .art{position:relative;height:128px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.scene{width:104px;height:78px}
.card .no{position:absolute;left:12px;top:10px;font-family:var(--display);font-weight:600;font-size:.85rem;color:var(--c);letter-spacing:.04em}
.card .done{position:absolute;right:44px;top:8px;width:28px;height:28px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center}
.card .done svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.favbtn{cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700}
.favbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}
.favbtn.on{color:var(--hl-ink);background:var(--hl);border-color:var(--hl)}
.favbtn.on svg{fill:currentColor}
.card .favbtn{position:absolute;right:10px;top:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;padding:0}
.pillrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.shfav{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:.9rem}
.card .body{padding:14px 16px 16px;display:grid;gap:8px;flex:1;align-content:start}
.card h3{font-size:1.2rem;font-weight:600}
.card p{margin:0;font-size:.95rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.85rem;color:var(--muted)}
.dot{display:inline-flex;align-items:center;gap:6px}
.dot::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
/* story page */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0;cursor:pointer;font-weight:700;color:var(--accent);text-decoration:none}
.sh{display:grid;gap:12px;margin:8px 0 22px;max-width:70ch}
.sh-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.badge-ill{flex:0 0 auto;width:96px;height:96px;border-radius:22px;background:color-mix(in srgb,var(--c) 18%,var(--surface));display:grid;place-items:center;box-shadow:var(--shadow)}
.badge-ill .scene{width:76px;height:58px}
.sh h1{font-size:clamp(1.9rem,5.5vw,2.9rem);font-weight:700}
.sh p{margin:0;color:var(--muted);font-size:1.12rem}
.pill{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;color:var(--c)}
.pill::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.startbtn{justify-self:start;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:12px 22px;font-weight:700;font-size:1.05rem;cursor:pointer;box-shadow:var(--shadow)}
.startbtn svg,.pbtn svg{width:22px;height:22px;fill:currentColor}
.text{max-width:68ch;font-size:var(--fs);line-height:1.8;display:grid;gap:1.05em}
.text p{margin:0}
.s{cursor:pointer;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:1px 0;transition:background .12s}
.s:hover{background:color-mix(in srgb,var(--hl) 35%,transparent)}
.s.on{background:var(--hl);color:var(--hl-ink)}
.vw{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-bottom:3px dotted var(--c);font-weight:700}
.vw:hover{background:color-mix(in srgb,var(--c) 22%,transparent)}
.words{margin-top:36px;max-width:68ch}
.words h2,.quiz h2{font-size:1.5rem;margin-bottom:12px}
.wlist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.wlist li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.wlist b{font-family:var(--display);font-size:1.1rem;color:var(--c)}
.quiz{margin-top:38px;max-width:68ch;display:grid;gap:16px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px}
.q .sk{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.q .qt{font-weight:700;font-size:1.15rem}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;cursor:pointer;font-size:1.02rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.why{font-size:.98rem;color:var(--muted);margin:0}
.result{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:20px;display:grid;gap:12px}
.result h3{font-size:1.5rem}
.stars{font-size:1.8rem;letter-spacing:.2em;color:var(--hl-ink);text-shadow:0 0 0 var(--hl)}
.stars span{color:var(--line)} .stars span.f{color:#E8A400}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:10px 20px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
/* player */
.player{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.1);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.pin{max-width:1080px;margin:0 auto;display:grid;gap:8px}
.prow{display:flex;align-items:center;gap:10px}
.pbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.pbtn.main{width:56px;height:56px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pinfo{flex:1;min-width:0}
.pinfo b{display:block;font-family:var(--display);font-size:.98rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinfo small{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;cursor:pointer}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.prefs{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.88rem;color:var(--muted)}
.prefs label{display:inline-flex;align-items:center;gap:6px}
.prefs select{background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;max-width:190px}
.vtip{margin-top:8px;font-size:.84rem;line-height:1.45;color:var(--muted);background:var(--bg);border:1.5px dashed var(--line);border-radius:10px;padding:8px 10px}
.vtip[hidden]{display:none}
.prefs .mini{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 10px;cursor:pointer;font-weight:700}
.wcard{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--surface);border:2px solid var(--c);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);z-index:30;display:grid;gap:8px}
.wcard h3{font-size:1.4rem;color:var(--c)}
.wcard p{margin:0}
.note{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:.95rem}
@media (max-width:520px){.prefs .hide-s{display:none}.prefs select{max-width:150px}.wcard{bottom:calc(168px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>

<script>
const STORIES = [{"vocab": [{"w": "camouflage", "d": "colors or patterns that help an animal blend in with its surroundings"}, {"w": "beak", "d": "the hard, pointed part of the mouth of an octopus or a bird"}, {"w": "suspicious", "d": "feeling that something is not quite right"}, {"w": "puzzle", "d": "a problem or game that takes careful thinking to solve"}, {"w": "flexible", "d": "able to bend easily without breaking"}], "quiz": [{"skill": "Main idea", "q": "What is the main idea of this story?", "opts": ["Octopuses are dangerous animals", "Octopuses are clever, curious animals that can solve problems", "Aquariums should not keep animals", "Crabs are hard to catch"], "ans": 1, "why": "The story shows Marlow opening jars, escaping, and solving puzzles, which proves how smart octopuses are."}, {"skill": "Details", "q": "How did Marlow get out of the tank?", "opts": ["He broke the glass", "Someone left the door open", "He squeezed through a small gap near the lid", "He climbed out through the drain"], "ans": 2, "why": "Octopuses have no bones, so they can squeeze through any gap bigger than their hard beak."}, {"skill": "Inference", "q": "Why did Nora put a camera in the room?", "opts": ["She wanted to take pretty pictures", "She wanted to find out who was sneaking out at night", "She was afraid of the dark", "Her teacher told her to"], "ans": 1, "why": "Nora noticed the missing crabs and a wet floor, so she needed proof of what was happening."}, {"skill": "Vocabulary", "q": "In the story, what does “flexible” mean?", "opts": ["Very heavy", "Very fast", "Able to bend easily", "Very quiet"], "ans": 2, "why": "Marlow's body is soft and bendy, which is exactly what flexible means."}, {"skill": "Character", "q": "What did Nora learn by the end of the story?", "opts": ["Animals should live alone", "Being patient and curious helps you learn from animals", "Octopuses cannot be trained", "Nighttime is scary"], "ans": 1, "why": "Nora solved the mystery by watching carefully instead of getting angry."}], "title": "The Octopus Who Escaped Every Night", "cat": "science", "blurb": "Something is sneaking out of the aquarium after dark. Nora and a giant Pacific octopus named Marlow are about to test each other's brains.", "paras": ["On Saturday mornings, Nora Chen put on her blue volunteer vest and rode the ferry to the Seattle waterfront. She was nine years old, and she was the youngest helper at the aquarium. Her job was to fill water bowls, wipe fingerprints off the glass, and answer questions from visitors. But her favorite part of the day was the last stop on her list. It was a big tank at the very back of the building, and inside it lived a giant Pacific octopus named Marlow.", "Marlow was the size of a beach ball, if a beach ball had eight long arms. His skin was the color of red brick, and it was covered in tiny bumps. When Nora walked up to the tank, he floated to the front and pressed one arm against the glass. The underside of his arm was lined with white suckers. Nora liked to think he was saying hello.", "“He recognizes you,” said Dr. Okafor, the scientist who took care of the animals. She held a clipboard and wore rubber boots that squeaked when she walked. “Octopuses can tell people apart. Some of them squirt water at the people they don’t like and leave their favorite visitors alone.”", "“Does Marlow like me?” asked Nora.", "“He hasn’t squirted you yet,” said Dr. Okafor with a smile. “That’s a very good sign.”", "Nora had been reading about octopuses for weeks, and she had collected a long list of amazing facts. An octopus has three hearts. Its blood is blue. It has no bones at all, so it can squeeze its body through a hole no bigger than its own eye. Even stranger, most of an octopus’s neurons are not in its head. They are spread through its arms, so each arm can almost think for itself. Nora liked to imagine eight little brains all arguing about what to do next.", "That Saturday, something was wrong. When Nora arrived, Dr. Okafor was standing in front of the crab tank with her hands on her hips. The crab tank sat two rows away from Marlow’s. Yesterday it had held six spotted crabs. Today it held four.", "“Two crabs are missing,” said Dr. Okafor. “And look at the floor.”", "Nora looked down. A trail of wet spots ran across the tile, like footprints that had been made by a ghost with very soft feet. The trail started near the crab tank. It ended at Marlow’s tank.", "“Somebody is playing a trick on us,” said Nora, and she felt her stomach flutter with excitement. “Or somebody is very hungry.”", "Dr. Okafor raised one eyebrow. “I locked every door last night myself. And the lid on Marlow’s tank was fastened tight. I checked it twice.”", "Nora looked at Marlow. He floated in the corner of his tank, perfectly still. His skin had turned from red to a pale, sandy brown, almost the same color as the rocks behind him. That was camouflage. An octopus can change its color in less than a second, using thousands of tiny colored sacs in its skin. Marlow looked very calm. He looked, Nora thought, a little too calm.", "“I think Marlow knows something,” she whispered.", "“Octopuses always know something,” said Dr. Okafor. “The trouble is, they never tell.”", "All day long, Nora kept an eye on the tank. She watched Marlow move his arms in slow, curling waves. She noticed that he kept touching the top corner of the lid, where a small rubber strip sealed the edge. Every time he touched it, the strip wiggled a tiny bit.", "At lunch, she showed Dr. Okafor. “Look. He’s been working on that strip all morning.”", "“Hmm,” said Dr. Okafor. “That strip is supposed to be tight. But even a small gap could be enough. An octopus can squeeze through any opening that is larger than its beak. The beak is the only hard part of its body.”", "“That means Marlow could fit through a hole the size of a lemon,” said Nora.", "“Or smaller,” said Dr. Okafor. “Octopuses are famous escape artists. There was one in New Zealand that slipped out of its tank every night and crawled back before morning. The keepers were suspicious for weeks.”", "Nora grinned. “Then I have an idea.”", "That night, Nora asked her dad to help her. Dr. Okafor had given permission for a small camera to be set up in the back room of the aquarium. Nora’s dad, who fixed computers for a living, taped it to a shelf and pointed it at Marlow’s tank. Then they went home, and Nora hardly slept. She kept picturing a long red arm sliding over the edge of a tank in the dark.", "At six o’clock the next morning, Nora and Dr. Okafor sat together in the office and pressed play on the video.", "For a long time, nothing happened. The room was dark and silent. The water in the tank rippled softly. Then, at 2:14 a.m., the corner of the lid rose by the width of a pencil. A single arm slid out, feeling its way along the edge like a person searching for a light switch in a strange house.", "Nora clapped her hand over her mouth.", "The arm was followed by another, and another. Then the whole octopus poured out of the tank like a thick, dark liquid. His body seemed to have no shape of its own. He squeezed through the gap, flowed down the side of the tank, and landed on the tile with a soft plop. Marlow was flexible in a way that seemed impossible for such a big animal.", "He crossed the room slowly, one arm at a time. On the video, he looked like a very patient, very sneaky puddle. When he reached the crab tank, he stopped and rested there, as if he was thinking. Then he reached over the top, picked out a crab with one arm, and tucked it neatly under his body.", "“He’s eating dinner,” whispered Dr. Okafor. “In another tank. And then he goes back home.”", "Sure enough, a few minutes later Marlow returned to his own tank and slid inside. The last thing the camera showed was one long arm reaching up, adjusting the lid back into place.", "“He closed the door behind him,” said Nora, amazed.", "“So nobody would notice,” said Dr. Okafor. She was laughing so hard that she had to wipe her eyes. “Marlow, you clever scoundrel.”", "Now they knew the mystery. But the mystery had turned into a puzzle. If Marlow could get out, how could they keep him safe? An octopus loose in a building at night might get stuck, dry out, or wander into a place where he couldn’t breathe. Octopuses breathe with gills, so they need to stay wet. Nora felt her excitement turn into worry.", "“We could put a heavy rock on the lid,” she said.", "“He might move it. Octopuses are stronger than they look.”", "“We could tie the lid down with rope.”", "“He might untie it,” said Dr. Okafor. “Octopuses have opened jar lids from the inside. One in a lab even figured out how to unscrew a bottle of food.”", "Nora thought hard. The best way to solve a tricky problem is to understand the one who made it. What did Marlow want? He wanted crabs. He wanted something to do. He was bored, and he was curious, and he had eight arms that never stopped exploring.", "“Maybe he isn’t escaping because he’s unhappy,” she said slowly. “Maybe he just has too much brain and not enough to do.”", "Dr. Okafor looked at her for a moment. “That is exactly what many scientists believe. Octopuses need enrichment. That means toys, puzzles, and new things to explore.”", "So Nora and Dr. Okafor went to work. They locked the lid with a special clip that Marlow could not reach. Then they built him a puzzle. Nora found a clear plastic box with a screw-on lid and put a small crab inside. She placed the box in Marlow’s tank and stepped back.", "Marlow noticed it right away. He drifted toward the box and wrapped an arm around it. He turned it over, and over, and over again. His skin flashed from brown to red to pale pink as he thought. Then he found the lid. He twisted it, one small turn at a time, until it popped off and the crab floated out. Marlow scooped up his snack and pulled it into his mouth, and Nora cheered so loudly that a family of visitors turned to stare.", "“Good job, Marlow!” she shouted, and she thought she saw him wink, although Dr. Okafor said octopuses do not really wink.", "After that, Nora visited Marlow every Saturday with a new puzzle. She brought a tube with a floating treat inside, a maze made of plastic pipes, and a ball with holes in it. Marlow solved every one, usually faster than the time before. He seemed to enjoy the challenge. He never tried to escape again, and the crab tank stayed full.", "One afternoon, a visiting kid asked, “Is he smart?”", "Nora stood up straight in her blue vest. “Very,” she said. “He is one of the smartest animals in the ocean. And he taught me something too.”", "“What did he teach you?” the kid asked.", "Nora smiled at the octopus, who was floating at the glass with one arm pressed against it. “When something puzzling happens,” she said, “don’t just get upset. Watch closely, ask questions, and stay curious. That’s how you figure out what’s really going on.”", "Marlow’s skin turned a warm, rosy pink. Dr. Okafor said it was the color octopuses sometimes turn when they are relaxed. Nora decided it meant something else. She decided it meant, You’re welcome."]}, {"vocab": [{"w": "volcano", "d": "a mountain with an opening where hot melted rock can come out"}, {"w": "glacier", "d": "a huge, slow-moving river of ice"}, {"w": "magma", "d": "hot, melted rock beneath the earth's surface"}, {"w": "erupt", "d": "to burst out suddenly with force"}, {"w": "lava", "d": "melted rock that flows out of a volcano"}], "quiz": [{"skill": "Main idea", "q": "What is the main idea of this story?", "opts": ["Mount Rainier is a volcano that is quiet now but still active", "Hiking is dangerous", "Glaciers are melting everywhere", "Grandma is a geologist"], "ans": 0, "why": "The story explains that Rainier is a sleeping volcano covered in ice, and scientists watch it carefully."}, {"skill": "Details", "q": "What is a glacier?", "opts": ["A kind of rock", "A giant, slowly moving river of ice", "A very cold lake", "A type of snow storm"], "ans": 1, "why": "The story describes glaciers as huge rivers of ice that move very slowly downhill."}, {"skill": "Inference", "q": "Why do scientists put instruments on the mountain?", "opts": ["To take pictures of tourists", "To warn people if the volcano wakes up", "To keep the glaciers cold", "To count the hikers"], "ans": 1, "why": "Instruments listen for tiny earthquakes that could be an early warning."}, {"skill": "Sequence", "q": "What happens right after Eli and Grandma reach the meadow?", "opts": ["They see the crater", "They eat lunch and look at the glacier", "They start a campfire", "They meet a ranger"], "ans": 1, "why": "After arriving at the meadow, they sit down for lunch and study the glacier across the valley."}, {"skill": "Vocabulary", "q": "What does “erupt” mean?", "opts": ["To fall asleep", "To burst out with great force", "To melt slowly", "To grow smaller"], "ans": 1, "why": "When a volcano erupts, ash, gas and melted rock burst out."}], "title": "The Mountain That Sleeps Above Seattle", "cat": "science", "blurb": "Mount Rainier looks calm, but inside it a fiery secret is waiting. Join Eli and his grandmother on a hike to learn how a volcano is born.", "paras": ["The first time Eli Navarro saw Mount Rainier up close, he forgot to breathe. From his bedroom window in Tacoma, the mountain always looked like a white cloud sitting on the horizon. But today he was standing in a meadow at the foot of it, and the mountain filled the whole sky. It was enormous. Its top was buried in snow, and thick rivers of ice curled down its sides like frozen waterfalls.", "“Well?” said his grandmother. “Do you like it?”", "“It’s bigger than I thought,” Eli whispered.", "Grandma Rosa laughed. She had a red backpack, a floppy sun hat, and a walking stick covered with stickers from every park she had ever visited. She was a retired geologist, which meant she had spent her whole life studying rocks, mountains, and the strange ways the Earth changes. Eli’s parents had gone away for the weekend, and Grandma Rosa had promised him an adventure. This was it.", "“Fourteen thousand, four hundred and ten feet,” she said, tapping her stick on the trail. “That is how tall Rainier is. It’s the tallest mountain in Washington, and it’s the most glaciated mountain in the lower forty-eight states. Do you know what else it is?”", "Eli shook his head.", "“A volcano,” said Grandma Rosa. “An active one.”", "Eli stared at her. “Wait. That mountain is a volcano? Like the ones that shoot fire?”", "“Rainier hasn’t erupted in a very long time. The last small signs of activity were more than a hundred years ago. But yes, deep inside, it is still alive. Scientists call it a sleeping giant.”", "Eli looked up at the mountain. Suddenly the snow and the ice looked very different. It seemed to him that the mountain was holding its breath.", "They began to hike. The trail wound through a forest of tall, dark trees that smelled like rain and Christmas. Moss hung from the branches like green beards. Every few minutes Eli stopped to look at something new: a banana-yellow slug, a fallen log covered with tiny mushrooms, a stream so clear that he could see every pebble on the bottom.", "“How does a volcano get built?” he asked as they climbed. “Does someone dig it?”", "Grandma Rosa chuckled. “Nobody digs it, Eli. The Earth builds it. Deep under the ground, it is so hot that rock melts. That melted rock is called magma. Because magma is lighter than the solid rock around it, it slowly rises, like a bubble in a pot of thick soup.”", "“And then it comes out?”", "“Sometimes. When magma reaches the surface, we call it lava. If it comes out gently, it flows. If pressure builds up underneath, it can explode. Then the volcano erupts, throwing ash, gas, and rock into the sky. Over thousands of years, layer after layer of lava and ash pile up, and a mountain grows.”", "Eli let that idea sink in. The mountain in front of him had been built one eruption at a time, over hundreds of thousands of years. It had been growing since before there were any people in Washington.", "They reached a wooden bridge over a rushing stream. The water was milky gray, the color of dishwater. “That is glacier water,” said Grandma Rosa. “Do you know why it’s cloudy?”", "“Is it dirty?”", "“In a way. Glaciers are made of ice, but they are also very heavy, and they move. As they slide downhill, they grind the rocks under them into fine powder called rock flour. The powder mixes with the melting ice, and the stream turns gray. So that cloudy water is really the mountain’s ground-up bones.”", "“Gross,” said Eli. “Cool. Gross and cool.”", "By noon they had climbed up out of the forest and into a wide, open meadow. The air was cool and thin, and wildflowers covered the ground in purple, red, and yellow. Eli took off his backpack and sat on a rock. Across the valley, a glacier spilled down the mountainside, its surface cracked with deep blue lines.", "“Those cracks are called crevasses,” said Grandma Rosa, handing him a sandwich. “They form when the ice bends as it moves. Some are hundreds of feet deep. That is why you must never walk on a glacier without a guide and special gear.”", "“How fast does it move?”", "“Slowly. Maybe a few inches a day. If you sat here and stared at it for an hour, you would never see it change. But over a year, it travels far enough to carve a valley.”", "Eli chewed his sandwich and stared at the ice. It was hard to believe that something so still was really moving. It felt like the mountain was showing him a secret that only patient people could see.", "After lunch they walked to a small stone hut. Inside, a park ranger named Dev sat in front of a computer screen full of wiggly lines. He wore a green jacket and had a pair of binoculars around his neck.", "“Rosa!” he said. “I haven’t seen you in years.”", "“Dev, this is my grandson, Eli. He wants to know everything about volcanoes.”", "“Then you came to the right place,” said Dev. He pointed to the screen. “These lines are from seismometers. They are instruments hidden all over the mountain that feel tiny movements in the ground. Every day, Rainier has dozens of very small earthquakes, far too small for anyone to feel.”", "Eli felt a shiver. “Is that bad?”", "“Not usually,” said Dev. “It’s normal. The mountain settles and shifts, like an old house. But if the lines suddenly got taller and busier, that could be a warning that magma is moving. Then scientists would tell the towns nearby, and people would have time to get to safety.”", "“So someone is always listening to the mountain.”", "“Every second of every day,” said Dev. “That’s my favorite part of the job.”", "Eli asked one more question. “What would happen if Rainier did erupt?”", "Dev’s smile faded a little, but his voice stayed calm. “The biggest danger wouldn’t be lava. It would be lahars, which are fast rivers of mud and melted ice that rush down the valleys. That is why there are warning sirens in some towns, and why families practice a plan for getting to high ground. Being prepared is what makes it safe to live near a mountain like this.”", "Eli thought about that on the walk back. It was strange. The mountain was beautiful and a little scary at the same time. He decided that was okay. Most really important things were.", "At the end of the trail, Grandma Rosa stopped at a lookout point. The sun was setting behind the mountain, and its snowy top had turned pink and gold. A silver mist drifted around the highest peak.", "“Rainier is not an enemy,” she said quietly. “It gives us clean water from its glaciers, rich soil in its valleys, and a view that makes people forget their troubles. We just have to respect it.”", "“Like a giant that’s asleep,” said Eli.", "“Exactly. You don’t poke it. You watch it, you learn about it, and you take good care of the land around it.”", "Eli pulled a notebook from his backpack and, in his messiest handwriting, began to write. He wrote about the glacier and the magma and the stone hut with its wiggly lines. Then, at the bottom of the page, he wrote a sentence he wanted to remember forever.", "The mountain isn’t just a pretty picture. It’s alive, and I’m going to learn everything I can about it.", "Grandma Rosa read over his shoulder and smiled. “You know, Eli,” she said, “that is exactly how every scientist begins.”"]}, {"vocab": [{"w": "migrate", "d": "to travel a long distance at a certain time of year"}, {"w": "instinct", "d": "a natural feeling that tells an animal what to do without being taught"}, {"w": "current", "d": "water that flows steadily in one direction"}, {"w": "predator", "d": "an animal that hunts other animals for food"}, {"w": "spawn", "d": "to lay eggs"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["How to catch a fish", "A salmon's long journey from a river to the ocean and back home", "Why bears are dangerous", "How dams are built"], "ans": 1, "why": "The whole story follows Sky as she leaves the river, grows in the ocean, and returns to spawn."}, {"skill": "Details", "q": "How does Sky find her way back to her home stream?", "opts": ["She follows other fish", "She uses the smell of the water", "She reads signs", "She follows a boat"], "ans": 1, "why": "Salmon remember the smell of the stream where they were born."}, {"skill": "Inference", "q": "Why does Sky's body change color when she returns to the river?", "opts": ["To look pretty", "Her body is getting ready to spawn and she is using up her energy", "She is sick from pollution", "She wants to hide from bears"], "ans": 1, "why": "Salmon change as they prepare to spawn and stop eating during the trip upstream."}, {"skill": "Cause and effect", "q": "What helped Sky get past the dam?", "opts": ["A fish ladder", "A fisherman", "A bird", "A bridge"], "ans": 0, "why": "A fish ladder is a series of small steps in the water that lets fish climb past a dam."}, {"skill": "Vocabulary", "q": "What does “instinct” mean?", "opts": ["A tool used by scientists", "A natural feeling that guides an animal", "A kind of food", "A place to sleep"], "ans": 1, "why": "Sky does not learn the way home from anyone. Her instinct guides her."}], "title": "Sky, the Salmon Who Came Home", "cat": "science", "blurb": "A tiny salmon leaves the river where she was born, swims across the ocean, and follows her nose all the way home. It is the longest trip of her life.", "paras": ["Deep in the mountains of Washington, where the snow melted into cold, clear streams, a tiny fish hatched from an egg. She was smaller than your pinky finger. She had two big black eyes and a little orange sac of food attached to her belly. Her mother had laid her in a nest of gravel at the bottom of the river, and then the water had washed over her and kept her safe.", "She did not have a name yet. But a girl named Amara, who came to the river with her science class, would one day give her one.", "For the first few weeks, the baby fish hid among the pebbles. She was a young salmon, and the river was full of dangers. Trout wanted to eat her. Kingfishers, the diving birds, wanted to eat her. Even hungry water bugs would nibble her if they could. Every predator in the stream wanted a snack, and she was the perfect size.", "But she was quick, and she was lucky, and she grew. Soon the orange sac disappeared, and she started chasing tiny insects on her own. Her body became silvery and smooth, with small dark spots on her back. When sunlight hit the water, she flashed like a coin.", "One day in April, Amara stood on the riverbank with her class. Their teacher, Ms. Baptiste, had brought them to a hatchery to release young salmon into the stream. Each student got a bucket. Amara lowered hers into the water, and a small silver fish darted out into the current.", "“Bye, little one,” Amara whispered. “Good luck out there.”", "“Luck?” said Ms. Baptiste, kneeling beside her. “That fish has something better than luck. She has instinct.”", "“What is instinct?”", "“It’s a feeling that tells an animal what to do without anyone teaching it. That fish has never seen the ocean, and she has never met an older salmon. But something inside her already knows exactly where to go.”", "Amara watched the fish flick her tail and vanish into the shadows. “I’m going to call her Sky,” she decided. “Because she is silver like clouds.”", "And so, Sky began her journey.", "The river carried her downhill, past logs and rocks and clumps of green weed. It grew wider and wider. Along the way she met hundreds of other young salmon, and together they traveled in silvery groups called schools. Swimming in a school kept them safer, because a predator could not chase them all at once.", "Then the water began to taste different. It became a little salty. Sky felt strange. Her body was changing, getting ready for a new home. Salmon are one of the very few fish that can live in both fresh water and salt water. To do this, their bodies adjust, like a phone switching from one network to another. It took several days, and Sky stayed in the calm, muddy place where the river meets the sea. Then, one morning, the current tugged her out into the wide, open ocean.", "Sky had never seen anything so big. The water went on forever in every direction. Below her, the ocean was deep and blue-black. Above her, the surface sparkled with light. She felt tiny, and also free.", "The next two years were the adventure of her life. She chased schools of herring and tiny shrimp. She dodged hungry seals and diving seabirds. Once she escaped from an orca by racing into a bed of floating kelp and holding perfectly still while the huge whale circled overhead. Her heart pounded, but the orca eventually gave up and swam away.", "She swam thousands of miles, following the great ocean currents north toward Alaska and then west, far away from land. Every day she ate and grew, and her body became long and powerful. She was no longer a tiny fish. She was a strong, silver salmon as long as a baseball bat.", "Then, one autumn, Sky felt something new. It was a pull, like an invisible string tied to her middle. It tugged her toward the east, toward the land she had left behind.", "It was time to migrate home.", "Sky did not know why. No one had told her. But every cell in her body said, Go. She joined a group of other salmon heading the same direction. Some of them came from rivers in Oregon. Some came from rivers in British Columbia. But Sky’s river was in Washington, and slowly the salmon around her split apart as each fish followed the pull toward a different home.", "When she reached the coast, Sky smelled something that made her fins tingle. It was the scent of fresh water, mixed with a hundred tiny things she recognized: pine needles, cold stone, and mountain snow. Scientists believe that salmon remember the smell of the place where they were born, and use it like a map. Sky followed that smell up an estuary, then into a river, then through a maze of smaller streams.", "The trip was harder than she had ever imagined. The river ran fast and cold. She swam against the current every single moment. She stopped eating, because her body was saving every bit of energy for the journey. Her silver skin began to turn a deep, dusty red, and her head turned green. She was changing again, this time to prepare for the most important job of her life.", "Then Sky met a wall.", "It was a dam, built long ago by people, and it stretched all the way across the river. Water thundered over the top. Sky leaped, and smacked into the concrete. She leaped again, and fell back. Other salmon around her tried too, and none of them could make it.", "But the people who built the dam had also built something else. Beside the wall was a long channel filled with small, shallow pools, each one a bit higher than the last, like a staircase made of water. It was called a fish ladder. Sky found it by following the current and started hopping from pool to pool, up and up and up. At the top, she slipped into the calm water above the dam and kept going.", "Next came the bears. A big brown bear stood in the shallow water, waiting with wide-open paws. Sky saw a flash of claws. She twisted her body and shot past him into a deep, dark pool where he could not reach. Nearby, a fish that had not been so lucky became the bear’s dinner. That was nature too. Bears, eagles, and even the trees near the river all depend on the salmon. When fish die after spawning, their bodies feed the forest, and the forest keeps the river cool and clean for the next generation.", "At last, after weeks of swimming, Sky reached a small, familiar stream shaded by tall trees. The water was cold and clear, and the gravel at the bottom looked like a bed of jewels. She knew this place. It was where she had been born.", "She was exhausted. Her body was scratched and scarred. But she found a quiet spot on the gravel, and with a strong flick of her tail she dug a shallow nest. She laid thousands of tiny orange eggs. Beside her, a male salmon released his milt to fertilize them. When the last egg was safe, Sky rested. She had done what she came to do. This is called spawning, and it is the reason for the whole long trip.", "Sky’s life was ending, but it did not feel sad. Above her, the water sparkled and the leaves rustled. Under the gravel, hundreds of tiny lives were beginning.", "On the riverbank the next spring, a girl named Amara, now ten years old, stood with her class. She had come back to help count salmon. She held a clipboard, and her heart was thumping with hope.", "“Look!” cried a boy. “There’s a little one!”", "Amara leaned over the water. A tiny fish with big black eyes and a small orange sac was hiding among the pebbles. She smiled.", "“Hello,” she whispered. “I think I know your mom.”"]}, {"vocab": [{"w": "engineer", "d": "a person who designs and builds machines or structures"}, {"w": "atmosphere", "d": "the layer of gases around a planet"}, {"w": "sample", "d": "a small piece taken to study or test"}, {"w": "mission", "d": "an important job or trip with a special goal"}, {"w": "ancient", "d": "very, very old"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["A girl who wants to fly a plane", "A robot and a helicopter exploring Mars and what they teach us", "How to build a computer", "A family road trip"], "ans": 1, "why": "Maya follows the Perseverance mission and learns how scientists explore Mars."}, {"skill": "Details", "q": "Why was landing on Mars called “seven minutes of terror”?", "opts": ["Because the landing is short, fast, and cannot be controlled from Earth", "Because there was a storm", "Because the rover was broken", "Because nobody watched"], "ans": 0, "why": "It takes radio signals many minutes to reach Mars, so the landing had to happen automatically."}, {"skill": "Inference", "q": "Why did the engineers give the helicopter the name Ingenuity?", "opts": ["It was very heavy", "It showed clever thinking to do something new", "It was the first robot ever made", "It looked like a bird"], "ans": 1, "why": "Ingenuity means being clever and inventive, which describes the little helicopter."}, {"skill": "Sequence", "q": "What did Maya do after the landing?", "opts": ["She wrote a letter to the mission team", "She built a paper helicopter and tested it", "She took a nap", "She read about volcanoes"], "ans": 1, "why": "Maya tried a paper helicopter experiment, just like the engineers testing in air."}, {"skill": "Vocabulary", "q": "What does “ancient” mean?", "opts": ["Very new", "Very old", "Very small", "Very loud"], "ans": 1, "why": "Ancient rivers on Mars are the ones that dried up billions of years ago."}], "title": "Perseverance Rolls Onto Mars", "cat": "science", "blurb": "A six-wheeled robot and a little helicopter named Ingenuity land on another planet. Maya, who dreams of being an engineer, follows the mission from her kitchen table.", "paras": ["On the morning of February 18, 2021, Maya Patel woke up before her alarm. She usually loved to sleep late on weekends, but today was different. Today, a robot the size of a car was going to try to land on another planet.", "She tiptoed to the kitchen in her pajamas. Her dad had already made hot chocolate and set his laptop on the table. On the screen was a live video from NASA. Scientists in blue shirts sat at long rows of computers in a control room in California, and the room was very, very quiet.", "“Is it starting?” asked Maya.", "“Any minute now,” said her dad. He was an engineer at a company that built airplane parts, and he had promised to watch the landing with her. “Get ready, kiddo. This is one of the hardest things humans have ever tried.”", "Maya was nine, and she wanted to be an engineer too. She loved to build things. Her bedroom shelf held a marble run made of cardboard tubes, a small windmill that spun in the breeze, and a paper airplane with a paperclip on the nose that could fly across the whole living room. She wanted to know how things worked, and she wanted to know why they sometimes didn’t.", "The robot on the screen was named Perseverance, which meant not giving up even when something is hard. Its nickname was Percy. Percy had six wheels, a long robotic arm, and a mast with cameras like eyes. It carried seven scientific instruments, and it had been traveling through space for almost seven months. Now it was about to reach a planet that was more than a hundred million miles from home.", "“Why go to Mars?” Maya asked.", "“Because Mars might have once had life,” her dad said. “Billions of years ago, there were rivers there, and lakes too. Percy is going to a place called Jezero Crater, where an ancient river once poured into a lake. If tiny living things ever existed on Mars, that is the best place to find signs of them.”", "Maya sipped her hot chocolate and thought about that. She tried to imagine a river on Mars, with red hills on both sides and blue water flowing through. It was hard to picture, because now Mars was a dry, dusty desert. Its atmosphere was thin and cold, and there was no water on the surface at all.", "On the screen, a voice from mission control said, “Entry, descent, and landing.” Maya sat up straight.", "“This part is called the seven minutes of terror,” her dad explained quietly. “Radio signals take about eleven minutes to travel from Mars to Earth. That means by the time the scientists hear that the spacecraft has entered the atmosphere, it has already landed or crashed. Nobody can steer it. It has to do everything on its own.”", "“By itself? With no one helping?”", "“Nobody,” said her dad. “The engineers wrote a plan, and the spacecraft has to follow it perfectly.”", "Maya held her breath. On the screen, a chart showed the spacecraft’s speed. It was hitting the top of the Martian atmosphere at more than twelve thousand miles per hour. The heat shield glowed as it slowed. A giant parachute, bigger than a house, popped open. Then the parachute was cut away, and a small rocket platform called the sky crane lowered Percy toward the ground on long cables, like a spider lowering itself on silk.", "The control room was silent. Maya could hear her own heartbeat.", "Then someone said, “Touchdown confirmed.”", "The room exploded. People jumped up and hugged each other. Some of them were crying. Maya screamed and threw her arms around her dad, and her hot chocolate almost fell over. “They did it!” she cried. “They actually did it!”", "A few minutes later, the first picture came back from Mars. It was black and white and a little fuzzy, but it showed a wheel and a shadow on the ground. There was a small, dusty plain, and beyond it a flat, distant horizon. That was the view from another world.", "“I can’t believe we’re looking at Mars,” Maya whispered.", "Over the next weeks, Maya followed every update. She learned that Percy was not alone. Strapped to its belly was a tiny helicopter called Ingenuity. It weighed only about four pounds, less than a big bag of flour, and looked like a small drone with two long blades. Its job was to try something no one had ever done: fly on another planet.", "Flying on Mars is much harder than flying on Earth. The Martian atmosphere is only about one percent as thick as ours, so there is very little air for the blades to push against. Ingenuity had to spin its blades extremely fast, more than two thousand times a minute, just to lift off the ground.", "“So how do the engineers know it will work?” Maya asked at dinner one night.", "“They tested it in a giant chamber on Earth,” said her mom, who taught science at the middle school. “They pumped out almost all the air to make it match Mars. And they kept trying, and trying, and trying, and fixing every problem that showed up.”", "Maya poked at her rice. “That sounds like a lot of failing.”", "“That’s how engineers work,” said her dad. “Every failure teaches you something. You keep adjusting until it works.”", "That gave Maya an idea. The next afternoon she cut two strips of paper, folded them, and made a spinning paper helicopter. She climbed on a chair and dropped it. It fluttered down, spinning slowly. She wrote down how long it took to hit the floor: two seconds. Then she tried a longer blade. Then a shorter one. Then she added a paperclip to the bottom.", "Her table became a lab. She made a chart in her notebook: blade length, weight, and time. By the end of the day she had discovered that longer blades made the helicopter spin more slowly and stay in the air longer. She had made forty-two paper helicopters. Her mom laughed when she saw the mess on the floor.", "“You’re running an experiment,” her mom said. “That is real science.”", "On April 19, Ingenuity took off from the surface of Mars. The video showed the little helicopter rising, hovering for thirty seconds, and gently settling down again. It was the first powered, controlled flight on another planet. In the control room, the engineers cheered and hugged again. Maya jumped up and down in her living room, waving her paper helicopter in the air.", "“It flew!” she yelled. “Ingenuity flew!”", "Meanwhile, Percy was busy too. It drove slowly across Jezero Crater, its wheels crunching over rocks. It used a laser to zap stones and read their chemistry. It drilled into a rock and sealed a small piece inside a tube, called a sample, to be collected and brought back to Earth someday. Maya loved that part best. She imagined a scientist opening one of those tubes years from now, holding a piece of Mars in her hand.", "One evening, Maya wrote a letter. She addressed it to the mission team and told them everything that was on her mind.", "Dear Engineers, she wrote. My name is Maya, and I am nine. Thank you for showing me that big dreams need lots of small tries. I built forty-two helicopters and none of them flew on Mars, but each one taught me something. When I grow up, I want to build something that helps people explore. Please keep going. I will be watching.", "She folded the letter and put it in an envelope. Her dad promised he would mail it in the morning.", "That night, Maya looked out her window at the sky. A small red dot glowed low over the rooftops. It was Mars. She waved, just a little, at the planet where a robot named Perseverance was rolling over ancient riverbeds. The robot didn’t wave back. It was much too far away and much too busy. But Maya smiled anyway, and she whispered the robot’s name.", "“Keep going, Percy,” she said. “I will too.”"]}, {"vocab": [{"w": "evaporate", "d": "to change from a liquid into a gas, like water turning to vapor"}, {"w": "condense", "d": "to change from a gas into tiny drops of liquid"}, {"w": "absorb", "d": "to soak up"}, {"w": "reservoir", "d": "a large place where water is collected and stored"}, {"w": "vapor", "d": "water in the form of a gas"}], "quiz": [{"skill": "Main idea", "q": "What does this story teach?", "opts": ["How water moves around Earth in a cycle", "How to swim", "How to build a boat", "Why rain is bad"], "ans": 0, "why": "Drip travels through rivers, plants, sky and back to rain, showing the water cycle."}, {"skill": "Details", "q": "What happens when the sun warms the ocean?", "opts": ["The water freezes", "Some water evaporates into vapor", "The water disappears forever", "Fish get sleepy"], "ans": 1, "why": "Warm sunlight turns liquid water into invisible vapor that rises into the air."}, {"skill": "Inference", "q": "Why does the vapor turn into clouds high in the sky?", "opts": ["The air up high is cooler, so vapor condenses", "It gets too heavy", "Birds push it", "The moon pulls it"], "ans": 0, "why": "Cold air makes vapor condense into tiny droplets that form clouds."}, {"skill": "Sequence", "q": "Which happens first in Drip's trip?", "opts": ["She is part of a cloud", "She soaks into the soil", "She becomes ice", "She is drunk by a deer"], "ans": 0, "why": "The story begins with Drip inside a rain cloud."}, {"skill": "Vocabulary", "q": "What does “absorb” mean?", "opts": ["To soak up", "To push away", "To freeze", "To spill"], "ans": 0, "why": "Tree roots absorb water from the soil, which means they soak it up."}], "title": "Drip's Big Trip", "cat": "science", "blurb": "A single raindrop tumbles out of a cloud over the Cascade Mountains. Where will she go? Follow Drip through rivers, roots, and clouds to learn the water cycle.", "paras": ["Drip was not always called Drip. For a long time, she had no name at all. She was just a tiny bit of water, floating inside a big, gray cloud over the Cascade Mountains. There were billions of other droplets around her, all bumping and swirling together. It was dark and crowded and a little cold, but Drip did not mind. She could feel that something exciting was about to happen.", "“Something is coming,” whispered the droplet next to her.", "“What do you mean?” asked Drip.", "“The cloud is getting heavy,” said the droplet. “Too many of us are crowded together. Soon we are going to fall.”", "And just as the droplet finished speaking, the cloud gave a shudder, and down they went.", "Drip tumbled through the air, spinning like a tiny glass ball. The wind whooshed past her. Below, she could see a green, wet world: a forest of tall fir trees, a mountain slope covered with ferns, and a silver stream winding through the valley. She fell faster and faster, and she laughed the whole way down.", "Splat! She landed on a broad, waxy leaf, and rolled off its edge. Plink! She hit a mossy stone. Plop! She dropped into the soil.", "“Ow,” she said. But it didn’t really hurt. The ground was soft, dark, and smelled like a fresh garden.", "“Welcome,” said a friendly voice. It was a very old tree root, thick and knobby, stretching deep into the earth. “You’re just in time. I’m thirsty.”", "Drip discovered that the soil was full of tiny spaces, like a sponge. Water could travel through these spaces slowly, from one bit of earth to the next. The tree root reached out thin hairs, and one of them touched her. Slurp! The root began to absorb her, pulling her inside.", "“Wait!” shouted Drip. “Where am I going?”", "“Up,” said the root. “Just relax.”", "Drip traveled through the tree’s hidden pipes, up the trunk, and through the branches. She passed through a tiny needle and felt a warm glow. Sunlight was shining on the leaf, and the tree was using her, along with sunlight and air, to make its food. That trick is called photosynthesis, and it is why forests are so green and full of life.", "Then Drip felt something strange. A tiny door opened in the needle, and she was pushed out into the air. She had become a gas. She was invisible, light as a feather, and she felt like she could float forever.", "“Don’t worry,” said a fellow bit of vapor beside her. “This is called transpiration. Trees breathe out water. Some days a single tree can send hundreds of gallons into the sky.”", "“I’m a cloud again?” asked Drip.", "“Almost,” said the vapor. “Wait for it.”", "Drip rose, and rose, and rose. As she climbed, the air grew colder and colder. Her tiny body shivered. Soon she bumped into other bits of vapor, and they clung together around a speck of dust. In a moment, Drip was a liquid droplet again. Thousands of other droplets joined her. That is called condensation, when vapor turns back into liquid, and it is how every cloud in the sky is made.", "For a while she floated in a fluffy white cloud, drifting east. She saw the mountains, and then the wide, dry plains of eastern Washington. But the air was getting colder, and the cloud was moving over a high peak.", "“Uh-oh,” said a droplet. “We’re freezing!”", "Drip felt herself grow stiff and sparkly. She had become a snowflake, six-sided and delicate. She drifted down to a snowy mountainside and landed on a thick white blanket. “Now what?” she asked.", "“Now we wait,” said the snowflakes around her. “All winter long.”", "Drip lay under a deep pile of snow for months. It was quiet and peaceful there, like sleeping under a giant quilt. Snow in the mountains works like a savings account for water. It holds it safely all winter and releases it in spring and summer, when people, plants, and animals need it most.", "Then, one bright April morning, the sun grew warm. Drip felt herself softening. She melted into a drop again and joined thousands of others trickling downhill. Together, they made a stream, and the stream grew into a rushing creek.", "Drip was carried past boulders and fallen logs. She swirled around a beaver dam, where a family of beavers was busy chewing branches. She swam beneath a bridge where two kids in rain boots were tossing pebbles into the water. She bounced through a rapids and giggled as she splashed over a small waterfall.", "“Whee!” she shouted. “This is the best day ever!”", "The creek flowed into a bigger river, and the river flowed toward a huge man-made lake behind a dam. This is called a reservoir. It stores water for the whole city, and it also spins giant machines that make electricity. Drip was pulled through a pipe, and she zipped down a long underground tunnel in the dark.", "“Where are we going now?” she wondered.", "Whoosh! Suddenly she was in a pipe under a house in Seattle. She heard a noise, and then a rush of water shot out of a shiny silver faucet. Drip splashed into a glass.", "A girl named Lily picked up the glass and took a big gulp.", "“Ahhh,” said Lily. “That tastes good.”", "For a moment, Drip felt worried. But Lily’s body made good use of the water. It helped her muscles move and her brain think and her skin stay soft. About a day later, Drip was back out in the world. She flowed through a drain and a sewer pipe and into a treatment plant where the water was cleaned. Then she was released into Puget Sound.", "The salty sea was wide and blue. Orcas glided by in the distance, and sea lions barked from a floating dock. Drip drifted with the tides, exploring kelp forests and tide pools. She met a jellyfish who told her a joke about a sandwich, which she didn’t understand. She rode a wave near the shore and watched a child build a sandcastle.", "One warm afternoon the sun blazed overhead. Drip felt her body warming up. She began to rise from the surface of the water, becoming a mist. It was evaporation. Every day, the sun evaporates enormous amounts of water from oceans, lakes, and rivers, and sends it back into the sky.", "Up she floated, higher than the seagulls, higher than the mountains. And there, in the cool air, she gathered with a crowd of other bits of vapor and became part of a cloud once more.", "“I know this place,” said Drip. “I’ve been here before.”", "“Of course you have,” said an older droplet. He was very wise, and very gray. “You’ve been here many times. The water on Earth never goes away. It just changes shape. The water you drank this morning might once have been a dinosaur’s bath. The rain that falls on your roof tomorrow may have been in a river in Asia last week.”", "“That is amazing,” said Drip.", "“It is the water cycle,” said the old droplet. “Evaporate, condense, fall, flow. Around and around, forever.”", "The cloud grew, and grew, and rolled over the Cascade Mountains. It was heavy again, and dark. Drip felt a tingle of excitement.", "“Are we falling again?” she asked.", "“Any second now,” said the old droplet.", "Below, a girl in a yellow raincoat looked up at the sky and smiled. Her name was Lily, and she loved the rain. She held out her palms.", "Drip fell, twirling and laughing, into her hand.", "“Hello again,” whispered Drip. “Ready for another trip?”"]}, {"vocab": [{"w": "orbit", "d": "the curved path an object takes around a planet"}, {"w": "gravity", "d": "the force that pulls objects toward each other, like keeping us on the ground"}, {"w": "astronaut", "d": "a person trained to travel and work in space"}, {"w": "microgravity", "d": "the feeling of floating when gravity seems very weak"}, {"w": "experiment", "d": "a test to find out how something works"}], "quiz": [{"skill": "Main idea", "q": "What does this story mostly explain?", "opts": ["How astronauts live and work in space", "How to become a pilot", "Why the moon is bright", "How rockets are built"], "ans": 0, "why": "Zoe asks questions and learns about floating, sleeping, and working aboard the station."}, {"skill": "Details", "q": "Why do astronauts float on the space station?", "opts": ["There is no gravity in space", "They are falling around Earth all the time, so they feel weightless", "The station is very light", "Magnets hold them"], "ans": 1, "why": "The station and the astronauts are in constant free fall around Earth, so they feel weightless."}, {"skill": "Inference", "q": "Why do astronauts exercise for two hours each day?", "opts": ["For fun", "To keep their muscles and bones strong", "To win games", "Because they are bored"], "ans": 1, "why": "Without gravity pulling on them, muscles and bones become weaker."}, {"skill": "Cause and effect", "q": "What did Zoe learn when she asked about water?", "opts": ["Water stays in round balls in space", "Water is heavy", "Water freezes", "Water is not allowed"], "ans": 0, "why": "Without gravity, water forms floating spheres."}, {"skill": "Vocabulary", "q": "What is an experiment?", "opts": ["A kind of food", "A test to learn how something works", "A bedtime story", "A tool"], "ans": 1, "why": "Astronauts run many experiments to learn new things."}], "title": "Sleepover on the Space Station", "cat": "science", "blurb": "Zoe wins a contest to talk with astronauts on the International Space Station. She learns why they float, how they sleep, and what it takes to live far above the Earth.", "paras": ["Zoe Kim had never won anything before in her life. Not a raffle, not a spelling bee, not even a coin toss. So when the email arrived that said, Congratulations! You have won the Washington State Science Fair Space Question Contest, she read it four times before she believed it.", "The prize was incredible. Zoe would get to ask a real astronaut a question live, from Earth to the International Space Station, while the station raced around the world at five miles per second. Her school gym was full of students and parents on the day of the call, and a big screen hung on the wall. Zoe sat in a chair on the stage with a microphone in her lap. Her palms were sweating.", "“Nervous?” asked her teacher, Mr. Delgado.", "“A little,” Zoe admitted. “What if I forget my question?”", "“You wrote it on a card,” he said, pointing at the index card in her hand. “And there is no wrong question in science.”", "The screen flickered. Then a face appeared, upside down. An astronaut with a wide grin was floating in a white module, with cables and glowing panels all around her. Her hair drifted up above her head like seaweed.", "“Hello, Washington!” she called. “This is Commander Reyes, speaking to you from the International Space Station. Can you hear me?”", "The whole gym cheered so loudly that Zoe’s ears rang.", "“We can hear you!” shouted Mr. Delgado. “We have a special guest with a question. Zoe?”", "Zoe stood up. Her knees shook. “Hi, Commander Reyes. My name is Zoe, and I am ten. My question is, why do astronauts float? Is there no gravity in space?”", "The commander laughed, and then she did a slow somersault in midair. “Great question, Zoe. Most people think there’s no gravity up here. But that is not quite right. The station is about two hundred and fifty miles above the Earth, and at that height, gravity is still ninety percent as strong as it is on the ground.”", "“Then why don’t you fall?” asked Zoe, surprised.", "“We do fall,” said the commander. “All the time! The trick is that the station is also moving sideways at over seventeen thousand miles an hour. So as we fall toward Earth, we keep missing it, because the ground curves away beneath us. That is what it means to be in orbit. We are falling around the planet, and everything inside the station is falling with us. That feels like floating. Scientists call it microgravity.”", "“Wow,” said Zoe. “That is really cool. It’s like the world’s longest roller coaster.”", "“That’s exactly what it’s like!” said the commander.", "Mr. Delgado leaned toward Zoe and whispered, “You can ask another one, if you like.”", "Zoe checked her card, but she had a different question in her head. “How do you sleep? Do you float around while you’re snoring?”", "The commander burst out laughing. She pushed off the wall, glided across the module, and came to a stop in front of a small closet with a curtain. “Let me show you.” She unzipped a sleeping bag that was fastened to the wall. “This is my bedroom. I climb in and zip up, and the bag holds me in place. If I didn’t, I might drift into a fan or bump into a computer during the night. Sometimes my arms float up in front of me like a zombie.”", "The students giggled. Someone in the back row shouted, “Do you have a pillow?”", "“Sort of,” said the commander. “But pillows don’t really do anything up here. Without gravity, your head doesn’t need support. It’s a very peaceful way to sleep.”", "Then another astronaut floated into the picture. He had a mustache and a big smile. “Hello, Washington! This is Flight Engineer Okonkwo. I’m going to show you something fun.” He held up a clear plastic pouch. Inside was a wobbling blob of water. The blob was perfectly round.", "“Watch this,” he said. He poked a straw into the pouch and squeezed. A shining ball of water drifted out and hung in the air like a giant marble. Then he leaned forward and, very carefully, took a sip. The water broke apart and swirled into his mouth. “On Earth, water falls down and spills everywhere. Up here, it sticks together in a ball, because of a force called surface tension. We can’t pour a glass of water, but we can catch a floating drop with our mouths.”", "The gym gasped. Zoe’s jaw dropped. She wanted to reach through the screen and touch the water.", "“What do you eat?” shouted a boy in the third row.", "“Food in pouches, mostly,” said the commander. “But we have tortillas instead of bread, because bread makes crumbs, and crumbs float into the equipment. We also have hot sauce. Food tastes a bit blander in space, so we use lots of spices.”", "Zoe raised her hand again. “What do you do all day? Are you just floating around?”", "“Oh, we are extremely busy,” said the commander. “A typical day includes about six hours of science experiments. We grow plants, test medicines, and study how our bodies change. We also spend two hours exercising every day, because in microgravity our muscles and bones get weaker. We run on a treadmill, and we use special machines to lift weights.”", "“You have to work out for two hours?” said Zoe.", "“Every single day,” said Commander Reyes. “It’s not optional.”", "Mr. Delgado chuckled. “Sounds like gym class.”", "Then a chime sounded. The commander glanced at a clock on the wall. “I’m sorry, Washington. We have about one minute left. Zoe, do you have a last question?”", "Zoe looked at her card. It said, What is the hardest thing about being an astronaut? She took a breath and read it aloud.", "The commander was quiet for a moment. She stopped floating and hovered near the window, where the curve of the Earth glowed behind her. Blue oceans and white clouds drifted by.", "“The hardest thing,” she said, “is missing home. I haven’t hugged my family in five months. We have video calls, but it’s not the same. But there is another hard thing too. In training, you fail a lot. I failed tests. I made mistakes in the simulator. I didn’t get chosen the first time I applied. It took me eleven years to become an astronaut.”", "“Eleven years?” said Zoe.", "“Eleven years,” said the commander. “But I kept trying, because I loved space. And here’s the secret: nobody gets here by being perfect. They get here by being curious, working hard, and not giving up when things go wrong.”", "The gym was so quiet that you could hear the ceiling lights hum. Zoe held her index card so tightly that it crinkled.", "“Thank you,” she said.", "“Thank you, Zoe,” said the commander. “Stay curious. Maybe one day I’ll see you up here.”", "Then the screen went dark. The whole gym erupted in cheers, and Zoe found herself hugged by her friends, her parents, and Mr. Delgado all at once.", "That evening, Zoe lay on her bed and stared at the glow-in-the-dark stars she had stuck on her ceiling last year. Outside, the sky was clear. She pulled out her phone and opened an app that showed where the space station was. It would pass over Washington at 9:14 p.m.", "She slipped on her jacket and ran into the backyard. Her dad followed with a blanket. They lay on the cool grass side by side and watched the sky.", "At exactly 9:14, a tiny, bright dot slid over the treetops. It moved steadily, like a star that had somewhere important to be. It wasn’t blinking like a plane. It was smooth and silver, brighter than any star.", "“That’s them,” whispered Zoe. “That’s Commander Reyes.”", "“Say hello,” said her dad.", "Zoe waved with her whole arm. “Hi!” she called to the sky. “Have a good night! Don’t float away!”", "The station glided over the horizon and disappeared behind the trees. Zoe stayed on the grass a little longer, looking up. She had a new plan. She would study hard, keep asking questions, and try, and try, and try again.", "It might take eleven years. That was fine. She was ten. She had plenty of time."]}, {"vocab": [{"w": "balance", "d": "the ability to stay steady without falling"}, {"w": "routine", "d": "a planned series of moves performed in order"}, {"w": "determined", "d": "having made a firm decision and refusing to give up"}, {"w": "dismount", "d": "to get off the apparatus at the end of a routine"}, {"w": "confident", "d": "feeling sure that you can do something"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["A girl learning to overcome fear and practice patiently", "A gymnastics team traveling", "A broken beam", "A new coach"], "ans": 0, "why": "Maya learns that small steps and calm breathing help her improve."}, {"skill": "Details", "q": "How wide is the balance beam?", "opts": ["Four inches", "One foot", "Two feet", "Six inches"], "ans": 0, "why": "The beam is only four inches wide, about the width of a smartphone."}, {"skill": "Inference", "q": "Why did Coach Dana lower the beam to the floor?", "opts": ["So Maya could practice without being afraid of falling", "To make it easier to cheat", "Because it was broken", "Because the gym was closing"], "ans": 0, "why": "A floor beam let Maya focus on balance without fear."}, {"skill": "Character", "q": "How did Maya feel at the meet just before she stepped onto the beam?", "opts": ["Angry", "Nervous but ready", "Sleepy", "Bored"], "ans": 1, "why": "She felt butterflies but used her breathing to stay calm."}, {"skill": "Vocabulary", "q": "What does “determined” mean?", "opts": ["Lazy", "Refusing to give up", "Silly", "Afraid"], "ans": 1, "why": "Maya was determined to stay on the beam."}], "title": "Maya and the Wobbly Beam", "cat": "gymnastics", "blurb": "The balance beam is only four inches wide, and Maya keeps falling off. Can she find her balance, her breath, and her courage?", "paras": ["The balance beam is one of the smallest things in the gym, and to Maya Torres it felt like the biggest. It was only four inches wide, about as wide as a smartphone. It stood four feet off the ground, covered in suede. Every time Maya climbed onto it, her legs turned to jelly.", "“Arms up,” said Coach Dana. “Chin up. Look at the end of the beam, not your feet.”", "Maya took one small step, then another. She was doing fine, and then she reached the middle. Her right foot slipped, and she wobbled like a spinning top about to fall. Her arms windmilled in the air. Then she tumbled sideways onto the blue mat below.", "“Ow,” she muttered. It didn’t hurt. The mat was thick and soft. But her face burned with embarrassment.", "Maya was nine years old, and she had been a gymnast for two years. She was great at floor exercise, and she could do a round-off and a back handspring with a huge smile. On the vault, she flew like a bird. But the beam was different. On the beam there was no room for mistakes. It was just her, her toes, and a four-inch strip of wood.", "“That’s okay,” said Coach Dana. “Everyone falls on the beam. Even Olympic gymnasts.”", "“Not the good ones,” said Maya.", "“Especially the good ones. They fall all the time in practice. That is how they get good.”", "Maya crossed her arms. It didn’t feel that way. Her teammate, Lily, could already cartwheel across the beam without wobbling. Her other friend, Bea, could do a full turn on one foot, like a ballerina. Maya could hardly walk from one end to the other without falling.", "That night at dinner, she pushed her peas around her plate.", "“Something wrong, sweetheart?” asked her mom.", "“I’m bad at the beam,” said Maya. “The meet is in three weeks, and I’m going to fall in front of everyone.”", "Her mom put down her fork. “Have you told Coach Dana how you feel?”", "“No.”", "“Maybe you should,” said her mom. “Coaches are there to help, you know.”", "So the next day, Maya walked up to Coach Dana before practice. Her voice was small. “I’m scared of the beam.”", "Coach Dana knelt down until they were eye to eye. “Thank you for telling me. Being scared doesn’t make you weak. It means you care. Let’s figure this out together.”", "She led Maya over to a corner of the gym where a low beam sat on the floor, only a few inches above the mat. “This is a training beam. It’s the same width, but if you fall, you’re only falling a few inches. Let’s start here.”", "Maya stepped onto the low beam. Her legs were steady. She walked to the end without a single wobble. She turned around and walked back. “I can do this,” she said, surprised.", "“Of course you can,” said Coach Dana. “Fear makes the beam feel narrower. When you take fear away, you can see what you can really do.”", "Over the next week, Maya practiced on the low beam every day. She learned the trick to balance. First, she learned to keep her eyes on one spot at the end of the beam. Second, she learned to squeeze her tummy muscles and stand tall, as if a string were pulling the top of her head toward the ceiling. Third, she learned to breathe, in through her nose, out through her mouth, slow and steady.", "“Balance is not about standing still,” Coach Dana explained. “It’s about making tiny adjustments, over and over. Watch your body. When you start to lean, you correct it. You’re always moving, just a little.”", "Maya tried it. She noticed that her ankles and her toes were working quietly, making small changes each moment. She wasn’t frozen like a statue. She was more like a tightrope walker, gently correcting all the time.", "By the end of the week she could walk across the low beam, do a small turn, and even a little jump. Then Coach Dana raised the beam a little higher, then a little higher. Maya felt her heart flutter each time. But each time, she took a breath, picked a spot, and stepped forward.", "Finally the day came when Coach Dana said, “Let’s try the real beam.”", "Maya looked up at the high beam. Her stomach did a flip.", "“Go slowly,” said Coach Dana. “I’ll be right here.”", "Maya climbed up. She raised her arms. She looked at the end. She took one step, then another. Her leg trembled, and she wobbled, but this time she didn’t panic. She breathed. She corrected. She stayed on. When she reached the end of the beam, she let out a breath and grinned.", "“I did it!” she said.", "“You sure did,” said Coach Dana. “Now do it again.”", "For the next two weeks, Maya practiced on the high beam every day. She made up a routine: a walk, a turn, a jump, a small pose, and a dismount, which is how a gymnast jumps off the end. She was determined to get it right. Some days she fell, and she just climbed back up. Some days she felt perfect. Her teammates noticed, and Lily even gave her a high five.", "The night before the meet, Maya could hardly sleep. She lay in bed, running through her routine in her head, step by step. Her stomach was full of butterflies.", "At the meet, the gym was crowded and loud. Parents waved signs. Music boomed from the floor exercise area. Girls in sparkly leotards stretched on the mats, their hair tied back in tight buns. Maya sat with her team, waiting for the beam rotation.", "Bea went first. She did a perfect routine, and the crowd cheered. Then Lily went, and she wobbled but stayed on. Then a judge in a blue blazer called, “Maya Torres.”", "Maya’s heart thudded. She stood up and walked toward the beam. It looked the same as it always did, narrow and high. She could hear her mother’s voice somewhere in the stands, shouting, “Go, Maya!”", "She saluted the judge. She took a deep breath, in through her nose and out through her mouth. Then she climbed onto the beam.", "Arms up. Chin up. Eyes on the end.", "She walked. She turned. She jumped, and her feet landed lightly. She held her pose. Her whole body felt calm, like a still pond. She felt the beam under her toes, and it no longer felt like an enemy. It felt like a friend.", "Halfway through, she felt a wobble. Her left foot slid a tiny bit, and her arms flew up. For one second the whole gym seemed to hold its breath.", "Maya breathed. She made a small adjustment. She steadied herself. Then she smiled and kept going.", "When she reached the end of the beam, she took one last breath, tucked her arms, and jumped, landing on the mat with both feet planted and her arms stretched to the sky. The audience roared.", "“Stuck it!” shouted Coach Dana.", "Maya turned to look at her, and her eyes were shining. She hadn’t won a gold medal. She hadn’t scored the highest of the day. But that didn’t matter. She had done something more important. She had faced her fear, and she had stayed on the beam.", "Afterward, Coach Dana hugged her. “I am so proud of you.”", "“I fell a little,” said Maya.", "“Not once,” said her coach. “You wobbled, and you fixed it. That is what balance really is.”", "That night, Maya climbed into bed with a ribbon in her hand. It wasn’t a first-place ribbon. It was a small green ribbon that said Participant. She put it on her nightstand, where she could see it every morning.", "She was confident now, more than ever. The beam was still narrow, and it was still high. But she knew a secret about it. The beam wasn’t the hard part. The hard part was believing she could do it.", "And she did."]}, {"vocab": [{"w": "persistence", "d": "continuing to try even when something is hard"}, {"w": "progress", "d": "movement forward or improvement over time"}, {"w": "frustrated", "d": "feeling upset because you cannot do what you want"}, {"w": "skill", "d": "an ability that you get better at by practicing"}, {"w": "spotter", "d": "a person who stands ready to help keep a gymnast safe"}], "quiz": [{"s
