His heart was pounding.", "The old man told the woman what he had noticed. Long ago, he explained, when he was a traveler in the mountains, he had once seen the beast. It had been walking through a village, and it stopped short when it saw a child wearing a red coat. It growled and backed away. He had noticed the same thing a second time, when a bright fire burned near a house. Nian had stayed far away. And a third time, when a loud noise made him flinch.", "“I believe,” said the old man, “that Nian is afraid of three things. The color red. Bright light. And loud noise.”", "“Are you sure?” asked the woman.", "“No,” he said honestly. “But it’s worth trying.”", "Together, they worked quickly. They cut long strips of red paper and pasted them on all the doors. They hung red cloth across the windows. They lit lanterns and candles until the whole house glowed like a small sun. And the old man gathered bamboo stalks, dry and hollow, and piled them near the fire.", "“What are these for?” asked the woman.", "“You’ll see,” said the old man.", "Night fell. The village grew silent. The wind whispered through the empty streets. Then, from far away, there came a low rumble. The ground began to tremble. Nian was coming.", "He crashed down from the mountain, his eyes flashing and his roar echoing off the hills. He sniffed the air. He smelled food. He thundered into the village, past the empty houses, until he reached the small house at the end of the road.", "But the house looked different. It blazed with light. Red banners flapped in the breeze. Nian stopped, confused. He had never seen anything like it. The color red made his skin prickle. His ears flattened.", "“Now!” whispered the old man.", "He threw a handful of bamboo into the fire. They crackled and popped. Bang! Bang! Crack! The sound exploded through the night like thunder. Nian jumped a foot in the air and let out a yelp.", "Bang! Bang! Crack! Crack! The old man tossed in more, and the noise grew louder. Wei, hiding behind the wall, covered his ears. Even the old woman flinched.", "Nian howled. He turned around and ran. He crashed through the village and up the mountain, faster than he had ever run before, and vanished into the darkness. The pops and bangs echoed after him, and they didn’t stop until the sky began to turn pink with dawn.", "When morning came, the villagers crept back from the hills. They were surprised to find their homes untouched. Nothing had been eaten. No fences had been broken. And in the middle of the village stood the old man, leaning on his walking stick, smiling.", "“How did you do it?” they asked.", "“Nian is not invincible,” said the old man. “He is only a beast. And all beasts fear something. All you needed to do was find out what.”", "Wei ran up to him. “Will he come back?”", "“He may,” said the old man. “But now you know what to do.”", "The villagers were overjoyed. They thanked the old man and asked him to stay, but he only shook his head. “I have somewhere else to go,” he said. And he vanished into the morning mist. Some people say he was a god, or a wise traveler. Nobody ever saw him again.", "The following winter, on the last night of the year, the villagers remembered what they had learned. They hung red paper on their doors. They lit lanterns until the streets glowed. They lit bamboo, and later firecrackers, and the whole village rang with noise. Nian never returned to bother them.", "Instead, it became a celebration. Everyone gathered at midnight, told stories, shared a huge meal, and welcomed the new year with joy. Children were given red envelopes with lucky money inside. Families wore red clothes. They hung red lanterns in the streets and pasted red paper couplets with good wishes on their doors. And they stayed up late, laughing and eating dumplings, watching the fireworks light up the sky.", "The tradition spread from village to village, and from generation to generation. Even today, when families celebrate the Lunar New Year, also called the Spring Festival, they use red for luck and happiness. They hang lanterns, set off fireworks, and gather with those they love. The word for New Year in Chinese, nian, is the same as the name of the beast. Some people say that the festival is called guo nian, which can mean either “to pass the year” or “to get past Nian.”", "Many years later, when Wei was old and gray, his grandchildren asked him about the monster. “Was it real, Grandfather?”", "Wei smiled and stirred his tea. “Maybe,” he said. “Maybe not. But I’ll tell you what I learned. When you’re afraid of something, don’t run right away. Look closely. Ask questions. Find out what it’s really afraid of. Often the scariest monsters are more frightened than they look.”", "Outside, firecrackers popped, and paper lanterns swayed in the wind. The whole street was glowing red.", "“And that,” said Wei, “is how we chased away the New Year’s monster.”"]}, {"vocab": [{"w": "whisper", "d": "to speak very softly"}, {"w": "mysterious", "d": "strange and hard to explain"}, {"w": "investigate", "d": "to look into something carefully to find out the truth"}, {"w": "echo", "d": "a sound that bounces off a surface and repeats"}, {"w": "explanation", "d": "a reason that tells why something happens"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Juniper solves a mystery about strange whispers in the library", "A kid who hates books", "A new library opening", "A haunted house"], "ans": 0, "why": "She investigates and finds a real explanation."}, {"skill": "Details", "q": "Where did the whispering sound come from?", "opts": ["A vent connected to the old reading room", "A ghost", "A radio", "The basement"], "ans": 0, "why": "The whispers were voices traveling through the air vent."}, {"skill": "Inference", "q": "Why did Mrs. Okafor think the library was haunted?", "opts": ["She heard voices when nobody was there", "She saw a ghost", "She dreamed it", "A friend told her"], "ans": 0, "why": "The voices seemed to come from empty places."}, {"skill": "Cause and effect", "q": "Why could Juniper hear the story club through the vent?", "opts": ["Sound traveled through the old ventilation pipes", "She had a radio", "The wall was thin", "She was standing next to them"], "ans": 0, "why": "Pipes carried the sound like a telephone."}, {"skill": "Vocabulary", "q": "What does “investigate” mean?", "opts": ["To look into something carefully", "To ignore", "To hide", "To laugh"], "ans": 0, "why": "Juniper investigates the whispers."}], "title": "Juniper and the Whispering Library", "cat": "adventure", "blurb": "Strange whispers come from the shelves of the Bothell library every night. Detective Juniper investigates a very quiet mystery with a very loud ending.", "paras": ["The Bothell library was the quietest place in the whole world, or so Juniper Mbeki had always believed. It had tall shelves and soft carpets and a big, round clock that ticked so softly that you had to hold your breath to hear it. The only sounds were the turning of pages and the occasional cough.", "That’s why Mrs. Okafor, the head librarian, looked so worried on Monday morning.", "“I need your help, Juniper,” she said, wringing her hands. “Something strange is going on in this library. It has been happening for a week now.”", "Juniper was eleven years old, and she was well known around town as a detective. She had solved the case of the missing tutu, the mystery of the lost lunchbox, and the puzzle of who had been eating the school garden’s tomatoes. She always carried a small notebook, and a magnifying glass on a chain around her neck.", "“What kind of strange?” she asked, flipping open her notebook.", "Mrs. Okafor leaned in and lowered her voice. “Whispers,” she said. “Every evening, after closing time, when I’m alone, I hear whispers. They come from the back of the library, near the old reading room. I can’t make out the words, but they’re definitely voices. And nobody is there.”", "A small shiver ran down Juniper’s back. But she stayed calm. “When do the whispers start?”", "“Always around six o’clock,” said Mrs. Okafor. “Right after we lock the doors. The whispering goes on for about an hour, and then it stops.”", "“Have you looked for the source?”", "“Of course. I searched every corner. There is no one. I’m starting to think the library is haunted.” She glanced nervously around. “Some of the regular readers have heard it too. Mr. Ivanov said he heard a voice say, ‘Beware the dragon.’”", "Juniper tapped her pencil on her notebook. “Interesting,” she said. “Ghosts don’t generally give advice about dragons. I’ll investigate.”", "That evening, Juniper arrived at the library just before closing time. She brought a flashlight, a thermos of hot chocolate, and her best friend, Sam, who loved mysteries almost as much as she did, and who was extremely afraid of ghosts.", "“Are you sure this is a good idea?” whispered Sam, gripping the flashlight so hard his knuckles turned white.", "“Scientific investigation requires courage,” said Juniper. “Also, snacks.”", "They found a hiding spot behind a large bookshelf in the reading room. Mrs. Okafor locked the doors and went to her desk, and the library grew still. The big clock ticked. A radiator hissed. Outside, the sky turned purple.", "At six o’clock exactly, they heard it.", "At first it was so faint that Juniper thought she was imagining it. A soft, low murmur, like wind in far-off trees. Then it grew clearer. Voices. Many voices, speaking softly, all at once.", "“…and then the dragon rose from the lake…”", "“…don’t forget the map…”", "“…the king will never find it…”", "Sam’s eyes went wide. “Juniper,” he whispered. “Those are ghosts.”", "“Ghosts don’t have Northwest accents,” said Juniper. “Listen carefully.”", "They crept closer. The voices seemed to come from the far wall, where an old iron grate covered a vent in the plaster. Juniper pulled out her magnifying glass. The grate was dusty. But on the floor below it, she saw something odd: a scrap of paper, folded neatly in half. She unfolded it. On it was a drawing of a dragon, and beneath it, a line of writing in pencil. Chapter Three.", "“Chapter Three,” Juniper murmured. “That’s not a ghost. That’s a story.”", "“What?” asked Sam.", "“Someone is telling a story. The voices are coming from somewhere else, and they’re traveling through this vent.” She pressed her ear against the grate. “The sound is louder here. It’s like a giant telephone.”", "“But where is it coming from?”", "Juniper looked up. The vent was connected to a pipe that ran along the ceiling and disappeared through the wall. “Follow the pipe,” she said.", "They tiptoed along the wall, tracing the pipe with their flashlight. It curved around a corner, past the nonfiction section, and across the ceiling, and it led, at last, to a locked door at the back of the library. A brass sign read, STAFF ONLY. BASEMENT.", "Sam swallowed. “Are we really going down there?”", "“Where else would the pipe lead?” said Juniper.", "She turned the knob, and to her surprise, the door was unlocked. Beyond it, a set of wooden stairs descended into the dark. From below came the sound of the voices again, clearer and louder. And now Juniper thought she could smell something else: popcorn.", "Slowly, the two friends crept down the stairs. At the bottom, they found a long, dim hallway lit with warm yellow light. At the end was a half-open door. Through it came laughter.", "Juniper peeked inside. She burst out laughing.", "The basement was full of kids and grown-ups, sitting on cushions and old couches, in a big circle. Bowls of popcorn passed from hand to hand. A woman in a purple scarf sat in a rocking chair, holding a thick, battered book. She read aloud in a deep, dramatic voice.", "“And then the great dragon rose from the lake!” she cried, spreading her arms wide. “Its scales shone like a thousand mirrors!”", "“Ooooh,” said the audience.", "“Wow,” said Sam. “It’s a story club.”", "Just then, the woman noticed them. “Well, hello,” she said, smiling. “Are you here for the meeting?”", "“I’m sorry,” said Juniper. “We didn’t mean to interrupt. We thought there was a ghost.”", "The woman burst out laughing. “A ghost? Oh dear. We’ve been meeting here every evening for a week. We’re the Basement Book Club. We read fantasy stories out loud. Nobody told you?”", "“We didn’t know,” said Juniper. She glanced back at the door. “The library staff never mentioned it.”", "“Oh, we asked Mr. Delaney, the custodian,” said the woman. “He let us use the room. We didn’t realize the old vent would carry the sound all the way upstairs. It seems to work like a whispering gallery.”", "Juniper smiled. That was a good explanation. Long ago, builders had discovered that certain shapes of rooms and pipes could carry whispers over great distances. The sound waves bounced along the walls, like a ball rolling down a tunnel, and came out the other end. The voices had traveled through the pipe, through the vent, and into the reading room. It was the echo of a story, not the sound of a ghost.", "“You solved the mystery,” said the woman.", "“I guess I did,” said Juniper. “But it was more of a quiet mystery than a spooky one.”", "They climbed back upstairs and told Mrs. Okafor. She was so relieved that she hugged them both. “A book club! What a wonderful thing. And here I thought we were haunted.”", "“Perhaps you could put a sign on the vent,” suggested Juniper. “Or move the club to a different room.”", "“Or,” said Mrs. Okafor, her eyes twinkling, “maybe we could let everyone hear. A story hour for the whole library, every evening at six. A whispering story hour.”", "Sam looked thrilled. “That’s a great idea! Can we join?”", "“Of course,” said Mrs. Okafor. “I believe you’ve earned it.”", "The next evening, Juniper and Sam sat in the basement with the rest of the Basement Book Club. The woman in the purple scarf read from her big book. It was a story of a girl and a dragon and a lost map. Juniper sat on a cushion with a bowl of popcorn in her lap, listening, wide-eyed, as the words danced across the room. Even Sam forgot to be scared.", "When the chapter ended, Juniper wrote in her notebook. Case closed. The mysterious whispers were a story club. Cause: sound traveling through an old vent. She paused, and added one more line at the bottom.", "Sometimes the scariest sounds have the most wonderful explanations.", "From then on, the library at six o’clock was not quiet at all. But nobody complained. The whispers drifted up through the vent like gentle music, and everyone who heard them stopped to listen. It turned out that even a silent library likes a good story."]}, {"vocab": [{"w": "treasure", "d": "a collection of valuable things, like gold or jewels"}, {"w": "ferry", "d": "a boat that carries people and vehicles across water"}, {"w": "compass", "d": "a tool with a needle that shows directions"}, {"w": "cove", "d": "a small, sheltered bay on the coast"}, {"w": "landmark", "d": "an easy-to-see object or place that helps you find your way"}], "quiz": [{"skill": "Main idea", "q": "What is the story mostly about?", "opts": ["Two kids follow a map and discover something meaningful", "A pirate war", "Learning to swim", "A broken boat"], "ans": 0, "why": "They find a family treasure that matters more than gold."}, {"skill": "Details", "q": "What did the children find inside the metal box?", "opts": ["Photographs, letters, and a small brass compass", "Gold coins", "A sword", "A crown"], "ans": 0, "why": "The treasure was made of family memories."}, {"skill": "Inference", "q": "Why did Grandpa hide the map?", "opts": ["He wanted the kids to enjoy an adventure and learn about the family", "He was mean", "He forgot", "He wanted to sell it"], "ans": 0, "why": "He planned a treasure hunt to share his memories."}, {"skill": "Sequence", "q": "What was the last landmark on the map?", "opts": ["A lighthouse", "A bridge", "A cave", "A church"], "ans": 0, "why": "The map ended at an old lighthouse."}, {"skill": "Vocabulary", "q": "What is a landmark?", "opts": ["An easily seen object that helps you find your way", "A kind of map", "A sea animal", "A bridge"], "ans": 0, "why": "The lighthouse and the twisted tree were landmarks."}], "title": "The Treasure Map in Grandpa's Attic", "cat": "adventure", "blurb": "A crumbling map hidden inside an old trunk leads Owen and his cousin across the San Juan Islands on a hunt for treasure. The prize is not what they expect.", "paras": ["When Owen Reyes turned ten, his grandfather gave him the strangest gift he had ever received. It was a brass key. It was small and heavy, about as long as his finger, and tied to a leather cord.", "“What does it open?” asked Owen.", "“You’ll have to find out,” said Grandpa Joe with a wink. He was a retired ferry captain, with a face like weathered wood and a laugh like a foghorn. He lived in an old white house on Orcas Island, in Washington’s San Juan Islands, where the tide rose and fell twice a day and eagles nested in the tall fir trees. Every summer, Owen and his cousin Mila came to stay for a week.", "This summer, the key was waiting on Owen’s pillow.", "“There’s a hint,” said Grandpa Joe. “Look in the attic.”", "Owen and Mila raced up the creaky stairs. The attic was warm and dusty. Sunbeams slanted through a round window. Boxes and trunks were stacked everywhere, and cobwebs hung like curtains. Mila sneezed. “It smells like a museum.”", "“Look,” said Owen. In the corner was an old wooden trunk with a keyhole. He slipped in the key, and it turned with a soft click.", "Inside the trunk, on top of a moth-eaten wool blanket, lay a rolled-up piece of yellowed paper. Owen unrolled it carefully. It was a map, drawn in faded blue ink. There was a coastline, a few small islands, and a dotted line that wound from a place marked HOME to a small red X.", "Beneath the X, someone had written in tiny letters: Follow the compass. Find what matters most.", "“It’s a treasure map,” breathed Mila. “A real treasure map!”", "“Grandpa must have made it for us,” said Owen. “Or maybe it was his grandfather’s. Look, there are clues.”", "Along the dotted line, small drawings marked the way. A twisted tree. A stone bridge. A tall rock shaped like a whale’s tail. At the very end, a tiny lighthouse stood beside the X.", "“I know that lighthouse,” said Mila. “It’s at the far end of the island.”", "“Then let’s go,” said Owen.", "They packed a backpack with water, sandwiches, a flashlight, and a notebook. Mila grabbed Grandpa’s old compass, a round brass one with a swinging needle that always pointed north. Owen tucked the map safely into his jacket. Grandpa Joe waved from the porch. “Be back before dinner,” he called. “And watch the tide!”", "The first landmark was easy. They followed a dirt road through the forest until they found a tree with a trunk twisted like a corkscrew. Long ago, it had been struck by lightning and had grown back crooked. Mila checked the compass. “The map says to go southeast from here.”", "“Which way is that?” asked Owen.", "“It’s where the needle points, plus a little bit,” said Mila, who had learned to use a compass at summer camp. “See? The N stands for north. Southeast is halfway between south and east.”", "They trudged through ferns and moss. The forest smelled like rain and cedar. Squirrels chattered overhead. After half an hour, they heard the burble of a stream, and around the next bend they saw a bridge made of gray stone, covered in moss.", "“Second clue,” said Mila. She checked the map. “Now we follow the stream to the sea.”", "The stream twisted and tumbled over rocks, and by the time they reached the shore, they were hot and tired. They sat on a driftwood log and ate their sandwiches. The sea spread out before them, blue and sparkling. Seagulls cried. A ferry chugged slowly across the horizon.", "“How much farther?” asked Owen.", "“Not far,” said Mila. She pointed. “Look. That’s the whale tail rock.”", "Sure enough, a huge black rock jutted out of the water, shaped exactly like a whale’s tail. The tide was low, and a narrow path of wet stones led out toward it, glistening in the sun. “The map says to go around it,” Mila said. “But be careful. The tide is coming in.”", "They picked their way over slippery rocks. Little crabs scuttled out of the way. Starfish clung to the stones in purple and orange. It felt like walking through a giant aquarium. When they reached the far side of the rock, they saw a small cove, and beyond it, at the end of a long, rocky point, the white lighthouse.", "“That’s it!” cried Owen.", "They raced along the beach. The lighthouse was old and weathered, with peeling paint, and its lantern room had long since gone dark. A rusty door stood at the base. Owen checked the map. “The X is inside.”", "Mila pushed the door open. It creaked. Inside, a spiral staircase wound upward into shadow. Dust floated in the shafts of light. At the foot of the stairs, they found a small stone alcove. And in the alcove sat a metal box.", "Their hearts thudded. Owen knelt and lifted the lid. Inside were dozens of old photographs, yellowed with age. A bundle of letters tied with string. A folded flag. And at the very bottom, a small brass compass, just like the one in Mila’s hand.", "“This is it?” said Mila, a little disappointed. “There’s no gold.”", "Owen picked up a photograph. It showed a young man with a big grin, standing on the deck of a ferry. On the back, in careful handwriting, someone had written, Captain Joe, my first day. He turned over another. It showed a boy and a girl standing on a beach, holding fishing poles. He recognized them. “That’s my mom. And your mom.”", "“They’re so little!” Mila said.", "They spread the pictures on the floor. There were photos of Grandpa Joe with his father, hauling nets. Photos of Grandma Rose, who had died before they were born, laughing in a garden. A picture of the whole family at a picnic, years and years ago, everyone squinting into the sun. There was a lighthouse in every single one of them.", "The letters were addressed to Joe from his father, and from his own grandfather. Owen opened one and read aloud. “My dear son, the sea will teach you three things: patience, courage, and how to find your way home. Keep this compass close.”", "Mila’s eyes shone. “It’s a family treasure.”", "“Grandpa made the map for us,” said Owen slowly. “He wanted us to find this.”", "They heard footsteps on the stairs. Grandpa Joe stood in the doorway, a little out of breath, leaning on his cane. He had followed them, staying just out of sight. His eyes twinkled.", "“You found it,” he said.", "“Grandpa,” said Owen, “why did you hide it?”", "The old captain lowered himself onto the bottom step. “When I was a boy, my own father did the same for me. He led me through these woods, and I discovered our family’s history. I wanted you to have the same chance. It isn’t gold that makes a family rich. It’s the stories that we pass on.”", "Owen held up the compass from the box. “This was your dad’s?”", "“And his father’s before him. It has guided the men and women of this family across the water for more than a hundred years.” Grandpa Joe smiled. “Now it’s yours to keep, Owen. You’ll pass it on someday, too.”", "Owen turned the compass over. On the back, tiny letters were engraved: Find your way home. His throat tightened. “Thank you.”", "“And Mila,” said Grandpa, “I have something for you.” He reached into his pocket and drew out a small silver whistle on a chain. “Your grandmother used to blow this to call us in for dinner. It’s a little rusty, but it still works.”", "Mila took the whistle and blew. It made a high, sweet sound that echoed up the spiral staircase. A gull flapped out of the lighthouse and flew away over the sea.", "They walked home together in the golden light of the late afternoon. Grandpa Joe told them stories about the islands, about storms he had weathered, and about the time a whale had come right up next to his ferry. Owen held the compass in his hand. Mila blew the whistle now and then, just for fun.", "That night, after dinner, Owen sat on the porch under a sky full of stars. He looked at the old map. He could see now that the red X didn’t only mark a place. It marked a beginning. He unrolled a blank sheet of paper, took out a pencil, and began to draw a map of his own, one that he would give to his grandchildren someday.", "At the top, he wrote in careful letters, Follow the compass. Find what matters most."]}, {"vocab": [{"w": "bilingual", "d": "able to speak two languages"}, {"w": "vocabulary", "d": "all the words a person knows"}, {"w": "belong", "d": "to feel that you are part of a group and are welcome there"}, {"w": "culture", "d": "the food, language, holidays, and customs of a group of people"}, {"w": "courage", "d": "the strength to do something even when you are afraid"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Speaking two languages can be a strength that helps others", "Chinese is hard to learn", "Moving is exciting", "Lunch is important"], "ans": 0, "why": "Mei uses both of her languages to help a new friend feel welcome."}, {"skill": "Details", "q": "What did Mei bring for lunch that some kids teased her about?", "opts": ["Dumplings", "A sandwich", "Pizza", "Soup"], "ans": 0, "why": "Some kids made fun of her lunch, and she felt embarrassed."}, {"skill": "Inference", "q": "Why did Mei feel two different ways at home and school?", "opts": ["She felt like she had to hide one part of herself", "She was tired", "She was sick", "She hated school"], "ans": 0, "why": "She worried that people would not accept her home language and food."}, {"skill": "Cause and effect", "q": "How did Mei help Anya?", "opts": ["By teaching her words in English and showing her around", "By doing her homework", "By giving her lunch", "By lending a pencil"], "ans": 0, "why": "She helped with words, gestures, and friendship."}, {"skill": "Vocabulary", "q": "What does “bilingual” mean?", "opts": ["Able to speak two languages", "Able to speak loudly", "Able to sing", "Able to swim"], "ans": 0, "why": "Mei is bilingual because she speaks Chinese and English."}], "title": "The Bridge Between Two Languages", "cat": "friend", "blurb": "Mei speaks Chinese at home and English at school, and sometimes the two worlds feel far apart. When a new classmate arrives who speaks neither, Mei discovers that she is a bridge.", "paras": ["Mei Lin had two voices.", "At home, in the small yellow house in Redmond, she spoke Chinese. It was the language of her grandmother’s stories, her mother’s lullabies, and her father’s terrible puns. It was the sound of dinner on the stove, chopsticks clinking, and her grandmother’s voice calling from the kitchen, “Mei Mei, chi fan le!” Dinner’s ready! In Chinese, Mei felt warm and easy, like sitting by a fire.", "At school, she spoke English. It was the language of spelling tests, math problems, and recess games. It was the language of her teacher, Ms. Alvarez, who wore bright scarves and loved to read aloud. In English, Mei felt quick and clever, like a squirrel racing up a tree.", "Two languages. Two voices. Two homes, in a way. And most days, Mei kept them carefully separate, like two boxes on different shelves.", "She was nine years old, and she wasn’t sure the two boxes should ever touch.", "It started on a Monday. At lunchtime, Mei opened her lunchbox and pulled out a thermos. Inside were her grandmother’s steamed dumplings, plump and shiny, filled with pork and chives. They smelled delicious. But a boy across the table wrinkled his nose.", "“Ew,” he said. “What is that? It smells weird.”", "Mei’s cheeks burned. “It’s dumplings.”", "“It looks like little brains,” said another boy, and a few kids giggled.", "Mei snapped the lid shut. “I’m not hungry,” she mumbled, and stared at her hands until the bell rang. All afternoon, her stomach growled, but she didn’t care. She felt small and prickly, like a hedgehog curled into a ball.", "That night, her grandmother noticed that the thermos was still full. “Mei Mei,” she said gently, “did you not like the dumplings?”", "“They were fine,” said Mei.", "Her grandmother waited. In her quiet way, she always knew when something was wrong. Mei sighed and told her about the boys. Her grandmother listened, nodding.", "“I made them with love,” she said at last. “They are the same dumplings my grandmother made me, in a village far away. Every fold is a story.”", "“I know,” said Mei. “But at school, everything is different. I don’t want to be different.”", "Her grandmother took Mei’s hands. “Different is not bad. Different is like a spice. Too much can be strong. But without it, food has no flavor.”", "Mei wasn’t sure that made her feel better. But she said thank you, and went to bed.", "The next morning, Ms. Alvarez stood at the front of the classroom with a small girl beside her. The girl had straight black braids and a serious face, and she clutched a backpack in both hands.", "“Class,” said Ms. Alvarez, “this is Anya. She has just moved here from another country. She’s learning English, so let’s all be kind and helpful.”", "Anya looked around the room. Her eyes were wide and nervous. She whispered something in a language Mei had never heard, and nobody understood.", "Ms. Alvarez smiled. “Anya, why don’t you sit next to Mei?”", "Mei felt a jolt of surprise. She led Anya to the empty desk beside hers, and Anya sat down quietly, staring at the floor.", "All morning, Anya barely moved. When Ms. Alvarez asked her a question, she shook her head. When the class started a math game, she sat with her hands folded. At recess, she stood alone by the fence, and nobody talked to her. Mei watched from across the playground. She recognized the look on Anya’s face. It was the look of a girl who had two boxes and no bridge.", "At lunch, Mei sat down beside her. Anya opened her lunchbox and took out a sandwich made of dark, dense bread and something red. It didn’t look like what the other kids ate. A boy at the next table sniffed loudly.", "Mei took a deep breath. She opened her own thermos and lifted out a dumpling with her chopsticks. “These are dumplings,” she said slowly. “Do you want to try one?”", "Anya blinked. She looked at the dumpling, then at Mei’s face. Then, carefully, she took it and bit into it. Her face changed. She smiled a tiny smile and said a word Mei didn’t know, but Mei understood exactly what it meant. It’s good.", "“Good,” said Mei. “Good. Dumpling.”", "“Doom-pling,” repeated Anya.", "Mei grinned. “Yes.”", "The boy at the next table snickered, but Mei didn’t look at him. She was too busy sharing. She pointed at Anya’s sandwich. “What is that?”", "Anya said something long and sounded like music. Mei shook her head. “I don’t understand.” Anya thought, then made a rolling motion with her hands, and pointed at the red filling. “Bee-troot,” she said. “Bee-troot.”", "“Beet!” said Mei. “Beets!”", "“Beets,” said Anya, with care.", "They went back and forth, pointing and repeating. By the end of lunch, Anya had learned five words in English, and Mei had learned one in Anya’s language: spasibo, which means thank you.", "Something surprising was happening inside Mei. When she helped Anya, the boxes in her head didn’t feel so separate. She used her English to explain the classroom rules. She used gestures and pictures to show Anya how to play kickball. She even used a little Chinese, once, when she was so excited that she forgot which language to use. Anya laughed, and Mei laughed too.", "Day by day, they became friends. Mei taught Anya the English names for everything: pencil, window, book, apple. She drew pictures on paper and labeled them. Anya learned quickly. She practiced her new words every night and taught Mei a few in return. Soon they were trading vocabulary, like collectors trading cards.", "Then, one Friday afternoon, Ms. Alvarez called Mei to her desk. “I’ve been watching you,” she said, with a smile. “You’ve been very kind to Anya. That is not always easy. It takes courage to reach out.”", "“It wasn’t hard,” said Mei. “She was just lonely.”", "“You are bilingual,” said Ms. Alvarez. “That means you have two languages inside you. Do you know what that gives you? A superpower. You can build a bridge between different people.”", "Mei frowned. “But I never thought it was a superpower. I always thought it made me different.”", "“It does,” said Ms. Alvarez. “But different is often what makes a person special. What if we celebrated it? We have a Culture Day coming up next week. Would you like to share something about your home?”", "Mei’s stomach flipped. She thought about the boys and the dumplings. But then she thought about Anya, and her grandmother, and the way it felt to have two voices.", "“I would,” she said.", "On Culture Day, the classroom was full of color. Kids brought flags, photographs, and foods from their families. A girl showed a beaded necklace from Nigeria. A boy sang a song in Spanish. Anya brought a tiny wooden doll, painted with flowers, and said a few words in English that she had practiced, very slowly.", "Then it was Mei’s turn. She stood at the front of the room with her thermos. Her heart was pounding.", "“This is my grandmother’s recipe,” she said. “They are called jiaozi. In English, we say dumplings. Some people think they look strange. But in my family, they are for the New Year, to bring luck. Each one is folded by hand.” She took a deep breath and looked at the boy who had teased her. “Would you like to try one?”", "The boy looked at her, then at the dumpling. He hesitated. Then he took a bite. His eyebrows rose.", "“It’s good,” he said, surprised. “It’s really good.”", "Mei smiled so wide that her cheeks hurt.", "One by one, the students tasted the dumplings. Some asked for seconds. Ms. Alvarez took a photo. Anya, standing beside Mei, said in slow English, “Mei is my friend. She teach me. She is… bridge.”", "Mei felt her eyes fill with tears. “Bridge,” she repeated softly.", "That night, she told her grandmother everything. Her grandmother’s eyes shone. “You have brought our home to school,” she said. “That is a very good thing.”", "Later, Mei lay in bed and thought about her two boxes. She realized they were not on separate shelves after all. They were on the same one, side by side, and she could move between them any time. She wasn’t two different girls. She was one girl who could speak in two voices, and understood something that many people never learn.", "Belonging is not about being the same as everyone else. It is about bringing your whole self, and making room for others to do the same.", "The next day at lunch, Mei’s thermos was full of dumplings again. This time, when she opened it, a crowd of kids gathered around the table. And Anya sat beside her, holding out a piece of dark bread with beets, and saying with a grin, “Trade?”", "“Trade,” said Mei."]}, {"vocab": [{"w": "pirouette", "d": "a full turn of the body balanced on one foot, usually on pointe or demi-pointe"}, {"w": "spot", "d": "to fix your eyes on one point while turning, to keep from getting dizzy"}, {"w": "momentum", "d": "the force that keeps something moving once it has started"}, {"w": "frustration", "d": "a feeling of being upset because something is difficult"}, {"w": "precision", "d": "doing something with great accuracy and care"}], "quiz": [{"skill": "Main idea", "q": "What is the main idea of this story?", "opts": ["A hidden technique called spotting helps dancers turn without getting dizzy", "Ballet shoes are expensive", "Ivy quits dancing", "Turning is impossible to learn"], "ans": 0, "why": "The story explains and demonstrates the technique of spotting."}, {"skill": "Details", "q": "What does spotting mean in ballet?", "opts": ["Fixing your eyes on one point while your body turns", "Practicing in the dark", "Wearing spots on your costume", "Watching other dancers"], "ans": 0, "why": "Spotting is picking one point and returning your eyes to it during a turn."}, {"skill": "Inference", "q": "Why did Ivy get dizzy before she learned to spot?", "opts": ["Her whole head was turning smoothly with her body the entire time", "She spun too slowly", "She was tired", "The floor was slippery"], "ans": 0, "why": "Without spotting, her vision blurred continuously, which causes dizziness."}, {"skill": "Cause and effect", "q": "What happened after Ivy practiced spotting against a wall with a sticker?", "opts": ["She learned to whip her head around and find the sticker again quickly", "She fell down", "She stopped dancing", "She changed studios"], "ans": 0, "why": "The sticker gave her a fixed point to practice finding quickly."}, {"skill": "Vocabulary", "q": "What does “momentum” mean?", "opts": ["The force that keeps something moving", "A type of shoe", "A dance costume", "A kind of music"], "ans": 0, "why": "Momentum carries Ivy's turn once she pushes off."}], "title": "The Secret of the Perfect Pirouette", "cat": "ballet", "blurb": "Ivy can leap and point her toes beautifully, but every turn ends with her stumbling and dizzy. A retired dancer teaches her the hidden trick that turns spinning into stillness.", "paras": ["Ivy Delgado could point her toes so sharply that Madame Orlova said they looked like exclamation marks. She could leap higher than anyone else in her level, her legs snapping into a perfect split in the air. But the moment she tried to turn, everything fell apart.", "Ivy had loved ballet for as long as she could remember, ever since she was five years old and her aunt had taken her to see a matinee performance of Cinderella, and Ivy had sat in the dark theater with her mouth hanging open, utterly amazed that a body could tell a whole story without saying a single word. She had begged for lessons that same week, and she had never once, in five years of Saturday classes and sore feet and blistered heels, regretted asking. She loved the smell of rosin dust by the barre. She loved the particular hush that fell over a room right before the piano began. She loved, most of all, the moment her body did exactly what she asked it to do, no more and no less, as though her muscles and her imagination had finally agreed on something together.", "Turning was the one thing that refused to agree with her.", "“Again,” said Madame Orlova, not unkindly, as Ivy wobbled out of her third pirouette in a row and had to catch herself on the barre.", "“I don’t understand,” Ivy said, pressing her hand to her forehead. “My legs know what to do. It’s my head that won’t cooperate.”", "“That,” said Madame Orlova, “is because you have not yet learned to spot.”", "Ivy had heard the word a hundred times. Spot your turn, Madame Orlova would call out, and Ivy would nod as if she understood, and then spin around like a top let loose on a table, and land facing a different wall every single time, the room swimming in front of her eyes.", "She had tried everything she could think of on her own. She had tried turning more slowly, which only meant she got dizzy more slowly. She had tried closing her eyes halfway through, which made things worse, not better, because then she had absolutely nothing to steady herself against at all. She had even tried, once, turning with her eyes squeezed shut the entire time, an idea she was quite proud of until she opened them again to find she had drifted three full feet sideways and nearly knocked over a music stand. None of it worked. Every single attempt ended the same way: the room tilting, her stomach lurching, her feet scrambling to find the floor again.", "After class, Ivy sat on the floor lacing up her sneakers, feeling sorry for herself, a hot knot of frustration sitting behind her eyes because her legs could do things other dancers' legs couldn't, and yet something as simple as a turn kept beating her anyway. The studio was emptying out. Only one person remained: an old woman with silver hair pulled into a neat bun, sitting very straight on the bench by the window, lacing up a pair of soft leather flats. Ivy had seen her before. She often sat and watched the advanced classes, and sometimes she helped Madame Orlova sort the costume racks. Nobody seemed to know exactly who she was, only that Madame Orlova treated her with enormous respect and called her Miss Petrova.", "“Turns troubling you?” the old woman asked, without looking up from her laces.", "Ivy blushed. “Is it that obvious?”", "“I have watched a great many turns in my life,” said Miss Petrova. “Yours has a very particular problem. Would you like to know what it is?”", "Ivy scrambled to her feet. “Yes. Please.”", "Miss Petrova rose slowly, one hand resting on the barre for balance, though Ivy suspected she didn’t truly need it. “Stand in the middle of the floor,” she said. “Now, turn around in a full circle, slowly, and tell me what you see.”", "Ivy turned. “The mirror. The door. The piano. The window. The mirror again.”", "“Now do it quickly. As quickly as you can, without moving your feet.”", "Ivy spun fast. The room blurred into a smear of gray and gold. When she stopped, she swayed, and Miss Petrova caught her elbow.", "“There,” said Miss Petrova. “That blur. That is what happens to your eyes every time you pirouette, because your head is turning at exactly the same speed as your body, the whole time, with nothing to rest on. Your eyes cannot fix on anything, so your brain becomes confused about which way is up. That confusion is what you call dizziness.”", "“So how do dancers do it without getting dizzy? Are their eyes just stronger?”", "“No,” said Miss Petrova, and for the first time she smiled. “They use a trick. It is called spotting, and once you understand it, you will never look at a turn the same way again. Watch.”", "She stepped to the center of the floor. She was at least seventy years old, Ivy guessed, but when she lifted her arms into a soft oval and rose onto the ball of one foot, something in her posture changed entirely, becoming taller, lighter, younger. For just a moment, Ivy could almost picture what Miss Petrova must have looked like decades ago, in some grand theater under bright lights, though she never said a word about where she had once danced, and Ivy had the feeling it would be rude to ask.", "“Choose a point,” said Miss Petrova, nodding toward a small chip in the mirror’s frame at eye level. “That is my spot. Now watch my head, not my feet.”", "She turned. But her head did something strange. Her body rotated smoothly, evenly, the way Ivy’s always did — but her head snapped around at the very last possible moment, whipping back to find the chip in the mirror frame again before her body had even finished catching up. She completed one full turn, then another, then a third, each one crisp and controlled, her eyes finding that same tiny chip in the mirror every single time, like a lighthouse beam sweeping past and returning, sweeping past and returning. It was a small movement, but it was executed with such precision that Ivy could hardly believe it belonged to the same body as the rest of the turn.", "She came to a stop, perfectly balanced, not the least bit dizzy.", "“Whoa,” said Ivy.", "“Your eyes,” said Miss Petrova, “must lead the turn, and your head must follow, but faster than the rest of you. You look at your spot for as long as possible. Then, at the very last moment, you whip your head around — fast, like snapping a towel — and find that same spot again on the other side. Your eyes rest on that point far longer than they spend blurring past everything else. That is the secret. Not strength. Not slower turns. Timing.”", "Ivy tried it, turning slowly at first, forcing her head to stay facing the mirror as her shoulders began to rotate away from it, then whipping her chin around at the last second to find the chip again.", "She only made it a quarter turn before she lost her balance and had to catch herself. But she hadn’t gotten dizzy.", "“Again,” said Miss Petrova, echoing Madame Orlova, but this time the word didn’t feel like criticism. It felt like an invitation.", "For the rest of the afternoon, long after the other dancers had gone home, Ivy practiced spotting. Not full pirouettes yet — just the head motion, standing still, whipping her chin from one point to another, feeling the strange, snapping sensation of it. Miss Petrova placed a small yellow sticker on the wall at eye level, right in the center of the mirror.", "“Find the sticker,” she said. “Lose it. Find it again. That is all turning really is.”", "Ivy did this fifty times, a hundred times, until her neck ached in a way it never had before, a good kind of ache, the kind that meant a muscle was learning something new. She noticed something interesting: when she whipped her head fast enough, she could genuinely feel her eyes “catching” on the sticker, the way her fingers might catch a ball tossed toward her.", "Miss Petrova watched her without saying much, occasionally offering a small correction. “Faster with the head,” she would say, or, “Slower with the feet, they are racing ahead of you.” Once, when Ivy grew frustrated and let out a long, unhappy sigh after a wobble, Miss Petrova simply sat down on the bench beside her.", "“You know,” she said, “frustration is not a sign that you are failing. It is a sign that you care enough to notice you have not yet succeeded. I would worry more about a student who felt nothing at all.”", "“It’s just — I’ve been trying for so long,” Ivy said. “Everyone else in my class can turn already.”", "“Everyone else in your class was not trying to solve the whole problem by themselves, without the one piece of information that makes it possible,” said Miss Petrova. “That is not the same as trying less hard. You were simply missing a key that had not yet been handed to you. Now you have it. Watch how quickly things change.”", "“Now,” said Miss Petrova, “add your feet. But go slowly. Slower than feels natural. A turn done slowly and well is worth ten turns done fast and badly.”", "Ivy tried a quarter turn with the spot. Then a half turn. Her chin snapped around right on time, finding the sticker, and for one half of a turn, the room did not blur at all.", "“I found it!” she gasped.", "“Now a whole turn.”", "It took another twenty tries. But on the twenty-first, Ivy pushed off from her supporting leg, felt the familiar rush of momentum carry her body around, and this time her head didn’t simply spin along helplessly with the rest of her. It held on to the sticker for as long as it dared, then whipped around fast, faster than she thought her neck could move, and found the little square of yellow again just as her shoulders came back to face the mirror.", "She landed. She did not stumble. She did not sway. The room was steady and clear, the mirror exactly where it had always been.", "“I did it,” Ivy whispered. “I actually did it.”", "“You did,” said Miss Petrova. “Now do it nine hundred more times, until your neck no longer has to think about it at all, and your body simply knows.”", "Ivy laughed, out of breath and delighted. “Nine hundred?”", "“Give or take,” said Miss Petrova, and there was a twinkle in her eye that made Ivy suspect she was not entirely joking.", "Over the following weeks, Ivy practiced spotting everywhere, not only at the studio. She spotted while turning around in the school hallway between classes, earning a strange look from a hall monitor. She spotted on the school bus, whipping her head to find the stop sign at the corner as the bus rounded a curve. She spotted in the kitchen while her little brother laughed and tried to copy her, getting hopelessly dizzy in the process because he refused to whip his head at the right moment.", "“You have to snap it,” she told him. “Don’t just let it drift around with everything else.”", "She practiced in front of the bathroom mirror while brushing her teeth, finding the same spot on the faucet handle again and again. She practiced in the backyard, using a chalk mark on the fence as her spot, until the neighbor’s dog got so used to watching her spin in circles that it stopped barking at her entirely and simply lay in the grass, tracking her with its eyes the way she tracked the chalk mark with hers. Some days the turns felt easy, almost automatic. Other days, especially when she was tired, the old dizziness crept back in, and she had to remind herself, out loud sometimes, to slow down and trust the timing rather than rushing the feet ahead of the head. Miss Petrova had warned her this would happen. “A new skill is not a straight staircase,” she had said. “It is more like a set of stairs with a few missing steps here and there. You will still get to the top. You will just occasionally need to jump a little.”", "There was one especially difficult Tuesday when Ivy tried, for the first time, a double pirouette, two full rotations instead of one, and the extra speed undid all her careful progress. She landed the first turn cleanly, spotted the sticker perfectly, but the second rotation came too fast for her head to catch up, and she stumbled sideways into the barre, more startled than hurt.", "“I lost it,” she said, more frustrated with herself than she had been in weeks. “I had it and then I lost it.”", "“You did not lose the secret,” said Miss Petrova. “You simply asked your neck to do something new before it was ready. A double turn asks for exactly the same idea, spotting, but at a faster tempo, and faster tempo always feels, at first, like starting over. It is not starting over. It is the same staircase, one flight higher.”", "Ivy took a breath, reset her feet, and tried again, more slowly this time, exaggerating the snap of her head so deliberately that it felt almost silly. It worked. Not perfectly — she still wobbled coming out of the second rotation — but she found the sticker both times, and she did not fall.", "“Better,” said Miss Petrova, and then, unexpectedly, she sat down on the bench and patted the space beside her. Ivy sat, still catching her breath.", "“May I tell you something,” Miss Petrova said, “that took me far longer to learn than spotting ever did?”", "“Please.”", "“Precision,” said Miss Petrova, “is not the same thing as perfection. A precise turn is one where every part does its job at exactly the right moment — the eyes, the head, the arms, the feet, each one arriving on time, like dancers arriving at their marks for the start of a piece. But precise does not mean flawless. I performed for many, many years, and I promise you, I wobbled in front of thousands of people more times than I could possibly count. What mattered was not that I never wobbled. What mattered was that I knew, every single time, exactly what had gone slightly wrong, and exactly how to fix it the next time I tried. That kind of knowing is worth more than any single perfect turn.”", "Ivy thought about that for a long moment, turning the idea over the way she might turn over a stone she’d found in the creek behind her house. “So getting frustrated when it doesn’t work isn’t actually a bad thing?”", "“Frustration only becomes a problem,” said Miss Petrova, “when you let it convince you to stop looking for the small correction. Feel it. Notice it. And then go looking for the correction anyway. That is the whole trick, in turning and in nearly everything else worth doing.”", "The following Saturday, Ivy arrived at the studio early, before most of the other dancers had even changed into their shoes, and found Madame Orlova setting up the piano.", "“You’re here early,” Madame Orlova said, glancing up.", "“I wanted extra time at the mirror,” Ivy admitted. “I keep finding tiny things to fix.”", "Madame Orlova studied her for a moment, the way she sometimes studied a whole class before deciding what to teach that day. “You know,” she said, “when Miss Petrova first came to watch my classes, years ago, I did not know quite what to make of her. She never asked to teach. She simply sat, and watched, and occasionally spoke to exactly the student who needed to hear something that day. I have come to think she has a gift for noticing which dancer is one small idea away from something enormous.”", "“She definitely noticed it in me,” Ivy said.", "“She did,” Madame Orlova agreed. “I am glad you were paying attention when she did.”", "Ivy practiced her pirouettes alone for twenty minutes before anyone else arrived, feeling the sticker catch her eye again and again, each turn a little steadier than the last, until the room felt less like a place where she might fall and more like a place that belonged to her.", "At her next class, Madame Orlova called for pirouettes, and Ivy took her place at the barre with a strange new confidence humming in her chest. She picked her spot: the same little chip in the mirror’s frame that Miss Petrova had shown her.", "She pushed off. Her body rotated. Her head held on to the chip until the last possible second, then whipped around, fast and sure, and found it again on the other side.", "One turn. Then, without stopping to think about it, a second.", "She landed, both turns clean, her balance steady beneath her, and the whole studio had gone quiet in the way a room goes quiet when something remarkable has just happened.", "“Well,” said Madame Orlova, her eyebrows raised very high. “It seems someone has discovered the secret.”", "Ivy glanced toward the window, where Miss Petrova sat on her usual bench, lacing up her flats, and caught the old dancer’s eye. Miss Petrova gave the smallest possible nod, the kind of nod that said, of course you did, I knew you would, without a single word spoken.", "A few weeks later, a younger girl named Talia, only seven years old and brand new to the class, came up to Ivy after a lesson, near tears, complaining that every time she tried to turn, the whole room went blurry and she fell right over.", "Ivy remembered exactly how that felt. She sat down on the floor across from Talia, the way Miss Petrova had once sat down across from her, and pointed toward the little chip in the mirror’s frame.", "“Can I show you something?” Ivy asked. “It’s called spotting, and it changes everything.”", "Ivy smiled and turned back to the mirror, already searching for her spot again. There was nothing dizzying about it anymore. It felt, instead, like a kind of quiet magic: the whole spinning world holding perfectly still, if only you knew exactly where to look, and now, for the first time, she had a secret worth passing along to someone else."]}, {"vocab": [{"w": "principal", "d": "the highest rank of dancer in a ballet company"}, {"w": "audition", "d": "a tryout where a dancer shows their skill to be chosen for a role or company"}, {"w": "scholarship", "d": "money given to help pay for lessons or school based on talent or need"}, {"w": "discipline", "d": "the practice of training yourself to work hard in a controlled, careful way"}, {"w": "barrier", "d": "something that blocks or makes progress difficult"}], "quiz": [{"skill": "Main idea", "q": "What is this biography mostly about?", "opts": ["Misty Copeland overcame a late start and difficult childhood to become a principal ballerina", "Misty Copeland never learned ballet", "Ballet is only for rich families", "Misty Copeland gave up on her dream"], "ans": 0, "why": "The story traces her path from a hard childhood to the top rank of American ballet."}, {"skill": "Details", "q": "How old was Misty when she took her first ballet class?", "opts": ["Thirteen", "Three", "Twenty", "Six"], "ans": 0, "why": "Most ballet dancers start much younger, but Misty began at thirteen."}, {"skill": "Inference", "q": "Why did Misty's teacher Cynthia Bradley let her practice on the basketball court?", "opts": ["Misty's family could not always get her to the studio, so the teacher found another way to help her train", "Misty did not want to be indoors", "The studio was closed for repairs", "Misty preferred basketball"], "ans": 0, "why": "Cynthia Bradley adapted her teaching around Misty's difficult living situation."}, {"skill": "Cause and effect", "q": "What happened after Misty joined American Ballet Theatre's studio company?", "opts": ["She worked her way up through the ranks over many years to become a principal dancer", "She quit immediately", "She switched to basketball", "She stopped taking classes"], "ans": 0, "why": "Her rise took years of steady work through the company's ranks."}, {"skill": "Vocabulary", "q": "What does “barrier” mean?", "opts": ["Something that blocks progress", "A type of shoe", "A dance move", "A costume"], "ans": 0, "why": "Misty faced many barriers, including being told her body type was wrong for ballet."}], "title": "Misty Copeland Finds Her Stage", "cat": "ballet", "blurb": "Most ballerinas start dancing as toddlers. Misty Copeland took her first class at thirteen, living in a motel room with five brothers and sisters. This is the true story of how she became a principal dancer against every expectation.", "paras": ["Misty Copeland was born on September 10, 1982, in Kansas City, Missouri, though her family eventually settled in Southern California, moving from apartment to apartment around Los Angeles before landing in the harborside city of San Pedro. It was not the kind of childhood that magazines usually picture when they imagine where a great ballerina comes from.", "On a summer afternoon in San Pedro, California, a thirteen-year-old girl named Misty Copeland stood at the edge of a basketball court at the Boys and Girls Club, waiting for a free dance class to begin. She had wandered over on a whim, mostly because her friends were going and she had nothing else to do that afternoon. She had never taken a single dance lesson in her life. She was, at the time, a member of the club's drill team, and it was through that connection that she had first heard a free dance class was starting up, taught by a young instructor who ran a private ballet studio nearby and occasionally volunteered her time to reach kids who would otherwise never set foot inside one.", "Misty’s childhood had not been an easy one. She was the fourth of six children, and her family moved often, sometimes staying with relatives, sometimes crowding into cheap motel rooms when money ran short. There were stretches when six people shared a single room, sleeping on the floor between two beds. Ballet, with its expensive shoes and its tuition and its early years of training that most dancers began as toddlers, seemed like something that happened in a different world entirely, a world Misty had no reason to think she belonged to.", "But that afternoon, a teacher named Cynthia Bradley walked into the gym and began to lead the group through simple stretches and positions. Something about it caught hold of Misty immediately; she later said it felt as though her body had been waiting her whole life to move that way, and finally someone had shown it how. She has described standing at the edge of that basketball court in her socks, since she owned no proper dance shoes, and feeling, for the very first time, that her body understood something before her mind had caught up to explain it.", "Cynthia noticed her too. Within weeks, it was clear that Misty had an extraordinary gift: flexible joints, natural balance, a way of moving that seemed both effortless and precise. Most dancers spend years building the strength and flexibility Misty seemed to arrive with already. Cynthia invited her to train at her private studio, the San Pedro Dance Center, offering a scholarship, since Misty’s family could not afford lessons. Without that scholarship, Misty has said many times since, none of what followed would have been possible at all; a single generous decision by one teacher opened a door that money alone would have kept shut.", "There was still the matter of getting to class. Misty’s mother worked long hours and the family’s living situation kept shifting, and sometimes there was no way to get Misty to the studio at all. So Cynthia did something unusual. For a period of time, with the family’s permission, Misty lived with Cynthia and her family, so that she could attend class every single day. It was an enormous commitment from a teacher who saw something rare and did not want it to slip away simply because of circumstances outside a thirteen-year-old’s control. On the days training could not happen at the studio itself, Cynthia would sometimes work with Misty right there on the outdoor basketball court where it had all begun, marking positions on the concrete in her regular sneakers, because a missed day of practice mattered more than having the perfect room, the perfect floor, or the perfect shoes to practice in.", "Misty trained with a hunger that surprised everyone around her. In most cases, a dancer who begins at thirteen never catches up to peers who began at three or four; the body needs years to build the flexibility and muscle memory that ballet requires. Misty defied that expectation almost immediately. Within a single year of her first class, she was dancing en pointe, a milestone that typically takes three or four years to reach safely. Within two years, she won first place in a regional competition, dancing a piece so demanding that judges asked, astonished, how long she had been training. When she told them barely two years, some of them didn’t believe her. That competition, the Music Center Spotlight Awards in Los Angeles, was one of the first moments the wider dance world outside San Pedro took real notice of her, and it meant that a girl who had been dancing for barely two years was suddenly being compared, seriously, to peers who had trained since preschool, and being found, to everyone's astonishment, more than equal to the comparison.", "Word of her talent spread quickly through the small, tightly connected world of American ballet. At fifteen, Misty was accepted into a summer intensive program with American Ballet Theatre, one of the most prestigious ballet companies in the world, headquartered in New York City. It was an enormous opportunity, and also an enormous challenge. Ballet, historically, had very few Black dancers in its top companies. Misty would often be the only Black dancer in the room, and sometimes she heard comments that made it clear certain people did not expect her to belong there. She was told, more than once, that her muscular build was not the traditional ballet body type. She was told her skin tone did not match the costumes designed for the corps de ballet, the group of dancers who move together in matching lines. Instead of making her feel unwelcome forever, these comments only sharpened her determination. She decided the solution was not to shrink herself to fit an old idea of what a ballerina should look like, but to dance so extraordinarily well that the idea itself would have to change.", "After a nerve-wracking audition in front of company directors who had never before seen a dancer with quite her background, she joined American Ballet Theatre's Studio Company at seventeen, and the main company itself at eighteen, in the year 2001, as one of very few Black dancers in the organization’s history. The road from there to the top was not fast. Ballet companies rank their dancers, from the corps de ballet, through soloist, up to principal, the highest rank, reserved for dancers who perform the leading roles in every full production. Misty spent years as a member of the corps, dancing in matching rows behind featured soloists, learning, watching, waiting, and working.", "Those corps years were not easy, and not always glamorous. Misty has spoken about long days of rehearsal that began early in the morning and stretched late into the evening, about touring with the company to cities across the country and around the world, packing and unpacking the same well-worn pointe shoes again and again, about the quiet discipline of showing up, every single day, ready to work, whether or not anyone in the audience that night would ever learn her name. Discipline, she has said, was never really about talent at all. It was about choosing, every morning, to do the unglamorous parts of the work — the stretching, the repetition, the small corrections — long before there was any guarantee that the effort would ever be rewarded with a leading role.", "During those corps years, Misty also found an unexpected mentor: Raven Wilkinson, a Black ballerina who, decades earlier in the 1950s, had become one of the first Black women to dance with a major American ballet company, the Ballet Russe de Monte Carlo. Wilkinson had toured through the segregated South at a time when audiences and even hotel owners sometimes refused to believe a Black woman belonged on a classical ballet stage at all, and she had faced hardships Misty could barely imagine. The two women met when Misty was still a young dancer at American Ballet Theatre, and Wilkinson became a source of guidance and friendship for years afterward, someone who understood, better than almost anyone alive, exactly what it felt like to be the only dancer in the room who looked a certain way. Misty later said that learning her own history, meeting a woman who had walked a similar road so long before her, made her barriers feel less like something she was facing alone and more like a chapter in a much longer story.", "There were difficult stretches. In her early twenties, an injury to her lower spine required surgery and nearly ended her career altogether. Doctors placed screws and rods in her back to stabilize six stress fractures in her tibia and treat the damage in her spine, and for a long time nobody, including Misty herself, was certain she would ever dance professionally again. She spent months not knowing whether she would ever dance again, let alone rise through the company’s ranks. She has spoken since about how frightening that period was, and how it forced her to think seriously, for the first time, about who she was if dancing was taken away from her. She chose, in the end, to fight her way back, working through a slow and painful recovery with the same discipline that had carried her from a basketball court gym to a major ballet company in the first place.", "She was promoted to soloist in 2007, becoming one of the first Black women to reach that rank at American Ballet Theatre. As a soloist, she took on more visible roles, and in 2012, she stepped into the title role of The Firebird, a fiery, demanding part built on quick, sharp jumps and dramatic extensions, becoming the first Black woman to dance that role for the company. A photograph from that performance, showing her muscular legs mid-leap, began circulating widely online, admired by people who had never before paid attention to ballet at all.", "It would take six more years of hard, steady work before her next promotion. In 2015, after fourteen years with the company, American Ballet Theatre named Misty Copeland a principal dancer. She became the first Black woman in the company’s seventy-five-year history to hold that rank. That same year, Time magazine named her one of the hundred most influential people in the world, and she was invited to serve on the President’s Council on Fitness, Sports and Nutrition, recognition that reached far beyond the walls of any theater.", "The news spread far beyond the ballet world. Misty had already become known outside of dance circles, partly through a widely shared photograph and short film, part of an advertising campaign called “I Will What I Want,” that showed her powerful, muscular body captured mid-leap alongside the text of a rejection letter she had once received, a striking contrast to the delicate, willowy image many people carried in their minds of what a ballerina should look like. Young dancers, especially young Black dancers who had never seen someone who looked like them in a leading ballet role, wrote to her by the thousands. Many said they had never considered ballet as something available to them until they saw her dance Odette in Swan Lake, or Firebird, roles that had almost never before been danced by a Black principal at a major American company.", "Life as a working dancer, even before she reached the rank of principal, meant a schedule most people would find exhausting. American Ballet Theatre performs in New York City for parts of the year and also tours to other cities and countries, which meant Misty spent long stretches away from home, rehearsing in unfamiliar studios, adjusting to different stages and different partners, and performing night after night even when her muscles ached from the previous evening’s show. Company dancers often rehearse one ballet in the morning while performing an entirely different one that same night, memorizing several roles at once and switching between them without much rest in between. It was, by any measure, a demanding way to make a living, and Misty has often pointed out that audiences who watch a finished performance rarely see the thousands of ordinary, repetitive hours of preparation sitting underneath those few minutes on stage.", "Misty’s reach extended well beyond the ballet stage itself. She was invited by the musician Prince to perform in several of his concerts and music videos, a partnership that introduced her dancing to audiences who had never watched a ballet performance in their lives. In 2014, she published a memoir, Life in Motion: An Unlikely Ballerina, which became a New York Times bestseller and was later adapted into a documentary film, giving readers an honest account of the motel rooms, the scholarship, and the years of doubt that came before the applause. She went on to write additional books for young readers, including a picture book called Firebird, aimed at showing children who might feel like outsiders that they, too, could imagine themselves inside a story about dance, and later a picture book called Bunheads, drawn from her own memories of being a young dancer backstage for the very first time. Years afterward, she also wrote a book honoring Raven Wilkinson directly, making sure that the ballerina who had once quietly guided her would not be forgotten by the next generation of dancers either.", "As a principal dancer, Misty took on many of the great classical roles in the standard ballet repertoire, dancing in full-length productions of The Nutcracker, Romeo and Juliet, and Don Quixote alongside the Firebird and Swan Lake roles that had already made her famous. Each new leading role meant months of rehearsal, working alongside a partner, learning not just the steps but the acting and the storytelling that turn a sequence of jumps and turns into a character an audience can believe in and care about, whether that character was a heartbroken swan queen, a mischievous firebird, or a young woman falling in love for the first time. She has said that every principal role still required exactly the same discipline that had gotten her through her very first year of training: showing up, doing the unglamorous repetition, and trusting that the work would eventually show up on stage, even on nights when her body was tired or her confidence was shaky.", "Misty has never pretended the road was simple, or that talent alone was enough. She speaks often about the specific barriers she faced: the years of training she had to compress into a fraction of the normal time, the assumptions people made about her body before they had even seen her dance, the loneliness of frequently being the only dancer in the room who looked like her. She has used her platform to push major ballet companies to make real changes, including developing pointe shoes and tights in a wider range of skin tones, something that seems small until you consider that for generations, dancers of color had to color their own shoes and tights by hand just to match their skin, a practice called pancaking, simply because no manufacturer made products for anyone but light-skinned dancers.", "She has also returned to where her own story began, working with community programs that make ballet training accessible to children who, like her, might never otherwise imagine themselves standing at a barre. Years after her own scholarship changed the direction of her life, she started a foundation of her own, partnering with Boys and Girls Clubs across the country, the very kind of organization where her own path into ballet had begun on that ordinary summer afternoon, to offer free ballet classes to children who might otherwise never have the chance to try. The program deliberately looks for the same thing Cynthia Bradley once noticed in a thirteen-year-old with no training at all: not a certain body shape or a certain amount of money in the family budget, but simple curiosity and a willingness to try something new. She often tells young dancers the same thing that Cynthia Bradley once showed her: that talent can appear at any age, in any body, in any circumstance, and that the job of the people around a young dancer is to notice it and make room for it to grow, rather than deciding in advance who does and does not belong.", "Today, Misty Copeland is widely considered one of the most influential ballet dancers of her generation, not only for her artistry on stage but for what her presence there has meant to an entire art form that is, slowly, becoming more open than it once was. She has written books, appeared in films, and spoken to audiences around the world, from school gymnasiums not unlike the one where she took her first class, to some of the grandest theaters on earth.", "When young dancers ask her for advice, Misty tends to bring the conversation back to the same handful of ideas: that a late start does not have to mean a closed door, that a single supportive adult, whether a teacher, a coach, or a stranger running a free class at a community center, can change the entire direction of a child's life, and that discipline, practiced quietly and repeated daily, matters more in the long run than any single dazzling performance. She reminds children that she once stood exactly where they might be standing now, unsure whether ballet was even a place meant for someone like her, with no leotard of her own and no dance training whatsoever, and that the only reason the rest of her story exists at all is that she was willing to walk over to that basketball court on an ordinary summer afternoon and try.", "But she still describes her favorite moment as the simplest one: the instant right before the music starts, standing in the wings, about to step into the light, thirteen-year-old her and the principal dancer she became standing, somehow, in the very same pair of shoes."]}, {"vocab": [{"w": "understudy", "d": "a performer who learns a role in case the main performer cannot go on"}, {"w": "generous", "d": "willing to give time, help, or credit to others without expecting anything back"}, {"w": "rehearsal", "d": "a practice session before a real performance"}, {"w": "gracious", "d": "polite and kind, especially when winning or when things go well for you"}, {"w": "loyalty", "d": "being faithful and supportive to a person or group"}], "quiz": [{"skill": "Main idea", "q": "What is this story mostly about?", "opts": ["Priya learns that being a good friend matters as much as being a good dancer", "Priya wants to be famous", "Callie quits ballet forever", "The recital is cancelled"], "ans": 0, "why": "Priya's choices about supporting Callie are the heart of the story."}, {"skill": "Details", "q": "Why does Priya know the lead role even though she was never assigned it?", "opts": ["She is the understudy and has quietly practiced it every week just in case", "She stole the choreography notes", "She used to have the role", "Callie taught her for fun"], "ans": 0, "why": "Priya is officially the understudy and prepares in case she is ever needed."}, {"skill": "Inference", "q": "Why does Priya feel torn when Callie gets hurt?", "opts": ["She is excited for her chance but also worried about her friend", "She is angry at Callie", "She wants to quit dancing", "She does not care about the show"], "ans": 0, "why": "Priya feels both real concern for Callie and real excitement for the opportunity, and both feelings are honest."}, {"skill": "Character", "q": "What does Priya decide to do for Callie during the performance?", "opts": ["Dedicate her dancing to Callie and involve her in the moment from the audience", "Ignore her completely", "Give up her spot", "Cancel the show"], "ans": 0, "why": "Priya finds a way to include Callie's spirit in the performance rather than leaving her out."}, {"skill": "Vocabulary", "q": "What does “understudy” mean?", "opts": ["A performer who learns a role in case the lead cannot perform", "A type of dance step", "A costume designer", "A kind of music"], "ans": 0, "why": "Priya is the understudy for the lead role."}], "title": "The Understudy", "cat": "ballet", "blurb": "Priya has practiced the lead role in secret for months, just in case. When her best friend Callie gets hurt the night before the recital, Priya must decide what kind of dancer, and what kind of friend, she wants to be.", "paras": ["Priya Anand and Callie Nakamura had been best friends since they were six years old, back when their biggest ballet ambition had been remembering which foot was supposed to point first in a simple tendu. They had grown up together at the same studio, moving up through the levels side by side, trading hair ties and sharing granola bars in the dressing room, arguing occasionally about nothing important and always making up within the hour. If you had asked either of them, at any point over those seven years, to name their best friend, they would have answered before you finished the question.", "Every Thursday afternoon, after the regular ballet class had ended and the other dancers had peeled off their shoes and gone home, Priya Anand stayed behind for twenty extra minutes. She would wait until the studio was empty except for Madame Orlova sorting sheet music at the piano, and then she would run through the choreography for the lead role in the spring recital: a piece called Reflections, set to a slow, shimmering piece of music that rose and fell like light on water.", "Priya was not dancing the lead role. Her best friend, Callie Nakamura, was.", "“You don’t have to keep doing this,” Callie told her one Thursday, lacing up her sneakers by the door, watching Priya mark through a difficult sequence of turns in the mirror. “I know it’s your job as the understudy, technically, but nobody expects you to know the whole thing cold. I barely know the whole thing cold.”", "“I like knowing it,” Priya said, which was true, though it wasn’t the whole truth. The whole truth was more complicated. Priya loved this role. She had loved it from the very first time Madame Orlova played the music in class, months before casting was even announced, and something in her chest had lifted every time she imagined dancing it. When the cast list went up and Callie’s name was next to Reflections and Priya’s name was next to Understudy, Priya had smiled and hugged her best friend and meant every bit of the hug. She had also gone home and cried a little, privately, in a way she never told anyone about, not even Callie.", "She remembered standing in front of that cast list, scanning it twice to make sure she had read it correctly, feeling the strange double weight of two true things landing on her at exactly the same moment. Callie had let out a shriek of delight and grabbed both of Priya’s hands, spinning her in a little circle right there in the hallway outside the studio, and Priya had spun along with her, laughing for real, because Callie’s joy was the kind that was impossible not to catch. It was only later, alone in her room that night, replaying the momen
